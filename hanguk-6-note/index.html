<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>산업화의 성과와 사회·문화의 변화 빈칸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --band:#1C2747; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.14);
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#16203A; --muted:#6A7389; --line:#E1E5EE;
  --o:#2563EB; --o-soft:#E6EEFF; --x:#E0453A; --x-soft:#FDEBEA; --gold:#F5B731;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.band{background:var(--band);color:var(--band-ink);padding-bottom:64px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.badge b{color:var(--o);font-weight:400}.badge i{color:var(--x);font-style:normal}
.logo small{display:block;font-size:12px;opacity:.75;font-weight:500;letter-spacing:.02em}
.logo h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(19px,5.4vw,24px);white-space:nowrap;letter-spacing:0;line-height:1.15}
.score{flex:0 0 auto;text-align:center;background:var(--band-soft);border-radius:14px;padding:8px 12px;min-width:64px;font-variant-numeric:tabular-nums}
.score span{display:block;font-size:11px;opacity:.8}
.score strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,.chip{font:inherit;font-size:14px;font-weight:500;color:var(--band-ink);background:var(--band-soft);border:1px solid transparent;border-radius:999px;padding:9px 14px;min-height:40px;-webkit-appearance:none;appearance:none}
select{flex:1 1 150px;min-width:0;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{color:#16203A;background:#fff}
.chip{cursor:pointer;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--gold);color:#1C2747}
.progress{height:6px;background:var(--band-soft);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--gold);width:0;border-radius:6px;transition:width .3s}
main.wrap{margin-top:-48px;display:flex;flex-direction:column;gap:16px;padding-block:0 24px}
.card{background:var(--surface);border-radius:24px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:16px;min-height:280px;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.no{font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:0}
.no em{font-style:normal;font-size:13px;font-family:var(--sans);font-weight:700;color:var(--muted);margin-left:4px}
.tag{background:var(--bg);border-radius:999px;padding:5px 11px;font-weight:500;font-size:12px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{font-size:clamp(19px,5.1vw,22px);font-weight:500;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.result{margin-top:auto;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start;animation:pop .28s ease-out}
.result[data-k="O"]{background:var(--o-soft)} .result[data-k="X"]{background:var(--x-soft)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.mark{flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-size:30px;border-radius:50%;color:#fff;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.result[data-k="O"] .mark{background:var(--o)} .result[data-k="X"] .mark{background:var(--x)}
@keyframes stamp{from{transform:scale(.4) rotate(-20deg)}to{transform:none}}
.verdict{font-weight:900;font-size:16px;margin:3px 0 6px}
.verdict.ok{color:var(--o)} .verdict.no{color:var(--x)}
.exp{font-size:15.5px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad button{font-family:var(--display);font-size:52px;line-height:1;cursor:pointer;border:none;border-radius:24px;min-height:104px;color:#fff;box-shadow:var(--shadow);transition:transform .1s}
#bO{background:var(--o)} #bX{background:var(--x)}
.pad button:active{transform:scale(.96)}
.next{width:100%;font:inherit;font-size:18px;font-weight:700;cursor:pointer;border:none;border-radius:20px;min-height:66px;background:var(--band);color:#fff;box-shadow:var(--shadow)}
:root[data-theme="dark"] .next{background:var(--gold);color:#1C2747}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:var(--gold);color:#1C2747}}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{font:inherit;font-size:14px;font-weight:500;background:none;border:none;color:var(--muted);padding:8px 4px;cursor:pointer}
.nav button:disabled{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1}
.done .big{font-family:var(--display);font-size:54px;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.done .chip{background:var(--band);color:#fff}
footer{font-size:12px;color:var(--muted);text-align:center}
.gate{position:fixed;inset:0;background:var(--band);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.gate form{background:var(--surface);color:var(--ink);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gate .badge{width:56px;height:56px;font-size:24px;background:var(--bg);box-shadow:none}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.gate input{font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.gate input:focus{border-color:var(--o);outline:none}
.gate button{font:inherit;font-size:17px;font-weight:700;padding:15px;border-radius:14px;border:none;background:var(--o);color:#fff;cursor:pointer}
.gate .err{color:var(--x);font-size:13px;min-height:1em}
.sh{margin:6px 0 0;font-size:15.5px;font-weight:900;color:var(--ink);background:var(--surface);border-left:5px solid var(--gold);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow)}
.it{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);font-size:16px;line-height:2.05;word-break:keep-all;overflow-wrap:anywhere}
.it.dn{opacity:.6}
.it p{margin:2px 0}.it img{display:block;max-width:100%;max-height:260px;margin:4px auto 6px;border-radius:8px}
.ih{display:flex;justify-content:space-between;align-items:center;line-height:1.3;margin-bottom:4px}
.nn{font-family:var(--display);font-size:18px;color:var(--muted)}
.chk{font:inherit;font-size:12.5px;border:1.5px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.chk[aria-pressed="true"]{background:var(--o);border-color:var(--o);color:#fff}
.bl{max-width:100%;white-space:normal;font:inherit;font-weight:700;display:inline-block;vertical-align:baseline;border:none;border-bottom:2.5px solid var(--o);background:var(--o-soft);border-radius:6px 6px 0 0;padding:0 6px;margin:0 2px;line-height:1.5;cursor:pointer;color:transparent;min-height:1.5em}
.bl span{visibility:hidden}.bl.open{color:var(--x);background:var(--x-soft);border-bottom-color:var(--x)}.bl.open span{visibility:visible}
.pick{white-space:normal}.pick i{font-style:normal;color:var(--muted);margin:0 2px}
.op{font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 7px;line-height:1.55;cursor:pointer;margin:0 1px}
.op.right{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}.op.bad{background:var(--x);border-color:var(--x);color:#fff}
.tw{overflow-x:auto;margin:4px 0}.tw table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.7}.tw th,.tw td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}.tw th{background:var(--bg);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.8;background:var(--surface);border-radius:18px}
.tip{font-size:12.5px;opacity:.85;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>빈</b><i>칸</i></div><h2>6주차 빈칸 암기 노트</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>
<div class="band"><div class="wrap">
  <div class="top">
    <div class="logo"><div class="badge" aria-hidden="true"><b>빈</b><i>칸</i></div><div><small>이경태T · 한국사2 6주차 교과서 빈칸</small><h1>6월 민주 항쟁~산업화 빈칸</h1></div></div>
    <div class="score" id="score"></div>
  </div>
  <div class="controls">
    <select id="sec" aria-label="단원 선택"></select>
    <button class="chip" id="all" aria-pressed="false">정답 모두 보기</button>
    <button class="chip" id="hide" aria-pressed="false">외운 문장 숨기기</button>
  </div>
  <div class="progress"><span id="bar"></span></div><p class="tip">빈칸을 누르면 정답이 보여요 · ( A / B )는 맞는 쪽을 눌러 보세요</p>
</div></div>
<main class="wrap">
  <section id="list" style="display:flex;flex-direction:column;gap:12px"></section>
  <div class="nav"><span></span><button id="reset">기록 초기화</button></div>
  <footer>26 한영외고 1학년 2학기 기말고사 대비 · 한터&amp;SNT</footer>
</main>
<script>
const DATA=[{"h": "6월 민주 항쟁", "s": "군사 정권을 연장하다", "t": "1. 5·18 민주화 운동을 무력으로 진압한 전두환 등 신군부 세력은 {국가 보위 비상 대책 위원회}를 설치하고 {입법부·행정부·사법부}를 장악하였다. 정치인들의 활동을 {탄압}하고 언론을 {통폐합}하였으며, 사회 정화를 구실로 많은 민간인을 {삼청 교육대}로 끌고 가 {군사 훈련}과 {강제 노역}을 시키기도 하였다."}, {"h": "6월 민주 항쟁", "s": "군사 정권을 연장하다", "t": "2. 신군부 세력이 10·26 사태 후 사회적 혼란을 수습하기 위해 설치한 초헌법적 기구를 {국가 보위 비상 대책 위원회}라고 하며 {최고 군사 회의}의 성격을 띠었다."}, {"h": "6월 민주 항쟁", "s": "군사 정권을 연장하다", "t": "3. 삼청 교육대는 {군부대 내}에 설치되었다. 가혹한 {훈련}과 {폭력} 등 인권 유린이 자행되었으며, 입소자 중 사망자가 다수 발생하였다."}, {"h": "6월 민주 항쟁", "s": "군사 정권을 연장하다", "t": "4. 전두환은 {최규하}를 대통령직에서 물러나게 하고 {통일 주체 국민 회의}를 통해 대통령에 취임하였다(1980). 그리고 {4/5/6/7*}년 {단임*/중임}의 대통령 {직선제/간선제*}를 주요 내용으로 하는 개헌을 단행하였는데 이는 {7차/8차*} 개헌이다."}, {"h": "6월 민주 항쟁", "s": "군사 정권을 연장하다", "t": "5. 이 헌법에 따라 실시된 선거에서 전두환은 다시 {대통령}에 당선되었다(1981)."}, {"h": "6월 민주 항쟁", "s": "군사 정권을 연장하다", "tbl": [["시기", "사건"], ["1979. 10.", "{10·26 사태}"], ["1979. 12.", "최규하, 제10대 대통령 취임, {통일 주체 국민 회의*/직선제}에서 선출됨"], ["1979. 12.", "{12·12 사태}"], ["1980. 5. 17.", "{비상계엄 전국 확대}"], ["1980. 5. 31.", "{국보위 설치}"], ["1980. 8.", "{삼청 교육대} 설치, 최규하 대통령 사임 → 전두환, 제11대 대통령 선출({통일 주체 국민 회의*/직선제}에서 선출됨)"], ["1980. 10.", "{제8차 개헌}, {7년}, {단임}, {대통령 선거인단}에 의한 {간선제}"], ["1980. 11.", "{언론 통폐합}"], ["1981. 2.", "전두환, 제12대 대통령 당선 → {대통령 선거인단}에서 간선으로 당선됨\n· 야간 통행금지 폐지, 프로 야구 개막, 두발·교복 자율화 등 {유화 정책}"]], "pre": "6. 전두환의 집권 과정"}, {"h": "6월 민주 항쟁", "s": "군사 정권을 연장하다", "t": "7. 전두환 정부는 악화된 국민감정과 국제 여론을 의식해 {유화} 정책을 펴 정권 장악의 불법성과 폭력성을 감추고자 하였다.\n① {야간 통행금지를 폐지} ② {과외 금지} ③ {중고생의 두발 및 교복 자율화 실시} ④ {프로 야구 출범}"}, {"h": "6월 민주 항쟁", "s": "군사 정권을 연장하다", "t": "8. 하지만 학생 운동과 노동 운동을 {탄압}하고 {고문 수사}도 서슴지 않았다. {보도 지침}을 통해 언론을 통제하는 등 시민의 자유와 민주주의를 억압하였다."}, {"h": "6월 민주 항쟁", "s": "민주화와 개헌을 향한 열망", "t": "9. 전두환 정부 {말}에는 각종 {권력형 부정}과 {비리 사건}이 연이어 터졌다. 학생 운동과 노동 운동을 탄압하는 과정에서 {부천 경찰서 성 고문 사건}도 일어났다.\n참고) 부천 경찰서 성 고문 사건(1986. 6. 6.~6. 7.): 부천 경찰서 형사 문귀동이 서울대 학생 권인숙을 조사하면서 성고문을 저지름. 권인숙은 노동 운동을 하려고 신분을 숨기고 공장에 취업했다가(위장 취업) 주민 등록증 변조 혐의로 연행된 상태였음"}, {"h": "6월 민주 항쟁", "s": "민주화와 개헌을 향한 열망", "t": "10. [사료] 1. 오늘 오후 4시 검찰이 발표한 조사 결과 내용만 보도할 것. 3. 검찰 발표 전문은 꼭 실어 줄 것. 5. 이 사건의 명칭을 ‘성추행’이라고 하지 말고 ‘성 모욕 행위’라고 할 것.\n→ 당시 정부는 각 언론사에 {보도 지침}을 내려 보도 여부, 기사 제목, 용어, 분량까지 통제함\n· 위 사료는 {부천 경찰서 성 고문} 사건과 관련된 {보도 지침}이다."}, {"h": "6월 민주 항쟁", "s": "민주화와 개헌을 향한 열망", "t": "11. 정부에 대한 불신이 커지는 가운데 국민의 손으로 직접 대통령을 선출해야 한다는 인식이 점차 확산되었다. 야당과 민주화 운동 진영은 대통령 {직선제} 개헌 운동을 본격적으로 전개하였다. 하지만 전두환 정부는 {4·13 호헌 조치}를 발표하여 대통령 직선제 개헌 논의 자체를 {금지}하였다."}, {"h": "6월 민주 항쟁", "s": "민주화와 개헌을 향한 열망", "t": "12. 이러한 상황에서 대학생 {박종철}이 수사 과정에서 고문으로 사망한 사건을 경찰이 은폐·조작한 사실이 뒤늦게 알려지자 국민의 분노는 폭발하였는데 이를 {박종철 고문 치사} 사건이라고 함"}, {"h": "6월 민주 항쟁", "s": "민주화와 개헌을 향한 열망", "tbl": [["날짜", "사건", "내용"], ["1987. 1. 14.", "{박종철 고문치사}", "서울대생 박종철이 {남영동 대공분실}에서 고문받다 숨짐"], ["1987. 1. 16.", "경찰의 거짓 발표", "“{탁 하고 치니 억 하고 죽었다}”"], ["1987. 4. 13.", "{4·13 호헌 조치}", "직선제 개헌 논의를 {금지}함"], ["1987. 5. 18.", "박종철 사건 {은폐·조작} 폭로", "{천주교 정의 구현 전국 사제단}이 폭로함"]], "pre": "13. 참고) 박종철 고문 치사 사건"}, {"h": "6월 민주 항쟁", "s": "6월 민주 항쟁", "t": "14. 전두환 정부의 폭력성에 대한 분노와 직선제 개헌을 향한 국민의 열망은 갈수록 높아졌다. 이러한 가운데 {민주 헌법 쟁취 국민운동 본부}가 결성되어 전국적으로 대통령 {직선제 개헌}과 고문 살인 정권 퇴진 운동을 전개하였다."}, {"h": "6월 민주 항쟁", "s": "6월 민주 항쟁", "t": "15. 시위가 확산되어 가던 중에 대학생 {이한열}이 경찰이 쏜 최루탄에 맞아 뇌사 상태에 빠지자, 국민의 민주화에 대한 요구는 더욱 거세어졌다."}, {"h": "6월 민주 항쟁", "s": "6월 민주 항쟁", "t": "16. {민주 헌법 쟁취 국민운동 본부}는 {국민 대회}를 개최해 범국민 민주 항쟁을 선언하였고, 전국 각지에서는 대규모 시위가 벌어졌는데 이를 {6·10 국민 대회}라고 한다."}, {"h": "6월 민주 항쟁", "s": "6월 민주 항쟁", "t": "17. 전두환 정부의 탄압에도 불구하고 명동 성당을 비롯하여 시내 곳곳에서 대규모 시위가 매일 전개되었고, 지방의 주요 도시에서도 시위가 계속되었다. 각계각층의 시민은 시위에 참여하여 {‘독재 타도’}와 {‘호헌 철폐’}를 외쳤다."}, {"h": "6월 민주 항쟁", "s": "6월 민주 항쟁", "t": "18. 결국 전두환 정부는 국민적 저항에 굴복하여 {직선제} 개헌을 수용하고 대대적인 민주화 조치를 취하겠다고 발표하였는데 이를 {6·29 선언}이라고 한다."}, {"h": "6월 민주 항쟁", "s": "6월 민주 항쟁", "tbl": [["시기", "사건"], ["1986. 7.", "{부천 경찰서 성고문 사건 보도 지침}"], ["1987. 1.", "{박종철 고문치사}"], ["1987. 4.", "{4·13 호헌 조치}(직선제 개헌 논의를 금지)"], ["1987. 5.", "박종철 사건 {은폐·조작 폭로}"], ["1987. 5.", "{민주 헌법 쟁취 국민운동 본부} 결성"], ["1987. 6.", "{이한열 최루탄 피격}"], ["1987. 6. 10.", "{6·10 국민 대회}(“호헌 철폐, 독재 타도”)"], ["1987. 6. 29.", "{6·29 선언}(노태우가 직선제 개헌과 1988년 2월 평화적 정부 이양을 약속함)"]], "pre": "19. 6월 민주 항쟁 과정"}, {"h": "6월 민주 항쟁", "s": "6월 민주 항쟁", "t": "20. 6월 민주 항쟁은 {군사 독재}를 끝내고 {평화적 정권 교체}의 길을 열었다는 점에서 큰 의의를 지닌다. 특히 6월 민주 항쟁으로 높아진 시민 의식은 사회 각 분야에서 {민주주의}가 발전하는 데 기여하였으며, 이는 우리 사회가 성숙한 시민 사회로 성장하는 주춧돌이 되었다."}, {"h": "6월 민주 항쟁", "s": "6월 민주 항쟁", "t": "21. (가) 본인은 …… 임기 중 개헌이 불가능하다고 판단하고 현행 헌법에 따라 내년 2월 25일 본인의 임기 만료와 더불어 후임자에게 정부를 이양할 것을 천명하는 바입니다. …… 평화적인 정부 이양과 서울 올림픽이라는 양대 국가 대사를 성공적으로 치르기 위해서 …… 소모적인 개헌 논의를 지양할 것을 선언합니다.\n· 위 사료는 {4·13 호헌 조치} 사료이다. {박종철 고문 치사} 사건 이후 발표\n(나) 오늘 우리는 …… 40년 독재 정치를 청산하고 희망찬 민주 국가를 건설하기 위한 거보를 전 국민과 함께 내딛는다. …… 국민적 여망인 개헌을 일방적으로 파기한 4·13 폭거를 철회시키기 위한 민주 장정을 시작한다.\n· 위 사료는 {6·10 국민 대회 선언문}의 일부이다. {4·13 호헌 조치} 이후 사건이다.\n(다) 첫째, 여야 합의하에 조속히 대통령 직선제 개헌을 하고 …… 1988년 2월 평화적 정부 이양을 실현토록 해야 하겠습니다. …… 셋째 …… 시국 관련 사범들은 석방해야 합니다.\n· 위 사료는 {6·29 선언}의 일부이다.\n· 순서: ({가}) → ({나}) → ({다})"}, {"h": "산업화와 경제 성장", "s": "정부 주도의 경제 개발이 본격화되다", "t": "1. 미국의 원조에 의존하던 한국 경제는 {1950년대 말}부터 원조가 감소하면서 {불황}에 빠졌다."}, {"h": "산업화와 경제 성장", "s": "정부 주도의 경제 개발이 본격화되다", "t": "2. {장면 내각}은 경제 건설을 국정의 최우선 목표로 삼고 {경제 개발 계획}을 수립하였으나, 재정이 취약하였을 뿐만 아니라 5·16 군사 정변이 발생하면서 {실행에 옮기지 못하였다*/실행에 옮겼다}."}, {"h": "산업화와 경제 성장", "s": "정부 주도의 경제 개발이 본격화되다", "t": "3. 박정희 등 군부 세력은 정변의 정당성을 확보하기 위해 {경제 개발}을 전면에 내세웠다. 이를 위해 장면 내각의 경제 개발 계획을 {보완}하여 {경제 개발 5개년 계획}을 {수립}하고 {정부*/민간} 주도로 {수출 주도형} 산업화를 적극 추진하였다."}, {"h": "산업화와 경제 성장", "s": "정부 주도의 경제 개발이 본격화되다", "t": "4. 1960년대 제1, 2차 경제 개발 5개년 계획 시기\n(1) 정부는 외국에서 빌려 온 자본을 토대로 {신발, 의류, 가발 등 노동 집약적 산업}을 육성하였다. → 서독에 {광부, 간호사}를 파견하면서 차관을 빌려 옴\n(2) 당시 세계 경제가 {호황}을 누리던 상황에서 수출액이 크게 {늘어}났고\n(3) {베트남 파병에 따른 특수}가 더해지면서 경제는 빠르게 성장하였다.\n(4) 또한 {시멘트, 정유 산업} 등을 육성하고, {경부 고속 국도, 1970년} 등 사회 간접 자본을 확충하는 등 경제 성장의 기반을 다졌다."}, {"h": "산업화와 경제 성장", "s": "정부 주도의 경제 개발이 본격화되다", "t": "5. 1970년대 제3, 4차 경제 개발 5개년 계획 시기\n(1) 정부는 {중화학 공업}을 적극 육성하였다. {철강·화학·기계·조선} 등의 분야를 집중적으로 지원하고 포항, 울산 등 {경상도 해안} 지역에 대규모 {중화학 공업 단지}를 조성하였다.\n(2) 제1차 석유 파동으로 유가가 크게 올라 한때 어려움을 겪었으나, 기업들이 {중동 건설} 사업에 적극 참여하여 {‘오일 머니’}를 벌어들임으로써 위기를 극복할 수 있었다.\n(3) 그 결과 {1977}년 {수출 100억 달러}를 달성하였고, {1970년대 말}에는 공업 구조에서 중화학 공업이 차지하는 비중이 경공업을 앞지르게 되었다.\n(4) 그러나 제2차 석유 파동과 중화학 공업에 대한 {과잉 중복 투자}로 경제 위기가 발생하였다.\n(5) 경제 성장률이 {마이너스}를 기록하고 물가마저 {폭등}하여 국민 생활은 어려워졌다."}, {"h": "산업화와 경제 성장", "s": "3저 호황으로 고도성장을 달성하다", "t": "6. 1980년대에 들어선 전두환 정부는\n(1) 경제 안정화에 초점을 맞추어 정부 주도의 성장 우선 정책을 부분적으로 수정하고 {민간 부문}의 참여를 늘렸다.\n(2) 중화학 공업의 중복 투자를 {조정}하고 부실기업을 {정리}하여 경제 위기를 극복하고자 하였다.\n(3) 1980년대 후반부터 {저달러·저유가·저금리}라는 유리한 경제 환경이 조성되며 한국 경제는 호황을 맞았는데 이를 {3저 호황}이라고 한다.\n(4) 이 시기 한국 경제는 {자동차, 반도체} 등 {기술 집약적 산업}을 중심으로 연평균 10%가 넘는 경제 성장률을 기록하였다.\n(5) 그러나 1980년대 말 {3저 호황}이 막을 내리면서 다시 어려움에 빠졌다."}, {"h": "산업화와 경제 성장", "s": "3저 호황으로 고도성장을 달성하다", "img": "p6a", "lines": ["(가) 번영의 외길은 수출뿐이다 – 정부는 경제 개발에 대한 확고한 의지를 가지고 {수출 주도형 산업화}를 추진하였다.", "(나) 캔두이즘(할 수 있다 정신) – 기업인들의 도전 정신은 한국 {기업가 정신}을 상징한다.", "(다) 글뤽 아우프(오늘도 무사히) – 낮은 임금과 곡물 가격을 감내한 노동자·농민, 해외에서 고생한 {파독 광부·간호사} 등의 헌신이 있었다."], "pre": "7. 한강의 기적을 일궈 낸 원동력"}, {"h": "산업화와 경제 성장", "s": "3저 호황으로 고도성장을 달성하다", "img": "p6b", "lines": ["· 위 자료는 {1980년}대의 {수출 증가} 그래프로 {3저 호황}으로 수출이 늘면서 {1986}년 무역 수지가 {흑자}로 전환하였다."], "pre": "8."}, {"h": "산업화의 문제점과 해결 노력", "s": "고도성장 이면의 그림자", "t": "1. 1960~1980년대 한국은 높은 경제 성장률을 보이며 {고도성장}을 이룩하였다."}, {"h": "산업화의 문제점과 해결 노력", "s": "고도성장 이면의 그림자", "t": "2. 그러나 {정부} 주도로 {성장} 위주의 경제 정책이 추진되는 과정에서 여러 가지 문제점이 나타났다."}, {"h": "산업화의 문제점과 해결 노력", "s": "고도성장 이면의 그림자", "t": "3. 성장에 밀려 {분배}가 제대로 이루어지지 않으면서 노동자는 여전히 {낮은 임금}과 열악한 작업 환경에 시달렸고 {빈부 격차}는 더욱 커졌다. 산업화의 중심이 된 도시와 개발에서 소외된 농촌 간의 소득 격차도 커졌다."}, {"h": "산업화의 문제점과 해결 노력", "s": "고도성장 이면의 그림자", "t": "4. 정부가 대규모 산업 시설을 {영남} 지방에 집중적으로 건설함으로써 {지역 간 격차}도 발생하였다."}, {"h": "산업화의 문제점과 해결 노력", "s": "고도성장 이면의 그림자", "t": "5. {대기업} 중심의 경제 정책에 따라 정부로부터 각종 특혜를 받은 일부 대기업이 {재벌}로 성장하면서 {재벌 중심의 산업 구조}가 형성되었다. 재벌은 경제 성장 과정에서 정부의 산업 육성 및 수출 정책에 협조하며 경제 성장에 일조하였다. 그러나 {정경 유착}과 경제 독점으로 기업 간의 공정 경쟁과 중소기업의 성장을 저해하기도 하였다."}, {"h": "산업화의 문제점과 해결 노력", "s": "고도성장 이면의 그림자", "t": "6. 한편 외국 자본에 의존해 경제 개발을 추진하면서 {외채 부담}이 증가하고, {수출 중심 경제} 전략으로 내수보다 무역의 비중이 커지면서 경제의 {대외 의존도}가 심화되었다. 이로 인해 한국 경제는 세계 경제의 변화에 큰 영향을 받게 되었다."}, {"h": "산업화의 문제점과 해결 노력", "s": "고도성장 이면의 그림자", "img": "p7", "lines": ["· 자료 1(긍정적 평가) 주장: {경제가 일정 수준에 올라 중산층이 두터워져야 민주주의가 발전한다.}", "· 자료 2(부정적 평가) 주장: {민주주의 발전의 토대 위에서 진정한 의미의 경제 발전이 가능하다.}"], "pre": "7. 박정희 정부의 성장 중심 경제 정책에 대한 평가"}, {"h": "산업화의 문제점과 해결 노력", "s": "급격한 도시화와 부작용", "t": "1. 산업화가 빠르게 진전되면서 농촌의 인구가 일자리를 찾아 {대도시}와 {신흥 공업 도시}로 몰려들었다. 그 결과 {1970년대 중엽} 이후 {도시*/농촌} 인구는 {도시/농촌*} 인구를 앞질렀으며, 고층 빌딩이 들어서고 도로가 정비되면서 도시는 빠르게 발전하였다."}, {"h": "산업화의 문제점과 해결 노력", "s": "급격한 도시화와 부작용", "t": "2. 그러나 화려한 도시화 이면에는 해결해야 할 과제가 생겨났다. 도시로 많은 사람이 몰려들면서 {주거난}과 {도시 빈민} 문제가 나타났다. 마땅한 주거지를 찾을 수 없었던 사람들이 도시 변두리나 높은 지대에 정착하면서 {‘판자촌’}, {‘달동네’}로 불리는 {빈민촌}이 형성되었다."}, {"h": "산업화의 문제점과 해결 노력", "s": "급격한 도시화와 부작용", "t": "3. 정부는 대규모 {아파트 단지} 등을 건설하여 주택난을 해결하고자 하였다. 그러나 그 과정에서 생활 터전을 잃고 쫓겨난 도시 빈민들이 생존권을 지키기 위해 저항하면서 {광주 대단지 사건} 등이 일어나기도 하였다."}, {"h": "산업화의 문제점과 해결 노력", "s": "급격한 도시화와 부작용", "t": "4. 서울시가 판자촌 정리 사업을 추진하면서 경기도 {광주}에 철거민들을 집단 이주만 시켜 놓고 방치하자, {1971년 8월} 광주 대단지 주민 5만여 명이 대규모 시위를 벌였는데 이 사건을 {광주 대단지 사건}이라고 한다. 이 사건으로 주민과 경찰 100여 명이 다치고 주민 23명이 구속되었다."}, {"h": "산업화의 문제점과 해결 노력", "s": "급격한 도시화와 부작용", "t": "5. 교통, 공해, 쓰레기 등으로 인한 문제도 대두하였다. 정부는 지하철을 비롯한 대중교통 확장, 고속 국도 건설, 쓰레기 소각장 조성 등을 통해 도시화에 따른 문제를 해결하려 하였다. 지하철 1호선은 {1974}년 개통되었다."}, {"h": "산업화의 문제점과 해결 노력", "s": "성장에서 소외된 농촌과 농민 운동", "t": "6. 농촌은 산업화 과정에서 상대적으로 {소외}되었다. 정부가 {저임금}을 유지하기 위해 쌀값을 낮게 책정하는 {저곡가} 정책을 펴면서 어려움은 더욱 커졌다."}, {"h": "산업화의 문제점과 해결 노력", "s": "성장에서 소외된 농촌과 농민 운동", "t": "7. 도시와 농촌 간의 격차가 커지자 정부는 {‘근면, 자조, 협동’}을 구호로 내걸고 {새마을 운동}을 {1970}년에 추진하였다.\n(1) 새마을 운동은 {주택 개량}, {도로 확충} 등 농촌의 생활 환경 개선에 일정한 성과를 거두었다.\n(2) 그러나 농가 소득이 크게 향상 {되었고/되지 못하였고*}, 점차 {국민정신 운동}으로 변하면서 {유신 체제} 유지에 이용되었다는 지적도 받았다."}, {"h": "산업화의 문제점과 해결 노력", "s": "성장에서 소외된 농촌과 농민 운동", "t": "8. 정부의 농업 정책이 한계를 드러내자 {농민 운동}이 본격화되었다. {함평 고구마 사건}을 비롯하여 {농업 협동조합 민주화 운동}, {농가 부채 탕감 운동} 등이 전개되었다. 1980년대에는 {외국 농산물 수입 개방 반대 운동}도 일어났다."}, {"h": "산업화의 문제점과 해결 노력", "s": "성장에서 소외된 농촌과 농민 운동", "t": "9. 농협이 고구마 전량을 사들이겠다는 약속을 어기자, 함평 농민들이 3년간 투쟁하여 피해를 보상받았던 사건은 {함평 고구마 사건}이라고 하며 {1976~1978}년에 있었다."}, {"h": "산업화의 문제점과 해결 노력", "s": "노동 운동이 전개되다", "t": "10. 노동자들은 {저임금}과 {장시간 노동}에 내몰렸다. 평화 시장 노동자 {전태일}이 {근로 기준법 준수}를 외치며 분신한 사건은 노동 현실을 극명하게 보여 주었다. {1970}년에 있었던 일이다.\n이를 계기로 노동자는 물론이고 지식인과 대학생도 {노동 문제}에 관심을 가지면서 노동 운동이 본격화되었다. 이후 노동조합을 결성하려는 움직임이 활발해졌고 {생존권 보장}을 요구하는 노동자들의 저항이 이어지면서 {YH 무역 사건} 등이 일어났다."}, {"h": "산업화의 문제점과 해결 노력", "s": "노동 운동이 전개되다", "t": "11. 1980년대에는 {최저 임금 인상}과 {근로 조건 개선}을 요구하는 파업이 탄광과 공장 중심으로 전개되었다. 또한 해고 노동자와 대학생이 참여하면서 노동 운동은 {사회적·정치적} 투쟁으로 발전하였다."}, {"h": "산업화의 문제점과 해결 노력", "s": "노동 운동이 전개되다", "img": "p9", "lines": ["· 자료 1: 노동자들은 {열악한 환경}에 노출되어 있을 뿐만 아니라, 무리한 {장시간 근로}를 강제 받아 건강이 크게 위협받고 있다.", "· 자료 2: 어린 {보조공}들이 과도한 노동에 시달리며 {저임금}을 받고 기본적인 생계조차 꾸리기 어려운 상황이다."], "pre": "12. 평화 시장의 노동 실태"}, {"h": "산업화의 문제점과 해결 노력", "s": "환경 문제가 대두하다", "t": "1. 1960년대부터 본격화된 산업화와 도시화는 생태·환경에도 문제를 일으켰다. 대규모 공단에서 배출하는 {산업 폐수}로 하천과 바다가 오염되었다. 공장에서 내뿜는 매연은 물론, 자동차가 증가하고 {연탄} 사용이 늘어나면서 {대기 오염}도 심각해졌다."}, {"h": "산업화의 문제점과 해결 노력", "s": "환경 문제가 대두하다", "t": "2. 그러나 1970년대까지도 환경 문제는 크게 부각되지 못하였다. 환경에 대한 국민의 인식이 부족하였을 뿐만 아니라 정부도 {경제 개발}을 우선시하며 환경 운동을 {억압}하였다. 다만 공단이 밀집된 부산, 울산, 여수 등지에서 환경 오염 물질로 피해를 본 주민을 중심으로 피해 보상 운동이 일어났을 뿐이었다."}, {"h": "산업화의 문제점과 해결 노력", "s": "환경 문제가 대두하다", "t": "3. 환경 문제는 {1980년}대 들어 본격적으로 대두하였다. {1982}년 우리나라 최초의 민간 환경 운동 단체인 {한국 공해 문제 연구소}가 탄생하였고, 이 단체를 중심으로 반공해 운동이 전개되었다. 특히 1985년 공론화된 {온산병 사태}로 환경 오염 문제가 사회 문제로 크게 주목을 받았다."}, {"h": "산업화의 문제점과 해결 노력", "s": "환경 문제가 대두하다", "t": "4. 정부도 1970년대 후반부터 환경 문제에 보다 적극적으로 대응하기 시작하였다. {환경 보전법}을 제정하고 자연 보호 범국민 운동을 추진하였으며, 1980년에는 환경 전담 기구로 {환경청}을 설치하였다. 1980년 개정된 헌법에 {환경권}을 명시하기도 하였다. 하지만 이후에도 환경을 희생시키는 경제 개발 정책이 지속되면서 환경 문제는 날로 심각해졌다."}, {"h": "산업화의 문제점과 해결 노력", "s": "환경 문제가 대두하다", "t": "5. 자연 보호 범국민 운동 궐기 대회는 {1977}년에 실시되었고 {정부} 주도하에 추진되었으나, 국민 개개인의 국토 청결에 대한 의무를 강조하는 데 머물렀다."}, {"h": "문화 변동과 일상생활의 변화", "s": "생활 양식이 변화하다", "t": "1. 산업화와 도시화가 진전되고 소비 수준이 높아지면서 사람들의 생활 양식에도 많은 변화가 나타났다. 아파트 같은 공동 주택이 도시를 중심으로 늘어나면서 집 안에 {수세식 화장실}이 설치되고, 서양식 부엌과 거실 중심의 생활 문화가 점차 보편화되었다. 세탁기, 냉장고, 가스레인지 등 가전제품은 생활의 편리함을 크게 향상시켰다."}, {"h": "문화 변동과 일상생활의 변화", "s": "생활 양식이 변화하다", "t": "2. 의생활에서는 {서양식 의복}이 한복을 대체하였고, 섬유 산업이 발전하면서 1960년대 후반에는 {기성복} 생산이 본격화되었다. 1980년대에는 프로 스포츠 출범과 올림픽 유치로 스포츠 붐이 일어났을 뿐만 아니라 건강과 여가를 중시하는 문화가 확산되면서 각종 스포츠 의류가 일상화되었다."}, {"h": "문화 변동과 일상생활의 변화", "s": "생활 양식이 변화하다", "t": "3. {1980}년대 {대중 소비 시대}의 변화된 풍경\n(1) {아파트식} 생활 문화 → 대거 늘어난 아파트의 영향으로 분리되어 있던 부엌이 집 안으로 들어와 {‘주방’}으로 불리게 되었다. 입식으로 싱크대와 식탁이 설치되고 가스레인지, 냉장고 등도 보급되었다.\n(2) 화려하게 꽃핀 패션 문화 → 경제 호황과 더불어 {컬러텔레비전} 방송이 시작되면서 패션에 대한 관심이 높아졌다. 또한 {교복 자율화}, 활발해진 국제 문화 교류 등의 변화된 사회 분위기 속에서 패션으로 개성을 드러내려는 청소년이 늘어났다.\n→ 넓은 어깨를 강조한 큰 사이즈 슈트와 엉덩이에 넉넉한 주름을 준 {디스코 바지}, 원색부터 형광색까지 다채로운 색상은 1980년대를 대표하는 패션 트렌드였다."}, {"h": "문화 변동과 일상생활의 변화", "s": "생활 양식이 변화하다", "t": "4. 식생활에서는 정부가 쌀 부족 문제를 해결하기 위해 {혼식}과 {분식}을 장려하는 정책을 펴면서 빵, 라면 등 밀가루 음식의 소비가 늘었다."}, {"h": "문화 변동과 일상생활의 변화", "s": "생활 양식이 변화하다", "t": "5. 바쁜 도시 생활과 서구화의 흐름에 따라 {가공식품}도 확산되었다. 외식 문화가 자리 잡고 외식업과 관련된 서비스 산업이 성장하였으며, 자장면이나 햄버거 등이 큰 인기를 얻으면서 {패스트푸드점}도 늘어 갔다."}, {"h": "문화 변동과 일상생활의 변화", "s": "교육 기회가 확대되다", "t": "6. 인구가 증가하고 경제가 성장하면서 교육은 {양적*/질적}으로 큰 성장을 이루었다. 학교 수가 빠르게 증가하였고, 중학생과 고등학생의 수는 1960년에서 1979년까지 각각 {2배}, {6배}로 많아졌다. 이러한 학교 교육의 확대는 높은 교육열과 함께 한국 경제 발전의 원동력이 되었다."}, {"h": "문화 변동과 일상생활의 변화", "s": "교육 기회가 확대되다", "t": "7. 그러나 과도한 입시 경쟁이 사회 문제로 떠올랐다. 이른바 일류 대학, 일류 고등학교, 일류 중학교에 들어가기 위한 {사교육} 열풍이 일었다. 이를 완화하기 위해 박정희 정부는 {중학교 무시험 추첨제}를 {1969}년에 도입하고, 대도시에 {고교 평준화}를 {1973}년에 실시하였다. 전두환 정부는 {1981}년 {과외 전면 금지와 본고사 폐지, 대학 졸업 정원제}를 시행하였다."}, {"h": "문화 변동과 일상생활의 변화", "s": "대중문화가 성장하다", "t": "8. 산업화가 진전되고 교육이 확대되는 상황에서 대중 매체의 보급은 다양한 대중문화의 발전을 가져왔다.\n(1) 1960년대에는 {라디오}가 대중문화를 주도하였다.\n(2) 1970년대에는 {텔레비전}이 본격적으로 보급되어 여가 생활의 중심이 되었고,\n(3) 1980년대에는 {컬러텔레비전} 방송이 시작되어 보다 수준 높은 영상 문화를 향유하게 되었다."}, {"h": "문화 변동과 일상생활의 변화", "s": "대중문화가 성장하다", "t": "9. 청소년 사이에 서구 문화가 빠르게 전파되었고, {통기타}와 {청바지}로 대변되는 {청년 문화}가 생겨났다. 대중문화가 발달하면서 한국적 정서를 담은 영화와 대중가요가 큰 인기를 끌었다."}, {"h": "문화 변동과 일상생활의 변화", "s": "대중문화가 성장하다", "t": "10. 한편 {1970~1980}년대 정부는 갖가지 기준을 붙여 영화를 {사전 검열}하고, 많은 대중가요를 {금지곡}으로 지정하였다. 이로써 창작의 자유가 크게 억압당하였다.\n(1) 1960년대 {미국식 팝}과 {트로트} 시대\n(2) 1970년대 청년들이 이끈 {포크}와 {록}의 시대\n(3) 1980년대 {대중음악}이 다양하게 꽃핀 시대"}, {"h": "★ 시험에 자주 나오는 연표 순서", "s": "연표 순서", "tbl": [["시기", "사건"], ["1979.10.26.", "{10·26 사태}"], ["1979.12.12.", "{12·12 사태}"], ["1980.5.17.", "{비상계엄 전국 확대}"], ["1980.5.18.", "{5·18 민주화 운동}"], ["1980.5.31.", "{국보위} 설치"], ["1980.8.", "{삼청 교육대}, {통일 주체 국민 회의}에서 선출"], ["1980.10.", "{제8차 개헌}(7년 단임 간선제)"], ["1981.2.", "{대통령 선거인단}에서 재당선"], ["함정", "5·18 진압 → {국보위}(5.31.) 순서 / 1980년은 {통일 주체 국민 회의}, 1981년은 {대통령 선거인단}"]], "pre": "① 전두환의 집권 과정 (1979~1981)"}, {"h": "★ 시험에 자주 나오는 연표 순서", "s": "연표 순서", "tbl": [["시기", "사건"], ["1986.7.", "{보도 지침}(부천 성 고문)"], ["1987.1.", "{박종철} 고문치사"], ["1987.4.13.", "{4·13 호헌 조치}"], ["1987.5.18.", "{은폐·조작} 폭로"], ["1987.5.27.", "{민주 헌법 쟁취 국민운동 본부}"], ["1987.6.9.", "{이한열} 피격"], ["1987.6.10.", "{6·10 국민 대회}"], ["1987.6.29.", "{6·29 선언}"], ["함정", "{박종철}(1월)이 {4·13}(4월)보다 먼저 / 4·13은 직선제 ‘{금지}’, 6·29는 직선제 ‘{수용}’"]], "pre": "② 6월 민주 항쟁 (1986~1987)"}, {"h": "★ 시험에 자주 나오는 연표 순서", "s": "연표 순서", "tbl": [["시기", "사건"], ["1950년대 말", "미국 {원조 감소} → 불황"], ["1960~1961", "{장면 내각} 계획(실행 X)"], ["1962", "{제1차 경제 개발 5개년 계획}"], ["1960년대", "{노동 집약적 산업}, 베트남 특수"], ["1970", "{경부 고속 국도}"], ["1970년대", "{중화학 공업} 육성"], ["1973", "{제1차 석유 파동} → 중동 건설"], ["1977", "{수출 100억 달러}"], ["1978", "{제2차 석유 파동}, 과잉 중복 투자"], ["1986", "{3저 호황}, {무역 수지 흑자}"], ["1980년대 말", "3저 호황 종료"], ["함정", "1960년대 {노동 집약} → 1970년대 {중화학} → 1980년대 {기술 집약}(자동차, 반도체)"]], "pre": "③ 경제 성장의 흐름"}, {"h": "★ 시험에 자주 나오는 연표 순서", "s": "연표 순서", "tbl": [["시기", "사건"], ["1970", "{전태일} 분신(노동)"], ["1971.8.", "{광주 대단지 사건}(도시 빈민)"], ["1976~1978", "{함평 고구마 사건}(농민)"], ["1979.8.", "{YH 무역 사건}(노동)"], ["함정", "광주 대단지 사건은 ‘{경기도}’ 광주 / 함평은 {3년간} 투쟁"]], "pre": "④ 산업화의 그늘 (사회 운동)"}, {"h": "★ 시험에 자주 나오는 연표 순서", "s": "연표 순서", "tbl": [["시기", "사건"], ["1969", "{중학교 무시험 추첨제}(박정희)"], ["1973", "{고교 평준화}(박정희)"], ["1981", "{과외 전면 금지}, 본고사 폐지(전두 let st={done:{}};try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)st=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
let section='0',showAll=false,hideDone=false;
$('sec').innerHTML=SECS.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+s+' ('+DATA.filter(d=>d.h===s).length+')</option>').join('');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function mk(t){
  return esc(t).replace(/\{(.+?)\}/g,(m,x)=>{
    if(x.includes('/')){
      return '<span class="pick">( '+x.split('/').map(o=>{const ok=o.endsWith('*');o=o.replace(/\*$/,'');return '<button class="op'+(showAll&&ok?' right':'')+'" data-ok="'+(ok?1:0)+'">'+o+'</button>'}).join('<i>/</i>')+' )</span>';
    }
    return '<button class="bl'+(showAll?' open':'')+'" style="min-width:'+Math.min(14,Math.max(2.5,x.length*0.95))+'em"><span>'+x+'</span></button>';
  }).replace(/_(.+?)_/g,'<u>$1</u>').replace(/\n/g,'<br>');
}
function render(){
  const items=DATA.map((d,i)=>[d,i]).filter(([d])=>d.h===SECS[+section]);
  const nd=items.filter(([d,i])=>st.done[i]).length;
  $('score').innerHTML='<span>외운 문장</span><strong>'+nd+'/'+items.length+'</strong>';
  $('bar').style.width=(items.length?nd/items.length*100:0)+'%';
  let h='',cur='',n=0;
  items.forEach(([d,i])=>{
    if(hideDone&&st.done[i])return;
    if(d.s!==cur){cur=d.s;n=0;h+='<h3 class="sh">'+esc(d.s)+'</h3>'}
    n++;
    const num=(d.pre||((d.t||'').match(/^(\d+)\./)||[])[0]||'');
    h+='<article class="it'+(st.done[i]?' dn':'')+'"><div class="ih"><span class="nn">'+num+'</span><button class="chk" data-i="'+i+'" aria-pressed="'+(st.done[i]?'true':'false')+'">'+(st.done[i]?'외웠어요 ✓':'외웠어요')+'</button></div>';
    if(d.img)h+='<img src="img/'+d.img+'.jpg" alt="">'+(d.lines||[]).map(l=>'<p>'+mk(l)+'</p>').join('');
    else if(d.tbl)h+='<div class="tw"><table>'+d.tbl.map((r,ri)=>'<tr>'+r.map(c=>(ri===0?'<th>':'<td>')+mk(c)+(ri===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>';
    else h+='<p>'+mk(d.t.replace(/^\d+\.\s*/,''))+'</p>';
    h+='</article>';
  });
  if(!h)h='<div class="empty">이 단원의 문장을 모두 외웠어요! 👏<br>‘외운 문장 숨기기’를 끄면 다시 볼 수 있어요.</div>';
  $('list').innerHTML=h;
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('bl'))b.classList.toggle('open');
  else if(b.classList.contains('op')){b.classList.add(b.dataset.ok==='1'?'right':'bad');if(b.dataset.ok!=='1')setTimeout(()=>b.classList.remove('bad'),900)}
  else if(b.classList.contains('chk')){const i=b.dataset.i;if(st.done[i])delete st.done[i];else st.done[i]=1;save();render()}
});
$('sec').onchange=e=>{section=e.target.value;window.scrollTo({top:0});render()};
$('all').onclick=e=>{showAll=!showAll;e.currentTarget.setAttribute('aria-pressed',showAll);e.currentTarget.textContent=showAll?'모두 가리기':'정답 모두 보기';render()};
$('hide').onclick=e=>{hideDone=!hideDone;e.currentTarget.setAttribute('aria-pressed',hideDone);render()};
let armed=false;
$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}
 st={done:{}};save();armed=false;t.textContent='기록 초기화';render()};
render();
</script>
<script>
(function(){
const H=1418297543,K='hy-hist2-hanguk-6-note-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
