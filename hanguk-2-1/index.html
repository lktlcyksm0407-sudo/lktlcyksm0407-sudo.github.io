<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>냉전·정부 수립 빈칸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --band:#1C2747; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.14);
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#16203A; --muted:#6A7389; --line:#E1E5EE;
  --o:#2563EB; --o-soft:#E6EEFF; --x:#E0453A; --x-soft:#FDEBEA; --gold:#F5B731;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.band{background:var(--band);color:var(--band-ink);padding-bottom:64px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.badge b{color:var(--o);font-weight:400}.badge i{color:var(--x);font-style:normal}
.logo small{display:block;font-size:12px;opacity:.75;font-weight:500;letter-spacing:.02em}
.logo h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(19px,5.4vw,24px);white-space:nowrap;letter-spacing:0;line-height:1.15}
.score{flex:0 0 auto;text-align:center;background:var(--band-soft);border-radius:14px;padding:8px 12px;min-width:64px;font-variant-numeric:tabular-nums}
.score span{display:block;font-size:11px;opacity:.8}
.score strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,.chip{font:inherit;font-size:14px;font-weight:500;color:var(--band-ink);background:var(--band-soft);border:1px solid transparent;border-radius:999px;padding:9px 14px;min-height:40px;-webkit-appearance:none;appearance:none}
select{flex:1 1 150px;min-width:0;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{color:#16203A;background:#fff}
.chip{cursor:pointer;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--gold);color:#1C2747}
.progress{height:6px;background:var(--band-soft);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--gold);width:0;border-radius:6px;transition:width .3s}
main.wrap{margin-top:-48px;display:flex;flex-direction:column;gap:16px;padding-block:0 24px}
.card{background:var(--surface);border-radius:24px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:16px;min-height:280px;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.no{font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:0}
.no em{font-style:normal;font-size:13px;font-family:var(--sans);font-weight:700;color:var(--muted);margin-left:4px}
.tag{background:var(--bg);border-radius:999px;padding:5px 11px;font-weight:500;font-size:12px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{font-size:clamp(19px,5.1vw,22px);font-weight:500;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.result{margin-top:auto;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start;animation:pop .28s ease-out}
.result[data-k="O"]{background:var(--o-soft)} .result[data-k="X"]{background:var(--x-soft)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.mark{flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-size:30px;border-radius:50%;color:#fff;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.result[data-k="O"] .mark{background:var(--o)} .result[data-k="X"] .mark{background:var(--x)}
@keyframes stamp{from{transform:scale(.4) rotate(-20deg)}to{transform:none}}
.verdict{font-weight:900;font-size:16px;margin:3px 0 6px}
.verdict.ok{color:var(--o)} .verdict.no{color:var(--x)}
.exp{font-size:15.5px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad button{font-family:var(--display);font-size:52px;line-height:1;cursor:pointer;border:none;border-radius:24px;min-height:104px;color:#fff;box-shadow:var(--shadow);transition:transform .1s}
#bO{background:var(--o)} #bX{background:var(--x)}
.pad button:active{transform:scale(.96)}
.next{width:100%;font:inherit;font-size:18px;font-weight:700;cursor:pointer;border:none;border-radius:20px;min-height:66px;background:var(--band);color:#fff;box-shadow:var(--shadow)}
:root[data-theme="dark"] .next{background:var(--gold);color:#1C2747}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:var(--gold);color:#1C2747}}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{font:inherit;font-size:14px;font-weight:500;background:none;border:none;color:var(--muted);padding:8px 4px;cursor:pointer}
.nav button:disabled{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1}
.done .big{font-family:var(--display);font-size:54px;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.done .chip{background:var(--band);color:#fff}
footer{font-size:12px;color:var(--muted);text-align:center}
.gate{position:fixed;inset:0;background:var(--band);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.gate form{background:var(--surface);color:var(--ink);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gate .badge{width:56px;height:56px;font-size:24px;background:var(--bg);box-shadow:none}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.gate input{font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.gate input:focus{border-color:var(--o);outline:none}
.gate button{font:inherit;font-size:17px;font-weight:700;padding:15px;border-radius:14px;border:none;background:var(--o);color:#fff;cursor:pointer}
.gate .err{color:var(--x);font-size:13px;min-height:1em}
.sh{margin:6px 0 0;font-size:15.5px;font-weight:900;color:var(--ink);background:var(--surface);border-left:5px solid var(--gold);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow)}
.it{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);font-size:16px;line-height:2.05;word-break:keep-all;overflow-wrap:anywhere}
.it.dn{opacity:.6}
.it p{margin:2px 0}.it img{display:block;max-width:100%;max-height:260px;margin:4px auto 6px;border-radius:8px}
.ih{display:flex;justify-content:space-between;align-items:center;line-height:1.3;margin-bottom:4px}
.nn{font-family:var(--display);font-size:18px;color:var(--muted)}
.chk{font:inherit;font-size:12.5px;border:1.5px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.chk[aria-pressed="true"]{background:var(--o);border-color:var(--o);color:#fff}
.bl{font:inherit;font-weight:700;display:inline-block;vertical-align:baseline;border:none;border-bottom:2.5px solid var(--o);background:var(--o-soft);border-radius:6px 6px 0 0;padding:0 6px;margin:0 2px;line-height:1.5;cursor:pointer;color:transparent;min-height:1.5em}
.bl span{visibility:hidden}.bl.open{color:var(--x);background:var(--x-soft);border-bottom-color:var(--x)}.bl.open span{visibility:visible}
.pick{white-space:normal}.pick i{font-style:normal;color:var(--muted);margin:0 2px}
.op{font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 7px;line-height:1.55;cursor:pointer;margin:0 1px}
.op.right{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}.op.bad{background:var(--x);border-color:var(--x);color:#fff}
.tw{overflow-x:auto;margin:4px 0}.tw table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.7}.tw th,.tw td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}.tw th{background:var(--bg);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.8;background:var(--surface);border-radius:18px}
.tip{font-size:12.5px;opacity:.85;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>빈</b><i>칸</i></div><h2>냉전·정부 수립 빈칸</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>
<div class="band"><div class="wrap">
  <div class="top">
    <div class="logo"><div class="badge" aria-hidden="true"><b>빈</b><i>칸</i></div><div><small>이경태T · 한국사2 Ⅱ-1 교과서 빈칸 (1주차)</small><h1>냉전·정부 수립 빈칸</h1></div></div>
    <div class="score" id="score"></div>
  </div>
  <div class="controls">
    <select id="sec" aria-label="단원 선택"></select>
    <button class="chip" id="all" aria-pressed="false">정답 모두 보기</button>
    <button class="chip" id="hide" aria-pressed="false">외운 문장 숨기기</button>
  </div>
  <div class="progress"><span id="bar"></span></div><p class="tip">빈칸을 누르면 정답이 보여요 · ( A / B )는 맞는 쪽을 눌러 보세요</p>
</div></div>
<main class="wrap">
  <section id="list" style="display:flex;flex-direction:column;gap:12px"></section>
  <div class="nav"><span></span><button id="reset">기록 초기화</button></div>
  <footer>26 한영외고 1학년 2학기 기말고사 대비 · 한터&amp;SNT</footer>
</main>
<script>
const DATA = [{"h": "냉전 체제의 형성", "s": "", "t": "_1947 트루먼 독트린_(냉전 시작) → 1950 6·25 전쟁 → _1969 닉슨 독트린_(냉전 완화, 데탕트) → 1972 7·4 남북 공동 선언 → _1989 몰타 선언_(냉전 종결)"}, {"h": "냉전 체제의 형성", "s": "냉전 체제의 형성", "t": "1. 제2차 세계 대전 이후 미국 중심의 {자본주의*/공산주의}진영과 소련 중심의 {자본주의/공산주의*}진영의 대결 구도 속에서 {냉전(Cold War)}이 본격화되었다."}, {"h": "냉전 체제의 형성", "s": "냉전 체제의 형성", "t": "2. 냉전이란 직접적인 {무력 충돌은 없지만*/무력 충돌을 하면서} _군사적·경제적·외교적인 대립이 지속되는 상태_이다. 그러나 냉전의 확산은 아시아에서 {냉전/열전*}으로 이어져 {중국, 한국, 베트남}에서 전쟁이 일어났다."}, {"h": "냉전 체제의 형성", "s": "냉전 체제의 형성", "t": "3. {1950년대*/1960년대}중반 이후에는 비동맹 중립 노선을 내세우는 {제3세계}가 등장하였다. 또한 1960년대 말 미국의 닉슨 독트린 발표는 냉전 체제가 {심화되는 데/완화되는 데*}영향을 끼쳤다."}, {"h": "냉전 체제의 형성", "s": "냉전 체제의 형성", "t": "참고) 닉슨 독트린(1969): 아시아의 안보는 아시아인 스스로 책임지라는 내용"}, {"h": "냉전 체제의 형성", "s": "일본의 항복과 전후 처리", "t": "1. 제2차 세계 대전이 끝난 후 미국 주도의 연합국 최고 사령부는 일본의 {비군사화}와 {민주화}를 목표로 개혁을 추진하였다. 이에 따라 일본의 {군사력 보유 금지} 등을 주요 내용으로 하는 {평화 헌법}이 제정되었고, 전쟁 범죄자 처벌을 위한 {극동 국제 군사 재판(도쿄 재판)}도 열렸다. 그러나 냉전이 본격화되면서 미국의 정책은 일본을 동아시아의 {반공 거점}으로 삼는 방향으로 변화하였다."}, {"h": "냉전 체제의 형성", "s": "일본의 항복과 전후 처리", "t": "2. 극동 국제 군사 재판(1946~1948)은\n① 주요 {피해국의 의견이 제대로 반영 되지 않았음} ② 전쟁 최고 책임자인 {일왕은 기소되지 않는} 등 한계가 있었다."}, {"h": "냉전 체제의 형성", "s": "미・소 중심의 냉전이 본격화되다", "t": "1. 미국은 _공산주의의 팽창을 막기 위해 자유 민주주의 국가를 지원_하겠다는 {트루먼*/닉슨}독트린을 발표하고, _유럽 부흥을 위한 경제 원조 계획_인 {마셜 플랜}을 세웠다. 또한 _서유럽 국가와 군사 방위 체제를 구축_하기 위해 {북대서양 조약 기구(NATO)}를 조직하였다."}, {"h": "냉전 체제의 형성", "s": "미・소 중심의 냉전이 본격화되다", "t": "2. 이에 맞서 _소련은 동유럽 국가_와 {경제 상호 원조 회의(COMECON)}를 결성하였고, 상호 방위를 목적으로 {바르샤바 조약 기구(WTO)}를 조직하였다."}, {"h": "냉전 체제의 형성", "s": "미・소 중심의 냉전이 본격화되다", "t": "3. 자본주의와 공산주의 진영 비교"}, {"h": "냉전 체제의 형성", "s": "미・소 중심의 냉전이 본격화되다", "tbl": [["구분", "미국 중심 (자본주의 진영)", "소련 중심 (공산주의 진영)"], ["정치·이념", "{트루먼 독트린}(1947) : 공산주의의 팽창을 막기 위해 자유 민주주의 국가를 지원하겠다고 발표", "{코민포름}(공산당 정보국, 1947) : 공산당의 정보 교환과 협력 목적"], ["경제", "{마셜 플랜} : 유럽 부흥을 위한 경제 원조 계획", "{경제 상호 원조 회의(COMECON)} : 동유럽 국가와 결성"], ["군사", "{북대서양 조약 기구(NATO)} : 서유럽 국가와 군사 방위 체제 구축", "{바르샤바 조약 기구(WTO)} : 상호 방위 목적"]]}, {"h": "냉전 체제의 형성", "s": "미・소 중심의 냉전이 본격화되다", "img": "a2_0", "lines": []}, {"h": "냉전 체제의 형성", "s": "중화 인민 공화국 수립", "t": "1. 일본의 침략에 맞서 힘을 합하였던 _중국_ {국민당}_과 중국_ {공산당}_은 전쟁이 끝나자 다시 대립_하였다. {마오쩌둥*/장제스}이 이끄는 중국 {국민당/공산당*}은 내전에서 승리하여 중국 본토 대부분을 장악하고 {중화 인민 공화국}을 수립하였다. 대륙에서 밀려난 중국 {공산당/국민당*}은 {타이완}으로 이동하였다. 이로써 중국 대륙이 {공산화}되었다."}, {"h": "냉전 체제의 형성", "s": "베트남 전쟁에 미국이 개입하다", "t": "1. {호찌민}의 주도로 수립된 _베트남 민주 공화국_은 {프랑스}와의 전쟁에서 {승리*/패배}하였지만, {제네바 회담}_에 따라 북위 17도선을 경계로 분단_되었다. 이후 남쪽에 {미국}의 지원으로_베트남 공화국_이 들어서자, 남북 간의 대립은 전쟁으로 이어졌다. 미국은 {통킹만 사건}을 빌미로 _전쟁에 전면 개입_하고, {소련과 중국} _등도 북베트남을 지원하면서 전쟁은 국제전_으로 확대되었다."}, {"h": "냉전 체제의 형성", "s": "베트남 전쟁에 미국이 개입하다", "img": "a3_0", "lines": []}, {"h": "냉전 체제의 형성", "s": "베트남 전쟁에 미국이 개입하다", "img": "a3_1", "lines": []}, {"h": "냉전 체제의 형성", "s": "제3세계의 형성", "t": "1. _제2차 세계 대전 이후 새롭게 독립한 아시아와 아프리카의 많은 국가_는 _미·소 진영 어느 쪽에도 가담하지 않는_ {비동맹 중립주의} _노선을 표방_하였다. 이러한 움직임은 {아시아·아프리카 회의(반둥 회의)}로 구체화되었고, {제3세계}의 형성으로 이어졌다."}, {"h": "냉전 체제의 형성", "s": "제3세계의 형성", "t": "2. 아시아·아프리카 회의(반둥 회의, 1955) : {중국}·{인도} 등 아시아·아프리카 신생 독립 29개국이 {'평화 10원칙'}에 합의, {비동맹 중립 노선 선언}하면서 {제3세계}를 형성함"}, {"h": "냉전 체제의 형성", "s": "제3세계의 형성", "t": "• 참고) 미국 등 서방 국가 = 제1세계 / 소련과 동유럽 국가 = 제2세계"}, {"h": "냉전 체제의 형성", "s": "제3세계의 형성", "img": "a3_2", "lines": []}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "t": "1. 미국의 _베트남 전쟁 개입에 대한 국제적 비난_이 높아지고 전쟁이 장기화되면서 _미국 내 반전 운동_이 거세게 일어났다. 이에 부담을 느낀 _미국은 아시아에서 미국의 군사적 역할을 축소_한다는 {트루먼/닉슨*} 독트린을 발표하였다. 이후 _미국은_ ① {베트남에서 군대를 철수}하였고, ② {중국과 관계 개선}을 시도하였다."}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "t": "2. 다음 사건의 순서를 쓰시오."}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "tbl": [["① 1947", "트루먼 독트린", "냉전의 시작"], ["② 1947", "마셜계획", ""], ["③ 1947", "코민포름", "소련이 마셜 계획에 대항하기 위해 만듦"], ["④ 1948", "대한민국 정부·북한 정권 수립", ""], ["⑤ 1949", "코메콘 창설", ""], ["⑥ 1949", "나토 창설", ""], ["⑦ 1949", "중화 인민 공화국 수립", ""], ["⑧ 1950", "6·25 전쟁", ""], ["⑨ 1954", "제네바 회담", "베트남 17도선 분단"], ["⑩ 1955", "반둥 회의", ""], ["⑪ 1955", "바르샤바 조약 기구 창설", ""], ["⑫ 1964", "통킹만 사건", ""], ["⑬ 1969", "닉슨 독트린", "냉전의 완화 이후 미군 베트남에서 철수, 중국과 관계 개선"], ["⑭ 1972", "닉슨 중국 방문", ""], ["⑮ 1979", "미·중 수교", ""], ["⑯ 1989", "몰타 회담", "냉전의 종식"], ["⑰ 1990", "독일 통일", ""], ["⑱ 1991", "소련 해체", "냉전 체제 완전 종료"]]}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "t": "• _미국은 베트남 전쟁과 같은 군사적 개입을 앞으로 피한다_.", "pre": "3."}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "t": "• 미국은 강대국의 핵 위협을 제외하고는 아시아 각국에서 내란이 일어나거나 침략을 받더라도 개입 하지 않는다."}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "t": "• 미국은 아시아 각국의 자주적 행동을 측면 지원한다."}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "t": "①\n위 사료는 {1969}년에 발표된 {닉슨 독트린}이다."}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "t": "② 위 사료의 핵심은 아시아에서 {미국}의 군사적 역할을 {확대/축소*} 한다는 것으로 이후 미 국은 {베트남}에서 미군을 철수 하였고 {중국}과 관계 개선을 시도하였음"}, {"h": "냉전 체제의 형성", "s": "냉전 체제가 완화되다", "t": "③ 중국을 방문한 미국 대통령은 {닉슨}으로 {1972}년에 중국을 방문하였다."}, {"h": "광복과 국토의 분단", "s": "광복 전후 주요 인물 성향", "tbl": [["좌익", "중도 좌익", "중도 우익", "우익"], ["_김일성(북), 박헌영(남)_", "_여운형_", "_안재홍, 김규식_", "_이승만, 김구_"]]}, {"h": "광복과 국토의 분단", "s": "광복 전후 주요 인물 성향", "t": "· 여운형 + 안재홍 = {조선 건국 준비 위원회}\n· 여운형 + 김규식 = {좌우 합작 운동}\n· 김규식 + 김구 = {남북 협상(+김일성)}"}, {"h": "광복과 국토의 분단", "s": "조선 건국 준비 위원회가 조직되다", "t": "1. 1945년 8월 15일 한국은 일제의 항복과 동시에 광복을 맞이하였다. 광복은 ①_한국인들이 수십 년간 목숨 바쳐 전개한 독립운동의 결실_이었다. 그렇지만 ②{연합국*/동맹국}이 _제2차 세계 대전에서 승리하여 얻은 결과_이기도 하였으므로, 한국의 진로는 _미국, 소련 등 연합국의 결정_에 영향을 받게 되었다."}, {"h": "광복과 국토의 분단", "s": "조선 건국 준비 위원회가 조직되다", "t": "2. {조선 건국 동맹*/조선 독립 동맹}을 비밀리에 이끌던 {여운형*/김구}은 일제의 패망 직전 조선 총독부와 {치안 유지} 및 {행정권 이양}을 교섭하였다. 이에 {정치 활동 불간섭}을 약속받고 {안재홍*/김규식}과 함께 좌우익 세력을 모아 광복 {직후*/직전} {조선 건국 준비 위원회(건준)}를 조직하였다."}, {"h": "광복과 국토의 분단", "s": "조선 건국 준비 위원회가 조직되다", "t": "3. 건준은 ①전국 각지에 {지부}를 두고 ② {치안대}를 조직하여 질서를 유지하였다. 그러나 조선 총독부는 미·소가 38도선을 경계로 남북을 나누어 점령한다는 사실을 알고 건준의 활동을 {방해}하였다."}, {"h": "광복과 국토의 분단", "s": "조선 건국 준비 위원회가 조직되다", "t": "4. 또한 {우익/좌익*} 세력이 주도권을 장악하자 {여운형/안재홍*} 등 {좌익/우익*} 세력이 건준에서 이탈하였다. 이후 건준은 미군의 진주에 {앞서*/뒤에} {조선 인민 공화국} 수립을 선포하여 한국인을 대표하고자 하였다. 이로써 건준은 해체되었고, 각 지부는 {인민 위원회}로 명칭이 바뀌었다."}, {"h": "광복과 국토의 분단", "s": "조선 건국 준비 위원회가 조직되다", "tbl": [["① 1944.8.", "_조선 건국 동맹_ 결성", ""], ["② 1945.8", "광복", ""], ["③ 1945 . 이러한 가운데 1945년 12월 {미국·영국·소련}의 _외무 장관이 모스크바에서 한국 문제를 논의_하였는데 이르를 {모스크바 3국 외상 회의}라고 한다."}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "t": "2. 광복 이후 국내의 주요 정치 세력"}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "tbl": [["정치 단체", "대표 인물"], ["한국 민주당", "송진우, 김성수"], ["한국 독립당", "김구"], ["독립 촉성 중앙 협의회", "이승만"], ["조선 공산당", "박헌영"]]}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "t": "3. 모스크바 3국 외상 회의에서는★★★\n① 한반도에 {임시 민주 정부를 수립}하고, ② 이를 위해 {미소 공동 위원회를 설치}하며 ③ {최대 5년간 신탁 통치}를 실시한다는 내용이 협의되었다.→ 신탁통치는 {미국, 영국, 중국, 소련} 등에 실시된다."}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "t": "4. 이에 대해 김구, 이승만 등 {우익*/좌익} 진영은 신탁 통치가 한국인의 자주권을 부정하는 결정이라고 비판하며 {찬성/반대*} 운동을 펼쳤다. 좌익 진영은 처음에는 {찬성/반대*}하였으나, 신탁 통치를 _임시 민주 정부 수립을 위한 지원_이라고 여겨 모스크바 3국 외상 회의의 결정을 {찬성*/반대} 하였다. 이후 _좌익과 우익은 의견 차이를 좁히지 못한 채 격렬하게 대립_하였다."}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "t": "1. 한국의 독립을 위하여 _임시 민주 정부를 수립_한다.", "pre": "5."}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "t": "2. 임시 정부 수립을 위하여 _미소 공동 위원회를 설치_하고 한국의 정당 및 사회단체 와 협의한다."}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "t": "3. 미소 공동 위원회의 제안은 _조선 임시 정부와 협의 후 5년 이내를 기한_으로 하는 조선에 대한 _4개국 신탁 통치의 협정을 작성_하기 위하여 _미국 · 소련 · 영국 · 중국_ 각국 정부의 공동 심의를 받아야 한다.\n위 사료는 {모스크바 3국 외상 회의 결정서}의 일부이다."}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "t": "6. 모스크바 3국 외상 회의 결과가 공식 발표되기 전에 일부 국내 신문이 _신탁 통치안을 강조한 보도_를 내면서 신탁 통치 {찬성/반대*} 여론이 고조되었다. 회의 결과가 공개된 이후 좌익은 처음의 {찬성/반대*} 입장을 바꾸어 회의 결정을 {반대/지지*} 하였다."}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "t": "7.한국은 {카이로 선언}을 통해 연합국으로부터 독립을 약속받았다. 그러나 _독립에 대한 구체적인 방안이 확정되지 않은 상황에서 광복을 맞이_하였고, 이후 모스크바 3국 외상 회의에서 한반도 문제 등 전후 처리 방안이 추가로 논의되었다. 회의 초반에 _미국은 최대 10년의 신탁 통치를 주장_하였고, _소련은 임시 정부 수립 등을 제안_하였다. 양국은 서로의 의견을 절충하여 합의하였는데, 국내에는 _“소련이 신탁 통치 주장”이라고 사실과 다르게 보도_되어 큰 파장을 불러일으켰다. 나중에 회의 전체 내용이 공개되었지만 신탁 통치에 대한 거부감은 수그러들지 않았고, 여론은 분열되었다. 한편 _미국과 소련은 한반도 문제를 서로 자국에 유리한 방향_으로 풀어나가려 하였다. 이러한 상황에서 한국인에게 최선의 길은 무엇이었을까?"}, {"h": "광복과 국토의 분단", "s": "모스크바 3국 외상 회의와 국내의 갈등", "img": "a8_0", "lines": []}, {"h": "통일 정부 수립 운동", "s": "제1차 미·소 공동 위원회가 무기 휴회되다", "t": "1. 모스크바 3국 외상 회의의 결정에 따라 _한국의 임시 민주 정부 수립을 논의_하기 위해 {제1차 미소 공동 위원회}가 {서울*/평양}에서 열렸다(1946. 3) 그러나 _자국에 유리한 임시 정부를 세우려는 미국과 소련의 의견 차이를 좁히기 어려웠다_. {미국*/소련}은 임시 민주 정부 수립을 위한 협의 대상에 신탁 통치 반대 세력도 포함하려 하였으나, {미국/소련*}은 모스크바 3국 외상 회의를 지지하는 세력만 참여시키자고 주장하였다. 결국 _제1차 미·소 공동 위원회는 합의점을 찾지 못한 채 무기 휴회_에 들어갔다. (1946. 5. )"}, {"h": "통일 정부 수립 운동", "s": "제1차 미·소 공동 위원회가 무기 휴회되다", "t": "2. 이러한 상황에서 {이승만*/김구}은 _남한만이라도 임시 정부를 수립_해야 한다고 주장하였는데 이를 {정읍 발언}이라고 한다. 그러나 통일 정부 수립을 희망하던 한국인들은 이 주장에 대부분 동의하지 않았고, 미국도 소련과 협의하여 한국 문제를 해결하려는 정책을 유지하였다."}, {"h": "통일 정부 수립 운동", "s": "제1차 미·소 공동 위원회가 무기 휴회되다", "t": "3. 이제 우리는 _무기 휴회된 미·소 공동 위원회_가 다시 열릴 기색도 보이지 않으며, 통일 정부를 고대하나 여의치 않게 되었다. 우리는 _남방만이라도 임시 정부 또는 위원회 같은 것을 조직_하여 38도선 이북에서 _소련이 물러나도록_ 세계 여론에 호소해야 될 것이니, 여러분도 결심해야 할 것이다\n①\n위 사료는 {이승만}의 {정읍 발언}이다.\n② {1차 미·소 공동위원회} 결렬 → 정읍발언 → {좌우 합작 운동}"}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "1. 제1차 미소 공동 위원회가 무기 휴회되고 좌익과 우익의 대립이 격화되는 가운데 {여운형}과 {김규식} 등 _중도 세력_은 {좌우 합작 운동}을 추진하였다. 이들은 중도 세력을 중심으로 정국을 개편하려는 미군정의 {지원을 받아*/반대에도 불구하고} {좌우 합작 위원회}를 조직하고, 좌익과 우익의 의견을 _절충_하여 {‘좌우 합작 7원칙’}을 발표하였다"}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "2. ‘좌우 합작 7원칙’의 주요 내용은 ① {통일 임시 정부 수립} ② {유상 매입}과 {무상 분배} 원칙의 토지 개혁, ③ {친일 반민족 행위자 처벌} 등 이었다."}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "3. ① _김구와 한국 독립당_은 이를 적극 {지지*/반대}하였지만, _이승만_은 {모호한} 태도를 보였다. ② _한국 민주당은_ 제시된 _토지 개혁 방식이 국가 재정의 파탄을 초래할 것_이라며 {찬성/반대*}하였다. ③ _좌익 세력_은 _무상 몰수·무상 분배의 토지 개혁과 친일파 즉각 청산을 요구_하며{지지/비판*}하였다."}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "4. 이러한 상황에서 _좌우 합작 위원회의 활동은 한계_에 부딪혔고, _미군정의 관심도 줄어_들었다. {여운형}이 암살당하면서 _좌우 합작 운동은 사실상 중단_되었고 _좌우 합작 위원회도 해산_하였다"}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "img": "a10_0", "lines": [], "pre": "5."}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "왼쪽 그림은 {좌우 합작 운동}과 관련된 그림이다. 극좌 세력과 극우 세력이 {좌우 합작}을 방해하는 모습을 풍자하고 있다. 가운데 두 인물 중 왼쪽은 {여운형}, 오른쪽은 {김규식}이다."}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "1. 남북을 통한 _좌우 합작으로 민주주의 임시 정부를 수립할 것_.", "pre": "6."}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "2. _미·소 공동 위원회의 속개를 요청_하는 공동 성명을 발표할 것."}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "3. 토지 개혁은 _몰수, 유상 매수 등으로 농민에게 무상 분배_하고, _주요 산업을 국유화_할 것."}, {"h": "통일 정부 수립 운동", "s": "좌우 합작 운동을 전개하다", "t": "4. 친일 반민족 행위자 처리는 새로이 구성할 입법 기구에서 심의 결정하여 실시할 것.\n①\n위 사료는 {좌우 합작 운동}에서 등장한 {좌우 합작 7원칙}이다.\n② 위 원칙은 중도파 세력은 {지지} 하였고 우익은 {친일 반민족 행위 처벌 문제} 때문에 {반대*/찬성}함 좌익은 {무상 몰수·무상 분배}의 토지 개혁과 친일파 {즉각} 청산을 요구하며 {반대*/찬성}함"}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "1. 1947년 5월, _제2차 미소 공동 위원회가 열렸으나 이견을 좁히지 못한 채 결렬_ 되었다. 미소 공동 위원회에서 합의가 어렵다고 여긴 미국은 한국 문제를 {유엔}에 이관하였다. {유엔 총회}는 미국의 제안대로 _인구 비례에 따른 총선거를 통해 한반도에 정부를 수립_한다는 결의안을 통과시켰다(1947. 11 )"}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "2. 그리고 _총선거를 관리 감독할 유엔 한국 임시 위원단을 파견_하였으나, _소련은 위원단의 입북을 거부_하였다. 이에 {유엔 소총회}는 _유엔 한국 임시 위원단의 접근이 가능한 지역의 총선거를 결의_하였다(1948. 2 )"}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "3. 남한만의 단독 선거가 결정되자 {김구}와 {김규식} 등은 통일 정부 수립을 위해 {남북 협상}을 추진하였다. 이러한 가운데 {평양}에서 _‘전 조선 제 정당·사회단체 대표자 연석 회의(남북 연석 회의)’_가 개최되었다(1948. 4) {평양}을 방문한 김구와 김규식 등은 북한 지도자들과 회담을 갖고, ① 외국 군대 철수, ② 남한 단독 선거 반대 등을 포함한 공동 성명을 발표하였다."}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "4. 그러나 _북한은 이미 독자적인 정권 수립이 진행 중_이었고, _남한에서는 단독 선거가 추진_되면서 _남북 협상은 성과를 거두지 못하였다_."}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "5. 마음속의 38선이 무너지고야 땅 위의 38선도 철폐될 수 있다. …… _나는 통일된 조국을 건설하려다 38선을 베고 쓰러질지언정_, 일신의 구차한 안일을 위하여 _단독 정부를 세우는데는 협력하지 않겠다_.\n위 사료는 {김구}의 {삼천만 동포에게 읍고함}이다. {김구}는 남한만의 단독 선거가 결정되자 이에 반대하는 {‘삼천만 동포에게 읍고함’}을 발표하였다. 또한 통일 정부 수립을 위해 {김규식} 등과 함께 {평양}을 방문하여 {남북 협상}에 참여해 북한의 지도자들과 공동 성명을 발표하였다."}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "1. _남과 북에서 외국 군대는 즉시 철수_해야 한다.", "pre": "6."}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "2. _외국군 철수 후 남북은 내전과 무질서를 반대_한다."}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "3. 남북 정당 사회단체 협의회를 소집하여 임시 정부를 수립하고 _총선거를 통해 입법 기관을 선출한_ 다음 헌법을 제정하고 통일 정부를 수립한다."}, {"h": "통일 정부 수립 운동", "s": "남북 협상이 추진되다", "t": "4. _남한의 단독 선거를 반대_한다.\n①\n위 사료는 {남북 협상} 공동 성명 내용이다.\n② 위 협의 내용이 현실화 될 수 없었던 이유는? → {남북에 각각 단독 정부를 수립하려는 세력이 있어 남북 협상이 실현되기에는 한계가 있었고, 남한 단독 선거를 막기에 시기적으로 늦은 움직임이었다.}"}, {"h": "통일 정부 수립 운동", "s": "단독 정부 수립을 둘러싼 갈등", "t": "1. 남한의 단독 선거 확정 후 분단 가능성이 더욱 높아지자, 이에 반대하는 움직임이 일어났다. 남북 협상을 추진한 세력은 선거에 {찬성/반대*}하였고, {우익/좌익*} 세력은 선거를 막기 위해 무장 투쟁을 벌이기도 하였다. 이처럼 단독 정부 수립을 둘러싼 갈등 속에서 {제주 4·3 사건}과 {여수·순천 10·19 사건}이 발생하였다."}, {"h": "통일 정부 수립 운동", "s": "단독 정부 수립을 둘러싼 갈등", "t": "2. _1947년 제주도에서 3·1절 기념행사가 끝나고 가두시위 중 경찰의 발포로 사상자가 발생_하자, 주민들은 항의 시위와 총파업을 벌였다. 여러 사람이 무차별 연행 되고 미군정에 대한 반감이 높아진 가운데 제주도의 {우익/좌익*} 세력 등이 {‘단독 선거 반대’}, {‘통일 정부 수립’}을 주장하며 무장봉기를 일으켰는데 이를 {제주 4·3 사건}이라고 한다."}, {"h": "통일 정부 수립 운동", "s": "단독 정부 수립을 둘러싼 갈등", "t": "3. 유혈 사태를 막기 위한 평화 협상도 추진되었지만, _미군정은 군대와 경찰, 서북 청년회 등을 동원_하여 진압에 나섰다. 이후 수립된 _이승만 정부는 제주도에 계엄령을 선포하여 강경한 진압_을 이어갔다. 이 과정에서 _민간인이 집단 사살_되기도 하였다."}, {"h": "통일 정부 수립 운동", "s": "단독 정부 수립을 둘러싼 갈등", "t": "4. 한편 이승만 정부가 여수에 주둔하고 있던 군부대에 제주도 출동 명령을 내리자, 부대 내의 {우익/좌익*} 세력 등은 {‘제주도 출동 반대’}, {‘통일 정부 수립’} 등을 내세우며 무장 봉기하는데 이를 {여수·순천 10·19 사건}이라고 한다. 이들은 한때 여수와 순천 일대를 장악하였으나 미국 군사 고문단의 협조를 받은 정부군에게 곧 진압되었고, _일부는_ {지리산} _일대로 옮겨 가서_ {6·25 전쟁} _때까지 활동_하였다. _여수·순천 10·19 사건이 진압되는 과정에서도 수많은 민간인이 희생_되었다."}, {"h": "대한민국 정부 수립", "s": "5·10총선거로 제헌 국회가 구성되다", "t": "1. _1948년 5월 10일, 38도선 이남 지역에서 유엔 한국 임시 위원단_의 감시 아래 총선거가 실시되었다. 5·10 총선거는 우리 역사상 _최초로 실시된_ {민주적인} _선거_였다. 그러나 _김구, 김규식 등 남북 협상에 참여하였던 인사_들과 _좌익 세력_ 등은 남한만의 단독 선거에 {찬성/반대*}하며 선거에 {참여/불참*}하였다."}, {"h": "대한민국 정부 수립", "s": "5·10총선거로 제헌 국회가 구성되다", "t": "2. 5·10 총선거는 {만 21}세 이상 {모든 남녀*/모든 남성}에 선거권을 부여하고 {만 25}세 이상 국민에세 피선거권을 부여한 {직접, 비밀, 평등, 자유}원칙에 입각한 민주 선거였다."}, {"h": "대한민국 정부 수립", "s": "5·10총선거로 제헌 국회가 구성되다", "t": "3. 5·10 총선거 결과 제주도의 {2*/3}곳을 제외한 선거구에서 임기 {2*/4}년의 국회의원 {198*/200}명 이 선출되었다. 제헌 국회는 국호를 {대한민국}으로 정하고 {헌법}을 제정·공포를 {1948. 7. 17}에 하였다,"}, {"h": "대한민국 정부 수립", "s": "5·10총선거로 제헌 국회가 구성되다", "t": "4. 제헌 헌법은 대한민국 정부가 {대한민국 임시 정부}의 _법통을 계승_한 {민주 공화국} 이라는 점을 밝혔으며, {삼권 분립}과 {대통령 중심제}를 채택하였다. 또한 ① {친일 반민족 행위자 청산}과 _②_ {농지 개혁} 등 독립운동가들이 새 국가 건설을 위해 구상하였던 주요 목표를 담았다."}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "t": "1. 제헌 국회는 헌법에 명시된 {직선제/간선제*} 규정에 따라 대통령에 {이승만}, 부통령에 {이시영}을 선출하였다. 이승만은 행정부를 구성하고 {미군정} 종식과 함께 대한민국 정부 수립을 국내외에 선포한 것이 {1948. 8. 15}이다."}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "t": "2. 그해 12월 유엔 총회는 대한민국 정부를 유엔 감시하의 _선거가 가능했던 지역에서 유일한 합법 정부_로 승인하였다. 이 후 대한민국은 미국 등 여러 나라로부터 승인을 받으며 국제 사회의 일원으로 자리 잡았다."}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "t": "3. 제헌 국회는 {무소속}이 85석으로 다수를 차지하였지만 {이승만}이 이끄는 {대한 독립 촉성 국민회}가 55석을 얻어 원내 제1당이 된 뒤 _한국 민주당 등 군소 우익 정당과 연합_ 해서 과반을 차지한 이승만을 대통령으로 선출하였다."}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "img": "a14_1", "lines": [], "pre": "4."}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "img": "a14_0", "lines": []}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "img": "a14_2", "lines": []}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "t": "사진: (5·10 총선거) 포스터 / {대한민국 정부} 수립 국민 축하식\n왼쪽은 {이승만}, 오른쪽은 {이시영}으로 제헌 헌법에 따르면 정·부통령의 임기는 4년이었다."}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "t": "5. 1948년에 발행된 대한민국 제1호 관보에는 발행 시기가 ‘대한민국 {30}년’으로 표기되어 있다. 이는 대한민국이 {1919}년에 수립된 {대한민국 임시 정부}에서 비롯되었다는 제헌 헌법의 전문과 관련 있다."}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "t": "6. 두 헌법 비교"}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "tbl": [["대한민국 임시 헌법", "제헌 헌법"], ["제1조 대한민국은 대한_인민_으로 조직함.\n제2조 대한민국의 주권은 대한_인민_ 전체에 재함.\n제3조 대한민국의 강토는 구한국의 판도로 함.\n제4조 대한민국의 _인민_은 일체 평등함.\n제5조 대한민국의 입법권은 {의정원}이, 행정권은 {국무원}이, 사법권은 {법원}이 행사함.\n제8조 대한민국의 _인민_은 법률 범위 내에서 좌에 각항의 자유를 향유함.\n1. 신교의 자유(종교의 자유) 2. 재산의 보유와 영농의 자유 3. 언론·저작·출판·집회·결사의 자유 4. 서신 비밀의 자유", "제1조 대한민국은 _민주 공화국_이다.\n제2조 대한민국의 주권은 _국민_에게 있고 모든 권력은 _국민_으로부터 나온다.\n제8조 모든 국민은 법률 앞에서 평등하며 성별, 신앙 또는 사회적 신분에 의하여 정치적·경제적·사회적 생활의 모든 영역에 있어서 차별을 받지 아니한다.\n제16조 모든 국민은 균등하게 교육을 받을 권리가 있다. 적어도 초등 교육은 의무적이며 무상으로 한다.\n제84조 대한민국의 경제 질서는 모든 국민에게 생활의 기본적 수요를 충족할 수 있게 하는 사회 정의의 실현과 균형 있는 국민 경제의 발전을 기함을 목적으로 삼는다. 각 인의 경제상 자유는 이 한계 내에서 보장한다."], ["위 사료는 {대한민국 임시} 헌법의 일부이다.", "위 사료는 {제헌} 헌법의 일부이다."]]}, {"h": "대한민국 정부 수립", "s": "대한민국 정부가 수립되다", "t": "7. 위 제헌 헌법에서 삼균주의가 반영된 부분은?\n① 제8조 모든 국민은 _법률 앞에서 평등_하며 정치적·경제적·사회적으로 차별 받지 않는다.\n② 제16조 모든 국민이 _균등하게 교육_ 받을 권리가 있다. ③ 제84조 개인의 _경제적 자유_를 보장한다."}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "1. 광복 이후 _식민지 잔재를 청산하고 친일 반민족 행위자를 처단_하는 일은 한국인 대다수가 요구하는 시대적 과제였다. 제헌 국회는 _‘반민족 행위를 처벌하는 특별법을 제정할 수 있다.’_라는 헌법 조항에 따라 {반민족 행위 처벌법(반민법)}을 제정하고(1948. 9 ) _국회 직속_의 {반민족 행위 특별 조사 위원회(반민 특위)}를 구성하였다."}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "img": "a15_0", "lines": [], "pre": "2."}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "• 밀정 행위로 독립운동을 방해한 자"}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "• 독립을 방해할 목적으로 단체를 조직하였거나 그 단체의 수뇌 간부로 활동하였던 자"}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "• 군, 경찰의 관리로서 악질적인 행위로 민족에 게 해를 가한 자"}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "• 비행기, 병기 또는 탄약 등 군수 공업을 책임 경영한 자\n위 사료는 {반민족 행위 처벌법}에 쓰인 {친일 반민족 행위자}의 유형이다.\n위 사진은 체포된 {친일 반민족 행위자}로 왼쪽에 있는 사람이 {노덕술}이고 그 다음으로 김연수, 최린, 이풍한이다."}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "3. 반민 특위는 _국민의 높은 지지 속_에서 친일 반민족 행위자에 대한 조사와 사법 처리에 나섰다. 그러나 반민 특위의 활동은 _이승만 정부의 비협조와 방해_로 위기를 겪었다. 대통령 이승만은 {반공}을 내세워 _반민 특위를 견제하는 담화_를 여러 번 발표하였고, _국회에 반민법 개정을 요구_하였다. 친일 고문 경찰로 악명 높았던 {노덕술}이 반민 특위에 검거되자, ‘반공 투쟁이 격렬한 때에 치안을 위해 경찰이 필요하니 반민 특위 조사 위원들은 신중히 처신하기 바란다.’라는 내용의 특별 담화도 발표하였다."}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "4. 이후 _경찰이 반민 특위 사무실을 습격하는 사건_이 발생하였다. 반민 특위 소속 국회 의원들은 공산당과 내통하였다는 혐의로 구속되었는데 이를 {국회 프락치 사건}이라고 한다, 반민법의 _공소 시효를 1949년 8월로 단축한 개정 법안_도 국회에서 통과되었다. 결국 _반민 특위는 해체_되었으며 친일 반민족 행위 청산 과제는 뒤로 미루어졌다."}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "5. 이것(반민법)이 상당한 법안이라 할지라도 전국 치안에 관계될 때에는 임시로 정지하는 것이 마땅한 일이다. 이미 법무부와 법제처에 지시해서 법안을 고쳐 국회에 제출하게 하는 중이니 우선 (반민 특위) 조사 위원들의 과도한 행동을 금지하기로 작정한 것이다.\n위 사료는 {반민법}에 대한 {이승만}의 담화이다."}, {"h": "대한민국 정부 수립", "s": "친일 반민족 행위자 청산을 위한 노력", "t": "6._다른 경찰이 합세하여 나를 발로 찼다_. 결국 나는 그들에게 신분증과 권총을 빼앗기고 사무실 뒤편에 있는 마당으로 끌려갔다. 끌려가서 보니 나보다 먼저 출근한 _특위 요원들과 낯이 익은 국회의원 등 여러 명이 모두 머리에 손을 얹고 땅바닥에 꿇어앉아 있었다_.\n위 사료는 경찰의 {반민 특위} 습격 사건과 관련된 사료이다."}, {"h": "대한민국 정부 수립", "s": "광복 이후 경제 상황", "t": "1. 광복 이후의 _국내 경제 상황은 여전히 어려웠고 남북 간 경제 불균형도 심하_였다. _남한은 북한에 비해 산업 기반 시설이 취약_하여 더 큰 어려움을 겪었다. 또한 일본의 자본과 기술이 빠져나가면서 공장의 수가 줄어든 반면에 해외에서 귀국하는 인구가 늘어나 _실업자가 대거 발생_하였다. 농민의 대다수는 자기 토지를 소유 하지 못한 _소작농이었으며 고율의 소작료에 시달렸다_."}, {"h": "대한민국 정부 수립", "s": "광복 이후 경제 상황", "t": "2. 이러한 상황에서 {미군정}이 _재정 마련을 위해 화폐를 과도하게 발행_하면서 _물가가 폭등_하였다. 또한 일제가 실시하였던 식량 통제 정책을 폐지하고 {미곡 자유화 정책}을 펼쳤으나 _상인과 지주의 매점매석으로 곡물 가격이 크게 올랐다_. 이에 식량 수급을 통제하였으나 별다른 성과를 거두지 못하였다."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "1. 광복 후 {미군정}은 _일본인 소유의 토지를 몰수하여 관리_하다가 {1948}년에 비로소 농민에게 {유상*/무상}으로 매각하였다. 하지만 본격적인 농지 개혁은 _대한민국 정부 수립 후_ {농지 개혁법}이 제정되면서 추진되었다."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "2. 농지 개혁은 _경작하는 농민이 토지를 소유해야 한다_는 {경자유전}의 원칙에 따라 {유상*/무상} 매수·{유상*/무상}분배 방식으로 실시되었다. 정부는 가구당 농지 소유의 상한선을 {3정보(약 3만m²)}로 정하고, 이를 초과하는 농지는 {지가 증권} 을 발급하고 매수하여 농민에게 매각하였다."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "3. 농지 개혁으로 ①_지주·소작제는 거의 소멸_되고, ②_농민 대다수가 자기 소유의 토지를 갖게 되었다_. 그러나 ③_농지가 아닌 토지는 개혁 대상에서 제외_되었고, ④_반민족 행위자의 토지 몰수도 이루어지지 않았다_. ⑤_유상 분배에 따른 부담으로 가난한 농민은 분배받은 농지를 팔고 다시 소작농이 되기도 하였다_."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "img": "a17_1", "lines": []}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "img": "a17_0", "lines": []}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "왼쪽 사진은 {지가 증권}으로 {농지 개혁법}에 따라 정부가 농지를 매수하고 보상하면서 발급하였다.\n오른쪽은 그래프는 {농지 개혁} 실시 전후 자작지는 {늘고*/줄고} 소작지는 {증가/감소*}한 것을 보여준다."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "5. 미군정은 일본인 소유 토지를 몰수하여 _미군정의 소유로 귀속_시켰고 동양 척식 주식회사를 {신한 공사}로 개편하여 관리하였다."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "6. 남한의 농지 개혁법은 _6·25 전쟁 직전인 1950년 5월에 실시_되어 농지를 얻게 된 _농민들이 전쟁 중 급격하게 공산화되지 않은 요인_이 되기도 하였다."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "• 농민이 아닌 사람의 농지, _농가 1가구당 3정보(약 3만m²)_ 초과 농지는 정부가 사들인다.", "pre": "7."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "• 분배받은 농지 상환액은 평년작 주생산물의 _1.5배로 하고 5년 동안 균등 상환_한다."}, {"h": "대한민국 정부 수립", "s": "농지 개혁을 실시하다", "t": "• 농가의 희망과 정부가 인정하는 사유에 따라서 일시 상환 또는 상환 기간을 단축할 수 있다\n위 사료는 {농지 개혁법}으로 이는 _1946년 6월 공포_되었으나 정부에서 재정 부담이 크다는 이유로 시행하지 않다가 보상액과 상환액이 같도록 개정한 후 {1950년 5월}에 시행하였다. 그 사이에 _많은 지주가 토지를 처분_하였고 농지 개혁이 실시되면서 _소작지가 크게 줄어_들었다. 농지 개혁은 여러 한계가 있었지만, _많은 농민이 자신의 토지를 소유하여 새로운 국가에 대한 희망_을 갖게 되었다는 점에서 역사적 의의가 있다."}, {"h": "대한민국 정부 수립", "s": "귀속 재산 처리법을 제정하다", "t": "1. 광복 이후 농지 개혁과 더불어 {귀속 재산} 처리도 식민지 경제 구조를 청산하는 중요한 문제였다. {귀속 재산}은 _패전한 일제가 한반도에서 축출됨에 따라 일본인이 남기고 간 것_으로 토지, 건물 등 부동산과 기업체, 유가 증권 등이 있었다. 이는 {미군정}에 접수되어 관리되다가 {대한민국 정부}에 이양되었다."}, {"h": "대한민국 정부 수립", "s": "귀속 재산 처리법을 제정하다", "t": "2. 정부는 {귀속 재산 처리법}을 제정하고, _농지를 제외한 나머지는 민간에 불하_하였다. 귀속 재산은 정부가 매긴 가격보다 {낮게*/높게}불하되었고, _대금은 장기간에 걸쳐 분할 상환이 가능_하였기 때문에 _예상보다 정부 재정에 기여하는 효과가 낮았다_. 또한 불하 과정에서 특정 {기업}에 대한 특혜 등의 부작용도 나타났다."}, {"h": "대한민국 정부 수립", "s": "귀속 재산 처리법을 제정하다", "t": "• _귀속 재산_은 합법적이며 사상이 온건 하고 운영 능력이 있는 선량한 연고자, 종업원 또는 농지 개혁법에 의하여 농지를 매수당한 자와 주택에 있어서는 특히 국가에 공이 있는 무주택자, 그 유가족, 주택 없는 빈곤한 노동자 또는 귀속 주택 이외의 주택을 취득하기 곤란 한 자에게 우선적으로 매각한다.", "pre": "3."}, {"h": "대한민국 정부 수립", "s": "귀속 재산 처리법을 제정하다", "t": "• 재산 매각에 있어서 _최고 15년의 기한으로 분할하여 대금을 납부_할 수 있다.\n위 사료는 {귀속 재산 처리법}의 일부이다."}, {"h": "대한민국 정부 수립", "s": "북한 정권이 수립되다", "t": "1. 소련군은 38도선 이북의 각 지역에 좌우 합작으로 성립된 {인민 위원회}의 자치를 인정하였다. 그렇지만 _모스크바 3국 외상 회의 후 신탁 통치에 반대하는 조만식 등 민족주의 세력을 억압_하였다."}, {"h": "대한민국 정부 수립", "s": "북한 정권이 수립되다", "t": "2. 이러한 상황에서 {김일성}을 위원장으로 조직된 {북조선 임시 인민 위원회}(1946. 2)는 각종 개혁을 통해 {사회주의} 경제 체제의 토대를 마련해 나갔다."}, {"h": "대한민국 정부 수립", "s": "북한 정권이 수립되다", "t": "3. 먼저 {무상*/유상}몰수·{무상*/유상}분배의 토지 개혁을 실시하였다. _분배된 토지의 매매·소작·저당은 금지_되었지만 _토지 개혁은 농민층의 높은 지지_를 받았다. 또한 _8시간제 노동법_과 _남녀평등권 법령을 제정_하였 으며 주요 산업을 {국유화}하였다."}, {"h": "대한민국 정부 수립", "s": "북한 정권이 수립되다", "t": "3. 1947년 북조선 임시 인민 위원회의 개편으로 성립된 _북조선 인민 위원회는 헌법 초안을 마련_하였다. 이후 총선거를 통해 구성된 {최고 인민 회의}가 헌법을 채택하고, {김일성}을 초대 수상으로 하여 {조선 민주주의 인민 공화국}이라는 이름으로 별도의 정권을 {1948. 9. 9}일에 세웠다."}, {"h": "대한민국 정부 수립", "s": "북한 정권이 수립되다", "t": "4. 그 결과 한반도에는 _이념과 체제가 다른 대한민국 정부와 북한 정권이 성립_하여 서로 대립하는 상황이 전개되었다."}, {"h": "대한민국 정부 수립", "s": "북한 정권이 수립되다", "img": "a19_0", "lines": [], "pre": "5."}, {"h": "대한민국 정부 수립", "s": "북한 정권이 수립되다", "t": "왼쪽 사진은 {남한/북한*}의 {토지 개혁} 홍보 포스터이다. {북조선 임시 인민 위원회*/조선 민주주의 인민 공화국}는 _조선 총독부와 일본인, 친일 반민족 행위자, 지주 등의 토지를 몰수하여 농민에게 분배_하였다."}, {"h": "대한민국 정부 수립", "s": "연표 암기", "tbl": [["①", "1945.8", "광복, 조선 건국 준비 위원회"], ["②", "1945.12", "모스크바 3국 외상 회의"], ["", "1946.2", "_북조선 임시 인민 위원회_"], ["③", "1946.3", "_북한의 토지 개혁_ → 제1차 미·소 공동 위원회"], ["④", "1946.6", "정읍 발언"], ["⑤", "1946.7", "좌우 합작 운동"], ["", "1947.2", "_북조선 인민 위원회 수립_"], ["⑥", "1947.5", "제2차 미·소 공동 위원회"], ["⑦", "유엔 총회 : 남북한 인구 비례에 근거 총선거 → 유엔 한국 임시 위원단 파견 → 소련의 거부", ""], ["⑧", "1948.2", "김구 삼천만 동포에게 읍고함(2월 10일)"], ["⑨", "유엔 소총회 : 선거 가능한 지역의 총선거(2월 26일)", ""], ["⑩", "1948.4", "제주 4·3 사건"], ["⑪", "1948.4", "남북 협상"], ["⑫", "1948.5", "5·10 총선거"], ["⑬", "1948.7", "제헌 헌법 공포"], ["⑭", "1948.8", "대한민국 정부 수립"], ["⑮", "1948.9", "_조선 민주주의 인민 공화국 정부 수립_"], ["⑯", "1948.9", "반민족 행위 처벌법 제정"], ["⑰", "1948.10", "여수·순천 10·19 사건"], ["⑱", "1949.5", "국회 프락치 사건(반민특위탄압)"], ["⑲", "1949.6", "반민 특위 습격 사건 → 농지 개혁법 제정 → 김구 암살"], ["⑳", "1949. 12", "귀속 재산 처리법 재정"], ["21", "1950.3", "농지 개혁법 개정안 및 시행령 통과"], ["22", "1950.5", "농지 개혁법 본격 시행(6.25 이전, 급속한 공산화 저지)"]]}, {"h": "대한민국 정부 수립", "s": "주요 인물 암기", "tbl": [["남북 협상", "김구, 김규식"], ["정읍 발언", "이승만"], ["남한만의 총선거 주장", "이승만"], ["조선 건국 준비 위원회 결성", "여운형, 안재홍"], ["좌우 합작 운동 추진", "여운형, 김규식"]]}, {"h": "대한민국 정부 수립", "s": "위원회 SET", "t": "{조선 건국 준비} 위원회 → {제1차 미소 공동} 위원회 → {좌우합작} 위원회"}, {"h": "대한민국 정부 수립", "s": "광복 직후의 흐름", "t": "광복(8.15) → {조선 건국 준비 위원회} → {조선 인민 공화국} → 맥아더의 포고령(9.7) → {한국 민주당 창당} → _미군정청 설치(9.20)_ → {임시 정부 요인 개인 자격으로 귀국} → _모스크바 3국 외상회의(12월)_"}];
const SECS=[...new Set(DATA.map(d=>d.h))];
const ROM=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ'];
const KEY='hy-hist2-hanguk-2-1-v1';
let st={done:{}};try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.done)st=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
let section='0',showAll=false,hideDone=false;
$('sec').innerHTML=SECS.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+s+' ('+DATA.filter(d=>d.h===s).length+')</option>').join('');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function mk(t){
  return esc(t).replace(/\{(.+?)\}/g,(m,x)=>{
    if(x.includes('/')){
      return '<span class="pick">( '+x.split('/').map(o=>{const ok=o.endsWith('*');o=o.replace(/\*$/,'');return '<button class="op'+(showAll&&ok?' right':'')+'" data-ok="'+(ok?1:0)+'">'+o+'</button>'}).join('<i>/</i>')+' )</span>';
    }
    return '<button class="bl'+(showAll?' open':'')+'" style="min-width:'+Math.max(2.5,x.length*0.95)+'em"><span>'+x+'</span></button>';
  }).replace(/_(.+?)_/g,'<u>$1</u>').replace(/\n/g,'<br>');
}
function render(){
  const items=DATA.map((d,i)=>[d,i]).filter(([d])=>d.h===SECS[+section]);
  const nd=items.filter(([d,i])=>st.done[i]).length;
  $('score').innerHTML='<span>외운 문장</span><strong>'+nd+'/'+items.length+'</strong>';
  $('bar').style.width=(items.length?nd/items.length*100:0)+'%';
  let h='',cur='',n=0;
  items.forEach(([d,i])=>{
    if(hideDone&&st.done[i])return;
    if(d.s!==cur){cur=d.s;n=0;h+='<h3 class="sh">'+esc(d.s)+'</h3>'}
    n++;
    const num=(d.pre||((d.t||'').match(/^(\d+)\./)||[])[0]||'');
    h+='<article class="it'+(st.done[i]?' dn':'')+'"><div class="ih"><span class="nn">'+num+'</span><button class="chk" data-i="'+i+'" aria-pressed="'+(st.done[i]?'true':'false')+'">'+(st.done[i]?'외웠어요 ✓':'외웠어요')+'</button></div>';
    if(d.img)h+='<img src="img/'+d.img+'.jpg" alt="">'+(d.lines||[]).map(l=>'<p>'+mk(l)+'</p>').join('');
    else if(d.tbl)h+='<div class="tw"><table>'+d.tbl.map((r,ri)=>'<tr>'+r.map(c=>(ri===0?'<th>':'<td>')+mk(c)+(ri===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>';
    else h+='<p>'+mk(d.t.replace(/^\d+\.\s*/,''))+'</p>';
    h+='</article>';
  });
  if(!h)h='<div class="empty">이 단원의 문장을 모두 외웠어요! 👏<br>‘외운 문장 숨기기’를 끄면 다시 볼 수 있어요.</div>';
  $('list').innerHTML=h;
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('bl'))b.classList.toggle('open');
  else if(b.classList.contains('op')){b.classList.add(b.dataset.ok==='1'?'right':'bad');if(b.dataset.ok!=='1')setTimeout(()=>b.classList.remove('bad'),900)}
  else if(b.classList.contains('chk')){const i=b.dataset.i;if(st.done[i])delete st.done[i];else st.done[i]=1;save();render()}
});
$('sec').onchange=e=>{section=e.target.value;window.scrollTo({top:0});render()};
$('all').onclick=e=>{showAll=!showAll;e.currentTarget.setAttribute('aria-pressed',showAll);e.currentTarget.textContent=showAll?'모두 가리기':'정답 모두 보기';render()};
$('hide').onclick=e=>{hideDone=!hideDone;e.currentTarget.setAttribute('aria-pressed',hideDone);render()};
let armed=false;
$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}
 st={done:{}};save();armed=false;t.textContent='기록 초기화';render()};
render();
</script>
<script>
(function(){
const H=1418297543,K='hy-hist2-hanguk-2-1-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
