<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>세계 문제와 미래 사회 1주차</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --band:#1C2747; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.14);
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#16203A; --muted:#6A7389; --line:#E1E5EE;
  --o:#2563EB; --o-soft:#E6EEFF; --x:#E0453A; --x-soft:#FDEBEA; --gold:#F5B731;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --shadow:0 10px 30px rgba(22,32,58,.10),0 2px 6px rgba(22,32,58,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.band{background:var(--band);color:var(--band-ink);padding-bottom:64px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.badge b{color:var(--o);font-weight:400}.badge i{color:var(--x);font-style:normal}
.logo small{display:block;font-size:12px;opacity:.75;font-weight:500;letter-spacing:.02em}
.logo h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(19px,5.4vw,24px);letter-spacing:0;line-height:1.15}
.score{flex:0 0 auto;text-align:center;background:var(--band-soft);border-radius:14px;padding:8px 12px;min-width:64px;font-variant-numeric:tabular-nums}
.score span{display:block;font-size:11px;opacity:.8}
.score strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,.chip{font:inherit;font-size:14px;font-weight:500;color:var(--band-ink);background:var(--band-soft);border:1px solid transparent;border-radius:999px;padding:9px 14px;min-height:40px;-webkit-appearance:none;appearance:none}
select{flex:1 1 150px;min-width:0;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{color:#16203A;background:#fff}
.chip{cursor:pointer;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--gold);color:#1C2747}
.progress{height:6px;background:var(--band-soft);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--gold);width:0;border-radius:6px;transition:width .3s}
main.wrap{margin-top:-48px;display:flex;flex-direction:column;gap:16px;padding-block:0 24px}
.card{background:var(--surface);border-radius:24px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:16px;min-height:280px;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.no{font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:0}
.no em{font-style:normal;font-size:13px;font-family:var(--sans);font-weight:700;color:var(--muted);margin-left:4px}
.tag{background:var(--bg);border-radius:999px;padding:5px 11px;font-weight:500;font-size:12px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{font-size:clamp(19px,5.1vw,22px);font-weight:500;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.result{margin-top:auto;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start;animation:pop .28s ease-out}
.result[data-k="O"]{background:var(--o-soft)} .result[data-k="X"]{background:var(--x-soft)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.mark{flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-size:30px;border-radius:50%;color:#fff;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.result[data-k="O"] .mark{background:var(--o)} .result[data-k="X"] .mark{background:var(--x)}
@keyframes stamp{from{transform:scale(.4) rotate(-20deg)}to{transform:none}}
.verdict{font-weight:900;font-size:16px;margin:3px 0 6px}
.verdict.ok{color:var(--o)} .verdict.no{color:var(--x)}
.exp{font-size:15.5px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad button{font-family:var(--display);font-size:52px;line-height:1;cursor:pointer;border:none;border-radius:24px;min-height:104px;color:#fff;box-shadow:var(--shadow);transition:transform .1s}
#bO{background:var(--o)} #bX{background:var(--x)}
.pad button:active{transform:scale(.96)}
.next{width:100%;font:inherit;font-size:18px;font-weight:700;cursor:pointer;border:none;border-radius:20px;min-height:66px;background:var(--band);color:#fff;box-shadow:var(--shadow)}
:root[data-theme="dark"] .next{background:var(--gold);color:#1C2747}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:var(--gold);color:#1C2747}}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{font:inherit;font-size:14px;font-weight:500;background:none;border:none;color:var(--muted);padding:8px 4px;cursor:pointer}
.nav button:disabled{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1}
.done .big{font-family:var(--display);font-size:54px;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.done .chip{background:var(--band);color:#fff}
footer{font-size:12px;color:var(--muted);text-align:center}
.gate{position:fixed;inset:0;background:var(--band);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.gate form{background:var(--surface);color:var(--ink);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gate .badge{width:56px;height:56px;font-size:24px;background:var(--bg);box-shadow:none}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.gate input{font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.gate input:focus{border-color:var(--o);outline:none}
.gate button{font:inherit;font-size:17px;font-weight:700;padding:15px;border-radius:14px;border:none;background:var(--o);color:#fff;cursor:pointer}
.gate .err{color:var(--x);font-size:13px;min-height:1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--band-soft);border-radius:14px;padding:4px}
.tabs button{font:inherit;font-weight:700;font-size:15px;border:none;border-radius:11px;padding:9px;background:none;color:var(--band-ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--gold);color:#1C2747}
.stem{font-size:17px;font-weight:700;line-height:1.6;margin:0;word-break:keep-all}.stem small{font-weight:400;color:var(--muted);font-size:12px}
.mb{font-size:15px;line-height:1.65;word-break:keep-all}.mb .box{border:1px solid var(--muted);border-radius:8px;padding:10px 12px;margin:6px 0}
.mb table,.pan table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}.mb td,.mb th,.pan td,.pan th{border:1px solid var(--muted);padding:4px 5px;text-align:center}.mb th,.pan th{background:var(--bg)}
.tw{overflow-x:auto}.fig{margin:6px 0;text-align:center}.fig img{max-width:100%;height:auto;background:#fff;border-radius:6px;display:block;margin:auto}.cap{font-size:12px;color:var(--muted)}.two{display:flex;gap:6px}.two .fig{flex:1;min-width:0}
.bg{border:1px solid var(--muted);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6;word-break:keep-all}.bg div{padding-left:1.4em;text-indent:-1.4em;margin:2px 0}.bg b{font-weight:700}
.chs{display:flex;flex-direction:column;gap:8px}.chs.g3{display:grid;grid-template-columns:1fr 1fr}.chs.g5{display:grid;grid-template-columns:repeat(5,1fr)}
.chs button{font:inherit;font-size:15px;text-align:left;line-height:1.5;min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;word-break:keep-all}.chs.g5 button{text-align:center;padding:10px 2px}
.chs button.right{border-color:var(--o);background:var(--o-soft);font-weight:700}.chs button.bad{border-color:var(--x);background:var(--x-soft)}.chs button:disabled{cursor:default;color:var(--ink);opacity:1}
.hardtag{background:var(--x);color:#fff;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;margin-right:5px}
.pan{border-radius:14px;padding:14px;font-size:14.5px;line-height:1.65;word-break:keep-all;background:var(--bg)}.pan .ti{font-weight:900;margin-bottom:6px}.ok{color:var(--o)}.no{color:var(--x)}
.row3{display:grid;grid-template-columns:2em 1.8em 1fr;gap:4px 2px;margin:8px 0;align-items:start}.dot{width:1.4em;height:1.4em;border-radius:50%;color:#fff;font-size:.75em;font-weight:900;display:inline-flex;align-items:center;justify-content:center}.dot.o{background:var(--o)}.dot.x{background:var(--x)}
.k{background:linear-gradient(transparent 60%,rgba(245,183,49,.55) 60%);font-weight:700}.core{border:1px solid var(--gold);border-radius:8px;padding:6px 9px;margin:8px 0}.concl{color:var(--x);font-weight:800}
details{background:var(--surface);border-radius:10px;padding:8px 10px;margin-top:8px}summary{font-weight:700;cursor:pointer}details ul{margin:4px 0 8px;padding-left:18px}.ct{font-weight:700;margin-top:6px}
</style></head><body>
<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>O</b><i>X</i></div><h2>세계 문제와 미래 사회 1주차</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>
<div class="band"><div class="wrap">
  <div class="top">
    <div class="logo"><div class="badge" aria-hidden="true"><b>O</b><i>X</i></div><div><small>이경태T · 이주민과 문화 다양성 문제</small><h1>세계 문제와 미래 사회 1주차</h1></div></div>
    <div class="score" id="score"></div>
  </div>
  <div class="tabs" role="tablist"><button data-m="ox" aria-selected="true">OX 문제</button><button data-m="mc" aria-selected="false">객관식 문제</button></div>
  <div class="controls">
    <select id="sec" aria-label="단원 선택"></select>
    <button class="chip" id="shuf" aria-pressed="false">섞기</button>
    <button class="chip" id="wrong" aria-pressed="false">틀린 문제</button>
  </div>
  <div class="progress"><span id="bar"></span></div>
</div></div>
<main class="wrap">
  <section class="card" id="card" aria-live="polite"></section>
  <div id="actions"></div>
  <div class="nav"><button id="prev">← 이전 문제</button><button id="reset">기록 초기화</button></div>
  <footer>26 한영외고 2학년 2학기 기말고사 대비 · 한터&amp;SNT</footer>
</main>

이었다.", "a": "O", "e": ""}, {"n": 22, "sec": "Ⅱ. 이주의 역사와 목적", "q": "농경·정착 생활이 시작되면서 인구 이동은 더욱 활발해졌다.", "a": "X", "e": "다소 산발적인 형태로 나타났어요."}, {"n": 23, "sec": "Ⅱ. 이주의 역사와 목적", "q": "고대 사회에는 전쟁을 바탕으로 한 정복과 침략, 노예 교역에 의한 이주가 나타났다.", "a": "O", "e": ""}, {"n": 24, "sec": "Ⅱ. 이주의 역사와 목적", "q": "게르만족은 로마 제국 영역으로 이동하였다.", "a": "O", "e": ""}, {"n": 25, "sec": "Ⅱ. 이주의 역사와 목적", "q": "노르만인의 영국 정복은 1166년에 있었다.", "a": "X", "e": "1066년이에요."}, {"n": 26, "sec": "Ⅱ. 이주의 역사와 목적", "q": "영국 청교도는 성공회를 거부한 대가로 박해를 받아 신대륙으로 이주하였다.", "a": "O", "e": ""}, {"n": 27, "sec": "Ⅱ. 이주의 역사와 목적", "q": "영국 청교도의 신대륙 이주는 경제적 목적의 이주이다.", "a": "X", "e": "정치적 목적의 이주로 정리해요."}, {"n": 28, "sec": "Ⅱ. 이주의 역사와 목적", "q": "영국 청교도는 메이플라워호를 타고 이주하였다.", "a": "O", "e": ""}, {"n": 29, "sec": "Ⅱ. 이주의 역사와 목적", "q": "오늘날 미국인들은 메이플라워호의 이주자들을 필그림 파더스라고 부른다.", "a": "O", "e": ""}, {"n": 30, "sec": "Ⅱ. 이주의 역사와 목적", "q": "동독인은 정치적 자유의 제한과 서독보다 낮은 생활 수준으로 서독으로 탈출하였다.", "a": "O", "e": ""}, {"n": 31, "sec": "Ⅱ. 이주의 역사와 목적", "q": "베를린 장벽은 서독이 동독인의 유입을 막기 위해 세웠다.", "a": "X", "e": "동독이 탈출을 막기 위해 세웠어요."}, {"n": 32, "sec": "Ⅱ. 이주의 역사와 목적", "q": "베를린 장벽과 동독인의 탈출은 경제적 이주의 사례로 분류된다.", "a": "X", "e": "정치적 목적의 사례예요."}, {"n": 33, "sec": "Ⅱ. 이주의 역사와 목적", "q": "아일랜드인은 영국의 지배를 받았다.", "a": "O", "e": ""}, {"n": 34, "sec": "Ⅱ. 이주의 역사와 목적", "q": "아일랜드는 프랑스의 지배를 받았다.", "a": "X", "e": "영국의 지배를 받았어요."}, {"n": 35, "sec": "Ⅱ. 이주의 역사와 목적", "q": "아일랜드 대기근은 1845~1850년 감자 역병으로 일어났다.", "a": "O", "e": ""}, {"n": 36, "sec": "Ⅱ. 이주의 역사와 목적", "q": "아일랜드 대기근으로 인구의 1/2이 감소하였다.", "a": "X", "e": "인구의 1/5이 감소했어요."}, {"n": 37, "sec": "Ⅱ. 이주의 역사와 목적", "q": "아일랜드 대기근으로 인한 이동은 정치적 목적의 이주이다.", "a": "X", "e": "경제적 목적이에요."}, {"n": 38, "sec": "Ⅱ. 이주의 역사와 목적", "q": "이촌 향도 현상은 경제적 목적의 이주이다.", "a": "O", "e": ""}, {"n": 39, "sec": "Ⅱ. 이주의 역사와 목적", "q": "미국 캘리포니아 골드러시는 1849년의 경제적 이주이다.", "a": "O", "e": ""}, {"n": 40, "sec": "Ⅱ. 이주의 역사와 목적", "q": "골드러시는 캘리포니아 로스앤젤레스에서 금이 발견되어 시작되었다.", "a": "X", "e": "서터스 밀에서 금이 발견되었어요."}, {"n": 41, "sec": "Ⅱ. 이주의 역사와 목적", "q": "디아스포라는 전통적으로 모국을 떠나 타국에 거주하는 유대인을 일컫는 용어이다.", "a": "O", "e": ""}, {"n": 42, "sec": "Ⅱ. 이주의 역사와 목적", "q": "오늘날 디아스포라는 새로운 국가에 거주하는 민족 집단으로 의미가 확대되었다.", "a": "O", "e": ""}, {"n": 43, "sec": "Ⅱ. 이주의 역사와 목적", "q": "디아스포라는 환경적 이주의 대표 개념이다.", "a": "X", "e": "문화적 이주에서 다뤄요."}, {"n": 44, "sec": "Ⅱ. 이주의 역사와 목적", "q": "이스라엘 건국은 자민족 공동체의 이익을 실현하기 위해 국가를 새롭게 건설한 사례이다.", "a": "O", "e": ""}, {"n": 45, "sec": "Ⅱ. 이주의 역사와 목적", "q": "디아스포라는 정체성 보존을 위해 해외에 거주하는 자녀를 일정 기간 맡기기도 한다.", "a": "O", "e": ""}, {"n": 46, "sec": "Ⅱ. 이주의 역사와 목적", "q": "하와이 사탕수수 농장 이민은 1937년에 시작되었다.", "a": "X", "e": "1902년이에요."}, {"n": 47, "sec": "Ⅱ. 이주의 역사와 목적", "q": "하와이 이민은 자발적, 경제적 이주의 성격을 띤다.", "a": "O", "e": ""}, {"n": 48, "sec": "Ⅱ. 이주의 역사와 목적", "q": "고려인의 중앙아시아 이주는 강제적, 정치적 이주이다.", "a": "O", "e": ""}, {"n": 49, "sec": "Ⅱ. 이주의 역사와 목적", "q": "고려인은 연해주에서 사할린으로 이주되었다.", "a": "X", "e": "연해주에서 중앙아시아로 이주되었어요."}, {"n": 50, "sec": "Ⅱ. 이주의 역사와 목적", "q": "1990년대 아프리카 사헬 지대에서는 사막화로 주민들이 난민이 되었다.", "a": "O", "e": ""}, {"n": 51, "sec": "Ⅱ. 이주의 역사와 목적", "q": "사헬 지대의 환경 문제는 홍수이다.", "a": "X", "e": "사막화와 극심한 가뭄이에요."}, {"n": 52, "sec": "Ⅱ. 이주의 역사와 목적", "q": "투발루의 이주는 해수면 상승과 관련된 환경적 이주이다.", "a": "O", "e": ""}, {"n": 53, "sec": "Ⅱ. 이주의 역사와 목적", "q": "투발루는 대서양의 섬 국가이다.", "a": "X", "e": "남태평양의 섬 국가예요."}, {"n": 54, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "칼레의 정글은 이주 목적의 다양함을 보여 주는 사례이다.", "a": "O", "e": ""}, {"n": 55, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "칼레는 영국과 가까운 프랑스 북부의 항구 도시이다.", "a": "O", "e": ""}, {"n": 56, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "칼레는 프랑스 남부의 항구 도시이다.", "a": "X", "e": "프랑스 북부예요."}, {"n": 57, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "칼레의 정글은 영국으로 가려는 사람들이 모여 살던 비공식 임시 거주지이다.", "a": "O", "e": ""}, {"n": 58, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "칼레의 정글은 2015년 프랑스 정부가 철거하였다.", "a": "X", "e": "2016년 10월에 철거했어요."}, {"n": 59, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "이름의 유래는 열악한 천막촌의 환경이다.", "a": "O", "e": ""}, {"n": 60, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "아흐메트의 국적은 아프가니스탄이다.", "a": "X", "e": "수단이에요. 아프가니스탄 출신은 아마드예요."}, {"n": 61, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "아흐메트는 리비아를 거쳐 밀항선으로 지중해를 건넜다.", "a": "O", "e": ""}, {"n": 62, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "아마드는 전쟁의 공포와 탈레반의 횡포에 시달리다 집을 나섰다.", "a": "O", "e": ""}, {"n": 63, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "아마드는 8개국을 항공편으로 통과하였다.", "a": "X", "e": "도보로 통과했어요."}, {"n": 64, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "아흐메트와 아마드의 공통점은 영국행을 원한다는 것이다.", "a": "O", "e": ""}, {"n": 65, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "정글에 있는 사람은 모두 유엔 협약의 난민 기준에 부합한다.", "a": "X", "e": "단순한 불법 이민자도 많아요."}, {"n": 66, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "칼레의 정글은 분쟁과 빈곤, 환경 재앙이 낳은 글로벌 위기의 축소판이다.", "a": "O", "e": ""}, {"n": 67, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "이주를 다룬 문학 장르를 디아스포라 문학이라고 하기도 한다.", "a": "O", "e": ""}, {"n": 68, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "이미륵은 소설 「네이티브 스피커」를 썼다.", "a": "X", "e": "이미륵은 「압록강은 흐른다」를 썼어요."}, {"n": 69, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "이미륵은 3·1 운동 참여 후 일제에 쫓겨 1920년 독일로 망명하였다.", "a": "O", "e": ""}, {"n": 70, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "이창래는 한국 이민 세대를 소재로 한 소설로 영어권에서 반향을 일으켰다.", "a": "O", "e": ""}, {"n": 71, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "이창래의 「제스처 라이프」는 독일 교과서에 실렸다.", "a": "X", "e": "독일 교과서에 실린 한국인은 이미륵이에요."}, {"n": 72, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "캘리포니아주는 미국으로 이주하는 사람들이 가장 선호하는 지역 중 하나이다.", "a": "O", "e": ""}, {"n": 73, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "캘리포니아의 쾌적한 기후는 흡인 요인이다.", "a": "O", "e": ""}, {"n": 74, "sec": "Ⅲ. 칼레의 정글과 읽기 자료", "q": "로스앤젤레스의 코리아타운은 캘리포니아주 밖에 있다.", "a": "X", "e": "캘리포니아주에 있어요."}, {"n": 75, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "자발적 이주는 이주자들이 스스로 선택한 이주이다.", "a": "O", "e": ""}, {"n": 76, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "자발적 이주에는 주로 배출 요인이 작용한다.", "a": "X", "e": "주로 흡인 요인이 작용해요."}, {"n": 77, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "강제적 이주에는 주로 배출 요인이 작용한다.", "a": "O", "e": ""}, {"n": 78, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "임금을 더 많이 받을 수 있는 지역으로의 이주는 자발적 이주이다.", "a": "O", "e": ""}, {"n": 79, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "기후가 쾌적한 지역으로의 이주는 강제적 이주이다.", "a": "X", "e": "자발적 이주예요."}, {"n": 80, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "우리나라의 이촌 향도는 강제적 이주이다.", "a": "X", "e": "자발적 이주예요."}, {"n": 81, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "내전을 피하는 정치적 이주는 강제적 이주이다.", "a": "O", "e": ""}, {"n": 82, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "사할린 한인 동포는 일제 강점기 일본 정부에 의해 강제로 끌려갔다.", "a": "O", "e": ""}, {"n": 83, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "사할린 한인 동포를 강제 이주시킨 주체는 소련이다.", "a": "X", "e": "일본 정부예요."}, {"n": 84, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "고려인은 1937년 소련(스탈린)이 강제 이주시켰다.", "a": "O", "e": ""}, {"n": 85, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "사할린 한인과 고려인은 같은 사례이다.", "a": "X", "e": "주체, 시기, 경로가 모두 달라요."}, {"n": 86, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "체로키족의 이동은 강제적 이주의 사례이다.", "a": "O", "e": ""}, {"n": 87, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "체로키족의 행렬은 필그림 파더스라고 부른다.", "a": "X", "e": "눈물의 여로라고 불러요."}, {"n": 88, "sec": "Ⅳ. 자발적 이주와 강제적 이주", "q": "체로키족은 전체의 3분의 1이 넘는 사람이 행진 중에 숨졌다.", "a": "O", "e": ""}, {"n": 89, "sec": "Ⅴ. 국지적 규모의 이주", "q": "국지적 규모의 이주는 한 국가 내에서 이루어지는 이주이다.", "a": "O", "e": ""}, {"n": 90, "sec": "Ⅴ. 국지적 규모의 이주", "q": "교외화는 세계적 규모의 이주이다.", "a": "X", "e": "국지적 규모의 이주예요."}, {"n": 91, "sec": "Ⅴ. 국지적 규모의 이주", "q": "이촌 향도는 촌락 인구가 도시로 이동하는 현상이다.", "a": "O", "e": ""}, {"n": 92, "sec": "Ⅴ. 국지적 규모의 이주", "q": "이촌 향도는 도시 인구가 촌락으로 이동하는 현상이다.", "a": "X", "e": "촌락에서 도시로 이동해요."}, {"n": 93, "sec": "Ⅴ. 국지적 규모의 이주", "q": "낮은 농촌 소득은 농촌의 배출 요인이다.", "a": "O", "e": ""}, {"n": 94, "sec": "Ⅴ. 국지적 규모의 이주", "q": "고용 기회의 증가는 농촌의 배출 요인이다.", "a": "X", "e": "도시의 흡인 요인이에요."}, {"n": 95, "sec": "Ⅴ. 국지적 규모의 이주", "q": "우리나라 이촌 향도는 1960년대 경제 개발 정책을 바탕으로 빠르게 진행되었다.", "a": "O", "e": ""}, {"n": 96, "sec": "Ⅴ. 국지적 규모의 이주", "q": "우리나라 이촌 향도는 1980년대 민주화 이후 시작되었다.", "a": "X", "e": "1960년대 산업화 과정이에요."}, {"n": 97, "sec": "Ⅴ. 국지적 규모의 이주", "q": "이촌 향도로 도농 간 격차가 확대되었다.", "a": "O", "e": ""}, {"n": 98, "sec": "Ⅴ. 국지적 규모의 이주", "q": "중국의 도농 소득 격차는 1980~2008년에 점점 벌어졌다.", "a": "O", "e": ""}, {"n": 99, "sec": "Ⅴ. 국지적 규모의 이주", "q": "우리나라의 농·어업 인구는 2000~2015년에 계속 증가하였다.", "a": "X", "e": "계속 감소했어요."}, {"n": 100, "sec": "Ⅴ. 국지적 규모의 이주", "q": "국가는 농촌 인구 감소를 해결하기 위해 귀농·귀촌을 권장한다.", "a": "O", "e": ""}, {"n": 101, "sec": "Ⅴ. 국지적 규모의 이주", "q": "과잉 도시화는 현재 일부 개발 도상국에서 나타난다.", "a": "O", "e": ""}, {"n": 102, "sec": "Ⅴ. 국지적 규모의 이주", "q": "과잉 도시화는 서비스 공급 능력 안에서 인구가 집중하는 과정이다.", "a": "X", "e": "공급 능력을 초과해 집중하는 과정이에요."}, {"n": 103, "sec": "Ⅴ. 국지적 규모의 이주", "q": "과잉 도시화의 결과로 주택 부족, 실업과 범죄 증가가 나타날 수 있다.", "a": "O", "e": ""}, {"n": 104, "sec": "Ⅴ. 국지적 규모의 이주", "q": "과잉 도시화는 빈민의 집단 거주지 형성으로 이어질 수 있다.", "a": "O", "e": ""}, {"n": 105, "sec": "Ⅴ. 국지적 규모의 이주", "q": "브라질의 슬럼 지역은 교외화의 사례이다.", "a": "X", "e": "과잉 도시화의 사례예요."}, {"n": 106, "sec": "Ⅴ. 국지적 규모의 이주", "q": "종주 도시의 출현은 과잉 도시화의 징후 중 하나이다.", "a": "O", "e": ""}, {"n": 107, "sec": "Ⅴ. 국지적 규모의 이주", "q": "태국의 방콕은 종주 도시의 좋은 사례이다.", "a": "O", "e": ""}, {"n": 108, "sec": "Ⅴ. 국지적 규모의 이주", "q": "종주 도시는 선진 산업 사회의 특징인 균형 도시화와 같다.", "a": "X", "e": "정반대예요."}, {"n": 109, "sec": "Ⅴ. 국지적 규모의 이주", "q": "종주 도시로 권력과 부가 집중되면 작은 도시들은 성장하기 어렵다.", "a": "O", "e": ""}, {"n": 110, "sec": "Ⅴ. 국지적 규모의 이주", "q": "인도 국민은 식수의 약 85%를 지하수에 의존한다.", "a": "O", "e": ""}, {"n": 111, "sec": "Ⅴ. 국지적 규모의 이주", "q": "물탱크 마피아는 델리에 필요한 식수량의 약 60%를 정부 허가로 공급한다.", "a": "X", "e": "지하수를 몰래 시추·갈취해 팔아요."}, {"n": 112, "sec": "Ⅴ. 국지적 규모의 이주", "q": "교외는 도시도 농촌도 아닌 그 중간에 있는 정주지의 물리적 형태이다.", "a": "O", "e": ""}, {"n": 113, "sec": "Ⅴ. 국지적 규모의 이주", "q": "교외화는 교외의 인구와 기능이 도심으로 이동하는 현상이다.", "a": "X", "e": "도심에서 교외로 이동해요."}, {"n": 114, "sec": "Ⅴ. 국지적 규모의 이주", "q": "고속도로 건설과 교통수단의 발달은 교외화를 촉진한다.", "a": "O", "e": ""}, {"n": 115, "sec": "Ⅴ. 국지적 규모의 이주", "q": "우리나라 교외화는 1960년대 이후 나타났다.", "a": "X", "e": "1990년대 이후 나타났어요."}, {"n": 116, "sec": "Ⅴ. 국지적 규모의 이주", "q": "교외화로 대도시와 주변 지역 간 교통량이 증가한다.", "a": "O", "e": ""}, {"n": 117, "sec": "Ⅴ. 국지적 규모의 이주", "q": "교외화가 도시 형성 과정과 두드러지게 다른 점은 인종적인 배타성이다.", "a": "O", "e": ""}, {"n": 118, "sec": "Ⅴ. 국지적 규모의 이주", "q": "미국의 도시 밖 대규모 거주지 개발은 흑인들이 주도하였다.", "a": "X", "e": "백인들이 주도했어요."}, {"n": 119, "sec": "Ⅴ. 국지적 규모의 이주", "q": "미국의 교외는 도심 구역보다 더 백인 중심적이고 더 부유하다.", "a": "O", "e": ""}, {"n": 120, "sec": "Ⅴ. 국지적 규모의 이주", "q": "역사가 케즈는 애틀랜타의 교외화를 1960년대 인권 운동과 연결하였다.", "a": "O", "e": ""}, {"n": 121, "sec": "Ⅴ. 국지적 규모의 이주", "q": "고속도로를 건설하면 교통 체증 구간은 사라진다.", "a": "X", "e": "새로운 교통 체증 구간이 생겨요."}, {"n": 122, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "세계적인 규모의 이주는 한 국가에서 다른 국가로 이루어지는 이주이다.", "a": "O", "e": ""}, {"n": 123, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "국제 순이동은 입국자 수와 출국자 수의 차이로 파악한다.", "a": "O", "e": ""}, {"n": 124, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "전입이 전출보다 많으면 순유출이다.", "a": "X", "e": "순유입이에요."}, {"n": 125, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "유럽, 북아메리카, 오세아니아는 순유입 대륙이다.", "a": "O", "e": ""}, {"n": 126, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "아시아는 순유입 대륙이다.", "a": "X", "e": "순유출 대륙이에요."}, {"n": 127, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "한국은 순유출에서 순유입으로 변하였다.", "a": "O", "e": ""}, {"n": 128, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "현재 가장 많은 세계적 이주 유형은 경제적 목적의 개발 도상국에서 선진국으로의 이동이다.", "a": "O", "e": ""}, {"n": 129, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "경제적 이주는 주로 선진국에서 개발 도상국으로 이동한다.", "a": "X", "e": "개발 도상국에서 선진국으로 이동해요."}, {"n": 130, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "이주 노동자는 경제적 목적으로 다른 나라에서 이주해 온 노동자이다.", "a": "O", "e": ""}, {"n": 131, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "이주 노동자 권리 협약은 1990년 유엔 총회에서 체결되었다.", "a": "O", "e": ""}, {"n": 132, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "이주 노동자는 모국에서 유급 활동을 하는 사람이다.", "a": "X", "e": "모국이 아닌 국가에서 유급 활동을 해요."}, {"n": 133, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "이주 노동자는 주로 숙련 노동에 종사한다.", "a": "X", "e": "주로 비숙련 노동에 종사해요."}, {"n": 134, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "제2차 세계 대전 이후 서유럽은 노동력 부족 해결을 위해 이주 노동자를 받아들였다.", "a": "O", "e": ""}, {"n": 135, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "서독으로 파견된 대한민국 간호사는 이주 노동자이다.", "a": "O", "e": ""}, {"n": 136, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "오늘날 경제적 목적의 세계적 이주는 감소하고 있다.", "a": "X", "e": "지속적으로 증가해요."}, {"n": 137, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "이주 노동자 권리 협약은 그 가족에 대한 보호도 규정한다.", "a": "O", "e": ""}, {"n": 138, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "이주 노동자 권리 협약은 전문과 9부 39조로 구성된다.", "a": "X", "e": "9부 93조예요."}, {"n": 139, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "협약 2부는 권리를 어떠한 종류의 차별도 없이 향유해야 한다고 규정한다.", "a": "O", "e": ""}, {"n": 140, "sec": "Ⅵ. 국제 순이동과 이주 노동자", "q": "협약 3부에는 강제 노동의 금지와 노동조합에 대한 권리가 포함된다.", "a": "O", "e": ""}, {"n": 141, "sec": "Ⅶ. 난민", "q": "난민은 박해를 받을 우려가 있다는 합리적인 근거가 있는 공포로 국적국 밖에 있는 사람이다.", "a": "O", "e": ""}, {"n": 142, "sec": "Ⅶ. 난민", "q": "난민 정의의 사유에 특정 사회 집단의 구성원 신분은 포함되지 않는다.", "a": "X", "e": "포함돼요."}, {"n": 143, "sec": "Ⅶ. 난민", "q": "난민 정의의 사유에는 정치적 의견이 포함된다.", "a": "O", "e": ""}, {"n": 144, "sec": "Ⅶ. 난민", "q": "대법원 판결의 박해에는 인간의 본질적 존엄성에 대한 중대한 침해나 차별을 야기하는 행위가 포함된다.", "a": "O", "e": ""}, {"n": 145, "sec": "Ⅶ. 난민", "q": "내전과 종교 간 충돌로 인한 박해도 난민의 발생 원인에 포함된다.", "a": "O", "e": ""}, {"n": 146, "sec": "Ⅶ. 난민", "q": "한국에서 난민으로 인정받으려면 충분한 근거가 있는 공포가 있었음을 증명해야 한다.", "a": "O", "e": ""}, {"n": 147, "sec": "Ⅶ. 난민", "q": "미라클 작전으로 온 아프가니스탄 현지인은 이주 노동자로 받아들여졌다.", "a": "X", "e": "특별기여자로 받아들여졌어요."}, {"n": 148, "sec": "Ⅶ. 난민", "q": "미라클 작전은 2021년의 일이다.", "a": "O", "e": ""}, {"n": 149, "sec": "Ⅶ. 난민", "q": "난민과 이주 노동자는 국제법에서 같은 대우를 받는다.", "a": "X", "e": "서로 다르게 대우해요."}, {"n": 150, "sec": "Ⅶ. 난민", "q": "이주 노동자는 미래 가능성을 개선하기 위해 이주를 선택한 존재이다.", "a": "O", "e": ""}, {"n": 151, "sec": "Ⅶ. 난민", "q": "난민은 미래 가능성을 개선하기 위해 이주를 선택한 존재이다.", "a": "X", "e": "생명과 자유를 위해 이주해야만 하는 존재예요."}, {"n": 152, "sec": "Ⅶ. 난민", "q": "난민의 자국 정부가 오히려 안전을 위협하기도 한다.", "a": "O", "e": ""}, {"n": 153, "sec": "Ⅶ. 난민", "q": "국제 사회는 난민의 권리 보호를 위해 유엔 난민 기구를 조직·운영한다.", "a": "O", "e": ""}, {"n": 154, "sec": "Ⅶ. 난민", "q": "UNHCR 관련 인구는 아시아가 가장 많다.", "a": "O", "e": ""}, {"n": 155, "sec": "Ⅶ. 난민", "q": "UNHCR 관련 인구는 유럽이 아프리카보다 많다.", "a": "X", "e": "아프리카가 더 많아요."}, {"n": 156, "sec": "Ⅶ. 난민", "q": "난민은 유럽과 북미 대륙에서 가장 많다.", "a": "X", "e": "아시아와 아프리카에서 가장 많아요."}, {"n": 157, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "미국은 구성원의 대부분이 국제 이주민과 그 후손으로 이루어진 국가이다.", "a": "O", "e": ""}, {"n": 158, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "초창기 미국의 국제 이주자는 영국인이 가장 많았다.", "a": "O", "e": ""}, {"n": 159, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "초창기 미국의 국제 이주자는 스페인인이 가장 많았다.", "a": "X", "e": "영국인이 가장 많았어요."}, {"n": 160, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "유럽계 백인은 미국의 주류 문화를 형성하였다.", "a": "O", "e": ""}, {"n": 161, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "아메리칸 인디언은 변방으로 밀려나고 인구도 크게 감소하였다.", "a": "O", "e": ""}, {"n": 162, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "오늘날 아메리칸 인디언은 모두 정부 보조금 없이 대도시에서 생활한다.", "a": "X", "e": "정부 보조금을 받으며 인디언 보호 구역에서 생활해요."}, {"n": 163, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "아프리카인은 강제로 미국에 이주하게 된 경우가 많다.", "a": "O", "e": ""}, {"n": 164, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "노예 수입은 1808년에 금지되었다.", "a": "O", "e": ""}, {"n": 165, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "노예 소유 관습은 주로 북부 지방에서 지속되었다.", "a": "X", "e": "대규모 농장을 운영한 남부 지방이에요."}, {"n": 166, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "노예제 폐지 후 흑인에 대한 차별은 바로 사라졌다.", "a": "X", "e": "이후에도 차별과 불평등한 대우가 이어졌어요."}, {"n": 167, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "1960년대 이후 국가별 할당제 폐지로 중남미에서의 이주가 크게 증가하였다.", "a": "O", "e": ""}, {"n": 168, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "히스패닉계는 흑인 다음으로 인구수가 많다.", "a": "X", "e": "백인 다음으로 많아요."}, {"n": 169, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "아시아계는 이주 시기가 상대적으로 늦었으나 비율이 빠르게 증가하였다.", "a": "O", "e": ""}, {"n": 170, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "2014년 미국 인구 구성은 유럽계, 히스패닉, 아프리카계, 아시아계 순으로 많다.", "a": "O", "e": ""}, {"n": 171, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "2060년에는 유럽계 비중이 증가할 것으로 추정된다.", "a": "X", "e": "감소할 것으로 추정돼요."}, {"n": 172, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "미국 이민자 출신 대륙에서 유럽의 비중은 크게 감소하였다.", "a": "O", "e": ""}, {"n": 173, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "미국 이민자 출신 국가는 멕시코가 가장 많다.", "a": "O", "e": ""}, {"n": 174, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "미국 내 히스패닉 비중은 북동부에서 가장 높다.", "a": "X", "e": "남서부에서 높아요."}, {"n": 175, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "아프리카계 비중은 남동부에서 높다.", "a": "O", "e": ""}, {"n": 176, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "아시아계 비중은 남동부에서 가장 높다.", "a": "X", "e": "서부 해안과 하와이에서 높아요."}, {"n": 177, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "유럽계는 유럽과 가까운 북동부에서 비중이 높다.", "a": "O", "e": ""}, {"n": 178, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "히스패닉은 영어와 스페인어를 모두 구사한다.", "a": "O", "e": ""}, {"n": 179, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "싱코 데 마요는 멕시코 군이 영국 군을 물리친 것을 기념한다.", "a": "X", "e": "프랑스 군을 물리친 것을 기념해요."}, {"n": 180, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "싱코 데 마요는 1862년의 승리를 기념한다.", "a": "O", "e": ""}, {"n": 181, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "밀레니얼 세대는 1960~1980년 사이에 태어난 세대이다.", "a": "X", "e": "1982~2000년 사이에 태어난 세대예요."}, {"n": 182, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "힙합은 1977년 뉴욕 브롱스 남부와 할렘의 길거리 음악에서 나왔다.", "a": "O", "e": ""}, {"n": 183, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "힙합은 주류에 편입된 백인 청년에게서 비롯되었다.", "a": "X", "e": "주류에 편입되지 못한 변두리 젊은 흑인들에게서 비롯되었어요."}, {"n": 184, "sec": "Ⅷ. 주류 문화와 소수 문화: 미국", "q": "힙합은 흑인의 경제적 자립을 유도하였다.", "a": "O", "e": ""}, {"n": 185, "sec": "Ⅸ. 유럽의 무슬림", "q": "유럽은 제2차 세계 대전 이후 이주 노동자를 꾸준히 받아들였다.", "a": "O", "e": ""}, {"n": 186, "sec": "Ⅸ. 유럽의 무슬림", "q": "유럽의 이주민에는 모로코, 알제리 등 아프리카 북부 출신이 많다.", "a": "O", "e": ""}, {"n": 187, "sec": "Ⅸ. 유럽의 무슬림", "q": "유럽의 인도, 파키스탄 출신 이주민은 동남아시아 출신이다.", "a": "X", "e": "남부 아시아 출신이에요."}, {"n": 188, "sec": "Ⅸ. 유럽의 무슬림", "q": "이주민의 낮은 출생률로 유럽의 외국계 이민자 비중이 감소하였다.", "a": "X", "e": "높은 출생률과 지속적 유입으로 증가했어요."}, {"n": 189, "sec": "Ⅸ. 유럽의 무슬림", "q": "유럽에서는 이슬람교 관련 종교 시설과 음식점이 증가하였다.", "a": "O", "e": ""}, {"n": 190, "sec": "Ⅸ. 유럽의 무슬림", "q": "런던과 파리의 무슬림 집단 거주 지역은 대도시 도심에 형성되었다.", "a": "X", "e": "대도시 외곽에 형성되었어요."}, {"n": 191, "sec": "Ⅸ. 유럽의 무슬림", "q": "화이트 채플은 무슬림들이 주를 이루는 영국 런던의 이민자 마을이다.", "a": "O", "e": ""}, {"n": 192, "sec": "Ⅸ. 유럽의 무슬림", "q": "모스크 건립 반대 시위는 문화적 차이로 인한 갈등의 예이다.", "a": "O", "e": ""}, {"n": 193, "sec": "Ⅸ. 유럽의 무슬림", "q": "부르카는 몸 전체는 물론 눈 부위까지 망사로 덮는 옷차림이다.", "a": "O", "e": ""}, {"n": 194, "sec": "Ⅸ. 유럽의 무슬림", "q": "서방에서는 부르카를 여성 억압의 상징으로 비판하기도 한다.", "a": "O", "e": ""}, {"n": 195, "sec": "Ⅸ. 유럽의 무슬림", "q": "독일과 영국이 공공장소에서 얼굴을 가리는 것을 법으로 금지한 대표 국가로 제시되었다.", "a": "X", "e": "프랑스, 벨기에, 덴마크예요."}, {"n": 196, "sec": "Ⅸ. 유럽의 무슬림", "q": "메르켈 총리는 부르카 전면 금지 요청을 받아들였다.", "a": "X", "e": "받아들일 수 없다고 했어요."}, {"n": 197, "sec": "Ⅸ. 유럽의 무슬림", "q": "메르켈 총리는 온몸을 가린 여성은 독일 사회에 녹아들 기회를 가지기 어렵다고 우려하였다.", "a": "O", "e": ""}, {"n": 198, "sec": "Ⅸ. 유럽의 무슬림", "q": "이슬람포비아는 이슬람 혐오를 뜻한다.", "a": "O", "e": ""}, {"n": 199, "sec": "Ⅸ. 유럽의 무슬림", "q": "프랑스는 모스크에 대한 외국 자금 지원을 일시적으로 금지하는 방안을 검토하였다.", "a": "O", "e": ""}, {"n": 200, "sec": "Ⅸ. 유럽의 무슬림", "q": "외국 자금 지원 금지의 목적은 모스크 건립을 늘리는 것이다.", "a": "X", "e": "극단주의 설파를 차단하려는 의도예요."}, {"n": 201, "sec": "Ⅸ. 유럽의 무슬림", "q": "유럽 주류 이슬람 사회는 정부 규제에 동참하는 모양새를 보였다.", "a": "O", "e": ""}, {"n": 202, "sec": "Ⅸ. 유럽의 무슬림", "q": "이맘은 이슬람교 교단 조직의 지도자를 가리키는 직명이다.", "a": "O", "e": ""}, {"n": 203, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "서남아시아의 본격적인 근대화는 1970년대 석유 파동 이후 시작되었다.", "a": "O", "e": ""}, {"n": 204, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "서남아시아의 근대화는 1990년대 이후 시작되었다.", "a": "X", "e": "1970년대 석유 파동 이후예요."}, {"n": 205, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "산유국은 자국 국민의 교육 수준이 낮아 외국인 노동자를 받아들이는 정책을 폈다.", "a": "O", "e": ""}, {"n": 206, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "서남아시아로 유입된 외국인 노동자는 주로 노년층 여성이다.", "a": "X", "e": "청장년층 남성이에요."}, {"n": 207, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "걸프 연안 산유국 국민은 단순 노동을 기피한다.", "a": "O", "e": ""}, {"n": 208, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "걸프 연안의 이주 노동자는 단순 노무직에만 종사한다.", "a": "X", "e": "숙련된 기술이 필요한 직종까지 차지해요."}, {"n": 209, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "걸프 연안 산유국 국민 대부분은 이슬람교를 믿는다.", "a": "O", "e": ""}, {"n": 210, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "사우디에서는 이주 노동자의 노동권 침해 논란이 끊이지 않는다.", "a": "O", "e": ""}, {"n": 211, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "2011년 사우디 정부가 본국에 통보 없이 인도네시아 노동자를 참수해 외교 갈등이 생겼다.", "a": "O", "e": ""}, {"n": 212, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "2013년 새 노동법은 종교의 자유를 보장한다는 비판을 받는 조항을 담았다.", "a": "X", "e": "종교의 자유를 제한한다는 비판을 받아요."}, {"n": 213, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "2013년 새 노동법에는 고용주에게 복종하도록 하는 내용이 있다.", "a": "O", "e": ""}, {"n": 214, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "2015년 2월 국내 19세 이하 이주 아동은 8만 7,099명이었다.", "a": "O", "e": ""}, {"n": 215, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "미등록 이주 아동은 8만 7,099명이다.", "a": "X", "e": "5,226명으로 추산돼요."}, {"n": 216, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "이주 아동은 기본권인 교육권을 보장받지 못하기도 한다.", "a": "O", "e": ""}, {"n": 217, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "이주 아동에게 가장 필요한 사항은 학비 지원이다.", "a": "X", "e": "한국어 교육(25%)이에요."}, {"n": 218, "sec": "Ⅹ. 서남아시아와 한국의 이주 아동", "q": "인권위는 이주 아동이 사회 통합에 중요한 역할을 할 세대라고 하였다.", "a": "O", "e": ""}, {"n": 219, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "세계화로 상품뿐만 아니라 자본과 노동도 자유롭게 이동한다.", "a": "O", "e": ""}, {"n": 220, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "이주 노동자 증가는 문화적 차이로 인한 갈등을 확대할 수 있다.", "a": "O", "e": ""}, {"n": 221, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "이주 노동자는 일반적으로 고임금, 숙련 업종에 종사한다.", "a": "X", "e": "저임금, 비숙련 업종에 종사해요."}, {"n": 222, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "이주한 국가의 경제가 침체되면 이주 노동자와의 갈등은 완화된다.", "a": "X", "e": "더욱 심화돼요."}, {"n": 223, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "다문화 가구는 우리나라 전체 가구의 1.3%이다.", "a": "O", "e": ""}, {"n": 224, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "결혼 이민자·귀화자의 차별 경험 비율은 2012년보다 증가하였다.", "a": "X", "e": "0.6%p 감소했어요."}, {"n": 225, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "결혼 이민자·귀화자의 고용률은 2012년보다 상승하였다.", "a": "O", "e": ""}, {"n": 226, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "다문화 가족의 문화 차이로 인한 어려움은 증가하였다.", "a": "X", "e": "감소했어요. 외로움과 자녀 양육의 어려움이 다소 증가했어요."}, {"n": 227, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "결혼 이민자, 귀화자가 꼽은 어려움 1위는 언어 문제이다.", "a": "O", "e": ""}, {"n": 228, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "난민은 비자발적으로 이주하게 된다.", "a": "O", "e": ""}, {"n": 229, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "수용 국가는 정치적, 경제적, 사회적 이유로 난민 수용을 기피하기도 한다.", "a": "O", "e": ""}, {"n": 230, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "국제기구는 재정적 어려움으로 적절한 도움을 주지 못하기도 한다.", "a": "O", "e": ""}, {"n": 231, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "헝가리의 국경 장벽 건설은 난민 유입을 늘리려는 조치이다.", "a": "X", "e": "난민 유입을 조절하려는 조치예요."}, {"n": 232, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "프랑스의 국경 장벽 건설 시기는 2015년으로 제시되었다.", "a": "O", "e": ""}, {"n": 233, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "에스토니아는 2005년에 국경 장벽을 완공한 것으로 제시되었다.", "a": "X", "e": "2018년 건설 예정으로 제시되었어요."}, {"n": 234, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "오스트리아는 슬로베니아 접경에 건설 계획을 발표하였다.", "a": "O", "e": ""}, {"n": 235, "sec": "Ⅺ. 이주로 인한 문제와 난민의 삶", "q": "기초 교육을 받는
