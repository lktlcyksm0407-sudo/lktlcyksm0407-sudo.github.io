<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>한국사 OX 트레이닝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: navy masthead band with controls; white question card overlaps it; big round O/X paddles below */
:root{
  --band:#1C2747; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.14);
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#16203A; --muted:#6A7389; --line:#E1E5EE;
  --o:#2563EB; --o-soft:#E6EEFF; --x:#E0453A; --x-soft:#FDEBEA; --gold:#F5B731;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --shadow:0 10px 30px rgba(22,32,58,.10),0 2px 6px rgba(22,32,58,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.band{background:var(--band);color:var(--band-ink);padding-bottom:64px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.badge b{color:var(--o);font-weight:400}.badge i{color:var(--x);font-style:normal}
.logo small{display:block;font-size:12px;opacity:.75;font-weight:500;letter-spacing:.02em}
.logo h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(19px,5.4vw,24px);white-space:nowrap;letter-spacing:0;line-height:1.15}
.score{flex:0 0 auto;text-align:center;background:var(--band-soft);border-radius:14px;padding:8px 12px;min-width:64px;font-variant-numeric:tabular-nums}
.score span{display:block;font-size:11px;opacity:.8}
.score strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,.chip{font:inherit;font-size:14px;font-weight:500;color:var(--band-ink);background:var(--band-soft);border:1px solid transparent;border-radius:999px;padding:9px 14px;min-height:40px;-webkit-appearance:none;appearance:none}
select{flex:1 1 150px;min-width:0;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{color:#16203A;background:#fff}
.chip{cursor:pointer;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--gold);color:#1C2747}
.progress{height:6px;background:var(--band-soft);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--gold);width:0;border-radius:6px;transition:width .3s}
main.wrap{margin-top:-48px;display:flex;flex-direction:column;gap:16px;padding-block:0 24px}
.card{background:var(--surface);border-radius:24px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:16px;min-height:280px;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.no{font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:0}
.no em{font-style:normal;font-size:13px;font-family:var(--sans);font-weight:700;color:var(--muted);margin-left:4px}
.tag{background:var(--bg);border-radius:999px;padding:5px 11px;font-weight:500;font-size:12px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{font-size:clamp(19px,5.1vw,22px);font-weight:500;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.result{margin-top:auto;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start;animation:pop .28s ease-out}
.result[data-k="O"]{background:var(--o-soft)} .result[data-k="X"]{background:var(--x-soft)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.mark{flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-size:30px;border-radius:50%;color:#fff;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.result[data-k="O"] .mark{background:var(--o)} .result[data-k="X"] .mark{background:var(--x)}
@keyframes stamp{from{transform:scale(.4) rotate(-20deg)}to{transform:none}}
.verdict{font-weight:900;font-size:16px;margin:3px 0 6px}
.verdict.ok{color:var(--o)} .verdict.no{color:var(--x)}
.exp{font-size:15.5px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad button{font-family:var(--display);font-size:52px;line-height:1;cursor:pointer;border:none;border-radius:24px;min-height:104px;color:#fff;box-shadow:var(--shadow);transition:transform .1s}
#bO{background:var(--o)} #bX{background:var(--x)}
.pad button:active{transform:scale(.96)}
.next{width:100%;font:inherit;font-size:18px;font-weight:700;cursor:pointer;border:none;border-radius:20px;min-height:66px;background:var(--band);color:#fff;box-shadow:var(--shadow)}
:root[data-theme="dark"] .next{background:var(--gold);color:#1C2747}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:var(--gold);color:#1C2747}}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{font:inherit;font-size:14px;font-weight:500;background:none;border:none;color:var(--muted);padding:8px 4px;cursor:pointer}
.nav button:disabled{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1}
.done .big{font-family:var(--display);font-size:54px;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.done .chip{background:var(--band);color:#fff}
footer{font-size:12px;color:var(--muted);text-align:center}
.gate{position:fixed;inset:0;background:var(--band);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.gate form{background:var(--surface);color:var(--ink);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gate .badge{width:56px;height:56px;font-size:24px;background:var(--bg);box-shadow:none}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.gate input{font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.gate input:focus{border-color:var(--o);outline:none}
.gate button{font:inherit;font-size:17px;font-weight:700;padding:15px;border-radius:14px;border:none;background:var(--o);color:#fff;cursor:pointer}
.gate .err{color:var(--x);font-size:13px;min-height:1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><style>body{margin:0}:root{padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body>

<script>
const DATA = [{"n": 1, "sec": "냉전 체제의 형성", "q": "냉전은 직접적인 무력 충돌은 없지만 군사적·경제적·외교적 대립이 지속되는 상태를 말한다.", "a": "O", "e": ""}, {"n": 2, "sec": "냉전 체제의 형성", "q": "냉전은 제2차 세계 대전 이후 영국 중심의 자본주의 진영과 소련 중심의 공산주의 진영의 대결이다.", "a": "X", "e": "자본주의 진영의 중심은 영국이 아니라 미국이에요."}, {"n": 3, "sec": "냉전 체제의 형성", "q": "냉전의 확산은 아시아에서 열전으로 이어져 중국, 한국, 베트남에서 전쟁이 일어났다.", "a": "O", "e": ""}, {"n": 4, "sec": "냉전 체제의 형성", "q": "유럽에서 시작된 냉전은 유럽에서 미국과 소련의 직접적인 전면전으로 이어졌다.", "a": "X", "e": "유럽에서는 직접적인 군사 충돌로 이어지지 않았어요. 실제 전쟁 (열전)은 아시아에서 일어났어요."}, {"n": 5, "sec": "냉전 체제의 형성", "q": "냉전 체제는 1991년 소련이 해체될 때까지 40여 년간 지속되었다.", "a": "O", "e": ""}, {"n": 6, "sec": "냉전 체제의 형성", "q": "냉전 체제는 1970년대 초 미국과 소련의 화해 분위기에 힘입어 완화되었다.", "a": "X", "e": "1970년대 초 화해한 나라는 미국과 중국이에요."}, {"n": 7, "sec": "냉전 체제의 형성", "q": "제2차 세계 대전 이후 미국 주도의 연합국 최고 사령부는 일본의 비군사화와 민주화를 목표로 개혁을 추진하였다.", "a": "O", "e": ""}, {"n": 8, "sec": "냉전 체제의 형성", "q": "일본에서는 군사력 보유 금지 등을 주요 내용으로 하는 평화 헌법이 제정되었다.", "a": "O", "e": ""}, {"n": 9, "sec": "냉전 체제의 형성", "q": "전쟁 범죄자 처벌을 위한 극동 국제 군사 재판을 베이징 재판이라고도 한다.", "a": "X", "e": "극동 국제 군사 재판은 도쿄 재판이라고도 해요."}, {"n": 10, "sec": "냉전 체제의 형성", "q": "극동 국제 군사 재판에서 전쟁 최고 책임자인 일왕이 기소되어 처벌받았다.", "a": "X", "e": "일왕은 기소되지 않았어요. 주요 피해국의 의견이 제대로 반영되지 않은 것과 함께 재판의 대표적인 한계예요."}, {"n": 11, "sec": "냉전 체제의 형성", "q": "냉전이 본격화되면서 미국은 일본을 동아시아의 반공 거점으로 삼는 방향으로 정책을 바꾸었다.", "a": "O", "e": ""}, {"n": 12, "sec": "냉전 체제의 형성", "q": "트루먼 독트린은 공산주의의 팽창을 막기 위해 자유 민주주의 국가를 지원하겠다는 미국의 선언이다.", "a": "O", "e": ""}, {"n": 13, "sec": "냉전 체제의 형성", "q": "트루먼 독트린은 1950년 6·25 전쟁 발발 직후 발표되었다.", "a": "X", "e": "트루먼 독트린은 1947년에 발표되었어요. 6·25 전쟁보다 3년 앞서요."}, {"n": 14, "sec": "냉전 체제의 형성", "q": "미국은 유럽 부흥을 위한 경제 원조 계획인 마셜 플랜을 세웠다.", "a": "O", "e": ""}, {"n": 15, "sec": "냉전 체제의 형성", "q": "미국은 서유럽 국가와 군사 방위 체제를 구축하기 위해 북대서양 조약 기구(NATO)를 조직하였다.", "a": "O", "e": ""}, {"n": 16, "sec": "냉전 체제의 형성", "q": "소련은 1947년 공산당 간의 상호 방위를 목적으로 코민포름을 조직하였다.", "a": "X", "e": "코민포름(공산당 정보국)의 목적은 공산당의 정보 교환과 협력이에요. 상호 방위를 목적으로 한 것은 바르샤바 조약 기구예요."}, {"n": 17, "sec": "냉전 체제의 형성", "q": "소련은 동유럽 국가와 경제 상호 원조 회의(COMECON)를 결성하였다.", "a": "O", "e": ""}, {"n": 18, "sec": "냉전 체제의 형성", "q": "바르샤바 조약 기구(WTO)는 미국이 서유럽 국가와 맺은 군사 동맹이다.", "a": "X", "e": "바르샤바 조약 기구는 소련이 동유럽 국가와 상호 방위를 목적으로 조직했어요. 미국과 서유럽의 군사 동맹은 NATO예요."}, {"n": 19, "sec": "냉전 체제의 형성", "q": "중국에서는 일본에 맞서 힘을 합했던 국민당과 공산당이 전쟁이 끝나자 다시 대립하였다.", "a": "O", "e": ""}, {"n": 20, "sec": "냉전 체제의 형성", "q": "장제스가 이끄는 중국 공산당이 국공 내전에서 승리하여 중화 인민 공화국을 수립하였다.", "a": "X", "e": "중국 공산당을 이끈 인물은 마오쩌둥이에요. 장제스는 국민당의 지도자예요."}, {"n": 21, "sec": "냉전 체제의 형성", "q": "중국 공산당은 토지 개혁 등을 통해 민중의 지지를 얻고 국민당 고립화 정책을 효과적으로 추진하였다.", "a": "O", "e": ""}, {"n": 22, "sec": "냉전 체제의 형성", "q": "중화 인민 공화국은 1949년에 수립되었다.", "a": "O", "e": ""}, {"n": 23, "sec": "냉전 체제의 형성", "q": "국공 내전에서 패한 중국 국민당은 홍콩으로 이동하였다.", "a": "X", "e": "국민당은 타이완으로 이동했어요."}, {"n": 24, "sec": "냉전 체제의 형성", "q": "호찌민의 주도로 수립된 베트남 민주 공화국은 프랑스와의 전쟁에서 승리하였다.", "a": "O", "e": ""}, {"n": 25, "sec": "냉전 체제의 형성", "q": "베트남은 제네바 회담에 따라 북위 38도선을 경계로 분단되었다.", "a": "X", "e": "베트남의 분단선은 북위 17도선이에요. 38도선은 한반도의 분할 점령선이에요."}, {"n": 26, "sec": "냉전 체제의 형성", "q": "베트남 남쪽에는 소련의 지원으로 베트남 공화국이 들어섰다.", "a": "X", "e": "베트남 공화국은 미국의 지원으로 들어섰어요."}, {"n": 27, "sec": "냉전 체제의 형성", "q": "미국은 통킹만 사건을 빌미로 베트남 전쟁에 전면 개입하였다.", "a": "O", "e": ""}, {"n": 28, "sec": "냉전 체제의 형성", "q": "베트남 전쟁에서 소련과 중국은 남베트남을 지원하였다.", "a": "X", "e": "소련과 중국은 같은 공산 진영인 북베트남을 지원했어요. 이로써 전쟁은 국제전으로 확대되었어요."}, {"n": 29, "sec": "냉전 체제의 형성", "q": "통킹만 사건은 1964년에 발생하였다.", "a": "O", "e": ""}, {"n": 30, "sec": "냉전 체제의 형성", "q": "새롭게 독립한 아시아·아프리카의 많은 국가는 비동맹 중립주의 노선을 표방하였다.", "a": "O", "e": ""}, {"n": 31, "sec": "냉전 체제의 형성", "q": "아시아·아프리카 회의(반둥 회의)에서는 신생 독립 29개국이 ‘평화 5원칙’에 합의하였다.", "a": "X", "e": "반둥 회의에서 합의한 것은 ‘평화 10원칙’이에요."}, {"n": 32, "sec": "냉전 체제의 형성", "q": "아시아·아프리카 회의는 1955년에 개최되었으며 제3세계 형성으로 이어졌다.", "a": "O", "e": ""}, {"n": 33, "sec": "냉전 체제의 형성", "q": "소련과 동유럽 국가를 제1세계, 미국 등 서방 국가를 제2세계라고 한다.", "a": "X", "e": "거꾸로예요. 미국 등 서방 국가가 제1세계, 소련과 동유럽 국가가 제2세계예요."}, {"n": 34, "sec": "냉전 체제의 형성", "q": "제3세계의 출현 이후 미국의 베트남 전쟁 전면 개입 등으로 냉전 분위기가 다시 고조되었다.", "a": "O", "e": ""}, {"n": 35, "sec": "냉전 체제의 형성", "q": "베트남 전쟁이 장기화되면서 미국 내에서 반전 운동이 거세게 일어났다.", "a": "O", "e": ""}, {"n": 36, "sec": "냉전 체제의 형성", "q": "닉슨 독트린은 아시아에서 미국의 군사적 역할을 확대한다는 내용이다.", "a": "X", "e": "닉슨 독트린은 아시아에서 미국의 군사적 역할을 축소한다는 내용이에요."}, {"n": 37, "sec": "냉전 체제의 형성", "q": "닉슨 독트린 발표 이후 미국은 베트남에서 군대를 철수하고 중국과의 관계 개선을 시도하였다.", "a": "O", "e": ""}, {"n": 38, "sec": "냉전 체제의 형성", "q": "닉슨은 미국 대통령 최초로 중국을 방문하였다.", "a": "O", "e": ""}, {"n": 39, "sec": "냉전 체제의 형성", "q": "미국과 중국은 닉슨 독트린이 발표된 1969년에 수교하였다.", "a": "X", "e": "미국과 중국이 수교한 것은 1979년이에요."}, {"n": 40, "sec": "광복과 국토의 분단", "q": "광복은 한국인들이 수십 년간 전개한 독립운동의 결실이었다.", "a": "O", "e": ""}, {"n": 41, "sec": "광복과 국토의 분단", "q": "광복은 오직 한국인의 독립운동만으로 얻은 결과였으므로 한국의 진로는 연합국의 영향을 받지 않았다.", "a": "X", "e": "광복은 연합국이 제2차 세계 대전에서 승리하여 얻은 결과이기도 했어요. 그래서 한국의 진로는 미국, 소련 등 연합국의 결정에 영향을 받았어요."}, {"n": 42, "sec": "광복과 국토의 분단", "q": "조선 독립 동맹을 비밀리에 이끌던 여운형은 일제의 패망 직전 조선 총독부와 교섭하였다.", "a": "X", "e": "여운형이 이끈 비밀 결사는 조선 건국 동맹이에요. 조선 독립 동맹은 중국 화북 지역에서 김두봉 등이 조직한 단체예요."}, {"n": 43, "sec": "광복과 국토의 분단", "q": "여운형은 조선 총독부와 치안 유지 및 행정권 이양을 교섭하여 정치 활동 불간섭을 약속받았다.", "a": "O", "e": ""}, {"n": 44, "sec": "광복과 국토의 분단", "q": "여운형은 정치범·경제범 석방, 서울의 3개월분 식량 확보 등 5가지 조건을 약속받았다.", "a": "O", "e": ""}, {"n": 45, "sec": "광복과 국토의 분단", "q": "여운형은 김규식과 함께 좌우익 세력을 모아 조선 건국 준비 위원회를 조직하였다.", "a": "X", "e": "건준을 함께 조직한 인물은 안재홍이에요. 김규식은 이후 좌우 합작 운동을 함께했어요."}, {"n": 46, "sec": "광복과 국토의 분단", "q": "조선 건국 준비 위원회는 광복 직전에 조직되었다.", "a": "X", "e": "건준은 광복 직후에 조직되었어요. 광복 직전에 있었던 것은 여운형과 총독부의 교섭이에요."}, {"n": 47, "sec": "광복과 국토의 분단", "q": "건준은 전국 각지에 지부를 두고 치안대를 조직하여 질서를 유지하였다.", "a": "O", "e": ""}, {"n": 48, "sec": "광복과 국토의 분단", "q": "건준은 “완전한 독립 국가 건설”, “민주주의 정권 수립” 등을 강령으로 내세웠다.", "a": "O", "e": ""}, {"n": 49, "sec": "광복과 국토의 분단", "q": "대한민국 임시 정부, 조선 독립 동맹, 건준의 강령은 모두 민주 공화국 수립을 지향하였다.", "a": "O", "e": ""}, {"n": 50, "sec": "광복과 국토의 분단", "q": "조선 총독부는 미·소의 분할 점령 사실을 알고 건준의 활동을 적극 지원하였다.", "a": "X", "e": "조선 총독부는 미·소가 38도선을 경계로 남북을 나누어 점령한다는 사실을 알고 건준의 활동을 방해했어요."}, {"n": 51, "sec": "광복과 국토의 분단", "q": "건준에서 우익 세력이 주도권을 장악하자 여운형 등 좌익 세력이 이탈하였다.", "a": "X", "e": "좌익 세력이 주도권을 장악하자 안재홍 등 우익 세력이 이탈했어요."}, {"n": 52, "sec": "광복과 국토의 분단", "q": "건준은 미군의 진주에 앞서 조선 인민 공화국 수립을 선포하였다.", "a": "O", "e": ""}, {"n": 53, "sec": "광복과 국토의 분단", "q": "건준이 해체된 후 각 지부는 인민 위원회로 명칭이 바뀌었다.", "a": "O", "e": ""}, {"n": 54, "sec": "광복과 국토의 분단", "q": "일본의 항복 직전 소련군이 만주를 거쳐 북한 지역으로 남하하였다.", "a": "O", "e": ""}, {"n": 55, "sec": "광복과 국토의 분단", "q": "소련이 미국에 북위 38도선을 경계로 한반도를 분할 점령하자고 제안하였다.", "a": "X", "e": "분할 점령을 제안한 나라는 미국이에요. 소련은 미국의 제안을 받아들였어요."}, {"n": 56, "sec": "광복과 국토의 분단", "q": "북위 38도선 북쪽에는 소련군이, 남쪽에는 미군이 주둔하게 되었다.", "a": "O", "e": ""}, {"n": 57, "sec": "광복과 국토의 분단", "q": "1945년 9월 서울에 진주한 미군은 38도선 이남 지역에서 군정을 선포하였다.", "a": "O", "e": ""}, {"n": 58, "sec": "광복과 국토의 분단", "q": "미군정은 질서 유지를 명분으로 조선 총독부의 행정 체제와 경찰 조직을 그대로 활용하였다.", "a": "O", "e": ""}, {"n": 59, "sec": "광복과 국토의 분단", "q": "미군정은 대한민국 임시 정부와 조선 인민 공화국을 정식 정부로 인정하였다.", "a": "X", "e": "미군정은 미군정만이 유일한 정부라고 선언하며 임시 정부와 조선 인민 공화국 등을 인정하지 않았어요."}, {"n": 60, "sec": "광복과 국토의 분단", "q": "미군정은 행정권을 각 지역의 인민 위원회에 이양하는 간접 통치 방식을 취하였다.", "a": "X", "e": "인민 위원회에 행정권을 이양하는 간접 통치는 소군정의 방식이에요. 미군정은 직접 통치했어요."}, {"n": 61, "sec": "광복과 국토의 분단", "q": "소군정은 민족주의 세력을 탄압하고 김일성 등 좌익 세력을 후원하였다.", "a": "O", "e": ""}, {"n": 62, "sec": "광복과 국토의 분단", "q": "소련은 자국에 우호적인 공산주의 정권을 수립하고자 하였다.", "a": "O", "e": ""}, {"n": 63, "sec": "광복과 국토의 분단", "q": "한국 민주당은 김구가 이끈 정당이다.", "a": "X", "e": "한국 민주당은 송진우, 김성수가 이끌었어요. 김구가 이끈 정당은 한국 독립당이에요."}, {"n": 64, "sec": "광복과 국토의 분단", "q": "독립 촉성 중앙 협의회는 이승만이 이끌었다.", "a": "O", "e": ""}, {"n": 65, "sec": "광복과 국토의 분단", "q": "조선 공산당은 여운형이 이끌었다.", "a": "X", "e": "조선 공산당은 박헌영이 이끌었어요."}, {"n": 66, "sec": "광복과 국토의 분단", "q": "한국 민주당은 1945년 9월 대한민국 임시 정부를 지지하며 창당되었다.", "a": "O", "e": ""}, {"n": 67, "sec": "광복과 국토의 분단", "q": "한국 민주당은 이승만의 단독 정부 수립론에 반대하고 5·10 총선거에 불참하였다.", "a": "X", "e": "한국 민주당은 이승만의 단독 정부 수립론에 동조했고 5·10 총선거에 참여했어요."}, {"n": 68, "sec": "광복과 국토의 분단", "q": "1945년 12월 미국·영국·소련의 외무 장관이 모스크바에서 한국 문제를 논의하였다.", "a": "O", "e": ""}, {"n": 69, "sec": "광복과 국토의 분단", "q": "모스크바 3국 외상 회의에는 미국·영국·소련·중국 4개국의 외무 장관이 참석하였다.", "a": "X", "e": "회의에 참석한 나라는 미국·영국·소련 3국이에요. 중국은 신탁 통치를 맡을 4개국에 포함되었을 뿐이에요."}, {"n": 70, "sec": "광복과 국토의 분단", "q": "모스크바 3국 외상 회의에서는 한반도에 임시 민주 정부를 수립하기로 하였다.", "a": "O", "e": ""}, {"n": 71, "sec": "광복과 국토의 분단", "q": "모스크바 3국 외상 회의에서는 임시 정부 수립을 위해 미소 공동 위원회를 설치하기로 하였다.", "a": "O", "e": ""}, {"n": 72, "sec": "광복과 국토의 분단", "q": "모스크바 3국 외상 회의에서는 최대 10년간 신탁 통치를 실시하기로 최종 결정하였다.", "a": "X", "e": "최종 결정은 최대 5년간의 신탁 통치예요. 10년은 회의 초반 미국의 주장이었어요."}, {"n": 73, "sec": "광복과 국토의 분단", "q": "신탁 통치를 맡을 4개국은 미국·영국·중국·소련이다.", "a": "O", "e": ""}, {"n": 74, "sec": "광복과 국토의 분단", "q": "회의 초반 미국은 최대 10년의 신탁 통치를 주장하였고, 소련은 임시 정부 수립 등을 제안하였다.", "a": "O", "e": ""}, {"n": 75, "sec": "광복과 국토의 분단", "q": "국내 신문은 미국이 신탁 통치를 주장했다고 정확하게 보도하였다.", "a": "X", "e": "국내에는 “소련이 신탁 통치 주장”이라고 사실과 다르게 보도되어 큰 파장이 일었어요."}, {"n": 76, "sec": "광복과 국토의 분단", "q": "김구, 이승만 등 우익 진영은 신탁 통치가 한국인의 자주권을 부정한다며 반대 운동을 펼쳤다.", "a": "O", "e": ""}, {"n": 77, "sec": "광복과 국토의 분단", "q": "좌익 진영은 처음부터 모스크바 3국 외상 회의의 결정을 지지하였다.", "a": "X", "e": "좌익도 처음에는 반대했어요. 이후 신탁 통치를 임시 민주 정부 수립을 위한 지원으로 여겨 지지로 입장을 바꾸었어요."}, {"n": 78, "sec": "광복과 국토의 분단", "q": "모스크바 3국 외상 회의 이후 좌익과 우익은 의견 차이를 좁히지 못한 채 격렬하게 대립하였다.", "a": "O", "e": ""}, {"n": 79, "sec": "통일 정부 수립 운동", "q": "제1차 미소 공동 위원회는 1946년 3월 서울에서 열렸다.", "a": "O", "e": ""}, {"n": 80, "sec": "통일 정부 수립 운동", "q": "제1차 미소 공동 위원회에서 소련은 신탁 통치 반대 세력도 협의 대상에 포함하자고 주장하였다.", "a": "X", "e": "반탁 세력도 포함하자고 한 것은 미국이에요. 소련은 모스크바 결정을 지지하는 세력만 참여시키자고 했어요."}, {"n": 81, "sec": "통일 정부 수립 운동", "q": "제1차 미소 공동 위원회는 합의점을 찾지 못한 채 1946년 5월 무기 휴회에 들어갔다.", "a": "O", "e": ""}, {"n": 82, "sec": "통일 정부 수립 운동", "q": "김구는 정읍에서 남한만이라도 임시 정부를 수립해야 한다고 주장하였다.", "a": "X", "e": "정읍 발언을 한 인물은 이승만이에요. 김구는 단독 정부 수립에 반대했어요."}, {"n": 83, "sec": "통일 정부 수립 운동", "q": "이승만의 정읍 발언에 대부분의 한국인이 동의하였고 미국도 즉시 단독 정부 수립을 추진하였다.", "a": "X", "e": "통일 정부를 희망하던 한국인들은 대부분 동의하지 않았고, 미국도 소련과 협의하여 한국 문제를 해결하려는 정책을 유지했어요."}, {"n": 84, "sec": "통일 정부 수립 운동", "q": "여운형과 김규식 등 중도 세력은 좌우 합작 운동을 추진하였다.", "a": "O", "e": ""}, {"n": 85, "sec": "통일 정부 수립 운동", "q": "좌우 합작 위원회는 중도 세력을 중심으로 정국을 개편하려는 미군정의 지원을 받았다.", "a": "O", "e": ""}, {"n": 86, "sec": "통일 정부 수립 운동", "q": "좌우 합작 위원회는 1946년 10월 좌우 합작 7원칙을 발표하였다.", "a": "O", "e": ""}, {"n": 87, "sec": "통일 정부 수립 운동", "q": "좌우 합작 7원칙은 무상 몰수·무상 분배 원칙의 토지 개혁을 내세웠다.", "a": "X", "e": "7원칙은 유상 매입(몰수·유상 매수)과 무상 분배 원칙이에요. 무상 몰수·무상 분배는 좌익의 요구였어요."}, {"n": 88, "sec": "통일 정부 수립 운동", "q": "좌우 합작 7원칙의 토지 개혁은 토지가 많을수록 값을 싸게 책정하는 체감 매상 방식이었다.", "a": "O", "e": ""}, {"n": 89, "sec": "통일 정부 수립 운동", "q": "좌우 합작 7원칙은 친일 반민족 행위자 처리를 새로 구성할 입법 기구에서 심의 결정하도록 하였다.", "a": "O", "e": ""}, {"n": 90, "sec": "통일 정부 수립 운동", "q": "좌우 합작 7원칙에는 미소 공동 위원회의 속개를 요청하는 내용이 포함되었다.", "a": "O", "e": ""}, {"n": 91, "sec": "통일 정부 수립 운동", "q": "김구와 한국 독립당은 좌우 합작 7원칙을 적극 지지하였다.", "a": "O", "e": ""}, {"n": 92, "sec": "통일 정부 수립 운동", "q": "이승만은 좌우 합작 7원칙을 적극 지지하였다.", "a": "X", "e": "이승만은 모호한 태도를 보였어요."}, {"n": 93, "sec": "통일 정부 수립 운동", "q": "한국 민주당은 7원칙의 토지 개혁 방식이 국가 재정의 파탄을 초래할 것이라며 반대하였다.", "a": "O", "e": ""}, {"n": 94, "sec": "통일 정부 수립 운동", "q": "좌익 세력은 친일파 처리를 입법 기구로 미룬 7원칙을 적극 지지하였다.", "a": "X", "e": "좌익은 무상 몰수·무상 분배의 토지 개혁과 친일파 즉각 청산을 요구하며 7원칙을 비판했어요."}, {"n": 95, "sec": "통일 정부 수립 운동", "q": "70쪽 만평은 악수하는 여운형과 김규식을 ‘극좌’와 ‘극우’가 끌어당기는 모습을 그렸다.", "a": "O", "e": ""}, {"n": 96, "sec": "통일 정부 수립 운동", "q": "좌우 합작 운동은 김구가 암살되면서 사실상 중단되었다.", "a": "X", "e": "좌우 합작 운동은 여운형이 암살되면서 사실상 중단되었어요."}, {"n": 97, "sec": "통일 정부 수립 운동", "q": "좌우 합작 위원회는 1947년 12월 해산하였다.", "a": "O", "e": ""}, {"n": 98, "sec": "통일 정부 수립 운동", "q": "1947년 5월 열린 제2차 미소 공동 위원회는 이견을 좁히지 못한 채 결렬되었다.", "a": "O", "e": ""}, {"n": 99, "sec": "통일 정부 수립 운동", "q": "미국은 미소 공동 위원회에서 합의가 어렵다고 여겨 한국 문제를 유엔에 이관하였다.", "a": "O", "e": ""}, {"n": 100, "sec": "통일 정부 수립 운동", "q": "유엔 총회는 남북 동일한 의석수에 따른 총선거를 통해 정부를 수립한다는 결의안을 통과시켰다.", "a": "X", "e": "유엔 총회는 인구 비례에 따른 총선거를 결의했어요(1947. 11.)."}, {"n": 101, "sec": "통일 정부 수립 운동", "q": "미국은 유엔 한국 임시 위원단의 입북을 거부하였다.", "a": "X", "e": "위원단의 입북을 거부한 나라는 소련이에요."}, {"n": 102, "sec": "통일 정부 수립 운동", "q": "유엔 소총회는 유엔 한국 임시 위원단의 접근이 가능한 지역의 총선거를 결의하였다(1948. 2.).", "a": "O", "e": ""}, {"n": 103, "sec": "통일 정부 수립 운동", "q": "유엔 한국 임시 위원단은 투표를 통해 찬성 4, 반대 2, 기권 2로 선거 감시를 결의하였다.", "a": "O", "e": ""}, {"n": 104, "sec": "통일 정부 수립 운동", "q": "김구는 단독 정부를 세우는 데 협력하지 않겠다는 내용의 ‘삼천만 동포에게 읍고함’을 발표하였다.", "a": "O", "e": ""}, {"n": 105, "sec": "통일 정부 수립 운동", "q": "남한만의 단독 선거가 결정되자 김구와 김규식 등은 남북 협상을 추진하였다.", "a": "O", "e": ""}, {"n": 106, "sec": "통일 정부 수립 운동", "q": "남북 연석 회의는 1948년 4월 서울에서 개최되었다.", "a": "X", "e": "남북 연석 회의는 평양에서 개최되었어요."}, {"n": 107, "sec": "통일 정부 수립 운동", "q": "남북 협상 공동 성명에는 외국 군대 철수, 남한 단독 선거 반대 등이 포함되었다.", "a": "O", "e": ""}, {"n": 108, "sec": "통일 정부 수립 운동", "q": "남북 협상의 결과 5·10 총선거가 연기되고 남북 통일 정부가 수립되었다.", "a": "X", "e": "북한은 이미 독자적인 정권 수립이 진행 중이었고 남한에서는 단독 선거가 추진되어 남북 협상은 성과를 거두지 못했어요."}, {"n": 109, "sec": "통일 정부 수립 운동", "q": "좌우 합작 운동과 남북 협상에 모두 참여한 인물은 김규식이다.", "a": "O", "e": ""}, {"n": 110, "sec": "통일 정부 수립 운동", "q": "1947년 제주도에서 3·1절 기념행사 후 가두시위 중 경찰의 발포로 사상자가 발생하였다.", "a": "O", "e": ""}, {"n": 111, "sec": "통일 정부 수립 운동", "q": "제주도의 좌익 세력 등은 ‘단독 선거 반대’, ‘통일 정부 수립’을 주장하며 무장봉기를 일으켰다(1948. 4. 3.).", "a": "O", "e": ""}, {"n": 112, "sec": "통일 정부 수립 운동", "q": "미군정은 제주 4·3 사건 당시 서북 청년회 등 좌익 단체를 동원하여 진압하였다.", "a": "X", "e": "서북 청년회는 미군정이 동원한 우익 단체예요."}, {"n": 113, "sec": "통일 정부 수립 운동", "q": "제주 4·3 사건 당시 미군정이 제주도에 계엄령을 선포하였다.", "a": "X", "e": "계엄령은 정부 수립 이후 이승만 정부가 선포했어요."}, {"n": 114, "sec": "통일 정부 수립 운동", "q": "제주 4·3 사건 당시 유혈 사태를 막기 위한 평화 협상도 추진되었다.", "a": "O", "e": ""}, {"n": 115, "sec": "통일 정부 수립 운동", "q": "제주 4·3 사건의 무력 충돌과 진압은 1954년 9월 21일까지 이어졌다.", "a": "O", "e": ""}, {"n": 116, "sec": "통일 정부 수립 운동", "q": "제주 4·3 사건 당시 희생자는 제주도민의 약 1%에 이르렀다.", "a": "X", "e": "희생자는 제주도민의 10%에 이르는 2만 5천~3만 명이었어요."}, {"n": 117, "sec": "통일 정부 수립 운동", "q": "제주 4·3 사건은 오랜 기간 은폐·왜곡되어 유족들은 ‘속솜허라(조용히 하라)’라며 침묵할 수밖에 없었다.", "a": "O", "e": ""}, {"n": 118, "sec": "통일 정부 수립 운동", "q": "2000년 제주 4·3 사건 진상 규명 및 희생자 명예 회복에 관한 특별법이 제정되었다.", "a": "O", "e": ""}, {"n": 119, "sec": "통일 정부 수립 운동", "q": "제주 영모원에서는 민간인 희생자만 위로하고 토벌대로 참여한 군인·경찰은 위로하지 않는다.", "a": "X", "e": "영모원에서는 토벌대로 참여했다가 사망한 군인과 경찰의 넋도 함께 위로해요. 평화와 상생의 정신을 보여 주는 사례예요."}, {"n": 120, "sec": "통일 정부 수립 운동", "q": "여수·순천 10·19 사건은 이승만 정부가 여수 주둔 군부대에 제주도 출동 명령을 내리면서 일어났다.", "a": "O", "e": ""}, {"n": 121, "sec": "통일 정부 수립 운동", "q": "여수·순천 10·19 사건의 봉기 세력은 ‘단독 선거 반대’를 핵심 구호로 내세웠다.", "a": "X", "e": "여순 사건의 봉기 세력은 ‘제주도 출동 반대’, ‘통일 정부 수립’을 내세웠어요. ‘단독 선거 반대’는 제주 4·3 사건의 구호예요."}, {"n": 122, "sec": "통일 정부 수립 운동", "q": "여수·순천 10·19 사건은 소련 군사 고문단의 협조를 받은 정부군에게 진압되었다.", "a": "X", "e": "정부군에게 협조한 것은 미국 군사 고문단이에요."}, {"n": 123, "sec": "통일 정부 수립 운동", "q": "여수·순천 10·19 사건의 봉기 세력 일부는 지리산 일대로 옮겨 가 6·25 전쟁 때까지 활동하였다.", "a": "O", "e": ""}, {"n": 124, "sec": "대한민국 정부 수립", "q": "5·10 총선거는 유엔 한국 임시 위원단의 감시 아래 38도선 이남 지역에서 실시되었다.", "a": "O", "e": ""}, {"n": 125, "sec": "대한민국 정부 수립", "q": "5·10 총선거는 우리 역사상 최초로 실시된 민주적인 선거였다.", "a": "O", "e": ""}, {"n": 126, "sec": "대한민국 정부 수립", "q": "5·10 총선거에서는 만 25세 이상의 남녀에게 선거권이 부여되었다.", "a": "X", "e": "선거권은 만 21세 이상 모든 남녀, 피선거권은 만 25세 이상 국민이에요."}, {"n": 127, "sec": "대한민국 정부 수립", "q": "5·10 총선거는 직접·비밀·평등·자유 원칙에 입각한 선거였다.", "a": "O", "e": ""}, {"n": 128, "sec": "대한민국 정부 수립", "q": "김구, 김규식 등 남북 협상에 참여한 인사들은 5·10 총선거에 출마하여 당선되었다.", "a": "X", "e": "김구, 김규식 등과 좌익 세력은 단독 선거에 반대하며 선거에 불참 했어요."}, {"n": 129, "sec": "대한민국 정부 수립", "q": "5·10 총선거는 제주도를 포함한 모든 선거구에서 정상적으로 실시되었다.", "a": "X", "e": "제주도의 2곳은 제주 4·3 사건의 영향으로 선거가 제대로 치러지지 못했어요."}, {"n": 130, "sec": "대한민국 정부 수립", "q": "5·10 총선거로 임기 4년의 국회 의원 198명이 선출되었다.", "a": "X", "e": "제헌 국회 의원의 임기는 2년이에요. 4년은 제헌 헌법의 정·부통령 임기예요."}, {"n": 131, "sec": "대한민국 정부 수립", "q": "제헌 국회에서는 무소속이 85석으로 다수를 차지하였다.", "a": "O", "e": ""}, {"n": 132, "sec": "대한민국 정부 수립", "q": "제헌 국회에서 김구가 이끈 한국 독립당이 원내 제1당이 되었다.", "a": "X", "e": "원내 제1당은 이승만이 이끈 대한 독립 촉성 국민회(55석)예요. 한국 독립당은 선거에 불참했어요."}, {"n": 133, "sec": "대한민국 정부 수립", "q": "대한 독립 촉성 국민회는 한국 민주당 등 군소 우익 정당과 연합해서 과반을 차지하였다.", "a": "O", "e": ""}, {"n": 134, "sec": "대한민국 정부 수립", "q": "제헌 국회는 국호를 대한민국으로 정하고 1948년 7월 17일 헌법을 공포하였다.", "a": "O", "e": ""}, {"n": 135, "sec": "대한민국 정부 수립", "q": "제헌 헌법은 대한민국 정부가 대한민국 임시 정부의 법통을 계승한 민주 공화국임을 밝혔다.", "a": "O", "e": ""}, {"n": 136, "sec": "대한민국 정부 수립", "q": "제헌 헌법은 의원 내각제를 채택하였다.", "a": "X", "e": "제헌 헌법은 삼권 분립과 대통령 중심제를 채택했어요."}, {"n": 137, "sec": "대한민국 정부 수립", "q": "제헌 헌법에는 친일 반민족 행위자 청산과 농지 개혁 등 독립운동가들이 구상한 목표가 담겼다.", "a": "O", "e": ""}, {"n": 138, "sec": "대한민국 정부 수립", "q": "제헌 국회는 국민 직선제 규정에 따라 대통령에 이승만, 부통령에 이시영을 선출하였다.", "a": "X", "e": "제헌 국회는 헌법에 명시된 간선제 규정에 따라 국회에서 대통령과 부통령을 선출했어요."}, {"n": 139, "sec": "대한민국 정부 수립", "q": "제헌 헌법에 따르면 정·부통령의 임기는 4년이었다.", "a": "O", "e": ""}, {"n": 140, "sec": "대한민국 정부 수립", "q": "이승만은 미군정 종식과 함께 1948년 8월 15일 대한민국 정부 수립을 국내외에 선포하였다.", "a": "O", "e": ""}, {"n": 141, "sec": "대한민국 정부 수립", "q": "유엔 총회는 1948년 12월 대한민국 정부를 한반도 전체의 유일한 합법 정부로 승인하였다.", "a": "X", "e": "유엔은 대한민국 정부를 유엔 감시하의 선거가 가능했던 지역에서 유일한 합법 정부로 승인했어요."}, {"n": 142, "sec": "대한민국 정부 수립", "q": "정부 수립 축하식 사진에는 한동안 성조기가 걸렸던 중앙청에 태극기가 게양된 모습이 담겨 있다.", "a": "O", "e": ""}, {"n": 143, "sec": "대한민국 정부 수립", "q": "1948년 발행된 대한민국 제1호 관보에는 발행 시기가 ‘대한민국 30년’으로 표기되어 있다.", "a": "O", "e": ""}, {"n": 144, "sec": "대한민국 정부 수립", "q": "‘대한민국 30년’이라는 표기는 대한민국이 1910년 국권 피탈 직후 수립되었다는 뜻이다.", "a": "X", "e": "대한민국이 1919년 수립된 대한민국 임시 정부에서 비롯되었다는 뜻이에요(1948년 = 대한민국 30년)."}, {"n": 145, "sec": "대한민국 정부 수립", "q": "제헌 헌법 전문에는 기미 삼일 운동으로 대한민국을 건립하였다는 내용이 담겨 있다.", "a": "O", "e": ""}, {"n": 146, "sec": "대한민국 정부 수립", "q": "대한민국 임시 헌법(1919)과 제헌 헌법(1948)은 모두 국호를 대한민국으로 하였다.", "a": "O", "e": ""}, {"n": 147, "sec": "대한민국 정부 수립", "q": "대한민국 임시 헌법은 입법권은 국무원이, 행정권은 의정원이 행사하도록 하였다.", "a": "X", "e": "입법권은 의정원, 행정권은 국무원, 사법권은 법원이 행사했어요."}, {"n": 148, "sec": "대한민국 정부 수립", "q": "제헌 헌법 제16조는 적어도 초등 교육은 의무적이며 무상으로 한다고 규정하였다.", "a": "O", "e": ""}, {"n": 149, "sec": "대한민국 정부 수립", "q": "제헌 헌법의 평등권(제8조), 교육권(제16조), 경제 질서(제84조) 조항에는 삼균주의가 반영되었다.", "a": "O", "e": ""}, {"n": 150, "sec": "대한민국 정부 수립", "q": "제헌 국회는 헌법 조항에 따라 반민족 행위 처벌법을 제정하였다(1948. 9.).", "a": "O", "e": ""}, {"n": 151, "sec": "대한민국 정부 수립", "q": "반민족 행위 특별 조사 위원회(반민 특위)는 대통령 직속 기구였다.", "a": "X", "e": "반민 특위는 국회 직속 기구였어요."}, {"n": 152, "sec": "대한민국 정부 수립", "q": "반민법은 밀정 행위로 독립운동을 방해한 자를 처벌 대상으로 규정하였다.", "a": "O", "e": ""}, {"n": 153, "sec": "대한민국 정부 수립", "q": "반민법은 군·경찰의 관리로서 악질적인 행위로 민족에게 해를 가한 자를 처벌 대상으로 규정하였다.", "a": "O", "e": ""}, {"n": 154, "sec": "대한민국 정부 수립", "q": "반민법은 군수 공업을 책임 경영한 자를 처벌 대상에서 제외하였다.", "a": "X", "e": "비행기, 병기 또는 탄약 등 군수 공업을 책임 경영한 자도 처벌 대상이었어요."}, {"n": 155, "sec": "대한민국 정부 수립", "q": "이승만 대통령은 반민 특위의 활동에 적극 협조하였다.", "a": "X", "e": "이승만은 반공을 내세워 반민 특위를 견제하는 담화를 여러 번 발표하고 국회에 반민법 개정을 요구했어요."}, {"n": 156, "sec": "대한민국 정부 수립", "q": "친일 고문 경찰 노덕술이 반민 특위에 검거되자 이승만은 반민 특위를 견제하는 특별 담화를 발표하였다.", "a": "O", "e": ""}, {"n": 157, "sec": "대한민국 정부 수립", "q": "1949년 6월 경찰이 반민 특위 사무실을 습격하였다.", "a": "O", "e": ""}, {"n": 158, "sec": "대한민국 정부 수립", "q": "반민 특위 소속 국회 의원들이 공산당과 내통하였다는 혐의로 구속된 사건을 국회 프락치 사건이라고 한다.", "a": "O", "e": ""}, {"n": 159, "sec": "대한민국 정부 수립", "q": "반민법의 공소 시효를 연장하는 개정 법안이 통과되어 친일파 처벌이 강화되었다.", "a": "X", "e": "공소 시효를 1949년 8월로 단축하는 개정 법안이 통과되었고, 결국 반민 특위는 해체되었어요."}, {"n": 160, "sec": "대한민국 정부 수립", "q": "반민 특위 활동으로 실형을 선고받은 반민족 행위자들은 모두 형기를 마쳤다.", "a": "X", "e": "실형을 받은 7건의 반민족 행위자는 1950년 3월까지 보석이나 형 집행 정지 등으로 전원 석방되었어요."}, {"n": 161, "sec": "대한민국 정부 수립", "q": "2004년 ‘일제 강점하 반민족 행위 진상 규명에 관한 특별법’이 제정되었다.", "a": "O", "e": ""}, {"n": 162, "sec": "대한민국 정부 수립", "q": "광복 이후 남한은 북한에 비해 산업 기반 시설이 취약하여 더 큰 어려움을 겪었다.", "a": "O", "e": ""}, {"n": 163, "sec": "대한민국 정부 수립", "q": "광복 이후 일본의 자본과 기술이 들어오면서 공장의 수가 크게 늘어났다.", "a": "X", "e": "일본의 자본과 기술이 빠져나가면서 공장의 수가 줄었어요."}, {"n": 164, "sec": "대한민국 정부 수립", "q": "광복 이후 해외에서 귀국하는 인구가 늘어나 실업자가 대거 발생하였다.", "a": "O", "e": ""}, {"n": 165, "sec": "대한민국 정부 수립", "q": "미군정은 재정 마련을 위해 화폐를 과도하게 발행하여 물가가 폭등하였다.", "a": "O", "e": ""}, {"n": 166, "sec": "대한민국 정부 수립", "q": "미군정의 미곡 자유화 정책으로 곡물 가격이 안정되었다.", "a": "X", "e": "상인과 지주의 매점매석으로 곡물 가격이 크게 올랐어요. 이후 다시 식량 수급을 통제했지만 별다른 성과가 없었어요."}, {"n": 167, "sec": "대한민국 정부 수립", "q": "미군정은 동양 척식 주식회사를 신한 공사로 개편하여 일본인 소유 토지를 관리하였다.", "a": "O", "e": ""}, {"n": 168, "sec": "대한민국 정부 수립", "q": "미군정은 일본인 소유의 토지를 몰수하여 1948년 농민에게 무상으로 나누어 주었다.", "a": "X", "e": "미군정은 1948년 농민에게 유상으로 매각했어요."}, {"n": 169, "sec": "대한민국 정부 수립", "q": "농지 개혁은 경작하는 농민이 토지를 소유해야 한다는 경자유전의 원칙에 따라 실시되었다.", "a": "O", "e": ""}, {"n": 170, "sec": "대한민국 정부 수립", "q": "농지 개혁은 유상 매수·유상 분배 방식으로 실시되었다.", "a": "O", "e": ""}, {"n": 171, "sec": "대한민국 정부 수립", "q": "농지 개혁법은 가구당 농지 소유의 상한선을 5정보로 정하였다.", "a": "X", "e": "상한선은 3정보(약 3만m²)예요."}, {"n": 172, "sec": "대한민국 정부 수립", "q": "정부는 상한선을 초과하는 농지를 지가 증권을 발급하고 매수하였다.", "a": "O", "e": ""}, {"n": 173, "sec": "대한민국 정부 수립", "q": "분배받은 농지의 상환액은 평년작 주생산물의 1.5배로 하고, 5년 동안 균등 상환하도록 하였다.", "a": "O", "e": ""}, {"n": 174, "sec": "대한민국 정부 수립", "q": "농지 개혁법은 1949년 6월 공포와 동시에 곧바로 시행되었다.", "a": "X", "e": "정부의 재정 부담 때문에 바로 시행하지 않다가, 보상액과 상환액이 같도록 개정한 후 1950년 5월에 시행했어요."}, {"n": 175, "sec": "대한민국 정부 수립", "q": "농지 개혁 시행이 늦어지는 사이 많은 지주가 토지를 처분하였다.", "a": "O", "e": ""}, {"n": 176, "sec": "대한민국 정부 수립", "q": "농지 개혁으로 지주·소작제가 거의 소멸되었다.", "a": "O", "e": ""}, {"n": 177, "sec": "대한민국 정부 수립", "q": "농지 개혁에서는 농지뿐 아니라 산림 등 모든 토지가 개혁 대상이 되었다.", "a": "X", "e": "농지가 아닌 토지는 개혁 대상에서 제외되었어요."}, {"n": 178, "sec": "대한민국 정부 수립", "q": "농지 개혁 과정에서 반민족 행위자의 토지가 모두 몰수되었다.", "a": "X", "e": "반민족 행위자의 토지 몰수는 이루어지지 않았어요."}, {"n": 179, "sec": "대한민국 정부 수립", "q": "유상 분배에 따른 부담으로 가난한 농민이 분배받은 농지를 팔고 다시 소작농이 되기도 하였다.", "a": "O", "e": ""}, {"n": 180, "sec": "대한민국 정부 수립", "q": "농지 개혁은 6·25 전쟁 중 농민들이 급격하게 공산화되지 않은 요인이 되기도 하였다.", "a": "O", "e": ""}, {"n": 181, "sec": "대한민국 정부 수립", "q": "농지 개혁 그래프에서 1945년 말에는 소작지 면적이 자작지 면적보다 넓었다.", "a": "O", "e": ""}, {"n": 182, "sec": "대한민국 정부 수립", "q": "귀속 재산은 패전한 일제가 축출되면서 일본인이 남기고 간 토지, 건물, 기업체, 유가 증권 등이다.", "a": "O", "e": ""}, {"n": 183, "sec": "대한민국 정부 수립", "q": "귀속 재산은 미군정에 접수되어 관리되다가 대한민국 정부에 이양되었다.", "a": "O", "e": ""}, {"n": 184, "sec": "대한민국 정부 수립", "q": "정부는 귀속 재산 처리법을 제정하여 농지를 포함한 모든 귀속 재산을 민간에 불하하였다.", "a": "X", "e": "농지를 제외한 나머지 귀속 재산을 민간에 불하했어요. 귀속 농지는 농지 개혁으로 처리되었어요."}, {"n": 185, "sec": "대한민국 정부 수립", "q": "귀속 재산은 정부가 매긴 가격보다 높게 불하되어 정부 재정에 크게 기여하였다.", "a": "X", "e": "정부가 매긴 가격보다 낮게 불하되었고 대금을 오랫동안 나누어 낼 수 있어서, 재정에 기여하는 효과가 예상보다 낮았어요."}, {"n": 186, "sec": "대한민국 정부 수립", "q": "귀속 재산 불하 과정에서 특정 기업에 대한 특혜 등의 부작용이 나타났다.", "a": "O", "e": ""}, {"n": 187, "sec": "대한민국 정부 수립", "q": "귀속 재산 처리법은 최고 15년의 기한으로 대금을 분할 납부할 수 있게 하였다.", "a": "O", "e": ""}, {"n": 188, "sec": "대한민국 정부 수립", "q": "소련군은 38도선 이북 각 지역에 좌우 합작으로 성립된 인민 위원회의 자치를 인정하였다.", "a": "O", "e": ""}, {"n": 189, "sec": "대한민국 정부 수립", "q": "소련군은 모스크바 3국 외상 회의 후 신탁 통치에 찬성하는 조만식 등 민족주의 세력을 억압하였다.", "a": "X", "e": "조만식 등은 신탁 통치에 반대하는 민족주의 세력이었어요."}, {"n": 190, "sec": "대한민국 정부 수립", "q": "북조선 임시 인민 위원회는 1946년 2월 김일성을 위원장으로 하여 조직되었다.", "a": "O", "e": ""}, {"n": 191, "sec": "대한민국 정부 수립", "q": "북조선 임시 인민 위원회는 유상 매수·유상 분배의 토지 개혁을 실시하였다.", "a": "X", "e": "북한은 무상 몰수·무상 분배의 토지 개혁을 실시했어요. 유상 매수·유상 분배는 남한의 농지 개혁이에요."}, {"n": 192, "sec": "대한민국 정부 수립", "q": "북한의 토지 개혁에서는 분배된 토지의 매매·소작·저당이 금지되었다.", "a": "O", "e": ""}, {"n": 193, "sec": "대한민국 정부 수립", "q": "북조선 임시 인민 위원회는 8시간제 노동법과 남녀평등권 법령을 제정하고 주요 산업을 국유화하였다.", "a": "O", "e": ""}, {"n": 194, "sec": "대한민국 정부 수립", "q": "1947년 북조선 임시 인민 위원회의 개편으로 성립된 북조선 인민 위원회는 헌법 초안을 마련하였다.", "a": "O", "e": ""}, {"n": 195, "sec": "대한민국 정부 수립", "q": "최고 인민 회의는 헌법을 채택하고 김일성을 초대 대통령으로 하여 정권을 세웠다.", "a": "X", "e": "김일성은 초대 수상으로 추대되었어요."}, {"n": 196, "sec": "대한민국 정부 수립", "q": "조선 민주주의 인민 공화국은 1948년 9월 9일 수립되었다.", "a": "O", "e": ""}, {"n": 197, "sec": "대한민국 정부 수립", "q": "조선 민주주의 인민 공화국은 대한민국 정부보다 먼저 수립되었다.", "a": "X", "e": "대한민국 정부 수립(1948. 8. 15.)이 북한 정권 수립(1948. 9. 9.)보다 먼저예요."}];
const SECS = [...new Set(DATA.map(d=>d.sec))];
const ROM=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ'];
const KEY='hanyoung-ox-v1';
let st={wrong:{},done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.wrong) st=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
let list=[],pos=0,picked=null,shuffle=false,wrongOnly=false,section='all',right=0,tried=0;

$('sec').innerHTML='<option value="all">전체 단원 ('+DATA.length+'문항)</option>'+
  SECS.map((s,i)=>'<option value="'+i+'">'+ROM[i]+'. '+s+' ('+DATA.filter(d=>d.sec===s).length+')</option>').join('');

function build(){
  list=DATA.filter(d=>(section==='all'||d.sec===SECS[+section])&&(!wrongOnly||st.wrong[d.n]));
  if(shuffle){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  pos=0;picked=null;right=0;tried=0;render();
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const total=list.length;
  const nWrong=Object.keys(st.wrong).length;
  $('score').innerHTML=tried?'<span>정답</span><strong>'+right+'/'+tried+'</strong>':'<span>틀린 문제</span><strong>'+nWrong+'</strong>';
  $('bar').style.width=total?((pos+(picked?1:0))/total*100)+'%':'0';
  $('prev').disabled=pos===0;
  const card=$('card'),act=$('actions');
  if(!total){
    card.innerHTML='<div class="done"><div class="big">0</div><p>'+(wrongOnly?'틀린 문제가 없어요. 전체 문제로 돌아가 풀어 보세요.':'문제가 없어요.')+'</p></div>';
    act.innerHTML='';return;
  }
  if(pos>=total){
    card.innerHTML='<div class="done"><p>이번 회차 결과</p><div class="big">'+right+' / '+tried+'</div><p>틀린 문제는 자동으로 모아 두었어요.</p><div class="row"><button class="chip" id="again">처음부터 다시</button><button class="chip" id="gowrong">틀린 문제만 풀기</button></div></div>';
    act.innerHTML='';
    $('again').onclick=build;
    $('gowrong').onclick=()=>{wrongOnly=true;$('wrong').setAttribute('aria-pressed','true');build()};
    return;
  }
  const d=list[pos];
  const si=SECS.indexOf(d.sec);
  let h='<div class="meta"><span class="no">'+d.n+'<em>번</em></span><span class="tag">'+ROM[si]+'. '+esc(d.sec)+'</span></div><p class="q">'+esc(d.q)+'</p>';
  if(picked){
    const ok=picked===d.a;
    h+='<div class="result" data-k="'+d.a+'"><div class="mark" aria-label="정답 '+d.a+'">'+d.a+'</div><div><p class="verdict '+(ok?'ok':'no')+'">'+(ok?'정답이에요!':'아쉬워요. 정답은 '+d.a)+'</p><p class="exp">'+esc(d.e||'옳은 설명이에요.')+'</p></div></div>';
    act.innerHTML='<button class="next" id="nx">'+(pos+1<total?'다음 문제 →':'결과 보기')+'</button>';
    $('nx').onclick=()=>{pos++;picked=null;render();window.scrollTo({top:0})};
    $('nx').focus({preventScroll:true});
  }else{
    act.innerHTML='<div class="pad"><button id="bO" aria-label="O 맞다">O</button><button id="bX" aria-label="X 틀리다">X</button></div>';
    $('bO').onclick=()=>answer('O');$('bX').onclick=()=>answer('X');
  }
  card.innerHTML=h;
  const p=$('pos');
}
function answer(k){
  const d=list[pos];picked=k;tried++;
  if(k===d.a){right++; if(wrongOnly) delete st.wrong[d.n];}
  else st.wrong[d.n]=1;
  save();render();
}
$('sec').onchange=e=>{section=e.target.value;build()};
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);build()};
$('wrong').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);build()};
$('prev').onclick=()=>{if(pos>0){pos--;picked=null;render()}};
let armed=false;
$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}
  st={wrong:{},done:{}};save();armed=false;t.textContent='기록 초기화';wrongOnly=false;$('wrong').setAttribute('aria-pressed','false');build()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(!picked&&(e.key==='o'||e.key==='O'))answer('O');
  else if(!picked&&(e.key==='x'||e.key==='X'))answer('X');
  else if(picked&&(e.key==='Enter'||e.key==='ArrowRight')){e.preventDefault();$('nx')&&$('nx').click()}

<script>
(function(){
const H=1418297543,K='hanyoung-ox-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
</body></html>
