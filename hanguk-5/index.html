<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>O</b><i>X</i></div><h2>한국사 5주차 트레이닝</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>

<script>
const OXD=[{"n": 1, "sec": "Ⅰ. 군사 정부의 등장", "q": "1961년 5월 16일 새벽, 육군 소장 박정희가 이끄는 군인들이 군사 정변을 일으켰다.", "a": "O", "e": ""}, {"n": 2, "sec": "Ⅰ. 군사 정부의 등장", "q": "5·16 군사 정변은 육군 소장 전두환이 이끈 군인들이 일으켰다.", "a": "X", "e": "5·16 군사 정변은 박정희가 이끌었어요. 전두환은 12·12 사태(1979)의 주도자예요."}, {"n": 3, "sec": "Ⅰ. 군사 정부의 등장", "q": "5·16 군사 정변 세력은 혁명 공약을 발표하여 헌정을 중단하고 군정을 실시하였다.", "a": "O", "e": ""}, {"n": 4, "sec": "Ⅰ. 군사 정부의 등장", "q": "혁명 공약은 반공을 국시의 제일의(義)로 삼는다고 하였다.", "a": "O", "e": ""}, {"n": 5, "sec": "Ⅰ. 군사 정부의 등장", "q": "혁명 공약은 평화 통일을 국시의 제일의로 삼는다고 하였다.", "a": "X", "e": "혁명 공약 1항은 ‘반공’을 국시의 제일의로 삼는다고 했어요."}, {"n": 6, "sec": "Ⅰ. 군사 정부의 등장", "q": "혁명 공약에는 과업이 성취되면 양심적인 정치인들에게 정권을 이양한다는 내용이 있다.", "a": "O", "e": ""}, {"n": 7, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정변 세력은 국가 재건 최고 회의를 설치하여 입법·사법·행정권을 장악하였다.", "a": "O", "e": ""}, {"n": 8, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정변 세력은 통일 주체 국민 회의를 설치하여 입법·사법·행정권을 장악하였다.", "a": "X", "e": "군정 시기 기구는 국가 재건 최고 회의예요. 통일 주체 국민 회의는 유신 헌법의 기구예요."}, {"n": 9, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정부는 언론을 탄압하고 정치인의 활동을 통제하였다.", "a": "O", "e": ""}, {"n": 10, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정부는 통일 운동에 앞장섰던 사람들을 체포하였다.", "a": "O", "e": ""}, {"n": 11, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정부는 통일 운동을 적극 지원하였다.", "a": "X", "e": "통일 운동에 앞장섰던 사람들을 체포했어요."}, {"n": 12, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정부는 국가 안보를 명분으로 중앙정보부를 설치하였다.", "a": "O", "e": ""}, {"n": 13, "sec": "Ⅰ. 군사 정부의 등장", "q": "중앙정보부는 1961년 국가 안전 보장을 명분으로 설치되었다.", "a": "O", "e": ""}, {"n": 14, "sec": "Ⅰ. 군사 정부의 등장", "q": "중앙정보부는 박정희의 정권 창출과 권력 유지에 활용되었다.", "a": "O", "e": ""}, {"n": 15, "sec": "Ⅰ. 군사 정부의 등장", "q": "중앙정보부는 국가 정보원을 거쳐 현재 국가 안전 기획부로 개편되었다.", "a": "X", "e": "거꾸로예요. 국가 안전 기획부를 거쳐 현재 국가 정보원이에요."}, {"n": 16, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정부는 1962년 대통령 중심제로 헌법을 개정하였다.", "a": "O", "e": ""}, {"n": 17, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정부는 1962년 의원 내각제로 헌법을 개정하였다.", "a": "X", "e": "대통령 중심제로 개정했어요(5차 개헌)."}, {"n": 18, "sec": "Ⅰ. 군사 정부의 등장", "q": "군사 정부는 민주 공화당을 창당하였다.", "a": "O", "e": ""}, {"n": 19, "sec": "Ⅰ. 군사 정부의 등장", "q": "박정희는 정치인에게 정권을 넘기고 군대로 복귀하겠다는 약속을 지켰다.", "a": "X", "e": "약속을 어기고 민간인 신분으로 대통령 선거에 출마했어요."}, {"n": 20, "sec": "Ⅰ. 군사 정부의 등장", "q": "박정희는 민간인 신분으로 대통령 선거에 출마하였다.", "a": "O", "e": ""}, {"n": 21, "sec": "Ⅰ. 군사 정부의 등장", "q": "1963년 대통령 선거에서 박정희는 민주 공화당 후보로 나섰다.", "a": "O", "e": ""}, {"n": 22, "sec": "Ⅰ. 군사 정부의 등장", "q": "1963년 대통령 선거에서 박정희는 윤보선을 누르고 당선되었다.", "a": "O", "e": ""}, {"n": 23, "sec": "Ⅰ. 군사 정부의 등장", "q": "1963년 대통령 선거에서 박정희는 김대중을 누르고 당선되었다.", "a": "X", "e": "1963년 상대는 윤보선이에요. 김대중은 1971년 제7대 대통령 선거의 야당 후보예요."}, {"n": 24, "sec": "Ⅱ. 한일 협정의 체결", "q": "박정희 정부는 경제 개발 자금을 확보하기 위해 한일 국교 정상화에 나섰다.", "a": "O", "e": ""}, {"n": 25, "sec": "Ⅱ. 한일 협정의 체결", "q": "미국은 소련과 중국에 맞서기 위한 안보 체제 구축을 위해 한일 관계 개선을 강력히 요구하였다.", "a": "O", "e": ""}, {"n": 26, "sec": "Ⅱ. 한일 협정의 체결", "q": "미국은 한일 국교 정상화에 반대하였다.", "a": "X", "e": "미국은 한국과 일본의 관계 개선을 강력히 요구했어요."}, {"n": 27, "sec": "Ⅱ. 한일 협정의 체결", "q": "중앙정보부장 김종필과 일본 외무상 오히라가 여러 차례 비밀리에 만나 회담을 진행하였다.", "a": "O", "e": ""}, {"n": 28, "sec": "Ⅱ. 한일 협정의 체결", "q": "김종필과 오히라의 회담은 공개적으로 진행되었다.", "a": "X", "e": "여러 차례 비밀리에 만났어요."}, {"n": 29, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 회담은 일본의 식민 지배에 대한 사죄와 배상이 포함되지 않은 채 진행되었다.", "a": "O", "e": ""}, {"n": 30, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 회담은 약탈된 문화유산의 반환을 핵심 조건으로 진행되었다.", "a": "X", "e": "약탈된 문화유산의 반환도 포함되지 않은 채 진행되었어요."}, {"n": 31, "sec": "Ⅱ. 한일 협정의 체결", "q": "대학생과 고등학생은 한일 회담을 대일 굴욕 외교라 여겨 반대 시위를 벌였다.", "a": "O", "e": ""}, {"n": 32, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 회담 반대 시위에 시민들이 동조하면서 시위가 격렬해졌는데, 이를 6·3 시위라고 한다.", "a": "O", "e": ""}, {"n": 33, "sec": "Ⅱ. 한일 협정의 체결", "q": "6·3 시위는 1965년에 일어났다.", "a": "X", "e": "6·3 시위는 1964년이에요. 한일 협정 비준이 1965년이에요."}, {"n": 34, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 회담 반대 시위에서 학생과 시민들은 ‘제2의 한일 합방 결사 반대’를 주장하였다.", "a": "O", "e": ""}, {"n": 35, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 회담 반대 시위에서는 ‘불법적 친일 정권 퇴진’이 주장되었다.", "a": "O", "e": ""}, {"n": 36, "sec": "Ⅱ. 한일 협정의 체결", "q": "박정희 정부는 비상계엄령을 선포하고 군대를 동원하여 6·3 시위를 진압하였다.", "a": "O", "e": ""}, {"n": 37, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 협정은 여야 합의 속에 국회에서 비준되었다.", "a": "X", "e": "야당의 반대에도 불구하고 민주 공화당 의원들만 참석한 가운데 비준되었어요."}, {"n": 38, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 협정은 1965년 국회에서 비준되었다.", "a": "O", "e": ""}, {"n": 39, "sec": "Ⅱ. 한일 협정의 체결", "q": "박정희 정부는 한일 협정으로 경제 개발에 필요한 자금을 일부 확보하였다.", "a": "O", "e": ""}, {"n": 40, "sec": "Ⅱ. 한일 협정의 체결", "q": "박정희 정부는 한일 협정으로 일본의 식민 지배에 대한 사죄와 배상을 받아 냈다.", "a": "X", "e": "사죄와 배상 등은 받아 내지 못했어요."}, {"n": 41, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 협정에서 한국은 무상 3억 달러, 정부 차관 2억 달러 등을 지급받았다.", "a": "O", "e": ""}, {"n": 42, "sec": "Ⅱ. 한일 협정의 체결", "q": "한일 협정으로 받은 자금은 식민 지배에 대한 배상금 명목이었다.", "a": "X", "e": "독립 축하금 명목과 차관으로 받았어요. 배상은 받아 내지 못했어요."}, {"n": 43, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "박정희 정부는 미국의 요청에 따라 베트남에 국군을 파병하였다.", "a": "O", "e": ""}, {"n": 44, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "베트남 파병 규모는 1964년부터 1973년까지 32만여 명에 달하였다.", "a": "O", "e": ""}, {"n": 45, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "베트남 파병 규모는 1965년부터 1970년까지 3만여 명이었다.", "a": "X", "e": "1964년부터 1973년까지 32만여 명이에요."}, {"n": 46, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "처음에는 비전투 요원이 파병(1964)되었고, 이후 전투 요원이 파병(1965)되었다.", "a": "O", "e": ""}, {"n": 47, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "처음부터 전투 요원이 파병되었다.", "a": "X", "e": "처음(1964)에는 비전투 요원, 미국의 요청으로 1965년 전투 요원이 파병되었어요."}, {"n": 48, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "미국은 파병의 대가로 기술과 차관 제공, 한국군 현대화 등을 약속하였다.", "a": "O", "e": ""}, {"n": 49, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "브라운 각서는 주한 미국 대사 브라운과 한국 외무 장관이 체결하였다.", "a": "O", "e": ""}, {"n": 50, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "브라운 각서는 1966년에 체결되었다.", "a": "O", "e": ""}, {"n": 51, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "브라운 각서는 베트남 첫 파병 직전에 체결되었다.", "a": "X", "e": "베트남 ‘추가’ 파병에 따른 미국의 지원 내용이 담긴 각서예요(1966)."}, {"n": 52, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "브라운 각서에서 미국은 파병 비용을 부담하고 한국군의 장비를 현대화한다고 하였다.", "a": "O", "e": ""}, {"n": 53, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "브라운 각서에는 베트남 현지의 각종 사업에 한국을 참여시킨다는 내용이 있다.", "a": "O", "e": ""}, {"n": 54, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "브라운 각서에서 한국은 미국에 군사 원조와 차관을 제공하기로 하였다.", "a": "X", "e": "미국이 한국에 군사 원조와 차관을 제공한다는 내용이에요."}, {"n": 55, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "베트남 파병으로 한국 기업의 해외 진출과 상품 수출이 활발해졌다.", "a": "O", "e": ""}, {"n": 56, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "베트남 파병은 경제 성장을 위한 발판이 되었다.", "a": "O", "e": ""}, {"n": 57, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "베트남 파병 과정에서 고엽제 피해자가 발생하였다.", "a": "O", "e": ""}, {"n": 58, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "베트남 파병으로 한국인 혼혈인(라이따이한) 문제가 남겨졌다.", "a": "O", "e": ""}, {"n": 59, "sec": "Ⅲ. 베트남 전쟁 파병", "q": "베트남 파병 과정에서 베트남 민간인의 희생은 없었다.", "a": "X", "e": "일부 국군에 의해 베트남 민간인이 희생되기도 했어요."}, {"n": 60, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "1968년에는 북한의 도발이 이어지면서 남북 간 긴장이 고조되었다.", "a": "O", "e": ""}, {"n": 61, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "1968년 1월 북한 특수 부대가 청와대 부근까지 침입하였다.", "a": "O", "e": ""}, {"n": 62, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "1968년 미국 첩보함 푸에블로호가 동해에서 북한에 나포되었다.", "a": "O", "e": ""}, {"n": 63, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "1968년 말 무장 공비 120여 명이 울진·삼척 지역에 출몰하였다.", "a": "O", "e": ""}, {"n": 64, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "푸에블로호는 서해에서 북한에 나포되었다.", "a": "X", "e": "동해에서 나포되었어요."}, {"n": 65, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "박정희 정부는 위기 상황을 부각시키며 반공 태세를 강화하였다.", "a": "O", "e": ""}, {"n": 66, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "3선 개헌은 대통령의 3회 연임을 허용하는 개헌이다.", "a": "O", "e": ""}, {"n": 67, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "3선 개헌은 국가 안보와 지속적인 경제 성장을 명분으로 추진되었다.", "a": "O", "e": ""}, {"n": 68, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "3선 개헌은 박정희가 처음 대통령에 당선되기 전에 추진되었다.", "a": "X", "e": "이미 재선에 성공한 뒤(1967) 추진했어요(1969)."}, {"n": 69, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "3선 개헌 반대 운동은 야당 의원과 학생, 시민들에 의해 전국으로 확산되었다.", "a": "O", "e": ""}, {"n": 70, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "여당은 야당 의원들을 따돌리고 국회 별관에서 편법으로 3선 개헌안을 통과시켰다.", "a": "O", "e": ""}, {"n": 71, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "3선 개헌안은 여야 합의로 국회 본회의장에서 통과되었다.", "a": "X", "e": "야당 의원들을 따돌리고 국회 별관에서 편법으로 통과시켰어요."}, {"n": 72, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "3선 개헌은 1969년에 이루어졌다.", "a": "O", "e": ""}, {"n": 73, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "박정희는 제7대 대통령 선거에서 야당 후보 김대중을 힘겹게 누르고 당선되었다.", "a": "O", "e": ""}, {"n": 74, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "제7대 대통령 선거는 1967년에 실시되었다.", "a": "X", "e": "제7대 대통령 선거는 1971년이에요."}, {"n": 75, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "1967년 동백림 사건은 194명이 연루된 대규모 간첩 사건으로 발표되었다.", "a": "O", "e": ""}, {"n": 76, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "중앙정보부는 동베를린을 거점으로 활동하였다며 예술인, 대학교수, 학생 등을 간첩 혐의로 연행하였다.", "a": "O", "e": ""}, {"n": 77, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "동백림 사건 관련자들의 간첩 혐의는 재판에서 모두 입증되었다.", "a": "X", "e": "재판 결과 간첩 혐의는 입증되지 않았어요."}, {"n": 78, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "동백림 사건은 박정희 정부가 불리한 정국을 전환하기 위해 간첩 사건을 확대·과장하는 가운데 일어났다.", "a": "O", "e": ""}, {"n": 79, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "진실·화해를 위한 과거사 정리 위원회는 동백림 사건에 대해 정부의 사과를 권고하였다.", "a": "O", "e": ""}, {"n": 80, "sec": "Ⅳ. 3선 개헌과 장기 집권", "q": "동백림 사건은 3선 개헌과 장기 집권의 초석이 되었다는 평가를 받는다.", "a": "O", "e": ""}, {"n": 81, "sec": "Ⅴ. 유신 체제의 성립", "q": "1969년 닉슨 독트린이 발표된 이후 냉전 체제가 완화되었다.", "a": "O", "e": ""}, {"n": 82, "sec": "Ⅴ. 유신 체제의 성립", "q": "닉슨 독트린 발표 이후 냉전 체제가 심화되었다.", "a": "X", "e": "냉전 체제가 완화되었어요."}, {"n": 83, "sec": "Ⅴ. 유신 체제의 성립", "q": "냉전 완화는 반공을 앞세운 박정희 정부에 불리하게 작용하였다.", "a": "O", "e": ""}, {"n": 84, "sec": "Ⅴ. 유신 체제의 성립", "q": "1970년대 초 경기 호황으로 국민의 불만이 줄어들었다.", "a": "X", "e": "경기 침체로 국민의 불만도 커졌어요."}, {"n": 85, "sec": "Ⅴ. 유신 체제의 성립", "q": "박정희 정부는 1972년 북한과 대화에 나서 7·4 남북 공동 성명을 발표하였다.", "a": "O", "e": ""}, {"n": 86, "sec": "Ⅴ. 유신 체제의 성립", "q": "박정희 정부는 안보 위기와 평화 통일에 대비한다는 구실로 10월 유신을 단행하였다.", "a": "O", "e": ""}, {"n": 87, "sec": "Ⅴ. 유신 체제의 성립", "q": "10월 유신 때 전국에 비상계엄이 선포되고 국회가 해산되었다.", "a": "O", "e": ""}, {"n": 88, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법은 국회에서 제정되었다.", "a": "X", "e": "국회를 해산한 뒤, 비상 국무 회의에서 제정했어요."}, {"n": 89, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법은 비상 국무 회의에서 제정되어 국민 투표로 확정되었다.", "a": "O", "e": ""}, {"n": 90, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법은 국민 투표 없이 확정되었다.", "a": "X", "e": "국민 투표로 확정되었어요."}, {"n": 91, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법은 통일 주체 국민 회의에서 대통령을 선출하도록 하였다.", "a": "O", "e": ""}, {"n": 92, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법에서 대통령은 국민의 직접 선거로 선출되었다.", "a": "X", "e": "통일 주체 국민 회의에서 선출하는 간선제예요."}, {"n": 93, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법에서 대통령의 임기는 6년이었다.", "a": "O", "e": ""}, {"n": 94, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법에서 대통령의 임기는 4년이었다.", "a": "X", "e": "6년이에요. 4년 중임은 5차 개헌(1962)이에요."}, {"n": 95, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법은 대통령의 중임 제한이 없어 박정희의 종신 집권을 가능하게 하였다.", "a": "O", "e": ""}, {"n": 96, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법의 대통령은 국회 의원 3분의 1 추천권을 가졌다.", "a": "O", "e": ""}, {"n": 97, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법의 대통령은 국회 해산권과 법관 임명권을 가졌다.", "a": "O", "e": ""}, {"n": 98, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법은 삼권 분립을 강화하였다.", "a": "X", "e": "삼권 분립을 사실상 무력화했어요."}, {"n": 99, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법은 국민의 기본권마저 제한할 수 있는 긴급 조치권을 대통령에게 주었다.", "a": "O", "e": ""}, {"n": 100, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 체제는 민주 정치의 기본 원리를 무시한 권위주의적 독재 체제였다.", "a": "O", "e": ""}, {"n": 101, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법에 따른 대통령 선거에서 박정희는 99.92%의 득표율로 당선되었다.", "a": "O", "e": ""}, {"n": 102, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법에 따른 대통령 선거는 통일 주체 국민 회의 대의원들이 체육관에 모여 투표하였다.", "a": "O", "e": ""}, {"n": 103, "sec": "Ⅴ. 유신 체제의 성립", "q": "유신 헌법에 따른 첫 대통령 선거에는 여러 명의 후보가 경쟁하였다.", "a": "X", "e": "한 명뿐인 대통령 후보를 두고 투표했어요."}, {"n": 104, "sec": "Ⅴ. 유신 체제의 성립", "q": "긴급 조치 1호는 유신 헌법을 부정·비방하거나 개정·폐지를 요구하는 행위를 금하였다.", "a": "O", "e": ""}, {"n": 105, "sec": "Ⅴ. 유신 체제의 성립", "q": "긴급 조치를 위반한 자는 영장 없이 체포·수색할 수 있었다.", "a": "O", "e": ""}, {"n": 106, "sec": "Ⅴ. 유신 체제의 성립", "q": "긴급 조치 위반자는 일반 법원에서만 재판을 받았다.", "a": "X", "e": "비상 군법 회의에서 심판, 처단한다고 했어요."}, {"n": 107, "sec": "Ⅴ. 유신 체제의 성립", "q": "긴급 조치권은 초헌법적 권한으로 1974년부터 1979년 12월까지 존속하였다.", "a": "O", "e": ""}, {"n": 108, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "유신 반대 운동은 김대중 납치 사건(1973)을 계기로 활발해졌다.", "a": "O", "e": ""}, {"n": 109, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "김대중은 일본에서 유신 체제를 비판하다가 중앙정보부에 의해 국내로 납치되었다.", "a": "O", "e": ""}, {"n": 110, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "김대중은 미국에서 유신 체제를 비판하다가 국내로 납치되었다.", "a": "X", "e": "일본에서 납치되었어요."}, {"n": 111, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "장준하 등 민주 인사들은 개헌 청원 100만 인 서명 운동을 전개하였다.", "a": "O", "e": ""}, {"n": 112, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "개헌 청원 100만 인 서명 운동은 유신 헌법을 지키자는 운동이었다.", "a": "X", "e": "유신 헌법을 고치자는(개헌) 청원 운동이에요."}, {"n": 113, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "장준하가 창간한 잡지 『사상계』는 통일과 민주주의를 주된 내용으로 다루었다.", "a": "O", "e": ""}, {"n": 114, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "학생들은 유신 헌법 철폐를 요구하는 시위를 계속하였다.", "a": "O", "e": ""}, {"n": 115, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "언론계, 종교계, 노동계 등에서도 유신에 반대하는 목소리를 높여 갔다.", "a": "O", "e": ""}, {"n": 116, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "반유신 민주화 운동이 확산되자 박정희 정부는 긴급 조치를 발표하여 억압하였다.", "a": "O", "e": ""}, {"n": 117, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "중앙정보부는 학생 운동 배후에 인민 혁명당이 존재한다며 관련자들을 잡아들였다.", "a": "O", "e": ""}, {"n": 118, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "제2차 인혁당 사건 관련자 중 8명에게 사형이 선고되고 곧바로 집행되었다.", "a": "O", "e": ""}, {"n": 119, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "제2차 인혁당 사건 관련자는 대법원 판결 후 1년 만에 사형당하였다.", "a": "X", "e": "대법원 판결 18시간 만에 사형당했어요."}, {"n": 120, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "국내외 법조인들은 제2차 인혁당 사건을 ‘사법 살인’이라고 비난하였다.", "a": "O", "e": ""}, {"n": 121, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "천주교 신부들은 정의 구현 사제단을 조직하여 유신 체제에 저항하였다.", "a": "O", "e": ""}, {"n": 122, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "유신에 반대하다가 해직된 언론인들은 언론 자유 수호 투쟁을 전개하였다.", "a": "O", "e": ""}, {"n": 123, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "1976년 정치인과 종교 인사들이 명동 성당에 모여 3·1 민주 구국 선언을 발표하였다.", "a": "O", "e": ""}, {"n": 124, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "3·1 민주 구국 선언은 1919년에 발표되었다.", "a": "X", "e": "1976년이에요. 3·1 운동(1919)과 헷갈리지 마세요."}, {"n": 125, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "3·1 민주 구국 선언은 함석헌, 김대중, 윤보선 등이 발표하였다.", "a": "O", "e": ""}, {"n": 126, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "3·1 민주 구국 선언은 긴급 조치의 철폐와 사법권의 독립을 요구하였다.", "a": "O", "e": ""}, {"n": 127, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "3·1 민주 구국 선언은 유신 체제를 지지하는 내용이었다.", "a": "X", "e": "유신 체제를 정면으로 비판했어요."}, {"n": 128, "sec": "Ⅵ. 유신 체제에 저항한 민주화 운동", "q": "민청학련 사건(1974)은 학생들이 민중 봉기를 획책하였다며 180여 명을 구속 기소한 사건이다.", "a": "O", "e": ""}, {"n": 129, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "1978년 국회 의원 선거에서 야당인 신민당의 득표율이 민주 공화당을 앞질렀다.", "a": "O", "e": ""}, {"n": 130, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "1978년 국회 의원 선거에서 민주 공화당의 득표율이 신민당을 크게 앞질렀다.", "a": "X", "e": "야당인 신민당의 득표율이 앞질렀어요."}, {"n": 131, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "국제 사회에서도 유신 독재와 인권 탄압을 비판하였다.", "a": "O", "e": ""}, {"n": 132, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "제2차 석유 파동으로 경제 상황이 어려워졌다.", "a": "O", "e": ""}, {"n": 133, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "YH 무역 사건은 신민당사에서 농성하던 노동자들을 경찰이 강경 진압한 사건이다.", "a": "O", "e": ""}, {"n": 134, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "YH 무역 사건은 회사 측의 일방적인 폐업 조치에 항의하는 과정에서 일어났다.", "a": "O", "e": ""}, {"n": 135, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "YH 무역 사건 진압 과정에서 여성 노동자 한 명이 사망하였다.", "a": "O", "e": ""}, {"n": 136, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "YH 무역 노동자들은 민주 공화당사에서 농성하였다.", "a": "X", "e": "야당인 신민당사에서 농성했어요."}, {"n": 137, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "YH 무역 사건은 범민주 세력의 공동 전선을 형성하는 계기가 되었다.", "a": "O", "e": ""}, {"n": 138, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "여당은 신민당 총재 김영삼을 국회 의원에서 제명하였다.", "a": "O", "e": ""}, {"n": 139, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "김영삼은 YH 무역 사건 이전에 국회 의원에서 제명되었다.", "a": "X", "e": "YH 무역 사건 → 야당 비판 → 김영삼 제명 순서예요."}, {"n": 140, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "김영삼 제명 이후 부산과 마산(창원) 일대에서 부마 민주 항쟁이 일어났다.", "a": "O", "e": ""}, {"n": 141, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "부마 민주 항쟁은 김영삼의 정치적 근거지인 부산과 마산에서 일어났다.", "a": "O", "e": ""}, {"n": 142, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "부마 민주 항쟁은 광주와 목포 일대에서 일어났다.", "a": "X", "e": "부산과 마산(창원) 일대에서 일어났어요."}, {"n": 143, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "1979년 10월 15일 부산대학교 교정에 「민주 투쟁 선언문」이 뿌려졌다.", "a": "O", "e": ""}, {"n": 144, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "부마 민주 항쟁의 시위대는 ‘유신 철폐’와 ‘독재 타도’를 구호로 내세웠다.", "a": "O", "e": ""}, {"n": 145, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "박정희 정부는 부산 일대에 계엄령을 선포하고 군대를 동원하였다.", "a": "O", "e": ""}, {"n": 146, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "부마 민주 항쟁은 계엄령 선포로 부산에서 곧바로 진압되어 다른 지역으로 확산되지 않았다.", "a": "X", "e": "마산의 공단 지역 등 주변 지역으로 확산되었어요."}, {"n": 147, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "대통령 박정희가 중앙정보부장 김재규에게 피살된 사건을 10·26 사태라고 한다.", "a": "O", "e": ""}, {"n": 148, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "10·26 사태로 유신 체제는 사실상 붕괴되었다.", "a": "O", "e": ""}, {"n": 149, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "부마 민주 항쟁은 이후 5·18 민주화 운동으로 이어졌다.", "a": "O", "e": ""}, {"n": 150, "sec": "Ⅶ. 유신 체제의 붕괴", "q": "10·26 사태는 부마 민주 항쟁보다 먼저 일어났다.", "a": "X", "e": "부마 민주 항쟁(1979. 10.)이 일어난 뒤 정권 내부 갈등으로 10·26 사태가 일어났어요."}, {"n": 151, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "10·26 사태로 비상계엄이 선포된 가운데 국무총리 최규하가 대통령에 선출되었다.", "a": "O", "e": ""}, {"n": 152, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "최규하는 국민의 직접 선거로 대통령에 선출되었다.", "a": "X", "e": "통일 주체 국민 회의를 통해 선출되었어요."}, {"n": 153, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "전두환이 이끄는 일부 군인이 반란을 일으켜 군사권을 장악한 사건을 12·12 사태라고 한다.", "a": "O", "e": ""}, {"n": 154, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "12·12 사태는 1980년에 일어났다.", "a": "X", "e": "12·12 사태는 1979년이에요."}, {"n": 155, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "신군부는 주요 정부 기관과 언론을 장악하고 정치에 개입하였다.", "a": "O", "e": ""}, {"n": 156, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "신군부는 12·12 사태를 통해 권력을 장악한 전두환·노태우 등의 군인을 말한다.", "a": "O", "e": ""}, {"n": 157, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "신군부는 5·16 군사 정변으로 권력을 잡은 박정희·김종필 등을 말한다.", "a": "X", "e": "그들은 군부의 1세대예요. 신군부는 12·12 사태의 전두환·노태우 등이에요."}, {"n": 158, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "대학가를 중심으로 계엄 철폐와 유신 헌법 개정 등을 요구하는 시위가 벌어졌다.", "a": "O", "e": ""}, {"n": 159, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "민주화 시위는 1980년 5월에 절정에 달하였는데, 이 시기를 서울의 봄이라고 한다.", "a": "O", "e": ""}, {"n": 160, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "서울의 봄은 1968년 체코슬로바키아의 ‘프라하의 봄’에 비유한 것이다.", "a": "O", "e": ""}, {"n": 161, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "10·26 사태 직후 긴급 조치 9호가 해제되고 일부 민주 인사가 석방되었다.", "a": "O", "e": ""}, {"n": 162, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "학생들은 서울역 앞에서 대규모 집회를 열고 비상계엄 해제와 신군부 퇴진을 요구하였다.", "a": "O", "e": ""}, {"n": 163, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "서울역 시위 지도부는 신군부 퇴진이 이루어질 때까지 시위를 계속하였다.", "a": "X", "e": "신군부가 정치에 개입할 빌미를 주지 않기 위해 시위를 중단했어요."}, {"n": 164, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "신군부는 5월 17일에 비상계엄을 전국으로 확대하였다.", "a": "O", "e": ""}, {"n": 165, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "신군부는 김대중을 비롯한 야권 정치인과 민주 인사, 학생 대표 등을 체포하였다.", "a": "O", "e": ""}, {"n": 166, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "신군부는 집회와 시위를 비롯한 모든 정치 활동을 금지하였다.", "a": "O", "e": ""}, {"n": 167, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "신군부는 언론과 출판에 대한 검열을 완화하였다.", "a": "X", "e": "검열을 강화하고 각 대학에 휴교령을 내렸어요."}, {"n": 168, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "q": "신군부는 각 대학에 휴교령을 내렸다.", "a": "O", "e": ""}, {"n": 169, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "1980년 5월 18일 광주에 계엄군으로 투입된 공수 부대원들이 등교하는 대학생들을 구타하였다.", "a": "O", "e": ""}, {"n": 170, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "광주의 학생들은 계엄 철폐와 신군부 퇴진을 요구하는 시위를 벌였다.", "a": "O", "e": ""}, {"n": 171, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "계엄군은 시위대를 향해 발포하여 수많은 사상자가 발생하였다.", "a": "O", "e": ""}, {"n": 172, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "일부 시민은 계엄군의 폭력적 진압에 항의하며 무기를 탈취하여 시민군을 조직하였다.", "a": "O", "e": ""}, {"n": 173, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "시민군이 조직되자 계엄군은 시내에서 철수하고 광주 외곽을 봉쇄하였다.", "a": "O", "e": ""}, {"n": 174, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "계엄군은 광주 외곽을 봉쇄한 뒤 언론을 통해 시민군의 활동을 정확히 보도하였다.", "a": "X", "e": "시민군을 폭도로 매도하고 언론을 통제했어요."}, {"n": 175, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "광주 시민은 시민 수습 대책 위원회를 구성하여 정부와 평화 협상을 시도하였다.", "a": "O", "e": ""}, {"n": 176, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5월 27일 새벽 계엄군은 헬기와 탱크를 앞세워 전남 도청의 시민군을 무력으로 진압하였다.", "a": "O", "e": ""}, {"n": 177, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "계엄군은 5월 27일 서울시청에서 끝까지 항전하던 시민군을 진압하였다.", "a": "X", "e": "전남 도청에서 항전하던 시민군을 진압했어요."}, {"n": 178, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "광주 시민 궐기문(1980. 5. 25.)에는 협상이 올바르게 진행되면 즉각 총을 놓겠다는 내용이 있다.", "a": "O", "e": ""}, {"n": 179, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5월 21일부터 27일 새벽까지 광주는 고립되었지만 시민들은 스스로 치안과 질서를 유지하였다.", "a": "O", "e": ""}, {"n": 180, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "고립된 광주에서 시민들은 주먹밥을 나누고 헌혈에 나섰다.", "a": "O", "e": ""}, {"n": 181, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5·18 민주화 운동은 신군부의 불법적 정권 탈취와 국가 폭력에 맞선 민주화 운동이었다.", "a": "O", "e": ""}, {"n": 182, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5·18 민주화 운동은 6월 민주 항쟁 등 1980년대 민주화 운동의 토대가 되었다.", "a": "O", "e": ""}, {"n": 183, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5·18 민주화 운동은 필리핀 등 아시아 여러 나라의 민주화 운동에 영향을 주었다.", "a": "O", "e": ""}, {"n": 184, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "일부 대학생은 신군부의 병력 동원이 미국의 묵인 아래 이루어졌다고 판단하였다.", "a": "O", "e": ""}, {"n": 185, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5·18 민주화 운동 이후 일부 대학생을 중심으로 반미 운동이 격화되었다.", "a": "O", "e": ""}, {"n": 186, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5·18 민주화 운동 이후 반일 운동이 격화되었다.", "a": "X", "e": "국군 작전 통제권을 가진 미국의 묵인을 의심하며 반미 운동이 격화되었어요."}, {"n": 187, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "당시 신문과 방송은 광주의 상황을 사실대로 보도하였다.", "a": "X", "e": "광주 시민은 폭도로, 시위는 불순 세력의 난동이라고 보도되었어요."}, {"n": 188, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5·18 민주화 운동 기록물은 2011년 유네스코 세계 기록 유산으로 등재되었다.", "a": "O", "e": ""}, {"n": 189, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "전두환과 노태우는 12·12 사태 및 5·17 내란 등의 혐의로 1996년 구속 기소되었다.", "a": "O", "e": ""}, {"n": 190, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "대법원은 전두환에게 무기 징역, 노태우에게 징역 17년을 선고하였다.", "a": "O", "e": ""}, {"n": 191, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "대법원은 전두환에게 사형, 노태우에게 무기 징역을 확정하였다.", "a": "X", "e": "대법원은 전두환에게 무기 징역, 노태우에게 징역 17년을 선고했어요."}, {"n": 192, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "대법원은 광주 시민의 시위가 헌법 질서를 수호하기 위한 정당한 행위였다고 명시하였다.", "a": "O", "e": ""}, {"n": 193, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "5·18 민주화 운동 등에 관한 특별법은 1995년에 제정되었다.", "a": "O", "e": ""}, {"n": 194, "sec": "Ⅸ. 5·18 민주화 운동과 그 의미", "q": "국가는 5·18 민주화 운동 기념일을 제정하여 그 정신을 계승하고 있다.", "a": "O", "e": ""}],MCD=[{"n": 1, "sec": "Ⅰ. 군사 정부의 등장", "hard": false, "typ": "사료 제시 · 단일 선택형", "kind": "mc", "stem": "다음 공약을 발표한 세력에 대한 설명으로 옳은 것은? <small>[2.8점]<\/small>", "body": "<div class=\"box\">1. 반공을 국시의 제일의(義)로 삼는다.<br>4. 국가 자주 경제 재건에 총력을 기울인다.<br>6. 과업이 성취되면 양심적인 정치인들에게 정권을 이양한다.<div class=\"src\">- 혁명 공약, 1961 -<\/div><\/div>", "bogi": [], "ch": ["통일 주체 국민 회의를 설치하여 입법·사법·행정권을 장악하였다.", "국가 재건 최고 회의를 설치하고 언론을 탄압하였다.", "통일 운동을 적극 지원하며 혁신 세력과 협력하였다.", "1962년 의원 내각제로 헌법을 개정하였다.", "약속대로 정치인에게 정권을 넘기고 군대로 었다.", "신민당 총재 김영삼이 국회 의원에서 제명되었다.", "대통령 박정희가 중앙정보부장 김재규에게 피살되었다."], "a": 4, "ans": "", "con": [["유신 체제의 붕괴 (93쪽)", ["1978년 총선 야당 <b class=\"k\">신민당<\/b> 득표율이 민주 공화당 앞섬", "국제 사회의 인권 탄압 비판, <b class=\"k\">제2차 석유 파동<\/b>으로 경제 악화", "<b class=\"k\">YH 무역 사건<\/b>(1979): 신민당사 농성 노동자 강경 진압, 여성 노동자 사망", "신민당 총재 <b class=\"k\">김영삼<\/b> 의원 제명 → <b class=\"k\">부마 민주 항쟁<\/b>(부산·마산)", "<b class=\"k\">10·26 사태<\/b>: 중앙정보부장 김재규가 박정희 피살 → 유신 붕괴"]], ["신군부와 서울의 봄 (94쪽)", ["10·26 → 비상계엄, <b class=\"k\">최규하<\/b> 대통령(통일 주체 국민 회의)", "<b class=\"k\">12·12 사태<\/b>(1979): 전두환 등 반란 → 군사권 장악", "<b class=\"k\">서울의 봄<\/b>(1980. 5. 절정): 계엄 철폐, 유신 헌법 개정 요구, ‘프라하의 봄’ 비유", "서울역 집회 → 지도부가 빌미를 주지 않으려 시위 <b class=\"k\">중단<\/b>", "<b class=\"k\">5. 17.<\/b> 비상계엄 전국 확대 → 김대중 등 체포, 정치 활동 금지, 검열 강화, 휴교령"]]], "core": "이 사건 = <b class=\"k\">10·26 사태<\/b>(1979), 김재규가 박정희 피살", "intro": "유신 체제를 사실상 끝낸 사건은 10·26 사태예요.", "fig": "", "ex": [["①", 0, "<b class=\"k\">12·12 사태<\/b>예요."], ["②", 0, "국회 해산·유신 헌법 제정은 <b class=\"k\">1972년<\/b>이에요."], ["③", 0, "10·26 직후 긴급 조치 9호는 <b class=\"k\">해제<\/b>되었어요."], ["④", 0, "김영삼 제명은 10·26 <b class=\"k\">이전<\/b>이에요."], ["⑤", 1, "중앙정보부장 <b class=\"k\">김재규<\/b>가 박정희를 피살했어요."]], "concl": "따라서 정답은 ⑤번이에요."}, {"n": 28, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "hard": false, "typ": "자료 제시 · 단일 선택형", "kind": "mc", "stem": "밑줄 친 ‘이 시기’에 대한 설명으로 옳은 것은? <small>[2.9점]<\/small>", "body": "<div class=\"box\">10·26 사태 직후 긴급 조치 9호가 해제되고 일부 민주 인사가 석방되면서 유신 철폐와 민주화를 요구하는 학생들의 시위가 확대되었다. 특히 1980년 5월에 시위는 절정에 달하였는데, <u>이 시기<\/u>를 흔히 ○○의 봄이라고 부른다.<\/div>", "bogi": [], "ch": ["5월 18일 광주에서 시작되었다.", "1968년 체코슬로바키아의 ‘프라하의 봄’에 비유한 명칭이다.", "학생들은 유신 헌법을 지킬 것을 요구하였다.", "시위 지도부는 신군부가 퇴진할 때까지 시위를 이어 갔다.", "민주화 요구로 5월 17일 비상계엄이 해제되었다."], "a": 1, "ans": "", "con": [["신군부와 서울의 봄 (94쪽)", ["10·26 → 비상계엄, <b class=\"k\">최규하<\/b> 대통령(통일 주체 국민 회의)", "<b class=\"k\">12·12 사태<\/b>(1979): 전두환 등 반란 → 군사권 장악", "<b class=\"k\">서울의 봄<\/b>(1980. 5. 절정): 계엄 철폐, 유신 헌법 개정 요구, ‘프라하의 봄’ 비유", "서울역 집회 → 지도부가 빌미를 주지 않으려 시위 <b class=\"k\">중단<\/b>", "<b class=\"k\">5. 17.<\/b> 비상계엄 전국 확대 → 김대중 등 체포, 정치 활동 금지, 검열 강화, 휴교령"]]], "core": "서울의 봄 = <b class=\"k\">프라하의 봄<\/b> 비유, 1980. 5. 절정", "intro": "교과서 94쪽 날개 ‘*서울의 봄’ 설명과 멀티미디어 자료예요.", "fig": "", "ex": [["①", 0, "5·18은 서울의 봄 <b class=\"k\">이후<\/b> 광주의 민주화 운동이에요."], ["②", 1, "<b class=\"k\">프라하의 봄<\/b>에 비유했어요."], ["③", 0, "<b class=\"k\">유신 헌법 개정<\/b>을 요구했어요."], ["④", 0, "빌미를 주지 않으려고 시위를 <b class=\"k\">중단<\/b>했어요."], ["⑤", 0, "5월 17일 비상계엄이 <b class=\"k\">전국으로 확대<\/b>되었어요."]], "concl": "따라서 정답은 ②번이에요."}, {"n": 29, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "hard": false, "typ": "밑줄 오류 찾기형", "kind": "mc", "stem": "다음 글의 밑줄 친 ㉠~㉤ 중 옳지 않은 것은? <small>[2.9점]<\/small>", "body": "<div class=\"box\">10·26 사태로 비상계엄이 선포된 가운데 <u>㉠국무총리 최규하가 통일 주체 국민 회의를 통해 대통령에 선출<\/u>되었다. 그러나 <u>㉡전두환이 이끄는 일부 군인<\/u>이 반란을 일으켜 군사권을 장악하였다. 신군부 세력은 <u>㉢5월 17일에 비상계엄을 전국으로 확대<\/u>하고, <u>㉣김대중을 비롯한 야권 정치인<\/u>과 민주 인사, 학생 대표 등을 체포하였다. 그리고 <u>㉤언론과 출판에 대한 검열을 폐지<\/u>하고 각 대학에는 휴교령을 내렸다.<\/div>", "bogi": [], "ch": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 4, "ans": "", "con": [["신군부와 서울의 봄 (94쪽)", ["10·26 → 비상계엄, <b class=\"k\">최규하<\/b> 대통령(통일 주체 국민 회의)", "<b class=\"k\">12·12 사태<\/b>(1979): 전두환 등 반란 → 군사권 장악", "<b class=\"k\">서울의 봄<\/b>(1980. 5. 절정): 계엄 철폐, 유신 헌법 개정 요구, ‘프라하의 봄’ 비유", "서울역 집회 → 지도부가 빌미를 주지 않으려 시위 <b class=\"k\">중단<\/b>", "<b class=\"k\">5. 17.<\/b> 비상계엄 전국 확대 → 김대중 등 체포, 정치 활동 금지, 검열 강화, 휴교령"]]], "core": "5·17 조치 = 계엄 전국 확대 + 체포 + 정치 활동 금지 + <b class=\"k\">검열 강화<\/b> + 휴교령", "intro": "교과서 94쪽 본문을 옮기고 한 군데만 바꾸었어요.", "fig": "", "ex": [["①", 1, "<b class=\"k\">통일 주체 국민 회의<\/b>를 통해 선출되었어요."], ["②", 1, "<b class=\"k\">전두환<\/b>이 이끌었어요(12·12)."], ["③", 1, "<b class=\"k\">5월 17일<\/b>이 맞아요."], ["④", 1, "<b class=\"k\">김대중<\/b> 등을 체포했어요."], ["⑤", 0, "검열을 <b class=\"k\">강화<\/b>했어요."]], "concl": "따라서 옳지 않은 것은 ⑤번이에요."}, {"n": 30, "sec": "Ⅷ. 신군부의 정권 장악과 서울의 봄", "hard": false, "typ": "사진 자료 · <보기> 조합형", "kind": "mc", "stem": "다음 설명에 해당하는 세력에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 고른 것은? <small>[3.0점]<\/small>", "body": "<div class=\"box\">12·12 사태를 일으킨 세력이다. 사진 앞줄 왼쪽에서 네 번째가 노태우, 다섯 번째가 전두환이다.<\/div>", "bogi": ["반란을 일으켜 군사권을 장악하였다.", "5·16 군사 정변을 주도한 군부의 1세대이다.", "주요 정부 기관과 언론을 장악하고 정치에 개입하였다.", "이 세력의 핵심 인물들은 1996년 12·12 사태 및 5·17 내란 등의 혐의로 구속 기소되었다."], "ch": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "a": 4, "ans": "", "con": [["신군부와 서울의 봄 (94쪽)", ["10·26 → 비상계엄, <b class=\"k\">최규하<\/b> 대통령(통일 주체 국민 회의)", "<b class=\"k\">12·12 사태<\/b>(1979): 전두환 등 반란 → 군사권 장악", "<b class=\"k\">서울의 봄<\/b>(1980. 5. 절정): 계엄 철폐, 유신 헌법 개정 요구, ‘프라하의 봄’ 비유", "서울역 집회 → 지도부가 빌미를 주지 않으려 시위 <b class=\"k\">중단<\/b>", "<b class=\"k\">5. 17.<\/b> 비상계엄 전국 확대 → 김대중 등 체포, 정치 활동 금지, 검열 강화, 휴교령"]], ["5·18의 의미와 계승 (95~96쪽)", ["신군부의 불법적 정권 탈취·국가 폭력에 맞선 민주화 운동", "<b class=\"k\">6월 민주 항쟁<\/b> 등 1980년대 민주화 운동의 토대, <b class=\"k\">필리핀<\/b> 등 아시아에 영향", "미국의 묵인 판단 → <b class=\"k\">반미 운동<\/b> 격화", "1996년 전두환·노태우 구속 기소 → 대법원(1997) <b class=\"k\">무기 징역<\/b>·<b class=\"k\">징역 17년<\/b>", "판결: 광주 시민의 시위 = <b class=\"k\">헌법 질서 수호<\/b>를 위한 정당한 행위", "1995년 <b class=\"k\">특별법<\/b>, 기념일 제정, 2011년 <b class=\"k\">유네스코 세계 기록 유산<\/b>"]]], "core": "신군부 = 12·12 사태의 <b class=\"k\">전두환·노태우<\/b> 등 (1세대 = 5·16의 박정희·김종필)", "intro": "교과서 94쪽 사진 설명과 날개 ‘신군부’ 설명이에요.", "fig": "", "ex": [["ㄱ", 1, "<b class=\"k\">군사권<\/b>을 장악했어요."], ["ㄴ", 0, "5·16 세력은 <b class=\"k\">군부 1세대<\/b>, 이들은 신군부예요."], ["ㄷ", 1, "정부 기관과 <b class=\"k\">언론<\/b>을 장악했어요."], ["ㄹ", 1, "<b class=\"k\">1996년<\/b> 구속 기소되었어요(96쪽)."]], "concl": "옳은 것은 ㄱ, ㄷ, ㄹ → ⑤번이에요."}, {"n": 31, "sec": "Ⅸ. 5·18 민주화 운동", "hard": false, "typ": "사료 제시 · 단일 선택형", "kind": "mc", "stem": "다음 글이 발표된 민주화 운동에 대한 설명으로 옳은 것은? <small>[2.9점]<\/small>", "body": "<div class=\"box\">우리는 왜 총을 들 수밖에 없었는가. …… 계엄 당국은 18일 오후부터 공수 부대를 대량 투입하여 시내 곳곳에서 학생, 젊은이들에게 무차별 살상을 자행하였으니! …… 협상이 올바른 방향으로 진행되면 즉각 총을 놓겠습니다.<div class=\"src\">- 광주 시민 궐기문, 1980. 5. 25. -<\/div><\/div>", "bogi": [], "ch": ["부산과 마산 일대에서 전개되었다.", "당시 언론은 광주의 상황을 사실대로 보도하였다.", "광주 시민은 시민 수습 대책 위원회를 구성하여 평화 협상을 시도하였다.", "계엄군은 시내에서 철수한 뒤 다시 진입하지 않았다.", "3선 개헌 반대를 주된 목표로 const ansTxt=d=>Array.isArray(d.a)?d.a.map(i=>MK[i]).join(', ')+'번':MK[d.a]+'번';
let sel=[];
function rMC(card,act,total){const d=list[pos];const done=picked!==null;const multi=Array.isArray(d.a);
 let h='<div class="meta"><span class="no">'+d.n+'<em>번</em></span><span class="tag">'+(d.hard?'<span class="hardtag">고난도</span>':'')+esc(d.typ)+'</span></div><p class="stem">'+d.stem+'</p>'+(d.body?'<div class="mb tw">'+d.body+'</div>':'');
 if(d.bogi.length)h+='<div class="bg">'+d.bogi.map((s,i)=>'<div><b>'+LB[i]+'.</b> '+s+'</div>').join('')+'</div>';
 if(d.kind!=='mc'){
  if(!done){h+='<div class="saans">'+(d.kind==='sa'?'답을 공책에 쓴 뒤 정답을 확인하세요.':'서술형 답안을 공책에 쓴 뒤 모범 답안을 확인하세요.')+'</div>';act.innerHTML='<button class="next" id="reveal">정답 확인하기</button>';card.innerHTML=h;
   $('reveal').onclick=()=>{picked='r';render()};return}
  if(picked==='r'){h+=panel(d,true);act.innerHTML='<div class="selfg"><button style="background:var(--o)" id="sgO">맞혔어요</button><button style="background:var(--x)" id="sgX">틀렸어요</button></div>';card.innerHTML=h;
   $('sgO').onclick=()=>{picked=null;answer('ok')};$('sgX').onclick=()=>{picked=null;answer('no')};return}
  h+=panel(d,picked==='ok');card.innerHTML=h;nextBtn(act,total);return}
 const g=d.ch.every(c=>c.length<=4)?'g5':d.ch.every(c=>c.length<=9)?'g3':'';
 const P=Array.isArray(picked)?picked:[picked];
 h+=(multi&&!done?'<p class="saans" style="padding:8px 12px;font-size:13.5px">두 개를 고르세요. ('+sel.length+'/2)</p>':'')+'<div class="chs '+g+'">'+d.ch.map((c,i)=>{let k='';if(done){const R=multi?d.a:[d.a];if(R.includes(i))k='right';else if(P.includes(i))k='bad'}else if(sel.includes(i))k='sel';return '<button data-i="'+i+'" class="'+k+'"'+(done?' disabled':'')+'>'+MK[i]+' '+c+'</button>'}).join('')+'</div>';
 if(done){const ok=multi?(P.length===2&&d.a.every(x=>P.includes(x))):picked===d.a;h+=panel(d,ok);nextBtn(act,total)}else act.innerHTML='';
 card.innerHTML=h;if(!done)card.querySelectorAll('.chs button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
  if(!multi){answer(i);return}
  if(sel.includes(i))sel=sel.filter(x=>x!==i);else sel.push(i);
  if(sel.length===2){const v=sel.slice();sel=[];answer(v)}else render()})}
function answer(k){const d=list[pos];picked=k;tried++;let ok;
 if(mode==='ox')ok=k===d.a;else if(d.kind!=='mc')ok=k==='ok';else if(Array.isArray(d.a))ok=k.length===2&&d.a.every(x=>k.includes(x));else ok=k===d.a;
 if(ok){right++;if(wrongOnly)delete W()[d.n]}else W()[d.n]=1;save();render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));wrongOnly=false;$('wrong').setAttribute('aria-pressed','false');secs();build()});
$('sec').onchange=e=>{section=e.target.value;build()};
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);build()};
$('wrong').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);build()};
$('prev').onclick=()=>{if(pos>0){pos--;picked=null;sel=[];render();window.scrollTo({top:0})}};
let armed=false;$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}st={wrong:{ox:{},mc:{}}};save();armed=false;t.textContent='기록 초기화';wrongOnly=false;$('wrong').setAttribute('aria-pressed','false');build()};
document.addEventListener('keydown',e=>{if(/SELECT|INPUT/.test(e.target.tagName))return;if(mode==='ox'&&picked===null&&/^[oO]$/.test(e.key))answer('O');else if(mode==='ox'&&picked===null&&/^[xX]$/.test(e.key))answer('X');else if(picked!==null&&(e.key==='Enter'||e.key==='ArrowRight')){e.preventDefault();$('nx')&&$('nx').click()}});
secs();build();
</script>
<script>
(function(){
const H=1418297543,K='hanyoung-hist2-w5-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
