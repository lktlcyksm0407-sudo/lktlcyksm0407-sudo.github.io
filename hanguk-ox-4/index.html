<style>
/* Layout: navy masthead band with controls; white question card overlaps it; big round O/X paddles below */
:root{
  --band:#1C2747; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.14);

:root[data-theme="dark"]{

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}

.next{width:100%;font:inherit;font-size:18px;font-weight:700;cursor:pointer;border:none;border-radius:20px;min-height:66px;background:var(--band);color:#fff;box-shadow:var(--shadow)}

button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1}
.done .big{font-family:var(--display);font-size:54px;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}

.done .chip{background:var(--band);color:#fff}
footer{font-size:12px;color:var(--muted);text-align:center}
.gate{position:fixed;inset:0;background:var(--band);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}

.gate .badge{width:56px;height:56px;font-size:24px;background:var(--bg);box-shadow:none}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.gate input{font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.gate input:focus{border-color:var(--o);outline:none}
.gate button{font:inherit;font-size:17px;font-weight:700;padding:15px;border-radius:14px;border:none;background:var(--o);color:#fff;cursor:pointer}
.gate .err{color:var(--x);font-size:13px;min-height:1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

하다", "q": "대통령 직선제 개헌안은 충분한 토론을 거쳐 비밀 투표로 통과되었다.", "a": "X", "e": "토론 없이 기립 투표로 통과되었어요."}, {"n": 19, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "발췌 개헌은 1952년에 이루어진 2차 개헌이다.", "a": "X", "e": "발췌 개헌은 1차 개헌이에요. 2차 개헌은 사사오입 개헌이에요."}, {"n": 20, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "발췌 개헌은 자유당의 대통령 직선제안과 민주 국민당의 양원제 및 내각 책임제안을 절충한 것이다.", "a": "O", "e": ""}, {"n": 21, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "발췌 개헌에서 자유당은 양원제 및 내각 책임제안을, 민주 국민당은 대통령 직선제안을 내놓았다.", "a": "X", "e": "거꾸로예요. 자유당이 대통령 직선제안, 민주 국민당이 양원제 및 내각 책임제안이에요."}, {"n": 22, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "이승만은 발췌 개헌이 이루어진 그해 다시 대통령에 당선되었다.", "a": "O", "e": ""}, {"n": 23, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "발췌 개헌안 제53조는 대통령과 부통령을 국민의 보통·평등·직접·비밀 투표로 선거한다고 규정하였다.", "a": "O", "e": ""}, {"n": 24, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "발췌 개헌안 제31조는 국회를 민의원과 참의원으로 구성한다고 규정하였다.", "a": "O", "e": ""}, {"n": 25, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "발췌 개헌 직후 민의원과 참의원의 양원제 국회가 실제로 구성되었다.", "a": "X", "e": "헌법에 명시만 되었고, 실제 양원제 국회는 3차 개헌 이후에 구성되었어요."}, {"n": 26, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "발췌 개헌은 6·25 전쟁이 끝난 뒤에 이루어졌다.", "a": "X", "e": "1952년, 전쟁 중에 이루어졌어요."}, {"n": 27, "sec": "전쟁 중에 직선제 개헌을 하다", "q": "국민 방위군 사건은 자유당 창당보다 먼저 일어났다.", "a": "O", "e": ""}, {"n": 28, "sec": "장기 집권을 위해 개헌하다", "q": "1954년 5월 제3대 국회 의원 선거에서 자유당이 압승하였다.", "a": "O", "e": ""}, {"n": 29, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌 전에는 대통령이 1차 중임, 즉 2번까지만 할 수 있었다.", "a": "O", "e": ""}, {"n": 30, "sec": "장기 집권을 위해 개헌하다", "q": "자유당은 당시 대통령인 이승만에 한해 중임 제한 규정을 적용하지 않는다는 개헌안을 발의하였다.", "a": "O", "e": ""}, {"n": 31, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌은 모든 대통령의 중임 제한을 폐지하는 내용이다.", "a": "X", "e": "당시 대통령인 이승만에 한해 중임 제한을 적용하지 않는 내용이에요."}, {"n": 32, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌의 핵심 내용은 대통령 직선제이다.", "a": "X", "e": "대통령 직선제는 발췌 개헌의 핵심이에요."}, {"n": 33, "sec": "장기 집권을 위해 개헌하다", "q": "당시 국회 재적 의원은 203명이었다.", "a": "O", "e": ""}, {"n": 34, "sec": "장기 집권을 위해 개헌하다", "q": "개헌에 필요한 찬성은 재적 의원의 3분의 2를 넘는 136명이었다.", "a": "O", "e": ""}, {"n": 35, "sec": "장기 집권을 위해 개헌하다", "q": "당시 개헌에 필요한 찬성은 135명이었다.", "a": "X", "e": "135.333…명을 넘어야 하므로 136명이에요."}, {"n": 36, "sec": "장기 집권을 위해 개헌하다", "q": "개헌안 표결 결과 찬성은 136표였다.", "a": "X", "e": "찬성은 135표였어요. 136명은 개헌에 필요한 찬성 수예요."}, {"n": 37, "sec": "장기 집권을 위해 개헌하다", "q": "표결 결과 정족수에 1명이 모자라 개헌안은 부결되었다.", "a": "O", "e": ""}, {"n": 38, "sec": "장기 집권을 위해 개헌하다", "q": "개헌안은 표결 당일 곧바로 통과가 선포되었다.", "a": "X", "e": "일단 부결되었고, 이틀 후 통과가 선포되었어요."}, {"n": 39, "sec": "장기 집권을 위해 개헌하다", "q": "이틀 후 국회 의장은 사사오입의 논리를 적용하여 개헌안이 통과되었다고 선포하였다.", "a": "O", "e": ""}, {"n": 40, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입은 반올림을 뜻한다.", "a": "O", "e": ""}, {"n": 41, "sec": "장기 집권을 위해 개헌하다", "q": "자유당은 135.333…명을 올림하여 136명으로 보아야 한다고 주장하였다.", "a": "X", "e": "자유당은 반올림하면 135명이라며 찬성 135표로 통과되었다고 주장했어요."}, {"n": 42, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌안이 통과되자 야당 국회 의원들이 항의하였다.", "a": "O", "e": ""}, {"n": 43, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌은 2차 개헌이다.", "a": "O", "e": ""}, {"n": 44, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌은 1952년에 이루어졌다.", "a": "X", "e": "1954년에 이루어졌어요. 1952년은 발췌 개헌이에요."}, {"n": 45, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌으로 이승만은 횟수의 제한 없이 대통령에 출마할 수 있게 되었다.", "a": "O", "e": ""}, {"n": 46, "sec": "장기 집권을 위해 개헌하다", "q": "법과 절차를 무시한 개헌이 계속되면서 민주주의는 크게 훼손되었다.", "a": "O", "e": ""}, {"n": 47, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌 이후 이승만 정부에 대한 국민의 신뢰가 높아졌다.", "a": "X", "e": "국민의 불신과 불만이 더욱 커졌어요."}, {"n": 48, "sec": "장기 집권을 위해 개헌하다", "q": "야당 세력은 민주당을 창당하여 이승만 정부와 자유당에 맞섰다.", "a": "O", "e": ""}, {"n": 49, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌안 제55조 1항은 대통령과 부통령의 임기를 4년으로 규정하였다.", "a": "O", "e": ""}, {"n": 50, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌안은 대통령과 부통령의 임기를 6년으로 규정하였다.", "a": "X", "e": "임기는 4년이에요."}, {"n": 51, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌안에는 대통령이 궐위되면 부통령이 대통령이 되고 잔임 기간 중 재임한다는 내용이 있다.", "a": "O", "e": ""}, {"n": 52, "sec": "장기 집권을 위해 개헌하다", "q": "사사오입 개헌안 부칙은 공포 당시의 대통령에게 제55조 1항 단서의 제한을 적용하지 않는다고 규정하였다.", "a": "O", "e": ""}, {"n": 53, "sec": "반공 체제를 강화하다", "q": "1956년 선거는 제3대 대통령 선거이면서 제4대 부통령 선거였다.", "a": "O", "e": ""}, {"n": 54, "sec": "반공 체제를 강화하다", "q": "1956년 대통령 선거에 자유당의 이승만, 민주당의 신익희, 무소속의 조봉암이 출마하였다.", "a": "O", "e": ""}, {"n": 55, "sec": "반공 체제를 강화하다", "q": "1956년 대통령 선거에서 조봉암은 자유당 후보로 출마하였다.", "a": "X", "e": "조봉암은 진보 성향의 무소속 후보였어요."}, {"n": 56, "sec": "반공 체제를 강화하다", "q": "민주당의 신익희 후보는 선거 기간 중 갑작스럽게 사망하였다.", "a": "O", "e": ""}, {"n": 57, "sec": "반공 체제를 강화하다", "q": "1956년 대통령 선거 기간 중 조봉암 후보가 갑작스럽게 사망하였다.", "a": "X", "e": "선거 기간 중 사망한 후보는 신익희예요."}, {"n": 58, "sec": "반공 체제를 강화하다", "q": "진보 성향의 조봉암은 유효 표의 30%가량을 얻으며 돌풍을 일으켰다.", "a": "O", "e": ""}, {"n": 59, "sec": "반공 체제를 강화하다", "q": "1956년 부통령에는 민주당의 장면이 당선되었다.", "a": "O", "e": ""}, {"n": 60, "sec": "반공 체제를 강화하다", "q": "1956년 부통령에는 자유당의 이기붕이 당선되었다.", "a": "X", "e": "민주당의 장면이 자유당의 이기붕을 누르고 당선되었어요."}, {"n": 61, "sec": "반공 체제를 강화하다", "q": "장면의 부통령 당선으로 자유당 정부의 위기 의식이 높아졌다.", "a": "O", "e": ""}, {"n": 62, "sec": "반공 체제를 강화하다", "q": "제3대 대통령 선거에서 민주당은 “못살겠다 갈아 보자.”라는 구호를 내세웠다.", "a": "O", "e": ""}, {"n": 63, "sec": "반공 체제를 강화하다", "q": "제3대 대통령 선거에서 민주당은 “갈아 봤자 더 못산다.”라는 구호로 대응하였다.", "a": "X", "e": "“갈아 봤자 더 못산다.”는 여당인 자유당의 구호예요."}, {"n": 64, "sec": "반공 체제를 강화하다", "q": "조봉암은 평화 통일 등을 내세우며 진보당을 창당하였다.", "a": "O", "e": ""}, {"n": 65, "sec": "반공 체제를 강화하다", "q": "조봉암은 북진 통일을 내세우며 진보당을 창당하였다.", "a": "X", "e": "조봉암은 평화 통일을 내세웠어요."}, {"n": 66, "sec": "반공 체제를 강화하다", "q": "진보당은 1956년 대통령 선거 이전에 창당되었다.", "a": "X", "e": "진보당은 대통령 선거 이후에 창당되었어요."}, {"n": 67, "sec": "반공 체제를 강화하다", "q": "이승만 정부는 반공 이념을 앞세워 진보당을 탄압하였다.", "a": "O", "e": ""}, {"n": 68, "sec": "반공 체제를 강화하다", "q": "1958년 조봉암과 진보당 간부들은 간첩죄와 국가 보안법 위반 등의 혐의로 구속되었다.", "a": "O", "e": ""}, {"n": 69, "sec": "반공 체제를 강화하다", "q": "이승만 정부는 진보당의 정당 등록을 취소하였다.", "a": "O", "e": ""}, {"n": 70, "sec": "반공 체제를 강화하다", "q": "조봉암은 4·19 혁명 이후에 사형을 당하였다.", "a": "X", "e": "4·19 혁명 전인 1959년에 사형을 당했어요."}, {"n": 71, "sec": "반공 체제를 강화하다", "q": "조봉암은 2011년 52년 만에 무죄를 선고받았다.", "a": "O", "e": ""}, {"n": 72, "sec": "반공 체제를 강화하다", "q": "2011년 재심에서 조봉암의 공소 사실은 대부분 유죄로 확정되었다.", "a": "X", "e": "공소 사실 대부분이 무죄로 밝혀졌어요."}, {"n": 73, "sec const SECS = [...new Set(DATA.map(d=>d.sec))];
const ROM=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'];
const KEY='hanyoung-ox-w4-v1';
let st={wrong:{},done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.wrong) st=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
let list=[],pos=0,picked=null,shuffle=false,wrongOnly=false,section='all',right=0,tried=0;

$('sec').innerHTML='<option value="all">전체 단원 ('+DATA.length+'문항)</option>'+
  SECS.map((s,i)=>'<option value="'+i+'">'+ROM[i]+'. '+s+' ('+DATA.filter(d=>d.sec===s).length+')</option>').join('');

function build(){
  list=DATA.filter(d=>(section==='all'||d.sec===SECS[+section])&&(!wrongOnly||st.wrong[d.n]));
  if(shuffle){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  pos=0;picked=null;right=0;tried=0;render();
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const total=list.length;
  const nWrong=Object.keys(st.wrong).length;
  $('score').innerHTML=tried?'<span>정답</span><strong>'+right+'/'+tried+'</strong>':'<span>틀린 문제</span><strong>'+nWrong+'</strong>';
  $('bar').style.width=total?((pos+(picked?1:0))/total*100)+'%':'0';
  $('prev').disabled=pos===0;
  const card=$('card'),act=$('actions');
  if(!total){
    card.innerHTML='<div class="done"><div class="big">0</div><p>'+(wrongOnly?'틀린 문제가 없어요. 전체 문제로 돌아가 풀어 보세요.':'문제가 없어요.')+'</p></div>';
    act.innerHTML='';return;
  }
  if(pos>=total){
    card.innerHTML='<div class="done"><p>이번 회차 결과</p><div class="big">'+right+' / '+tried+'</div><p>틀린 문제는 자동으로 모아 두었어요.</p><div class="row"><button class="chip" id="again">처음부터 다시</button><button class="chip" id="gowrong">틀린 문제만 풀기</button></div></div>';
    act.innerHTML='';
    $('again').onclick=build;
    $('gowrong').onclick=()=>{wrongOnly=true;$('wrong').setAttribute('aria-pressed','true');build()};
    return;
  }
  const d=list[pos];
  const si=SECS.indexOf(d.sec);
  let h='<div class="meta"><span class="no">'+d.n+'<em>번</em></span><span class="tag">'+ROM[si]+'. '+esc(d.sec)+'</span></div><p class="q">'+esc(d.q)+'</p>';
  if(picked){
    const ok=picked===d.a;
    h+='<div class="result" data-k="'+d.a+'"><div class="mark" aria-label="정답 '+d.a+'">'+d.a+'</div><div><p class="verdict '+(ok?'ok':'no')+'">'+(ok?'정답이에요!':'아쉬워요. 정답은 '+d.a)+'</p><p class="exp">'+esc(d.e||'옳은 설명이에요.')+'</p></div></div>';
    act.innerHTML='<button class="next" id="nx">'+(pos+1<total?'다음 문제 →':'결과 보기')+'</button>';
    $('nx').onclick=()=>{pos++;picked=null;render();window.scrollTo({top:0})};
    $('nx').focus({preventScroll:true});
  }else{
    act.innerHTML='<div class="pad"><button id="bO" aria-label="O 맞다">O</button><button id="bX" aria-label="X 틀리다">X</button></div>';
    $('bO').onclick=()=>answer('O');$('bX').onclick=()=>answer('X');
  }
  card.innerHTML=h;
  const p=$('pos');
}
function answer(k){
  const d=list[pos];picked=k;tried++;
  if(k===d.a){right++; if(wrongOnly) delete st.wrong[d.n];}
  else st.wrong[d.n]=1;
  save();render();
}
$('sec').onchange=e=>{section=e.target.value;build()};
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);build()};
$('wrong').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);build()};
$('prev').onclick=()=>{if(pos>0){pos--;picked=null;render()}};
let armed=false;
$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}
  st={wrong:{},done:{}};save();armed=false;t.textContent='기록 초기화';wrongOnly=false;$('wrong').setAttribute('aria-pressed','false');build()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(!picked&&(e.key==='o'||e.key==='O'))answer('O');
  else if(!picked&&(e.key==='x'||e.key==='X'))answer('X');
  else if(picked&&(e.key==='Enter'||e.key==='ArrowRight')){e.preventDefault();$('nx')&&$('nx').click()}
});
build();
</script>
<script>
(function(){
const H=1418297543,K='hanyoung-ox-w4-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
</body></html>
