<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>세계 대전 문제 트레이닝</title>

<style>

:root[data-theme="dark"]{

.intro{margin:0 0 8px}.er{display:flex;gap:6px;margin:0 0 6px;align-items:flex-start}.er .lb{font-weight:700;min-width:22px}
.ox{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:900;margin-top:2px}.ox.o{background:var(--o)}.ox.x{background:var(--x)}
.end{color:var(--x);font-weight:700;margin:6px 0 2px}

.self .chip,.row2 .chip{background:var(--band);color:#fff}.row2{display:flex;gap:10px;justify-content:center}.row2 .ok{background:var(--o)}.row2 .no{background:var(--x)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>문</b><i>제</i></div><h2>세계 대전 문제 트레이닝</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>

<script>
const DATA = [{"n": 1, "sec": "제1차 세계 대전과 국제 질서의 변화", "type": "그림 자료형", "stem": "다음 그림의 (가), (나) 세력에 대한 설명으로 옳은 것은?", "body": "<div class=\"dbox\"><b>(가)<\/b> 독일 · 오스트리아·헝가리 제국 · 이탈리아　　　<b>(나)<\/b> 프랑스 · 영국 · 러시아<\/div>", "ch": ["(가)는 3국 협상이다.", "(나)는 독일이 프랑스를 고립시키기 위해 만들었다.", "(가)의 이탈리아는 전쟁이 일어나자 협상국 편에 가담하였다.", "(나)의 러시아는 범게르만주의를 내세웠다.", "(가)와 (나)의 대립은 제2차 세계 대전의 배경이 되었다."], "a": 3, "at": "", "key": "3국 동맹(독·오·이) vs 3국 협상(프·영·러) / 이탈리아는 <u>협상국 편<\/u>으로 참전", "intro": "(가)는 <b>3국 동맹<\/b>, (나)는 <b>3국 협상<\/b>이에요. 교과서 176쪽 그림을 그대로 떠올려 보세요.", "exp": [["①", 0, "(가)는 3국 <b>동맹<\/b>이에요."], ["②", 0, "프랑스를 고립시키려고 만든 것은 (가) 3국 동맹이에요. (나)는 이에 맞선 것이에요."], ["③", 1, "이탈리아는 3국 동맹이었지만 전쟁이 일어나자 <b>협상국 편<\/b>에 가담했어요."], ["④", 0, "러시아는 <b>범슬라브주의<\/b>를 내세웠어요."], ["⑤", 0, "3국 동맹과 3국 협상의 대립은 <b>제1차<\/b> 세계 대전의 배경이에요."]], "end": "따라서 정답은 ③번이에요."}, {"n": 2, "sec": "제1차 세계 대전과 국제 질서의 변화", "type": "자료 해석형", "stem": "밑줄 친 ‘이곳’에 대한 설명으로 옳은 것은?", "body": "<div class=\"dbox\"><u>이곳<\/u>은 여러 민족과 종교가 얽혀 있어 ‘유럽의 화약고’라고 불렸다. 이곳에서 열강의 긴장과 대립이 높아졌다.<\/div>", "ch": ["러시아가 범게르만주의를 내세웠다.", "영국과 독일이 3C 정책으로 맞섰다.", "발칸반도이다.", "미국의 참전 계기가 된 사건이 일어났다.", "국제 연맹의 본부가 세워졌다."], "a": 3, "at": "", "key": "유럽의 화약고 = <u>발칸반도<\/u> (범슬라브주의 vs 범게르만주의)", "intro": "‘유럽의 화약고’는 <b>발칸반도<\/b>예요. 작은 불씨로도 큰 전쟁이 터질 수 있는 곳이라는 뜻이에요.", "exp": [["①", 0, "러시아는 <b>범슬라브주의<\/b>, 독일·오스트리아·헝가리 제국이 범게르만주의예요."], ["②", 0, "3C 정책은 <b>영국<\/b>, 3B 정책은 <b>독일<\/b>의 정책이에요. 발칸반도의 대립은 범슬라브주의와 범게르만주의의 대립이에요."], ["③", 1, "발칸반도예요."], ["④", 0, "미국 참전 계기는 독일의 <b>무제한 잠수함 작전<\/b>이에요."], ["⑤", 0, "교과서에 나오지 않는 내용이에요."]], "end": "따라서 정답은 ③번이에요."}, {"n": 3, "sec": "제1차 세계 대전과 국제 질서의 변화", "type": "사건 자료형", "stem": "다음 사건을 계기로 일어난 사실로 옳은 것은?", "body": "<div class=\"dbox\">1914년 보스니아의 세르비아계 청년이 사라예보를 방문한 오스트리아·헝가리 제국의 황태자 부부를 암살하였다.<\/div>", "ch": ["러시아에서 2월 혁명이 일어났다.", "미국에서 뉴딜 정책이 추진되었다.", "파리 강화 회의가 열렸다.", "독일이 폴란드를 침공하였다.", "오스트리아·헝가리 제국이 세르비아에 선전 포고를 하였다."], "a": 5, "at": "", "key": "사라예보 사건(1914) → 오스트리아·헝가리가 <u>세르비아<\/u>에 선전 포고 → 제1차 세계 대전", "intro": "자료는 r><tr><td>물량전<\/td><td>(라)<\/td><\/tr><\/table>", "ch": ["(가) - 총력전", "(나) - 잠수함, 전차, 독가스, 비행기", "(다) - 참호전", "(라) - 전쟁 물자 보급이 승패를 좌우함", "(라) - 적은 물자로 짧게 끝나는 전쟁"], "a": 5, "at": "", "key": "물량전 = 많은 생산물을 사용·파괴, <u>물자 보급<\/u>이 승패 좌우", "intro": "교과서 177쪽 ‘새로운 전쟁의 모습’ 표 그대로예요.", "exp": [["①", 1, "총력전이에요."], ["②", 1, "잠수함, 전차, 독가스, 기관총, 화염 방사기, 비행기 등."], ["③", 1, "참호전이에요."], ["④", 1, "물량전의 뜻이에요."], ["⑤", 0, "물량전은 <b>많은 양<\/b>의 생산물을 쓰고 파괴한 전쟁이에요. 전쟁은 길어졌어요(장기전·지구전)."]], "end": "따라서 옳지 않은 것은 ⑤번이에요."}, {"n": 9, "sec": "제1차 세계 대전과 국제 질서의 변화", "type": "사료 해석형", "stem": "다음 원칙에 대한 설명으로 옳은 것은?", "body": "<div class=\"dbox\">제1조 강화 조약은 공개적으로 진행하며, 비밀 외교와 비밀 회담을 금지한다.<br>제5조 모든 식민지 문제는 식민지 주민의 의사를 존중하여 공평무사하고 자유롭게 처리되도록 한다.<br>제14조 국가 간 연합 기구를 만들어 각국의 정치적 독립과 영토 보전을 보장한다.<\/div>", "ch": ["소련의 레닌이 발표하였다.", "워싱턴 회의에서 처음 발표되었다.", "민족 자결주의가 포함되어 식민지 독립운동에 영향을 주었다.", "제14조에 따라 국제 연합이 창설되었다.", "독일의 히틀러가 이 원칙을 지지하였다."], "a": 3, "at": "", "key": "윌슨의 <u>14개조 평화 원칙<\/u> → 제5조 <u>민족 자결주의<\/u>, 제14조 → <u>국제 연맹<\/u>", "intro": "미국 <b>윌슨<\/b> 대통령의 <b>14개조 평화 원칙<\/b>이에요. 파리 강화 회의(1919)의 바탕이 되었어요.", "exp": [["①", 0, "미국 <b>윌슨<\/b> 대통령이 제시했어요."], ["②", 0, "파리 강화 회의의 바탕이었어요. 워싱턴 회의는 그 뒤(1921~1922)예요."], ["③", 1, "제5조의 민족 자결주의는 식민지 독립운동에 큰 영향을 주었어요."], ["④", 0, "제14조는 <b>국제 연맹<\/b>(1920)으로 이어졌어요. 국제 연합은 1945년이에요."], ["⑤", 0, "관련 없는 내용이에요."]], "end": "따라서 정답은 ③번이에요."}, {"n": 10, "sec": "제1차 세계 대전과 국제 질서의 변화", "type": "그림+사료형", "stem": "다음 그림과 조약에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "body": "<div class=\"pair2\"><div class=\"qimg\"><img src=\"img/cryingchild.jpg\" style=\"height:120px\"><span class=\"icap\">▲ 독일을 우는 아이로 묘사<\/span><\/div><div class=\"dbox\">제119조 독일은 해외 식민지에 관한 모든 권리를 연합국에 넘겨준다.<br>제173조 독일에서 의무병 제도는 폐지된다.<br>제231조 전쟁에 대한 모든 책임은 독일을 비롯한 동맹국에 있다.<\/div><\/div>", "ch": ["베르사유 조약이다.", "독일은 영토가 줄고 군비가 감축되었다.", "독일은 막대한 배상금을 내게 되었다.", "독일은 이 조약에 크게 만족하여 ‘베르사유 선물’이라고 불렀다.", "이 조약으로 성립된 세계 질서를 베르사유 체제라고 한다."], "a": 4, "at": "", "key": "베르사유 조약 → 독일 <u>영토 축소, 군비 감축, 배상금<\/u> → 독일인은 ‘베르사유 명령’이라 부름", const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
let list=[],pos=0,picked=null,shuffle=false,wrongOnly=false,section='all',right=0,tried=0;
$('sec').innerHTML='<option value="all">전체 단원 ('+DATA.length+'문항)</option>'+SECS.map((s,i)=>'<option value="'+i+'">'+ROM[i]+'. '+s+' ('+DATA.filter(d=>d.sec===s).length+')</option>').join('');
function build(){
  list=DATA.filter(d=>(section==='all'||d.sec===SECS[+section])&&(!wrongOnly||st.wrong[d.n]));
  if(shuffle){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  pos=0;picked=null;right=0;tried=0;render();
}
function expHtml(d,ok){
  let h='<div class="xp"><p class="verdict '+(ok===null?'':(ok?'ok':'no'))+'">'+(ok===null?'정답 확인':(ok?'정답이에요!':'아쉬워요. 정답은 '+CI[d.a-1]))+'</p>';
  if(d.at)h+='<div class="ans">정답 | '+d.at+'</div>';
  if(d.key)h+='<div class="key"><b>핵심</b> '+d.key+'</div>';
  if(d.intro)h+='<p class="intro">'+d.intro+'</p>';
  h+=d.exp.map(e=>'<div class="er"><span class="lb">'+e[0]+'</span><span class="ox '+(e[1]?'o':'x')+'">'+(e[1]?'O':'X')+'</span><span>'+e[2]+'</span></div>').join('');
  if(d.end)h+='<p class="end">'+d.end+'</p>';
  return h+'</div>';
}
function render(){
  const total=list.length;
  $('score').innerHTML=tried?'<span>정답</span><strong>'+right+'/'+tried+'</strong>':'<span>틀린 문제</span><strong>'+Object.keys(st.wrong).length+'</strong>';
  $('bar').style.width=total?((pos+(picked!==null?1:0))/total*100)+'%':'0';
  $('prev').disabled=pos===0;
  const card=$('card'),act=$('actions');
  if(!total){card.innerHTML='<div class="done"><div class="big">0</div><p>'+(wrongOnly?'틀린 문제가 없어요. 전체 문제로 돌아가 풀어 보세요.':'문제가 없어요.')+'</p></div>';act.innerHTML='';return}
  if(pos>=total){
    card.innerHTML='<div class="done"><p>이번 회차 결과</p><div class="big">'+right+' / '+tried+'</div><p>틀린 문제는 자동으로 모아 두었어요.</p><div class="row"><button class="chip" id="again">처음부터 다시</button><button class="chip" id="gowrong">틀린 문제만 풀기</button></div></div>';
    act.innerHTML='';$('again').onclick=build;$('gowrong').onclick=()=>{wrongOnly=true;$('wrong').setAttribute('aria-pressed','true');build()};return;
  }
  const d=list[pos],si=SECS.indexOf(d.sec);
  let h='<div class="meta"><span class="no">'+d.n+'<em>번</em></span><span class="tag">'+ROM[si]+'. '+d.sec+'</span></div><p class="q">'+d.stem+'</p><div class="body">'+d.body+'</div>';
  if(d.a){
    h+='<div class="chs">'+d.ch.map((c,i)=>{let cls='';if(picked!==null){if(i+1===d.a)cls='right';else if(i+1===picked)cls='bad'}
      return '<button class="cho '+cls+'" data-i="'+(i+1)+'"'+(picked!==null?' disabled':'')+'><b>'+CI[i]+'</b><span>'+c+'</span></button>'}).join('')+'</div>';
  }else if(picked===null){
    h+='<div class="self"><p>'+(d.type==='서술형'?'답을 공책에 써 본 뒤':'답을 떠올려 본 뒤')+' 정답을 확인하세요.</p><button class="chip" id="reveal">정답 보기</button></div>';
  }
  if(picked!==null){
    h+=expHtml(d,d.a?picked===d.a:(picked===1?true:(picked===2?false:null)));
    if(!d.a&&picked===0)h+='<div class="row2"><button class="chip ok" id="sOk">맞았어요</button><button class="chip no" id="sNo">틀렸어요</button></div>';
  }
  card.innerHTML=h;
  card.querySelectorAll('.cho').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  if($('reveal'))$('reveal').onclick=()=>{picked=0;render()};
  if($('sOk'))$('sOk').onclick=()=>selfMark(true);
  if($('sNo'))$('sNo').onclick=()=>selfMark(false);
  if(picked!==null&&!(!d.a&&picked===0)){act.innerHTML='<button class="next" id="nx">'+(pos+1<total?'다음 문제 →':'결과 보기')+'</button>';$('nx').onclick=()=>{pos++;picked=null;render();window.scrollTo({top:0})}}
  else act.innerHTML='';
}
function selfMark(ok){const d=list[pos];tried++;if(ok){right++;if(wrongOnly)delete st.wrong[d.n]}else st.wrong[d.n]=1;picked=ok?1:2;save();render()}
function answer(k){const d=list[pos];picked=k;tried++;if(k===d.a){right++;if(wrongOnly)delete st.wrong[d.n]}else st.wrong[d.n]=1;save();render()}
$('sec').onchange=e=>{section=e.target.value;build()};
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);build()};
$('wrong').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);build()};
$('prev').onclick=()=>{if(pos>0){pos--;picked=null;render()}};
let armed=false;
$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}
  st={wrong:{}};save();armed=false;t.textContent='기록 초기화';wrongOnly=false;$('wrong').setAttribute('aria-pressed','false');build()};
build();
</script>
<script>
(function(){
const H=1418297543,K='ms-hist1-ww-quiz-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
</body></html>
