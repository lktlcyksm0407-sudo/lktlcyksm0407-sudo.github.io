<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>O</b><i>X</i></div><h2>한국사 6주차 트레이닝</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>

<script>
const OXD=[{"n": 1, "sec": "Ⅰ. 군사 정권의 연장", "q": "5·18 민주화 운동을 무력으로 진압한 신군부 세력은 국가 보위 비상 대책 위원회를 설치하였다.", "a": "O", "e": ""}, {"n": 2, "sec": "Ⅰ. 군사 정권의 연장", "q": "신군부 세력은 5·18 민주화 운동을 진압한 뒤 국가 재건 최고 회의를 설치하였다.", "a": "X", "e": "국가 재건 최고 회의는 5·16 군사 정변 세력(1961)의 기구예요. 신군부는 국가 보위 비상 대책 위원회를 설치했어요."}, {"n": 3, "sec": "Ⅰ. 군사 정권의 연장", "q": "국가 보위 비상 대책 위원회는 입법부·행정부·사법부를 장악하였다.", "a": "O", "e": ""}, {"n": 4, "sec": "Ⅰ. 군사 정권의 연장", "q": "국가 보위 비상 대책 위원회는 10·26 사태 후 사회적 혼란 수습을 내세워 설치한 초헌법적 기구였다.", "a": "O", "e": ""}, {"n": 5, "sec": "Ⅰ. 군사 정권의 연장", "q": "국가 보위 비상 대책 위원회는 최고 군사 회의의 성격을 띠었다.", "a": "O", "e": ""}, {"n": 6, "sec": "Ⅰ. 군사 정권의 연장", "q": "신군부 세력은 정치인들의 활동을 보장하고 언론의 자유를 확대하였다.", "a": "X", "e": "정치인들의 활동을 탄압하고 언론을 통폐합했어요."}, {"n": 7, "sec": "Ⅰ. 군사 정권의 연장", "q": "신군부 세력은 언론을 통폐합하였다.", "a": "O", "e": ""}, {"n": 8, "sec": "Ⅰ. 군사 정권의 연장", "q": "신군부 세력은 사회 정화를 구실로 많은 민간인을 삼청 교육대로 끌고 갔다.", "a": "O", "e": ""}, {"n": 9, "sec": "Ⅰ. 군사 정권의 연장", "q": "삼청 교육대에서는 군사 훈련과 강제 노역이 이루어졌다.", "a": "O", "e": ""}, {"n": 10, "sec": "Ⅰ. 군사 정권의 연장", "q": "삼청 교육대는 민간 시설에 설치되어 입소자의 인권이 보장되었다.", "a": "X", "e": "군부대 내에 설치되었고, 가혹한 훈련과 폭력 등 인권 유린이 자행되었어요."}, {"n": 11, "sec": "Ⅰ. 군사 정권의 연장", "q": "삼청 교육대 입소자 중 사망자가 다수 발생하였다.", "a": "O", "e": ""}, {"n": 12, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환은 최규하를 대통령직에서 물러나게 하였다.", "a": "O", "e": ""}, {"n": 13, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환은 1980년 국민의 직접 선거로 대통령에 취임하였다.", "a": "X", "e": "통일 주체 국민 회의를 통해(간선) 대통령에 취임했어요."}, {"n": 14, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환은 통일 주체 국민 회의를 통해 대통령에 취임하였다(1980).", "a": "O", "e": ""}, {"n": 15, "sec": "Ⅰ. 군사 정권의 연장", "q": "신군부는 7년 단임의 대통령 간선제를 주요 내용으로 하는 개헌을 단행하였다.", "a": "O", "e": ""}, {"n": 16, "sec": "Ⅰ. 군사 정권의 연장", "q": "1980년 개헌에서는 대통령 임기 6년, 중임 제한 없음을 규정하였다.", "a": "X", "e": "그것은 유신 헌법(1972)이에요. 1980년 제8차 개헌은 7년 단임, 간선제예요."}, {"n": 17, "sec": "Ⅰ. 군사 정권의 연장", "q": "제8차 개헌에 따라 대통령은 대통령 선거인단이 선출하였다.", "a": "O", "e": ""}, {"n": 18, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환은 새 헌법에 따라 실시된 선거에서 다시 대통령에 당선되었다(1981).", "a": "O", "e": ""}, {"n": 19, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환 정부는 악화된 국민감정과 국제 여론을 의식해 유화 정책을 폈다.", "a": "O", "e": ""}, {"n": 20, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환 정부는 유화 정책으로 정권 장악의 불법성과 폭력성을 감추고자 하였다.", "a": "O", "e": ""}, {"n": 21, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환 정부는 유화 정책으로 야간 통행금지를 새로 실시하였다.", "a": "X", "e": "야간 통행금지를 폐지했어요(1982. 1.)."}, {"n": 22, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환 정부는 중고생의 두발 및 교복 자율화를 실시하였다.", "a": "O", "e": ""}, {"n": 23, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환 정부는 프로 야구를 출범시켰다.", "a": "O", "e": ""}, {"n": 24, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환 정부는 과외 금지를 실시하였다.", "a": "O", "e": ""}, {"n": 25, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환 정부는 학생 운동과 노동 운동을 탄압하고 고문 수사도 서슴지 않았다.", "a": "O", "e": ""}, {"n": 26, "sec": "Ⅰ. 군사 정권의 연장", "q": "전두환 정부는 보도 지침을 통해 언론을 통제하였다.", "a": "O", "e": ""}, {"n": 27, "sec": "Ⅰ. 군사 정권의 연장", "q": "12·12 사태는 10·26 사태보다 먼저 일어났다.", "a": "X", "e": "10·26 사태(1979. 10.) → 12·12 사태(1979. 12.) 순서예요."}, {"n": 28, "sec": "Ⅰ. 군사 정권의 연장", "q": "최규하는 통일 주체 국민 회의에서 제10대 대통령으로 선출되었다.", "a": "O", "e": ""}, {"n": 29, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "전두환 정부 말에는 각종 권력형 부정과 비리 사건이 연이어 터졌다.", "a": "O", "e": ""}, {"n": 30, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "부천 경찰서 성 고문 사건은 학생 운동과 노동 운동을 탄압하는 과정에서 일어났다.", "a": "O", "e": ""}, {"n": 31, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "부천 경찰서 성 고문 사건의 피해자는 위장 취업 후 주민 등록증 변조 혐의로 연행된 대학생이었다.", "a": "O", "e": ""}, {"n": 32, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "정부는 부천 경찰서 성 고문 사건에 대한 언론의 자유로운 보도를 허용하였다.", "a": "X", "e": "보도 지침을 내려 보도 내용을 통제했어요."}, {"n": 33, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "보도 지침은 사건의 명칭을 ‘성추행’ 대신 ‘성 모욕 행위’라고 하도록 지시하였다.", "a": "O", "e": ""}, {"n": 34, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "보도 지침은 검찰이 발표한 조사 결과 내용만 보도하도록 하였다.", "a": "O", "e": ""}, {"n": 35, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "정부는 보도 지침으로 보도 여부, 기사 제목, 용어, 분량까지 통제하였다.", "a": "O", "e": ""}, {"n": 36, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "부천 경찰서 성 고문 사건 관련 보도 지침은 1987년 6월에 내려졌다.", "a": "X", "e": "1986년 7월 17일이에요."}, {"n": 37, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "정부에 대한 불신이 커지며 국민이 직접 대통령을 선출해야 한다는 인식이 확산되었다.", "a": "O", "e": ""}, {"n": 38, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "야당과 민주화 운동 진영은 대통령 간선제 개헌 운동을 전개하였다.", "a": "X", "e": "대통령 직선제 개헌 운동을 본격적으로 전개했어요."}, {"n": 39, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "전두환 정부는 4·13 호헌 조치를 발표하여 대통령 직선제 개헌 논의 자체를 금지하였다.", "a": "O", "e": ""}, {"n": 40, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "4·13 호헌 조치는 대통령 직선제 개헌을 약속한 조치였다.", "a": "X", "e": "개헌 논의를 금지했어요. 직선제 개헌 수용은 6·29 선언이에요."}, {"n": 41, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "4·13 호헌 조치에서 전두환은 현행 헌법에 따라 후임자에게 정부를 이양하겠다고 하였다.", "a": "O", "e": ""}, {"n": 42, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "4·13 호헌 조치에서 전두환은 서울 올림픽을 개헌 논의를 지양할 이유로 들었다.", "a": "O", "e": ""}, {"n": 43, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "대학생 박종철은 수사 과정에서 고문으로 사망하였다.", "a": "O", "e": ""}, {"n": 44, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "경찰은 박종철의 사망 원인을 처음부터 있는 그대로 발표하였다.", "a": "X", "e": "“탁 하고 치니 억 하고 죽었다.”라며 고문 사실을 은폐·조작했어요."}, {"n": 45, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "“탁 하고 치니 억 하고 죽었다.”는 1987년 1월 경찰이 발표한 박종철의 사인이다.", "a": "O", "e": ""}, {"n": 46, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "경찰이 박종철 사건을 은폐·조작한 사실이 뒤늦게 알려지자 국민의 분노가 폭발하였다.", "a": "O", "e": ""}, {"n": 47, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "박종철 고문치사 사건은 4·13 호헌 조치 이후에 일어났다.", "a": "X", "e": "박종철 고문치사(1987. 1.)가 4·13 호헌 조치(1987. 4.)보다 먼저예요."}, {"n": 48, "sec": "Ⅱ. 민주화와 개헌을 향한 열망", "q": "박종철은 치안 본부 남영동 대공분실 취조실에서 고문으로 목숨을 잃었다.", "a": "O", "e": ""}, {"n": 49, "sec": "Ⅲ. 6월 민주 항쟁", "q": "민주 헌법 쟁취 국민운동 본부는 대통령 직선제 개헌과 고문 살인 정권 퇴진 운동을 전개하였다.", "a": "O", "e": ""}, {"n": 50, "sec": "Ⅲ. 6월 민주 항쟁", "q": "민주 헌법 쟁취 국민운동 본부의 결성식은 명동 성당에서 열렸다.", "a": "X", "e": "5월 27일 옛 향린 교회에서 열렸어요. 명동 성당은 농성의 중심 장소예요."}, {"n": 51, "sec": "Ⅲ. 6월 민주 항쟁", "q": "대학생 이한열은 경찰이 쏜 최루탄에 맞아 뇌사 상태에 빠졌다.", "a": "O", "e": ""}, {"n": 52, "sec": "Ⅲ. 6월 민주 항쟁", "q": "이한열이 최루탄에 맞아 쓰러진 것은 1987년 6월 9일이다.", "a": "O", "e": ""}, {"n": 53, "sec": "Ⅲ. 6월 민주 항쟁", "q": "이한열 최루탄 피격 이후 국민의 민주화 요구는 약해졌다.", "a": "X", "e": "국민의 민주화 요구는 더욱 거세어졌어요."}, {"n": 54, "sec": "Ⅲ. 6월 민주 항쟁", "q": "민주 헌법 쟁취 국민운동 본부는 국민 대회를 개최해 범국민 민주 항쟁을 선언하였다.", "a": "O", "e": ""}, {"n": 55, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6·10 국민 대회 때 전국 각지에서 대규모 시위가 벌어졌다.", "a": "O", "e": ""}, {"n": 56, "sec": "Ⅲ. 6월 민주 항쟁", "q": "대한 성공회 서울 주교좌성당은 6·10 국민 대회를 개최하고 민주 항쟁을 알린 장소이다.", "a": "O", "e": ""}, {"n": 57, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6·10 국민 대회 선언문은 4·13 폭거를 철회시키기 위한 민주 장정을 시작한다고 하였다.", "a": "O", "e": ""}, {"n": 58, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6·10 국민 대회 선언문은 전두환의 특별 담화로 발표되었다.", "a": "X", "e": "민주 헌법 쟁취 국민운동 본부가 발표했어요. 전두환 특별 담화는 4·13 호헌 조치예요."}, {"n": 59, "sec": "Ⅲ. 6월 민주 항쟁", "q": "전두환 정부의 탄압에도 명동 성당을 비롯한 시내 곳곳에서 대규모 시위가 매일 전개되었다.", "a": "O", "e": ""}, {"n": 60, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6월 민주 항쟁 당시 시위는 서울에서만 일어났다.", "a": "X", "e": "지방의 주요 도시에서도 시위가 계속되었어요."}, {"n": 61, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6월 민주 항쟁 당시 각계각층의 시민은 ‘독재 타도’와 ‘호헌 철폐’를 외쳤다.", "a": "O", "e": ""}, {"n": 62, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6월 민주 항쟁 당시 시민들은 ‘유신 철폐’를 핵심 구호로 외쳤다.", "a": "X", "e": "‘독재 타도’, ‘호헌 철폐’예요. ‘유신 철폐’는 부마 민주 항쟁(1979)의 구호예요."}, {"n": 63, "sec": "Ⅲ. 6월 민주 항쟁", "q": "명동 성당은 경찰에 쫓긴 시위대가 모여 농성을 벌인 중심 장소였다.", "a": "O", "e": ""}, {"n": 64, "sec": "Ⅲ. 6월 민주 항쟁", "q": "한국은행 앞 광장은 6월 민주 항쟁 기간 가장 빈번하게 시위가 벌어진 장소이다.", "a": "O", "e": ""}, {"n": 65, "sec": "Ⅲ. 6월 민주 항쟁", "q": "전두환 정부는 국민적 저항에 굴복하여 직선제 개헌을 수용하였다.", "a": "O", "e": ""}, {"n": 66, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6·29 선언은 민주 정의당 대표 노태우가 발표하였다.", "a": "O", "e": ""}, {"n": 67, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6·29 선언은 전두환 대통령이 직접 발표한 특별 담화이다.", "a": "X", "e": "민주 정의당 대표 노태우가 발표했어요."}, {"n": 68, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6·29 선언에는 1988년 2월 평화적 정부 이양을 실현한다는 내용이 담겼다.", "a": "O", "e": ""}, {"n": 69, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6·29 선언에는 시국 관련 사범을 석방해야 한다는 내용이 있다.", "a": "O", "e": ""}, {"n": 70, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6월 민주 항쟁은 군사 독재를 끝내고 평화적 정권 교체의 길을 열었다.", "a": "O", "e": ""}, {"n": 71, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6월 민주 항쟁으로 높아진 시민 의식은 성숙한 시민 사회로 성장하는 주춧돌이 되었다.", "a": "O", "e": ""}, {"n": 72, "sec": "Ⅲ. 6월 민주 항쟁", "q": "6월 민주 항쟁의 결과 대통령 간선제가 유지되었다.", "a": "X", "e": "직선제 개헌을 수용했어요(6·29 선언)."}, {"n": 73, "sec": "Ⅲ. 6월 민주 항쟁", "q": "4·13 호헌 조치 → 6·10 국민 대회 → 6·29 선언 순으로 전개되었다.", "a": "O", "e": ""}, {"n": 74, "sec": "Ⅲ. 6월 민주 항쟁", "q": "민주화 운동 기념관은 당시 치안 본부 남영동 대공분실이 있던 곳이다.", "a": "O", "e": ""}, {"n": 75, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "1977년 말 한국은 처음으로 수출 100억 달러를 달성하였다.", "a": "O", "e": ""}, {"n": 76, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "한국은 수출 10억 달러를 달성한 지 7년 만에 수출 100억 달러를 달성하였다.", "a": "O", "e": ""}, {"n": 77, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "한국은 수출 10억 달러를 달성한 지 17년 만에 수출 100억 달러를 달성하였다.", "a": "X", "e": "7년 만이에요."}, {"n": 78, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "미국의 원조에 의존하던 한국 경제는 1950년대 말부터 원조가 감소하면서 불황에 빠졌다.", "a": "O", "e": ""}, {"n": 79, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "1950년대 말 미국의 원조가 늘어나면서 한국 경제는 호황을 누렸다.", "a": "X", "e": "원조가 감소하면서 불황에 빠졌어요."}, {"n": 80, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "장면 내각은 경제 건설을 국정의 최우선 목표로 삼고 경제 개발 계획을 수립하였다.", "a": "O", "e": ""}, {"n": 81, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "장면 내각은 경제 개발 계획을 수립하여 성공적으로 실행하였다.", "a": "X", "e": "재정이 취약했고 5·16 군사 정변이 발생하여 실행에 옮기지 못했어요."}, {"n": 82, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "박정희 등 군부 세력은 정변의 정당성을 확보하기 위해 경제 개발을 전면에 내세웠다.", "a": "O", "e": ""}, {"n": 83, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "군부 세력은 장면 내각의 경제 개발 계획을 보완하여 경제 개발 5개년 계획을 수립하였다.", "a": "O", "e": ""}, {"n": 84, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "경제 개발 5개년 계획은 민간 주도의 내수 중심 산업화를 추진하였다.", "a": "X", "e": "정부 주도로 수출 주도형 산업화를 추진했어요."}, {"n": 85, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "제1차 경제 개발 5개년 계획은 1962년에 시작되었다.", "a": "O", "e": ""}, {"n": 86, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "1960년대 정부는 외국에서 빌려 온 자본을 토대로 노동 집약적 산업을 육성하였다.", "a": "O", "e": ""}, {"n": 87, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "1960년대에는 신발, 의류, 가발 등 노동 집약적 산업이 육성되었다.", "a": "O", "e": ""}, {"n": 88, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "1960년대 제1, 2차 경제 개발 5개년 계획 시기에는 철강·조선 등 중화학 공업을 집중 육성하였다.", "a": "X", "e": "중화학 공업 육성은 1970년대 제3, 4차 계획 시기예요."}, {"n": 89, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "1960년대 세계 경제가 호황을 누리던 상황에서 수출액이 크게 늘어났다.", "a": "O", "e": ""}, {"n": 90, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "베트남 파병에 따른 특수는 1960년대 경제 성장에 도움을 주었다.", "a": "O", "e": ""}, {"n": 91, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "정부는 서독에 광부와 간호사를 파견하면서 차관을 빌려 왔다.", "a": "O", "e": ""}, {"n": 92, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "1960년대 정부는 시멘트, 정유 산업 등을 육성하였다.", "a": "O", "e": ""}, {"n": 93, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "경부 고속 국도는 1970년에 완공되었다.", "a": "O", "e": ""}, {"n": 94, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "경부 고속 국도는 서울과 인천을 연결하였다.", "a": "X", "e": "서울과 부산을 연결했어요."}, {"n": 95, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "경부 고속 국도 건설은 사회 간접 자본 확충에 해당한다.", "a": "O", "e": ""}, {"n": 96, "sec": "Ⅳ. 정부 주도의 경제 개발", "q": "1인당 국민 소득은 1960년대 이후 1980년대 중반까지 계속 늘어났다.", "a": "O", "e": ""}, {"n": 97, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "1970년대 제3, 4차 경제 개발 5개년 계획 시기에 정부는 중화학 공업을 적극 육성하였다.", "a": "O", "e": ""}, {"n": 98, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "정부는 철강·화학·기계·조선 등의 분야를 집중적으로 지원하였다.", "a": "O", "e": ""}, {"n": 99, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "대규모 중화학 공업 단지는 포항, 울산 등 경상도 해안 지역에 조성되었다.", "a": "O", "e": ""}, {"n": 100, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "대규모 중화학 공업 단지는 주로 호남 지방의 내륙에 조성되었다.", "a": "X", "e": "포항, 울산 등 경상도 해안 지역에 조성되었어요."}, {"n": 101, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "제1차 석유 파동으로 유가가 크게 올라 한때 어려움을 겪었다.", "a": "O", "e": ""}, {"n": 102, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "기업들은 중동 건설 사업에 적극 참여하여 ‘오일 머니’를 벌어들였다.", "a": "O", "e": ""}, {"n": 103, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "제1차 석유 파동은 1978년에 일어났다.", "a": "X", "e": "제1차 석유 파동은 1973년, 제2차 석유 파동이 1978년이에요."}, {"n": 104, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "1970년대 말 공업 구조에서 중화학 공업이 차지하는 비중이 경공업을 앞질렀다.", "a": "O", "e": ""}, {"n": 105, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "제2차 석유 파동과 중화학 공업에 대한 과잉 중복 투자로 경제 위기가 발생하였다.", "a": "O", "e": ""}, {"n": 106, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "제2차 석유 파동 이후 경제 성장률이 마이너스를 기록하고 물가가 폭등하였다.", "a": "O", "e": ""}, {"n": 107, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "애틀랜틱 배런호(1974)는 국내 최초로 제작된 26만 톤급 초대형 유조선이다.", "a": "O", "e": ""}, {"n": 108, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "1980년대 전두환 정부는 정부 주도의 성장 우선 정책을 더욱 강화하였다.", "a": "X", "e": "경제 안정화에 초점을 맞춰 성장 우선 정책을 부분적으로 수정하고 민간 부문 참여를 늘렸어요."}, {"n": 109, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "전두환 정부는 중화학 공업의 중복 투자를 조정하고 부실기업을 정리하였다.", "a": "O", "e": ""}, {"n": 110, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "3저 호황은 저달러·저유가·저금리라는 유리한 경제 환경 속에서 나타났다.", "a": "O", "e": ""}, {"n": 111, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "3저 호황의 ‘3저’는 저임금·저유가·저금리를 말한다.", "a": "X", "e": "저달러·저유가·저금리예요."}, {"n": 112, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "3저 호황 시기에는 자동차, 반도체 등 기술 집약적 산업이 성장을 이끌었다.", "a": "O", "e": ""}, {"n": 113, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "3저 호황 시기 한국은 연평균 10%가 넘는 경제 성장률을 기록하였다.", "a": "O", "e": ""}, {"n": 114, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "3저 호황으로 수출이 늘면서 1986년 무역 수지가 흑자로 전환하였다.", "a": "O", "e": ""}, {"n": 115, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "3저 호황은 1990년대 중반까지 계속되었다.", "a": "X", "e": "1980년대 말 3저 호황이 막을 내리면서 다시 어려움에 빠졌어요."}, {"n": 116, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "1983~1985년 한국의 무역 수지는 적자였다.", "a": "O", "e": ""}, {"n": 117, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "1983~1990년 중 무역 수지 흑자 규모는 1988년에 가장 컸다.", "a": "O", "e": ""}, {"n": 118, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "정부의 수출 주도형 산업화 추진 의지는 ‘한강의 기적’의 원동력이었다.", "a": "O", "e": ""}, {"n": 119, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "낮은 임금과 곡물 가격을 감내한 노동자·농민의 헌신도 ‘한강의 기적’의 원동력이었다.", "a": "O", "e": ""}, {"n": 120, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "‘캔두이즘(할 수 있다 정신)’은 한국 기업가 정신을 상징한다.", "a": "O", "e": ""}, {"n": 121, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "q": "‘글뤽 아우프(오늘도 무사히)’는 기업인의 도전 정신을 상징하는 말이다.", "a": "X", "e": "해외에서 하루의 무사를 기원하며 고생한 파독 광부·간호사 등 땀 흘려 일한 국민과 관련돼요."}, {"n": 122, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "정부 주도로 성장 위주의 경제 정책이 추진되면서 여러 가지 문제점이 나타났다.", "a": "O", "e": ""}, {"n": 123, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "고도성장 과정에서 성장에 밀려 분배가 제대로 이루어지지 않았다.", "a": "O", "e": ""}, {"n": 124, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "고도성장 과정에서 빈부 격차가 줄어들었다.", "a": "X", "e": "경제력이 소수에 집중되며 빈부 격차가 더욱 커졌어요."}, {"n": 125, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "산업화의 중심이 된 도시와 개발에서 소외된 농촌 간의 소득 격차가 커졌다.", "a": "O", "e": ""}, {"n": 126, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "정부가 대규모 산업 시설을 영남 지방에 집중 건설하여 지역 간 격차가 발생하였다.", "a": "O", "e": ""}, {"n": 127, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "정부는 대규모 산업 시설을 호남 지방에 집중적으로 건설하였다.", "a": "X", "e": "영남 지방에 집중적으로 건설했어요."}, {"n": 128, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "1980년대 국가 주요 산업 단지는 경부 고속 국도를 축으로 수도권과 영남 지역에 몰려 있다.", "a": "O", "e": ""}, {"n": 129, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "정부로부터 각종 특혜를 받은 일부 대기업이 재벌로 성장하였다.", "a": "O", "e": ""}, {"n": 130, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "재벌은 정부의 산업 육성 및 수출 정책에 협조하며 경제 성장에 일조하였다.", "a": "O", "e": ""}, {"n": 131, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "재벌은 정경 유착과 경제 독점으로 중소기업의 성장을 저해하기도 하였다.", "a": "O", "e": ""}, {"n": 132, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "재벌 중심의 산업 구조는 기업 간의 공정 경쟁을 촉진하였다.", "a": "X", "e": "정경 유착과 경제 독점으로 공정 경쟁을 저해했어요."}, {"n": 133, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "외국 자본에 의존해 경제 개발을 추진하면서 외채 부담이 증가하였다.", "a": "O", "e": ""}, {"n": 134, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "수출 중심 경제 전략으로 경제의 대외 의존도가 낮아졌다.", "a": "X", "e": "내수보다 무역 비중이 커지면서 대외 의존도가 심화되었어요."}, {"n": 135, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "대외 의존도가 커지면서 한국 경제는 세계 경제 변화의 영향을 크게 받게 되었다.", "a": "O", "e": ""}, {"n": 136, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "‘경제가 일정 수준에 올라 중산층이 두터워져야 민주주의가 발전한다.’는 박정희 정부 경제 정책에 대한 긍정적 평가이다.", "a": "O", "e": ""}, {"n": 137, "sec": "Ⅵ. 고도성장 이면의 그림자", "q": "‘민주주의 발전의 토대 위에서 진정한 의미의 경제 발전이 가능하다.’는 박정희 정부 경제 정책에 대한 긍정적 평가이다.", "a": "X", "e": "부정적 평가(김영삼 전 대통령, 1999)의 주장이에요."}, {"n": 138, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "산업화로 농촌 인구가 일자리를 찾아 대도시와 신흥 공업 도시로 몰려들었다.", "a": "O", "e": ""}, {"n": 139, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "1970년대 중엽 이후 도시 인구가 농촌 인구를 앞질렀다.", "a": "O", "e": ""}, {"n": 140, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "1960년대 초에 이미 도시 인구가 농촌 인구를 앞질렀다.", "a": "X", "e": "1970년대 중엽 이후예요."}, {"n": 141, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "도시로 많은 사람이 몰려들면서 주거난과 도시 빈민 문제가 나타났다.", "a": "O", "e": ""}, {"n": 142, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "도시 변두리나 높은 지대에 ‘판자촌’, ‘달동네’로 불리는 빈민촌이 형성되었다.", "a": "O", "e": ""}, {"n": 143, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "정부는 대규모 아파트 단지 등을 건설하여 주택난을 해결하고자 하였다.", "a": "O", "e": ""}, {"n": 144, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "광주 대단지 사건은 서울시가 철거민을 경기도 광주에 집단 이주만 시켜 놓고 방치하여 일어났다.", "a": "O", "e": ""}, {"n": 145, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "광주 대단지 사건은 전라남도 광주에서 일어났다.", "a": "X", "e": "경기도 광주에서 일어났어요."}, {"n": 146, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "광주 대단지 사건은 1971년 8월에 일어났다.", "a": "O", "e": ""}, {"n": 147, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "광주 대단지 사건 당시 주민 5만여 명이 대규모 시위를 벌였다.", "a": "O", "e": ""}, {"n": 148, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "정부는 지하철 등 대중교통 확장, 고속 국도 건설, 쓰레기 소각장 조성으로 도시 문제를 해결하려 하였다.", "a": "O", "e": ""}, {"n": 149, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "지하철 1호선은 1974년에 개통되었다.", "a": "O", "e": ""}, {"n": 150, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "서울 강남 지역은 한남 대교 건설, 경부 고속 국도 개통, 아파트 건설 등으로 빠르게 도시화되었다.", "a": "O", "e": ""}, {"n": 151, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "농촌은 산업화 과정에서 상대적으로 소외되었다.", "a": "O", "e": ""}, {"n": 152, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "정부는 저임금을 유지하기 위해 쌀값을 낮게 책정하는 저곡가 정책을 폈다.", "a": "O", "e": ""}, {"n": 153, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "저곡가 정책은 농민의 소득을 높이기 위해 실시되었다.", "a": "X", "e": "저임금을 유지하기 위한 정책으로, 농촌의 어려움을 더 키웠어요."}, {"n": 154, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "새마을 운동은 ‘근면, 자조, 협동’을 구호로 내걸었다.", "a": "O", "e": ""}, {"n": 155, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "새마을 운동은 1970년에 추진되었다.", "a": "O", "e": ""}, {"n": 156, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "새마을 운동은 주택 개량, 도로 확충 등 농촌의 생활 환경 개선에 일정한 성과를 거두었다.", "a": "O", "e": ""}, {"n": 157, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "새마을 운동으로 농가 소득이 크게 향상되었다.", "a": "X", "e": "농가 소득은 크게 향상되지 못했어요."}, {"n": 158, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "새마을 운동은 점차 국민정신 운동으로 변하면서 유신 체제 유지에 이용되었다는 지적을 받았다.", "a": "O", "e": ""}, {"n": 159, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "함평 고구마 사건은 농협이 고구마 전량을 사들이겠다는 약속을 어기면서 일어났다.", "a": "O", "e": ""}, {"n": 160, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "함평 농민들은 3년간 투쟁하여 피해를 보상받았다(1976~1978).", "a": "O", "e": ""}, {"n": 161, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "함평 고구마 사건은 1980년대 외국 농산물 수입 개방에 반대한 운동이다.", "a": "X", "e": "1976~1978년 농협의 수매 약속 위반에 맞선 운동이에요."}, {"n": 162, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "농민 운동으로 농업 협동조합 민주화 운동, 농가 부채 탕감 운동 등이 전개되었다.", "a": "O", "e": ""}, {"n": 163, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "q": "1980년대에는 외국 농산물 수입 개방 반대 운동도 일어났다.", "a": "O", "e": ""}, {"n": 164, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "노동자들은 저임금과 장시간 노동에 내몰렸다.", "a": "O", "e": ""}, {"n": 165, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "평화 시장 노동자 전태일은 근로 기준법 준수를 외치며 분신하였다.", "a": "O", "e": ""}, {"n": 166, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "전태일 분신 사건은 1979년에 일어났다.", "a": "X", "e": "1970년이에요. 1979년에는 YH 무역 사건이 일어났어요."}, {"n": 167, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "전태일 분신 사건을 계기로 지식인과 대학생도 노동 문제에 관심을 가졌다.", "a": "O", "e": ""}, {"n": 168, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "전태일은 박정희 대통령에게 탄원서를 보내 어린 보조공들의 노동 현실을 알렸다(1969).", "a": "O", "e": ""}, {"n": 169, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "전태일의 탄원서에 따르면 평화 시장 보조공들은 1일 15시간씩 작업하였다.", "a": "O", "e": ""}, {"n": 170, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "노동조합을 결성하려는 움직임이 활발해지며 YH 무역 사건 등이 일어났다.", "a": "O", "e": ""}, {"n": 171, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1980년대에는 최저 임금 인상과 근로 조건 개선을 요구하는 파업이 탄광과 공장 중심으로 전개되었다.", "a": "O", "e": ""}, {"n": 172, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1980년대 노동 운동은 해고 노동자와 대학생이 참여하면서 사회적·정치적 투쟁으로 발전하였다.", "a": "O", "e": ""}, {"n": 173, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1980년대 노동 운동은 경제적 요구에만 머물렀다.", "a": "X", "e": "해고 노동자와 대학생이 참여하면서 사회적·정치적 투쟁으로 발전했어요."}, {"n": 174, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "대규모 공단에서 배출하는 산업 폐수로 하천과 바다가 오염되었다.", "a": "O", "e": ""}, {"n": 175, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "자동차가 증가하고 연탄 사용이 늘어나면서 대기 오염이 심각해졌다.", "a": "O", "e": ""}, {"n": 176, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1970년대에 환경 문제가 사회 문제로 크게 부각되었다.", "a": "X", "e": "1970년대까지는 크게 부각되지 못했고, 1980년대 들어 본격적으로 대두했어요."}, {"n": 177, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1970년대 정부는 경제 개발을 우선시하며 환경 운동을 억압하였다.", "a": "O", "e": ""}, {"n": 178, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1970년대에는 공단이 밀집된 부산, 울산, 여수 등지에서 주민 중심의 피해 보상 운동이 일어났다.", "a": "O", "e": ""}, {"n": 179, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1982년 우리나라 최초의 민간 환경 운동 단체인 한국 공해 문제 연구소가 탄생하였다.", "a": "O", "e": ""}, {"n": 180, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "한국 공해 문제 연구소는 정부가 설치한 환경 전담 기구이다.", "a": "X", "e": "최초의 민간 환경 운동 단체예요. 정부의 환경 전담 기구는 환경청(1980)이에요."}, {"n": 181, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1985년 공론화된 온산병 사태로 환경 오염 문제가 크게 주목받았다.", "a": "O", "e": ""}, {"n": 182, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "온산병은 우리나라 최초의 공해병이다.", "a": "O", "e": ""}, {"n": 183, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "한국 공해 문제 연구소는 온산 주민들이 이타이이타이병 초기 증세와 비슷한 병을 앓고 있다고 발표하였다.", "a": "O", "e": ""}, {"n": 184, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "정부는 온산병 사태 때 끝까지 공해 피해를 인정하지 않았다.", "a": "X", "e": "결국 공해 피해를 인정하고 지역 주민의 집단 이주를 결정했어요."}, {"n": 185, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "정부는 1970년대 후반부터 환경 보전법을 제정하는 등 환경 문제에 대응하기 시작하였다.", "a": "O", "e": ""}, {"n": 186, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "자연 보호 범국민 운동 궐기 대회(1977)는 민간 환경 단체가 주도하였다.", "a": "X", "e": "정부 주도로 추진되었고, 국민의 국토 청결 의무 강조에 머물렀어요."}, {"n": 187, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1980년 환경 전담 기구로 환경청이 설치되었다.", "a": "O", "e": ""}, {"n": 188, "sec": "Ⅷ. 노동 운동과 환경 문제", "q": "1980년 개정된 헌법에 환경권이 명시되었다.", "a": "O", "e": ""}, {"n": 189, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "아파트 같은 공동 주택이 늘면서 집 안에 수세식 화장실이 설치되었다.", "a": "O", "e": ""}, {"n": 190, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "서양식 부엌과 거실 중심의 생활 문화가 점차 보편화되었다.", "a": "O", "e": ""}, {"n": 191, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "세탁기, 냉장고, 가스레인지 등 가전제품이 생활의 편리함을 향상시켰다.", "a": "O", "e": ""}, {"n": 192, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "1960년대 후반에는 기성복 생산이 본격화되었다.", "a": "O", "e": ""}, {"n": 193, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "의생활에서는 한복이 서양식 의복을 대체하였다.", "a": "X", "e": "서양식 의복이 한복을 대체했어요."}, {"n": 194, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "1980년대 프로 스포츠 출범과 올림픽 유치로 스포츠 붐이 일었다.", "a": "O", "e": ""}, {"n": 195, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "1980년대 컬러텔레비전 방송 시작, 교복 자율화 등으로 패션에 대한 관심이 높아졌다.", "a": "O", "e": ""}, {"n": 196, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "아파트의 영향으로 분리되어 있던 부엌이 집 안으로 들어와 ‘주방’으로 불리게 되었다.", "a": "O", "e": ""}, {"n": 197, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "정부는 쌀 부족 문제를 해결하기 위해 혼식과 분식을 장려하였다.", "a": "O", "e": ""}, {"n": 198, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "혼분식 장려 정책으로 빵, 라면 등 밀가루 음식의 소비가 줄었다.", "a": "X", "e": "밀가루 음식의 소비가 늘었어요."}, {"n": 199, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "바쁜 도시 생활과 서구화의 흐름에 따라 가공식품이 확산되었다.", "a": "O", "e": ""}, {"n": 200, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "외식 문화가 자리 잡으면서 패스트푸드점이 늘어 갔다.", "a": "O", "e": ""}, {"n": 201, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "마이카 붐이 일면서 ‘드라이브’라는 말이 생겼다.", "a": "O", "e": ""}, {"n": 202, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "중학생과 고등학생의 수는 1960년에서 1979년까지 각각 2배, 6배로 많아졌다.", "a": "O", "e": ""}, {"n": 203, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "1960~1979년 중학생 수는 6배, 고등학생 수는 2배로 늘었다.", "a": "X", "e": "중학생 2배, 고등학생 6배예요."}, {"n": 204, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "과도한 입시 경쟁으로 사교육 열풍이 일었다.", "a": "O", "e": ""}, {"n": 205, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "박정희 정부는 1969년 중학교 무시험 추첨제를 도입하였다.", "a": "O", "e": ""}, {"n": 206, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "박정희 정부는 1973년 대도시에 고교 평준화를 실시하였다.", "a": "O", "e": ""}, {"n": 207, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "고교 평준화는 전두환 정부가 처음 실시하였다.", "a": "X", "e": "박정희 정부가 1973년 대도시에 실시했어요."}, {"n": 208, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "전두환 정부는 1981년 과외 전면 금지와 본고사 폐지, 대학 졸업 정원제를 시행하였다.", "a": "O", "e": ""}, {"n": 209, "sec": "Ⅸ. 생활 양식의 변화와 교육 기회의 확대", "q": "중학교 무시험 추첨제로 ‘뺑뺑이’라는 신조어가 생겼다.", "a": "O", "e": ""}, {"n": 210, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "1960년대에는 라디오가 대중문화를 주도하였다.", "a": "O", "e": ""}, {"n": 211, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "1970년대에는 텔레비전이 본격적으로 보급되어 여가 생활의 중심이 되었다.", "a": "O", "e": ""}, {"n": 212, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "컬러텔레비전 방송은 1970년대에 시작되었다.", "a": "X", "e": "1980년대에 시작되었어요."}, {"n": 213, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "청소년 사이에 통기타와 청바지로 대변되는 청년 문화가 생겨났다.", "a": "O", "e": ""}, {"n": 214, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "대중문화가 발달하면서 한국적 정서를 담은 영화와 대중가요가 큰 인기를 끌었다.", "a": "O", "e": ""}, {"n": 215, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "1970~1980년대 정부는 영화를 사전 검열하고 많은 대중가요를 금지곡으로 지정하였다.", "a": "O", "e": ""}, {"n": 216, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "1960년대는 미국식 팝과 트로트의 시대였다.", "a": "O", "e": ""}, {"n": 217, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "1970년대는 청년들이 이끈 포크와 록의 시대였다.", "a": "O", "e": ""}, {"n": 218, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "1980년대는 발라드, 트로트, 댄스 음악을 중심으로 삼파전 양상이 나타났다.", "a": "O", "e": ""}, {"n": 219, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "1980년대 후반에는 민중가요가 일반 대중 사이에서 주목받기 시작하였다.", "a": "O", "e": ""}, {"n": 220, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "신중현과 엽전들의 「미인」(1974)은 한국 발라드의 고전으로 평가받는다.", "a": "X", "e": "한국 록의 시초예요. 한국 발라드의 고전은 유재하의 「사랑하기 때문에」(1987)예요."}, {"n": 221, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "1970년대 거리에서는 장발과 미니스커트 단속이 이루어졌다.", "a": "O", "e": ""}, {"n": 222, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "김민기의 「늙은 군인의 노래」는 군인의 사기를 저하시킨다는 이유로 금지되었다.", "a": "O", "e": ""}, {"n": 223, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "국기 하기식 때 애국가가 나오면 행인은 멈춰 서서 국기에 대한 경례를 해야 했다.", "a": "O", "e": ""}, {"n": 224, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "야간 통행금지는 밤 12시부터 다음날 새벽 4시까지였다.", "a": "O", "e": ""}, {"n": 225, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "야간 통행금지는 1982년 1월에 해제되었다.", "a": "O", "e": ""}, {"n": 226, "sec": "Ⅹ. 대중문화의 성장과 통제·검열", "q": "박정희 정부는 일상생활과 문화를 통제하여 개인의 개성과 표현의 자유를 보장하였다.", "a": "X", "e": "비판 세력을 억누르고 독재 권력을 유지하기 위해 통제와 검열을 강화했어요."}];

50, <b class=\"k\">매년 증가<\/b>했어요."], ["ㄷ", 0, "흑자 최대는 <b class=\"k\">1988년(88.9)<\/b>이에요."], ["ㄹ", 0, "1990년 수출액은 <b class=\"k\">650으로 증가<\/b>했어요. 수입이 더 늘어 적자예요."]], "concl": "옳은 것은 ㄱ, ㄴ → ①번이에요."}, {"n": 18, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "hard": false, "typ": "밑줄 오류 찾기형", "kind": "mc", "stem": "다음 글의 밑줄 친 ㉠~㉤ 중 옳지 않은 것은? <small>[2.9점]<\/small>", "body": "<div class=\"box\">1970년대 정부는 <u>㉠포항, 울산 등 경상도 해안 지역<\/u>에 중화학 공업 단지를 조성하였다. <u>㉡제1차 석유 파동<\/u>으로 어려움을 겪었으나 중동 건설 사업 참여로 극복하였다. 그 결과 <u>㉢1977년 수출 100억 달러<\/u>를 달성하였다. 그러나 <u>㉣제2차 석유 파동과 과잉 중복 투자<\/u>로 경제 위기가 발생하였다. 1980년대 전두환 정부는 <u>㉤정부 주도의 성장 우선 정책을 더욱 강화<\/u>하였다.<\/div>", "bogi": [], "ch": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 4, "ans": "", "con": [["중화학 공업 육성 (101쪽)", ["1970년대 <b class=\"k\">3·4차<\/b> 계획: 철강·화학·기계·조선 등 <b class=\"k\">중화학 공업<\/b>", "포항, 울산 등 <b class=\"k\">경상도 해안<\/b>에 중화학 공업 단지", "<b class=\"k\">제1차 석유 파동<\/b>(1973) → <b class=\"k\">중동 건설<\/b> 참여, ‘<b class=\"k\">오일 머니<\/b>’로 극복", "1977년 수출 100억 달러, 1970년대 말 중화학 공업 비중 > 경공업", "<b class=\"k\">제2차 석유 파동<\/b>(1978) + <b class=\"k\">과잉 중복 투자<\/b> → 마이너스 성장, 물가 폭등"]], ["3저 호황 (101쪽)", ["전두환 정부: 경제 안정화, 성장 우선 정책 부분 수정, <b class=\"k\">민간 부문<\/b> 참여 확대", "중화학 공업 중복 투자 <b class=\"k\">조정<\/b>, 부실기업 <b class=\"k\">정리<\/b>", "1980년대 후반 <b class=\"k\">저달러·저유가·저금리<\/b> → <b class=\"k\">3저 호황<\/b>", "<b class=\"k\">자동차, 반도체<\/b> 등 기술 집약적 산업, 연평균 10% 넘는 성장", "<b class=\"k\">1986년 무역 수지 흑자<\/b> 전환 → 1980년대 말 호황 종료"]]], "core": "전두환 정부 = 성장 우선 정책 <b class=\"k\">부분 수정<\/b>, <b class=\"k\">민간 부문<\/b> 참여 확대", "intro": "교과서 101쪽 본문을 옮기고 한 군데만 바꾸었어요.", "fig": "", "ex": [["①", 1, "<b class=\"k\">경상도 해안<\/b>이에요."], ["②", 1, "<b class=\"k\">제1차 석유 파동<\/b>(1973)이에요."], ["③", 1, "<b class=\"k\">1977년<\/b> 100억 달러예요."], ["④", 1, "<b class=\"k\">과잉 중복 투자<\/b>예요."], ["⑤", 0, "성장 우선 정책을 <b class=\"k\">부분적으로 수정<\/b>하고 민간 참여를 늘렸어요."]], "concl": "따라서 옳지 않은 것은 ⑤번이에요."}, {"n": 19, "sec": "Ⅴ. 중화학 공업 육성과 3저 호황", "hard": false, "typ": "자료 제시 · 단일 선택형", "kind": "mc", "stem": "다음은 ‘한강의 기적’을 일궈 낸 원동력이다. 이에 대한 설명으로 옳은 것은? <small>[2.9점]<\/small>", "body": "<div class=\"box\">(가) 번영의 외길은 수출뿐이다.<br>(나) 캔두이즘(할 수 있다 정신)<br>(다) 글뤽 아우프(오늘도 무사히)<\/div>", "bogi": [], "ch": ["(가)는 기업인의 도전 정신을 상징한다.", "(나)는 파독 광부들이 서로에게 건넨 인사말이다.", "(다)는 해외에서 고생한 파독 광부·간호사 등 국민의 헌신과 관련된다.", "(가)는 내수 중심의 산업화를 강조한다.", "(나)는 정부의 저곡가 정책을 뜻한다."], "a": 2, "ans": "", "con": [["‘한강의 기적’의 원동력 (101쪽)", ["(가) 번영의 외길은 수출뿐: 정부의 <b class=\"k\">수출 주도형 산업화<\/b> 의지", "(나) 캔두이즘: 기업인의 도전 정신, <b class=\"k\">한국 기업가 정신<\/b>", "(다) 글뤽 아우프: 노동자·농민, <b class=\"k\">파독 광부·간호사<\/b> 등 국민의 헌신"]]], "core": "(가) <b class=\"k\">정부<\/b> / (나) <b class=\"k\">기업인<\/b> / (다) <b class=\"k\">땀 흘려 일한 국민<\/b>", "intro": "교과서 101쪽 탐구 ‘한강의 기적을 일궈 낸 원동력’이에요.", "fig": "", "ex": [["①", 0, "(가)는 <b class=\"k\">정부<\/b>의 수출 주도형 산업화 의지예요."], ["②", 0, "(나)는 <b class=\"k\">기업인<\/b>의 도전 정신이에요."], ["③", 1, "(다)는 <b class=\"k\">파독 광부·간호사<\/b> 등의 헌신이에요."], ["④", 0, "<b class=\"k\">수출 주도형<\/b>이에요."], ["⑤", 0, "(나)는 <b class=\"k\">한국 기업가 정신<\/b>이에요."]], "concl": "따라서 정답은 ③번이에요."}, {"n": 20, "sec": "Ⅵ. 고도성장 이면의 그림자", "hard": false, "typ": "<보기> 조합형", "kind": "mc", "stem": "고도성장 이면에 나타난 문제점으로 옳은 것만을 <보기>에서 고른 것은? <small>[2.9점]<\/small>", "body": "", "bogi": ["성장에 밀려 분배가 제대로 이루어지지 않아 빈부 격차가 커졌다.", "대규모 산업 시설이 영남 지방에 집중되어 지역 간 격차가 발생하였다.", "수출 중심 경제 전략으로 경제의 대외 의존도가 낮아졌다.", "재벌이 정경 유착과 경제 독점으로 중소기업의 성장을 저해하였다."], "ch": ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 3, "ans": "", "con": [["고도성장 이면의 그림자 (102쪽)", ["정부 주도·<b class=\"k\">성장 위주<\/b> → <b class=\"k\">분배<\/b> 소홀: 저임금, 열악한 작업 환경, <b class=\"k\">빈부 격차<\/b> 확대", "도시–농촌 소득 격차, 산업 시설 <b class=\"k\">영남<\/b> 집중 → <b class=\"k\">지역 간 격차<\/b>", "특혜 받은 대기업 → <b class=\"k\">재벌<\/b>: 성장에 일조 / <b class=\"k\">정경 유착<\/b>·경제 독점", "외국 자본 의존 → <b class=\"k\">외채 부담<\/b>, 수출 중심 → <b class=\"k\">대외 의존도<\/b> 심화"]]], "core": "그림자 = <b class=\"k\">빈부 격차<\/b>, <b class=\"k\">지역 격차<\/b>, <b class=\"k\">재벌·정경 유착<\/b>, <b class=\"k\">외채·대외 의존도<\/b>", "intro": "교과서 102쪽 ‘고도성장 이면의 그림자’예요.", "fig": "", "ex": [["ㄱ", 1, "<b class=\"k\">분배<\/b> 소홀 → 빈부 격차예요."], ["ㄴ", 1, "<b class=\"k\">영남<\/b> 집중 → 지역 간 격차예요."], ["ㄷ", 0, "대외 의존도가 <b class=\"k\">심화<\/b>되었어요."], ["ㄹ", 1, "<b class=\"k\">정경 유착<\/b>과 경제 독점이에요."]], "concl": "옳은 것은 ㄱ, ㄴ, ㄹ → ④번이에요."}, {"n": 21, "sec": "Ⅵ. 고도성장 이면의 그림자", "hard": false, "typ": "사료 비교 · 단일 선택형", "kind": "mc", "stem": "다음 자료에 대한 설명으로 옳은 것은? <small>[3.0점]<\/small>", "body": "<div class=\"box\"><b>자료 1<\/b> …… 경제가 일정 수준에 올라 중산층이 두터워져야 민주주의가 발전할 수 있다는 것이다. 그런 점에서 자유를 부득이 유보하고 경제 발전을 우선시한 박 전 대통령의 생각은 옳았다는 것이다.<div class=\"src\">- 『주간조선』, 1999 -<\/div><\/div><div class=\"box\"><b>자료 2<\/b> 경제 개발이라는 미명 아래 가혹한 인권 탄압과 고문, 유신 독재로 …… 부익부 빈익빈, 정경 유착의 왜곡된 경제 구조와 오늘의 경제 위기도 박정희 정권의 잘못된 경제 정책에 기인한 바 크다.<div class=\"src\">- 김영삼 전 대통령, 1999 -<\/div><\/div>", "bogi": [], "ch": ["자료 1은 자유를 유보하고 경제 발전을 우선시한 것을 옳았다고 본다.", "자료 2는 경제 발전이 민주주의 발전보다 먼저라고 본다.", "자료 1은 정경 유착의 경제 구조를 비판한다.", "자료 2는 박정희 정부의 경제 정책을 높이 평가한다.", "두 자료 모두 유신 독재를 긍정적으로 평가한다."], "a": 0, "ans": "", "con": [["박정희 정부 경제 정책 평가 (102쪽)", ["긍정: 중산층이 두터워져야 민주주의 발전 → 자유 유보, <b class=\"k\">경제 발전 우선<\/b>은 옳았다", "부정(김영삼): 인권 탄압·유신 독재, <b class=\"k\">정경 유착<\/b>의 왜곡된 경제 구조", "부정 요지: <b class=\"k\">민주주의 발전의 토대 위<\/b>에서 진정한 경제 발전 가능"]]], "core": "자료 1 = <b class=\"k\">경제 발전 우선<\/b>(긍정) / 자료 2 = <b class=\"k\">민주주의 토대 위<\/b>(부정)", "intro": "교과서 102쪽 탐구 ‘박정희 정부의 성장 중심 경제 정책에 대한 평가’예요.", "fig": "", "ex": [["①", 1, "<b class=\"k\">경제 발전 우선<\/b>이 옳았다고 봐요."], ["②", 0, "자료 2는 <b class=\"k\">민주주의 발전의 토대 위<\/b>에서 경제 발전이 가능하다고 봐요."], ["③", 0, "정경 유착 비판은 <b class=\"k\">자료 2<\/b>예요."], ["④", 0, "자료 2는 <b class=\"k\">부정적<\/b> 평가예요."], ["⑤", 0, "자료 2는 유신 독재를 <b class=\"k\">비판<\/b>해요."]], "concl": "따라서 정답은 ①번이에요."}, {"n": 22, "sec": "Ⅵ. 고도성장 이면의 그림자", "hard": false, "typ": "자료 제시 · 단일 선택형", "kind": "mc", "stem": "다음 자료와 같은 산업 단지 배치가 가져온 문제로 가장 적절한 것은? <small>[2.9점]<\/small>", "body": "<div class=\"box\">[1980년대 국가 주요 산업 단지] 경부 고속 국도를 축으로 수도권(인천, 안산 등)과 영남 지역(포항, 울산, 창원, 거제 등)에 산업 단지가 몰려 있다.<\/div>", "bogi": [], "ch": ["도시 인구가 감소하였다.", "외채 부담이 줄어들었다.", "지역 간 경제 격차가 발생하였다.", "재벌 중심의 산업 구조가 해체되었다.", "농촌 인구가 크게 늘어났다."], "a": 2, "ans": "", "con": [["고도성장 이면의 그림자 (102쪽)", ["정부 주도·<b class=\"k\">성장 위주<\/b> → <b class=\"k\">분배<\/b> 소홀: 저임금, 열악한 작업 환경, <b class=\"k\">빈부 격차<\/b> 확대", "도시–농촌 소득 격차, 산업 시설 <b class=\"k\">영남<\/b> 집중 → <b class=\"k\">지역 간 격차<\/b>", "특혜 받은 대기업 → <b class=\"k\">재벌<\/b>: 성장에 일조 / <b class=\"k\">정경 유착<\/b>·경제 독점", "외국 자본 의존 → <b class=\"k\">외채 부담<\/b>, 수출 중심 → <b class=\"k\">대외 의존도<\/b> 심화"]], ["급격한 도시화와 부작용 (103쪽)", ["농촌 인구 → 대도시·신흥 공업 도시, <b class=\"k\">1970년대 중엽<\/b> 이후 도시 인구 > 농촌 인구", "<b class=\"k\">주거난·도시 빈민<\/b> → ‘판자촌’, ‘달동네’", "대규모 <b class=\"k\">아파트 단지<\/b> 건설 → 철거민 저항 → <b class=\"k\">광주 대단지 사건<\/b>", "광주 대단지 사건: <b class=\"k\">1971. 8.<\/b>, <b class=\"k\">경기도 광주<\/b>, 주민 5만여 명 시위, 23명 구속", "교통·공해·쓰레기 → 지하철(<b class=\"k\">1호선 1974<\/b>), 고속 국도, 소각장"]]], "core": "산업 시설 <b class=\"k\">영남 집중<\/b> → <b class=\"k\">지역 간 격차<\/b>", "intro": "교과서 102쪽 지도 ‘1980년대 국가 주요 산업 단지’예요.", "fig": "", "ex": [["①", 0, "도시 인구는 <b class=\"k\">증가<\/b>했어요."], ["②", 0, "외채 부담은 <b class=\"k\">증가<\/b>했어요."], ["③", 1, "<b class=\"k\">지역 간 격차<\/b>가 발생했어요."], ["④", 0, "재벌 중심 구조가 <b class=\"k\">형성<\/b>되었어요."], ["⑤", 0, "농촌 인구는 도시로 <b class=\"k\">이동<\/b>했어요."]], "concl": "따라서 정답은 ③번이에요."}, {"n": 23, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "hard": false, "typ": "사료 제시 · 단일 선택형", "kind": "mc", "stem": "다음 자료에 나타난 사건으로 옳은 것은? <small>[2.8점]<\/small>", "body": "<div class=\"box\">서울시가 판자촌 정리 사업을 추진하면서 경기도 광주에 철거민들을 집단 이주만 시켜 놓고 방치하자, 1971년 8월 주민 5만여 명이 대규모 시위를 벌였다. 이 사건으로 주민과 경찰 100여 명이 다치고 주민 23명이 구속되었다.<\/div>", "bogi": [], "ch": ["함평 고구마 사건", "광주 대단지 사건", "YH 무역 사건", "온산병 사태", "5·18 민주화 운동"], "a": 1, "ans": "", "con": [["급격한 도시화와 부작용 (103쪽)", ["농촌 인구 → 대도시·신흥 공업 도시, <b class=\"k\">1970년대 중엽<\/b> 이후 도시 인구 > 농촌 인구", "<b class=\"k\">주거난·도시 빈민<\/b> → ‘판자촌’, ‘달동네’", "대규모 <b class=\"k\">아파트 단지<\/b> 건설 → 철거민 저항 → <b class=\"k\">광주 대단지 사건<\/b>", "광주 대단지 사건: <b class=\"k\">1971. 8.<\/b>, <b class=\"k\">경기도 광주<\/b>, 주민 5만여 명 시위, 23명 구속", "교통·공해·쓰레기 → 지하철(<b class=\"k\">1호선 1974<\/b>), 고속 국도, 소각장"]]], "core": "<b class=\"k\">광주 대단지 사건<\/b> = 1971. 8., <b class=\"k\">경기도 광주<\/b>, 철거민 방치", "intro": "교과서 103쪽 용어 풀이 ‘광주 대단지 사건’이에요.", "fig": "", "ex": [["①", 0, "<b class=\"k\">농민<\/b> 운동(1976~1978)이에요."], ["②", 1, "<b class=\"k\">도시 빈민<\/b>의 생존권 투쟁이에요."], ["③", 0, "<b class=\"k\">노동<\/b> 운동(1979)이에요."], ["④", 0, "<b class=\"k\">공해병<\/b>(1985)이에요."], ["⑤", 0, "<b class=\"k\">전라남도 광주<\/b>, 1980년이에요."]], "concl": "따라서 정답은 ②번이에요."}, {"n": 24, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "hard": false, "typ": "밑줄 오류 찾기형", "kind": "mc", "stem": "다음 글의 밑줄 친 ㉠~㉤ 중 옳지 않은 것은? <small>[2.9점]<\/small>", "body": "<div class=\"box\">도시와 농촌 간의 격차가 커지자 정부는 <u>㉠‘근면, 자조, 협동’<\/u>을 구호로 내걸고 새마을 운동을 추진하였다(1970). 새마을 운동은 <u>㉡주택 개량, 도로 확충<\/u> 등 농촌의 생활 환경 개선에 일정한 성과를 거두었다. 그러나 <u>㉢농가 소득이 크게 향상되지 못하였고<\/u>, <u>㉣점차 국민정신 운동으로 변하면서<\/u> <u>㉤6월 민주 항쟁의 원동력이 되었다<\/u>는 평가를 받았다.<\/div>", "bogi": [], "ch": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 4, "ans": "", "con": [["성장에서 소외된 농촌과 농민 운동 (104쪽)", ["<b class=\"k\">저곡가 정책<\/b>: 저임금 유지 위해 쌀값을 낮게 책정", "<b class=\"k\">새마을 운동<\/b>(1970, ‘근면, 자조, 협동’): 주택 개량·도로 확충 성과", "한계: 농가 소득 향상 X, 국민정신 운동 → <b class=\"k\">유신 체제<\/b> 유지에 이용", "<b class=\"k\">함평 고구마 사건<\/b>(1976~1978): 농협 수매 약속 위반 → 3년 투쟁, 보상", "농협 민주화, 농가 부채 탕감, 1980년대 <b class=\"k\">농산물 수입 개방 반대<\/b>"]]], "core": "새마을 운동의 한계 = 소득 향상 X, <b class=\"k\">유신 체제 유지<\/b>에 이용", "intro": "교과서 104쪽 본문을 옮기고 한 군데만 바꾸었어요.", "fig": "", "ex": [["①", 1, "‘<b class=\"k\">근면, 자조, 협동<\/b>’이에요."], ["②", 1, "<b class=\"k\">주택 개량, 도로 확충<\/b>이에요."], ["③", 1, "소득은 크게 향상되지 <b class=\"k\">못했어요<\/b>."], ["④", 1, "<b class=\"k\">국민정신 운동<\/b>으로 변했어요."], ["⑤", 0, "<b class=\"k\">유신 체제 유지<\/b>에 이용되었다는 지적을 받았어요."]], "concl": "따라서 옳지 않은 것은 ⑤번이에요."}, {"n": 25, "sec": "Ⅶ. 급격한 도시화와 농민 운동", "hard": false, "typ": "사진 자료 · 단일 선택형", "kind": "mc", "stem": "다음 사건이 일어난 시기 농촌의 상황으로 옳은 것은? <small>[2.9점]<\/small>", "body": "<div class=\"box\">[사진] 피해 보상을 요구하며 시위 중인 함평 농민 – 농협이 고구마 전량을 사들 ss=\"box\">본인은 …… 임기 중 개헌이 불가능하다고 판단하고 현행 헌법에 따라 내년 2월 25일 본인의 임기 만료와 더불어 후임자에게 정부를 이양할 것을 천명하는 바입니다. …… 소모적인 개헌 논의를 지양할 것을 선언합니다.<div class=\"src\">- 전두환 특별 담화, 1987. 4. 13. -<\/div><\/div><p class=\"note\">※ 교과서에 언급된 내용만을 활용하여 정확히 서술할 것.<br>※ 주요 키워드(직선제 개헌 운동, 6·29 선언, 평화적 정부 이양)는 반드시 사용할 것.<br>※ ① 3점, ② 3점. 요구된 내용 외 추가 서술 시 오류 발생하면 감점.<\/p>", "bogi": [], "ch": [], "a": -1, "ans": "서술형", "con": [["민주화와 개헌을 향한 열망 (97쪽)", ["정부 말 각종 <b class=\"k\">권력형 부정<\/b>과 비리 사건", "<b class=\"k\">부천 경찰서 성 고문 사건<\/b>(1986) → <b class=\"k\">보도 지침<\/b>(1986. 7. 17.): 보도 여부·제목·용어·분량 통제", "국민 직접 선출 인식 확산 → 야당·민주화 진영 <b class=\"k\">직선제 개헌 운동<\/b>", "<b class=\"k\">4·13 호헌 조치<\/b>(1987): 직선제 개헌 논의 자체 <b class=\"k\">금지<\/b>", "<b class=\"k\">박종철 고문치사<\/b>(1987. 1.) → 경찰 은폐·조작 드러남 → 국민 분노 폭발"]], ["6월 민주 항쟁 (98쪽)", ["<b class=\"k\">민주 헌법 쟁취 국민운동 본부<\/b> 결성 → 직선제 개헌·고문 살인 정권 퇴진 운동", "<b class=\"k\">이한열<\/b> 최루탄 피격(1987. 6. 9.) → 민주화 요구 거세짐", "<b class=\"k\">6·10 국민 대회<\/b>: 범국민 민주 항쟁 선언, 전국 대규모 시위", "명동 성당·지방 도시 시위 → ‘<b class=\"k\">독재 타도<\/b>’, ‘<b class=\"k\">호헌 철폐<\/b>’", "<b class=\"k\">6·29 선언<\/b>(민주 정의당 대표 <b class=\"k\">노태우<\/b>): 직선제 개헌 수용, 1988. 2. 평화적 정부 이양", "의의: 군사 독재 종식, <b class=\"k\">평화적 정권 교체<\/b>의 길, 성숙한 시민 사회의 주춧돌"]]], "core": "직선제 개헌 운동 → <b class=\"k\">4·13 호헌 조치<\/b> → 6월 민주 항쟁 → <b class=\"k\">6·29 선언<\/b>", "intro": "다음처럼 두 요소를 나누어 쓰면 돼요.", "fig": "", "ex": [["①", 1, "정부에 대한 불신 속에 야당과 민주화 운동 진영이 대통령 <b class=\"k\">직선제 개헌 운동<\/b>을 본격적으로 전개하자, 전두환 정부가 직선제 개헌 논의 자체를 <b class=\"k\">금지<\/b>하기 위해 발표하였다. (3점)"], ["②", 1, "<b class=\"k\">6·29 선언<\/b>: 민주 정의당 대표 노태우가 대통령 <b class=\"k\">직선제 개헌<\/b>을 수용하고 1988년 2월 <b class=\"k\">평화적 정부 이양<\/b>을 약속하였다. (3점)"]], "concl": "채점 포인트: 직선제 개헌 운동, 개헌 논의 금지, 6·29 선언, 직선제, 평화적 정부 이양"}, {"n": 41, "sec": "Ⅺ. 고난도 대비 유형", "hard": true, "typ": "서술형", "kind": "essay", "stem": "1960~1980년대 정부 주도의 성장 위주 경제 정책이 가져온 문제점을 ① 분배 및 지역 측면과 ② 기업 구조 및 대외 경제 측면으로 나누어 서술하시오. <small>[6.0점]<\/small>", "body": "<div class=\"box\">1960~1980년대 한국은 높은 경제 성장률을 보이며 고도성장을 이룩하였다. 그러나 정부 주도로 성장 위주의 경제 정책이 추진되는 과정에서 여러 가지 문제점이 나타났다.<\/div><p class=\"note\">※ 교과서에 언급된 내용만을 활용하여 정확히 서술할 것.<br>※ 주요 키워드(빈부 격차, 영남, 재벌, 정경 유착, 대외 의존도)는 반드시 사용할 것.<br>※ ① 3점, ② 3점.<\/p>", "bogi": [], "ch": [], "a": -1, "ans": "서술형", "con": [["고도성장 이면의 그림자 (102쪽)", ["정부 주도·<b class=\"k\">성장 위주<\/b> → <b class=\"k\">분배<\/b> 소홀: 저임금, 열악한 작업 환경, <b class=\"k\">빈부 격차<\/b> 확대", "도시–농촌 소득 격차, 산업 시설 <b class=\"k\">영남<\/b> 집중 → <b class=\"k\">지역 간 격차<\/b>", "특혜 받은 대기업 → <b class=\"k\">재벌<\/b>: 성장에 일조 / <b class=\"k\">정경 유착<\/b>·경제 독점", "외국 자본 의존 → <b class=\"k\">외채 부담<\/b>, 수출 중심 → <b class=\"k\">대외 의존도<\/b> 심화"]]], "core": "<b class=\"k\">빈부·지역 격차<\/b> / <b class=\"k\">재벌·정경 유착<\/b>, <b class=\"k\">외채·대외 의존도<\/b>", "intro": "다음처럼 두 측면을 나누어 쓰면 돼요.", "fig": "", "ex": [["①", 1, "성장에 밀려 분배가 제대로 이루어지지 않아 <b class=\"k\">빈부 격차<\/b>가 커졌고, 도시와 농촌 간 소득 격차가 커졌으며, 산업 시설이 <b class=\"k\">영남<\/b> 지방에 집중되어 지역 간 격차가 발생하였다. (3점)"], ["②", 1, "특혜를 받은 대기업이 <b class=\"k\">재벌<\/b>로 성장하여 <b class=\"k\">정경 유착<\/b>과 경제 독점으로 공정 경쟁과 중소기업 성장을 저해하였고, 외채 부담 증가와 함께 경제의 <b class=\"k\">대외 의존도<\/b>가 심화되었다. (3점)"]], "concl": "채점 포인트: 빈부 격차, 영남(지역 격차), 재벌, 정경 유착, 대외 의존도"}, {"n": 42, "sec": "Ⅺ. 고난도 대비 유형", "hard": true, "typ": "순서 쓰기 단답형", "kind": "sa", "stem": "다음 사건을 일어난 순서대로 기호를 쓰시오. <small>[3.5점]<\/small>", "body": "<div class=\"box\">(가) 6·29 선언 &nbsp;&nbsp;(나) 박종철 고문치사 사건 &nbsp;&nbsp;(다) 4·13 호헌 조치<br>(라) 부천 경찰서 성 고문 사건 보도 지침 &nbsp;&nbsp;(마) 민주 헌법 쟁취 국민운동 본부 결성<br>(바) 이한열 최루탄 피격 &nbsp;&nbsp;(사) 6·10 국민 대회 &nbsp;&nbsp;(아) 박종철 사건 은폐·조작 폭로<\/div>", "bogi": [], "ch": [], "a": -1, "ans": "(라) → (나) → (다) → (아) → (마) → (바) → (사) → (가)", "con": [["6월 민주 항쟁 과정 (연표)", ["1986. 7. 보도 지침 → 1987. 1. 박종철 고문치사 → 4. <b class=\"k\">4·13 호헌 조치<\/b>", "5. 은폐·조작 폭로 → 5. <b class=\"k\">국민운동 본부<\/b> 결성 → 6. 9. 이한열 피격", "6. 10. <b class=\"k\">6·10 국민 대회<\/b> → 6. 29. <b class=\"k\">6·29 선언<\/b>"]], ["박종철 고문치사 사건 (참고)", ["1987. 1. 14. 남영동 대공분실에서 고문받다 숨짐", "1. 16. 경찰 발표 “<b class=\"k\">탁 하고 치니 억 하고 죽었다<\/b>”", "4. 13. 4·13 호헌 조치 → 5. 18. 은폐·조작 폭로(천주교 정의 구현 전국 사제단)"]]], "core": "보도 지침 → 박종철 → <b class=\"k\">4·13<\/b> → 폭로 → <b class=\"k\">본부 결성<\/b> → 이한열 → <b class=\"k\">6·10<\/b> → <b class=\"k\">6·29<\/b>", "intro": "1986년과 1987년을 나누어 정리해요.", "fig": "", "ex": [["(라)", 1, "1986. 7. <b class=\"k\">보도 지침<\/b>"], ["(나)", 1, "1987. 1. <b class=\"k\">박종철<\/b> 고문치사"], ["(다)", 1, "1987. 4. 13. <b class=\"k\">4·13 호헌 조치<\/b>"], ["(아)", 1, "1987. 5. 18. <b class=\"k\">은폐·조작 폭로<\/b>"], ["(마)", 1, "1987. 5. 27. <b class=\"k\">국민운동 본부<\/b> 결성"], ["(바)", 1, "1987. 6. 9. <b class=\"k\">이한열<\/b> 피격"], ["(사)", 1, "1987. 6. 10. <b class=\"k\">6·10 국민 대회<\/b>"], ["(가)", 1, "1987. 6. 29. <b class=\"k\">6·29 선언<\/b>"]], "concl": "순서를 모두 맞아야 정답이에요."}, {"n": 43, "sec": "Ⅺ. 고난도 대비 유형", "hard": true, "typ": "사료 비교 · 단일 선택형", "kind": "mc", "stem": "(가), (나) 자료에 대한 설명으로 옳은 것은? <small>[3.2점]<\/small>", "body": "<div class=\"box\"><b>(가)<\/b> 2만여 명 중 40%를 차지하는 보조공들은 평균 연령 15세의 어린이들입니다. …… 하루에 90원 내지 100원의 급료를 받으며 1일 15시간씩 작업을 합니다.<\/div><div class=\"box\"><b>(나)<\/b> 이젠 5분 동안 같은 자세로 누울 수도 없고요. …… 우리는 죽을 때 죽더라도 우리 애들만은 제발 좀 살려주이소.<\/div>", "bogi": [], "ch": ["(가)의 작성자는 1980년대 탄광 파업을 이끌었다.", "(가)는 YH 무역 사건 이후의 노동 실태를 보여 준다.", "(나)와 관련된 사태는 우리나라 최초의 공해병으로 알려졌다.", "(나)의 사태에서 정부는 끝까지 공해 피해를 부정하였다.", "(가), (나)는 모두 1970년대 초에 작성되었다."], "a": 2, "ans": "", "con": [["노동 운동의 전개 (104쪽)", ["저임금·장시간 노동 → <b class=\"k\">전태일<\/b> 분신(1970, 평화 시장, ‘<b class=\"k\">근로 기준법 준수<\/b>’)", "지식인·대학생 관심 → 노동 운동 본격화 → 노동조합 결성, <b class=\"k\">생존권<\/b> 보장 요구", "<b class=\"k\">YH 무역 사건<\/b>(1979) 등", "1980년대: <b class=\"k\">최저 임금 인상<\/b>·근로 조건 개선 파업(탄광·공장) → <b class=\"k\">사회적·정치적 투쟁<\/b>"]], ["환경 문제의 대두 (105쪽)", ["산업 폐수 → 하천·바다 오염 / 매연·자동차·연탄 → 대기 오염", "1970년대: 정부 <b class=\"k\">경제 개발<\/b> 우선, 환경 운동 <b class=\"k\">억압<\/b>", "<b class=\"k\">한국 공해 문제 연구소<\/b>(1982, 최초 민간 환경 단체) → 반공해 운동", "<b class=\"k\">온산병<\/b>(1985 공론화, 최초 공해병) → 정부 피해 인정, 집단 이주", "정부: <b class=\"k\">환경 보전법<\/b>, 자연 보호 범국민 운동(1977, <b class=\"k\">정부 주도<\/b>), <b class=\"k\">환경청<\/b>(1980), 헌법에 <b class=\"k\">환경권<\/b>(1980)"]]], "core": "(가) <b class=\"k\">전태일 탄원서<\/b>(1969) / (나) <b class=\"k\">온산병<\/b> 주민 증언", "intro": "두 자료의 정체를 먼저 확정해요. (가)는 전태일의 탄원서(1969), (나)는 온산병 주민의 증언이에요.", "fig": "", "ex": [["①", 0, "전태일은 <b class=\"k\">1970년<\/b> 분신했어요."], ["②", 0, "1969년 자료로 YH 무역 사건(1979)보다 <b class=\"k\">이전<\/b>이에요."], ["③", 1, "<b class=\"k\">온산병<\/b> = 우리나라 최초의 공해병이에요."], ["④", 0, "정부는 결국 피해를 <b class=\"k\">인정<\/b>하고 집단 이주를 결정했어요."], ["⑤", 0, "(나)는 <b class=\"k\">1980년대<\/b>(1985 공론화)예요."]], "concl": "따라서 정답은 ③번이에요."}, {"n": 44, "sec": "Ⅺ. 고난도 대비 유형", "hard": true, "typ": "표 정리 · <보기> 조합형", "kind": "mc", "stem": "다음 표의 (A)~(D)에 대한 설명으로 옳은 것을 <보기>에서 있는 대로 고른 것은? <small>[3.3점]<\/small>", "body": "<div class=\"tw\"><table class=\"t\"><tr><th>구분<\/th><th>1960년대<\/th><th>1970년대<\/th><th>1980년대<\/th><\/tr><tr><td>계획·정책<\/td><td>제1, 2차 경제 개발 5개년 계획<\/td><td>제3, 4차 경제 개발 5개년 계획<\/td><td>경제 안정화 정책<\/td><\/tr><tr><td>중심 산업<\/td><td>(A)<\/td><td>(B)<\/td><td>(C)<\/td><\/tr><tr><td>특징<\/td><td>베트남 특수<\/td><td>(D)<\/td><td>3저 호황<\/td><\/tr><\/table><\/div>", "bogi": ["(A)에는 신발·의류·가발 등 노동 집약적 산업이 들어간다.", "(B) 시기에 정부는 민간 부문의 참여를 늘리고 부실기업을 정리하였다.", "(C)에는 자동차·반도체 등 기술 집약적 산업이 들어간다.", "(D)에는 ‘제1차 석유 파동 → 중동 건설 참여로 극복’이 들어갈 수 있다.", "(C) 시기에 무역 수지가 처음으로 적자로 전환하였다."], "ch": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㅁ", "ㄱ, ㄴ, ㄹ, ㅁ"], "a": 2, "ans": "", "con": [["정부 주도의 경제 개발 (100쪽)", ["1950년대 말 미국 <b class=\"k\">원조 감소<\/b> → 불황", "<b class=\"k\">장면 내각<\/b>: 경제 개발 계획 수립 → 재정 취약·5·16으로 <b class=\"k\">실행 못함<\/b>", "군부: 정당성 확보 위해 경제 개발 → <b class=\"k\">경제 개발 5개년 계획<\/b>(1962~), <b class=\"k\">정부 주도·수출 주도형<\/b>", "1960년대(1·2차): 차관 → 신발·의류·가발 등 <b class=\"k\">노동 집약적 산업<\/b>", "세계 경제 호황 + <b class=\"k\">베트남 특수<\/b>, 서독 광부·간호사 파견", "시멘트·정유 산업, <b class=\"k\">경부 고속 국도<\/b>(1970) 등 사회 간접 자본", "1977년 말 <b class=\"k\">수출 100억 달러<\/b>(10억 달러 달성 후 <b class=\"k\">7년<\/b> 만)"]], ["중화학 공업 육성 (101쪽)", ["1970년대 <b class=\"k\">3·4차<\/b> 계획: 철강·화학·기계·조선 등 <b class=\"k\">중화학 공업<\/b>", "포항, 울산 등 <b class=\"k\">경상도 해안<\/b>에 중화학 공업 단지", "<b class=\"k\">제1차 석유 파동<\/b>(1973) → <b class=\"k\">중동 건설<\/b> 참여, ‘<b class=\"k\">오일 머니<\/b>’로 극복", "1977년 수출 100억 달러, 1970년대 말 중화학 공업 비중 > 경공업", "<b class=\"k\">제2차 석유 파동<\/b>(1978) + <b class=\"k\">과잉 중복 투자<\/b> → 마이너스 성장, 물가 폭등"]], ["3저 호황 (101쪽)", ["전두환 정부: 경제 안정화, 성장 우선 정책 부분 수정, <b class=\"k\">민간 부문<\/b> 참여 확대", "중화학 공업 중복 투자 <b class=\"k\">조정<\/b>, 부실기업 <b class=\"k\">정리<\/b>", "1980년대 후반 <b class=\"k\">저달러·저유가·저금리<\/b> → <b class=\"k\">3저 호황<\/b>", "<b class=\"k\">자동차, 반도체<\/b> 등 기술 집약적 산업, 연평균 10% 넘는 성장", "<b class=\"k\">1986년 무역 수지 흑자<\/b> 전환 → 1980년대 말 호황 종료"]]], "core": "(A) <b class=\"k\">노동 집약<\/b> (B) <b class=\"k\">중화학<\/b> (C) <b class=\"k\">기술 집약<\/b> (D) <b class=\"k\">석유 파동·중동<\/b>", "intro": "시기별 경제 특징 표를 완성한 뒤 판단해요.", "fig": "", "ex": [["ㄱ", 1, "1960년대 <b class=\"k\">노동 집약적 산업<\/b>이에요."], ["ㄴ", 0, "<b class=\"k\">1980년대<\/b> 전두환 정부의 정책이에요."], ["ㄷ", 1, "3저 호황기 <b class=\"k\">자동차·반도체<\/b>예요."], ["ㄹ", 1, "1970년대 <b class=\"k\">제1차 석유 파동<\/b> 극복이에요."], ["ㅁ", 0, "1986년 무역 수지가 <b class=\"k\">흑자<\/b>로 전환했어요."]], "concl": "옳은 것은 ㄱ, ㄷ, ㄹ → ③번이에요."}, {"n": 45, "sec": "Ⅺ. 고난도 대비 유형", "hard": true, "typ": "O, X 변형 · 단일 선택형", "kind": "mc", "stem": "다음 설명 중 옳은 것은? <small>[3.2점]<\/small>", "body": "", "bogi": [], "ch": ["1960년에서 1979년까지 중학생 수는 6배, 고등학생 수는 2배로 늘었다.", "새마을 운동은 1972년 유신 헌법 공포와 함께 시작되었다.", "광주 대단지 사건으로 주민과 경찰 100여 명이 다치고 주민 23명이 구속되었다.", "지하철 1호선은 경부 고속 국도와 같은 해에 개통되었다.", "함평 농민들은 2년간의 투쟁 끝에 피해를 보상받았다."], "a": 2, "ans": "", "con": [["급격한 도시화와 부작용 (103쪽)", ["농촌 인구 → 대도시·신흥 공업 도시, <b class=\"k\">1970년대 중엽<\/b> 이후 도시 인구 > 농촌 인구", "<b class=\"k\">주거난·도시 빈민<\/b> → ‘판자촌’, ‘달동네’", "대규모 <b class=\"k\">아파트 단지<\/b> 건설 → 철거민 저항 → <b class=\"k\">광주 대단지 사건<\/b>", "광주 대단지 사건: <b class=\"k\">1971. 8.<\/b>, <b class=\"k\">경기도 광주<\/b>, 주민 5만여 명 시위, 23명 구속", "교통·공해·쓰레기 → 지하철(<b class=\"k\">1호선 1974<\/b>), 고속 국도, 소각장"]], ["성장에서 소외된 농촌과 농민 운동 (104쪽)", ["<b class=\"k\">저곡가 정책<\/b>: 저임금 유지 위해 쌀값을 낮게 책정", "<b c
