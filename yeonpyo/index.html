<style>
/* Layout: 한 줄 세로 연표(세로 눈금선) 위에 학습 카드가 놓이는 단일 컬럼 앱 */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --paper:#1a222b; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2e3a46;
  --accent:#6fb0dc; --accent-soft:#1e3242; --seal:#e0685d; --good:#6cc492; --good-soft:#18332a; --bad-soft:#3a2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --paper:#1a222b; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2e3a46;
  --accent:#6fb0dc; --accent-soft:#1e3242; --seal:#e0685d; --good:#6cc492; --good-soft:#18332a; --bad-soft:#3a2220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:0;letter-spacing:.5px;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
.seal{flex:none;width:52px;height:52px;border:2.5px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:15px;line-height:1.05;text-align:center;transform:rotate(-6deg)}
.label{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:16px;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.tabs button{font:inherit;font-weight:700;font-size:14px;padding:10px 4px;border:0;border-right:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{margin-top:16px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.badge{display:inline-block;background:var(--bad-soft);color:var(--seal);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:2px}

/* 연표 보기 */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
ol.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);position:relative}
ol.tl li{position:relative;padding:7px 0 7px 14px}
ol.tl li::before{content:"";position:absolute;left:-25px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2.5px solid var(--accent)}
ol.tl li.key::before{background:var(--seal);border-color:var(--seal)}
.yr{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--accent);display:inline-block;min-width:78px}
.ev{font-weight:500}
.note{display:block;font-size:12.5px;color:var(--muted)}
.cover{display:inline-block;min-width:78px;height:20px;border-radius:4px;background:var(--line);vertical-align:-4px;cursor:pointer;border:0;padding:0}
.cover.ev-c{min-width:150px}
ol.tl li.yearhead::before{display:none}
.yearhead{font-family:var(--display);font-size:18px;margin:14px 0 2px -18px;padding-left:4px;color:var(--ink)}

.score{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
.choices{display:grid;gap:8px}

.choice.picked{border-color:var(--accent);background:var(--accent-soft)}
.choice.picked .n{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--seal);background:var(--bad-soft)}
.choice .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.result{margin-top:12px;padding:12px;border-radius:10px;font-size:14px}
.result.ok{background:var(--good-soft)}
.result.no{background:var(--bad-soft)}
.result b{font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.q{font-family:var(--display);font-size:20px;margin:0 0 12px;text-wrap:balance}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .choice{flex-direction:column;min-height:96px;justify-content:center;font-weight:500}

.wl{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.wl li{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:baseline}
.wl .cnt{margin-left:auto;font-size:12px;color:var(--seal);font-weight:700;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:28px 10px;border:1.5px dashed var(--line);border-radius:12px}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.choice{transition:background .15s,border-color .15s}}

</style>

let WRONG = {};
try{ WRONG = JSON.parse(localStorage.getItem("hy-wrong")||"{}")||{} }catch(e){ WRONG = {} }
function saveWrong(){ try{ localStorage.setItem("hy-wrong",JSON.stringify(WRONG)) }catch(e){} $("#wcount").textContent = Object.keys(WRONG).length }
function addWrong(ids){ ids.forEach(id=>WRONG[id]=(WRONG[id]||0)+1); saveWrong() }
saveWrong();

/* ---------- 연표 가리기 ---------- */
let hideMode = "none"; const opened = new Set();
function renderView(){
  const list = SETS[setName];
  let html = `<p class="hint">회색 칸을 누르면 하나씩 열립니다. 빨간 점은 시험 핵심 사건입니다.</p>
  <div class="tools">
    <button class="btn ${hideMode==='none'?'primary':''}" data-hide="none">모두 보기</button>
    <button class="btn ${hideMode==='year'?'primary':''}" data-hide="year">연도 가리기</button>
    <button class="btn ${hideMode==='ev'?'primary':''}" data-hide="ev">사건 가리기</button>
  </div><ol class="tl">`;
  let lastY = "";
  list.forEach(e=>{
    const y = String(e.d).slice(0,4);
    if(y!==lastY){ html += `<li class="yearhead" style="padding:0">${y}</li>`; lastY = y }
    const k = e.id;
    const yr = (hideMode==="year" && !opened.has(k)) ? `<button class="cover" data-open="${k}" aria-label="연도 보기"></button>` : `<span class="yr">${esc(e.show)}</span>`;
    const ev = (hideMode==="ev" && !opened.has(k)) ? `<button class="cover ev-c" data-open="${k}" aria-label="사건 보기"></button>` : `<span class="ev">${esc(e.ev)}</span>${e.note?`<span class="note">${esc(e.note)}</span>`:""}`;
    html += `<li class="${e.key?'key':''}">${yr} ${ev}</li>`;
  });
  html += `</ol>`;
  $("#p-view").innerHTML = html;
}
$("#p-view").addEventListener("click",ev=>{
  const h = ev.target.closest("[data-hide]"); if(h){ hideMode = h.dataset.hide; opened.clear(); renderView(); return }
  const o = ev.target.closest("[data-open]"); if(o){ opened.add(o.dataset.open); renderView() }
});

/* ---------- 순서 맞추기 ---------- */
let ord = null, ordLevel = "hard", ordScore = {ok:0,total:0};
function pickOrder(){
  const list = SETS[setName];
  let pool;
  if(ordLevel==="hard"){ // 가까운 시기 5개 연속
    const s = Math.floor(Math.random()*(list.length-5+1));
    pool = list.slice(s,s+5);
  } else {
    pool = shuffle(list).slice(0,5);
  }
  // 같은 날짜 중복 제거 후 부족하면 다시
  const ds = new Set(pool.map(e=>e.d)); if(ds.size<5) return pickOrder();
  const items = shuffle(pool);
  ord = {items, picked:[], done:false};
}
function renderOrder(){
  if(!ord) pickOrder();
  const lab = "가나다라마";
  let html = `<p class="hint">일어난 순서대로 하나씩 누르세요. 다시 누르면 취소됩니다.</p>
  <div class="tools"><button class="btn ${ordLevel==='hard'?'primary':''}" data-lv="hard">고난도 · 가까운 시기</button><button class="btn ${ordLevel==='easy'?'primary':''}" data-lv="easy">기본 · 전체 범위</button></div>
  <div class="card"><div class="score"><span>순서 맞추기</span><span>맞힌 문제 ${ordScore.ok} / ${ordScore.total}</span></div><div class="choices">`;
  const correct = [...ord.items].sort((a,b)=>a.d-b.d);
  ord.items.forEach((e,i)=>{
    const p = ord.picked.indexOf(i);
    let cls = p>=0 ? "picked" : "";
    if(ord.done){ cls = (correct[p]===e) ? "right" : "wrong" }
    html += `<button class="choice ${cls}" data-pick="${i}" ${ord.done?'disabled':''}><span class="n">${p>=0?p+1:""}</span><span>(${lab[i]}) ${esc(e.ev)}${ord.done?`<span class="d">${esc(e.show)}</span>`:""}</span></button>`;
  });
  html += `</div>`;
  if(ord.done){
    const ok = ord.picked.every((idx,k)=>ord.items[idx]===correct[k]);
    const ans = correct.map(e=>"("+lab[ord.items.indexOf(e)]+")").join(" → ");
    html += `<div class="result ${ok?'ok':'no'}"><b>${ok?'정답입니다':'다시 확인하세요'}</b><br>정답 순서: ${ans}<br>${correct.map(e=>`<span class="d" style="font-family:var(--mono);font-size:12.5px">${esc(e.show)}</span> ${esc(e.ev)}`).join("<br>")}</div>
    <div class="row"><button class="btn primary" data-next>다음 문제</button></div>`;
  } else {
    html += `<div class="row"><button class="btn primary" data-check ${ord.picked.length<5?'disabled':''}>채점하기</button><button class="btn" data-reset>다시 고르기</button><button class="btn" data-next>다른 문제</button></div>`;
  }
  html += `</div>`;
  $("#p-order").innerHTML = html;
}
$("#p-order").addEventListener("click",ev=>{
  const t = ev.target;
  const lv = t.closest("[data-lv]"); if(lv){ ordLevel = lv.dataset.lv; ord=null; renderOrder(); return }
  const pk = t.closest("[data-pick]");
  if(pk && !ord.done){ const i = +pk.dataset.pick; const p = ord.picked.indexOf(i);
    if(p>=0) ord.picked.splice(p,1); else if(ord.picked.length<5) ord.picked.push(i); renderOrder(); return }
  if(t.closest("[data-reset]")){ ord.picked=[]; renderOrder(); return }
  if(t.closest("[data-next]")){ ord=null; renderOrder(); return }
  if(t.closest("[data-check]")){
    ord.done = true; ordScore.total++;
    const correct = [...ord.items].sort((a,b)=>a.d-b.d);
    const ok = ord.picked.every((idx,k)=>ord.items[idx]===correct[k]);
    if(ok) ordScore.ok++; else addWrong(ord.picked.filter((idx,k)=>ord.items[idx]!==correct[k]).map(idx=>ord.items[idx].id));
    renderOrder();
  }
});

/* ---------- 먼저? 나중? ---------- */
let ab = null, abScore = {ok:0,total:0,streak:0};
function pickAB(){
  const list = SETS[setName];
  let i, j, tries=0;
  do{ i = Math.floor(Math.random()*list.length); j = i + (Math.random()<.5?-1:1)*(1+Math.floor(Math.random()*3)); tries++ }
  while((j<0||j>=list.length||list[i].d===list[j].d) && tries<50);
  if(j<0||j>=list.length) j = (i+1)%list.length;
  const pair = shuffle([list[i],list[j]]);
  ab = {pair, ask: Math.random()<.5 ? "먼저" : "나중에", chosen:null};
}
function renderAB(){
  if(!ab) pickAB();
  const [a,b] = ab.pair;
  const target = ab.ask==="먼저" ? (a.d<b.d?a:b) : (a.d>b.d?a:b);
  let html = `<p class="hint">가까운 시기의 두 사건이 나옵니다. 시험 직전에 빠르게 돌려 보세요.</p>
  <div class="card"><div class="score"><span>연속 정답 ${abScore.streak}</span><span>${abScore.ok} / ${abScore.total}</span></div>
  <p class="q">둘 중 <span style="color:var(--seal)">${ab.ask}</span> 일어난 사건은?</p><div class="pair">`;
  ab.pair.forEach((e,i)=>{
    let cls = "";
    if(ab.chosen!==null){ cls = e===target ? "right" : (i===ab.chosen ? "wrong" : "") }
    html += `<button class="choice ${cls}" data-ab="${i}" ${ab.chosen!==null?'disabled':''}><span>${esc(e.ev)}${ab.chosen!==null?`<span class="d">${esc(e.show)}</span>`:""}</span></button>`;
  });
  html += `</div>`;
  if(ab.chosen!==null){
    const ok = ab.pair[ab.chosen]===target;
    const first = a.d<b.d?a:b, second = a.d<b.d?b:a;
    html += `<div class="result ${ok?'ok':'no'}"><b>${ok?'정답':'오답'}</b><br>${esc(first.ev)} (${esc(first.show)}) → ${esc(second.ev)} (${esc(second.show)})${first.note||second.note?`<br><span style="color:var(--muted);font-size:13px">${esc([first.note,second.note].filter(Boolean).join(" / "))}</span>`:""}</div>
    <div class="row"><button class="btn primary" data-abnext>다음</button></div>`;
  }
  html += `</div>`;
  $("#p-ab").innerHTML = html;
}
$("#p-ab").addEventListener("click",ev=>{
  const c = ev.target.closest("[data-ab]");
  if(c && ab.chosen===null){
    ab.chosen = +c.dataset.ab; const [a,b] = ab.pair;
    const target = ab.ask==="먼저" ? (a.d<b.d?a:b) : (a.d>b.d?a:b);
    abScore.total++;
    if(ab.pair[ab.chosen]===target){ abScore.ok++; abScore.streak++ } else { abScore.streak=0; addWrong([a.id,b.id]) }
    renderAB(); return }
  if(ev.target.closest("[data-abnext]")){ ab=null; renderAB() }
});

/* ---------- 오답 ---------- */
function renderWrong(){
  const ids = Object.keys(WRONG).filter(id=>BYID[id]).sort((x,y)=>BYID[x].d-BYID[y].d);
  if(!ids.length){ $("#p-wrong").innerHTML = `<div class="empty">아직 틀린 사건이 없습니다.<br>순서 맞추기나 먼저? 나중?에서 틀린 사건이 여기에 연표 순서로 모입니다.</div>`; return }
  let html = `<p class="hint">틀린 사건을 연표 순서로 모았습니다. 숫자는 틀린 횟수입니다.</p><ul class="wl">`;
  ids.forEach(id=>{ const e = BYID[id]; html += `<li><span class="yr">${esc(e.show)}</span><span><span class="ev">${esc(e.ev)}</span>${e.note?`<span class="note">${esc(e.note)}</span>`:""}</span><span class="cnt">${WRONG[id]}회</span></li>` });
  html += `</ul><div class="row"><button class="btn" data-clear>오답 기록 지우기</button></div><div id="confirm"></div>`;
  $("#p-wrong").innerHTML = html;
}
$("#p-wrong").addEventListener("click",ev=>{
  if(ev.target.closest("[data-clear]")){ $("#confirm").innerHTML = `<div class="result no">기록을 모두 지울까요? <div class="row"><button class="btn primary" data-yes>지우기</button><button class="btn" data-no>취소</button></div></div>`; return }
  if(ev.target.closest("[data-yes]")){ WRONG = {}; saveWrong(); renderWrong(); return }
  if(ev.target.closest("[data-no]")){ $("#confirm").innerHTML = "" }
});

/* ---------- 탭·범위 ---------- */
function render(){
  ["view","order","ab","wrong"].forEach(t=>{ $("#p-"+t).hidden = t!==tab });
  ({view:renderView,order:renderOrder,ab:renderAB,wrong:renderWrong})[tab]();
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected", x===b)); render();
}));
document.querySelectorAll("#sets button").forEach(b=>b.addEventListener("click",()=>{
  setName = b.dataset.set; document.querySelectorAll("#sets button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  ord=null; ab=null; opened.clear(); render();
}));
render();
</script>

<script>
(function(){
const H=1418297543,K='lkt-yeonpyo-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
