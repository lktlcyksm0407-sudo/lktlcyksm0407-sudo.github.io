<style>

<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>O</b><i>X</i></div><h2>세계 문제와 미래 사회 3주차</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>

 "q": "문화 다양성 협약은 2001년 유네스코 총회에서 채택되었다.", "a": "X", "e": "2005년 10월 20일 제33차 총회에서 채택되었어요."}, {"n": 36, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "문화 다양성 협약은 미국과 이스라엘의 찬성으로 채택되었다.", "a": "X", "e": "미국과 이스라엘은 반대했어요."}, {"n": 37, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "문화 다양성 협약은 154개 회원국 중 148개국의 찬성으로 채택되었다.", "a": "O", "e": ""}, {"n": 38, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "우리나라는 2010년 문화 다양성 협약을 비준하였다.", "a": "O", "e": ""}, {"n": 39, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "문화 다양성 협약은 각국이 문화 정책을 수립할 자주권을 보장한다.", "a": "O", "e": ""}, {"n": 40, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "문화 다양성 협약은 문화 교류 과정의 분쟁 해결 절차를 제시한다.", "a": "O", "e": ""}, {"n": 41, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "문화 다양성 협약은 문화 강대국에 대한 지원을 명시한다.", "a": "X", "e": "문화 약소국에 대한 지원을 명시해요."}, {"n": 42, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "문화 다양성 협약은 소수 민족의 지식 체계를 유지·증진하는 것을 주요 사업으로 삼는다.", "a": "O", "e": ""}, {"n": 43, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "유네스코 협약은 한 국가 내부의 문화 다양성 문제 해결을 주된 과제로 삼는다.", "a": "X", "e": "국가 간 문화 보호주의와 문화적 격차 해소가 주된 과제예요."}, {"n": 44, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "산업 혁명 시대 프랑스로 온 이주 노동자는 대부분 유럽 출신이었다.", "a": "O", "e": ""}, {"n": 45, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스는 제2차 세계 대전으로 인한 인명 손실로 국제 노동 이주 정책을 실시하였다.", "a": "X", "e": "제1차 세계 대전이에요."}, {"n": 46, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스는 1974년 이주 노동자의 가족 합류를 허용하였다.", "a": "O", "e": ""}, {"n": 47, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스의 이주민 공동체는 주로 서남아시아 출신이다.", "a": "X", "e": "주로 마그레브(북아프리카의 모로코, 알제리, 튀니지) 출신이에요."}, {"n": 48, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스의 동화주의 시기에는 모든 학생이 동일한 교육 과정을 따르고 프랑스어를 배워야 했다.", "a": "O", "e": ""}, {"n": 49, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스의 동화주의 시기에 개인의 문화적 정체성은 공적 영역에서 다루어졌다.", "a": "X", "e": "사적 영역에서 다루어졌어요."}, {"n": 50, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스는 1980년대 후반 '차이에 대한 권리'를 인정하였다.", "a": "O", "e": ""}, {"n": 51, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스는 비종교성 원칙을 폐지하고 아랍 문화관 건립을 허용하였다.", "a": "X", "e": "비종교성 원칙을 고수하면서도 허용했어요."}, {"n": 52, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스는 이주민 자녀에게 모국어 교육을 실시하여 다언어주의의 수용을 확대하였다.", "a": "O", "e": ""}, {"n": 53, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "프랑스는 기회 균등법을 제정하여 대중 매체의 문화 다양성을 확보하였다.", "a": "O", "e": ""}, {"n": 54, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "국립 이민 문화관과 차별 퇴치 고용청은 캐나다의 제도이다.", "a": "X", "e": "프랑스의 제도예요."}, {"n": 55, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "캐나다는 1967년부터 이민 점수제를 시행하였다.", "a": "O", "e": ""}, {"n": 56, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "캐나다의 이민 점수제는 인종과 출신국을 기준으로 점수를 매긴다.", "a": "X", "e": "인종, 출신국과 무관하게 교육 수준, 언어 능력 등을 점수화해요."}, {"n": 57, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "캐나다는 다문화주의를 연방 정부의 공식 통합 정책으로 채택하였다.", "a": "O", "e": ""}, {"n": 58, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "캐나다는 규모가 큰 집단에만 재정적 지원을 하였다.", "a": "X", "e": "규모에 상관없이 모든 집단에 지원했어요."}, {"n": 59, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "캐나다는 외국 예술가를 대상으로 취업 허가를 면제하였다.", "a": "O", "e": ""}, {"n": 60, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "스웨덴은 평등, 선택의 자유, 협력의 세 가지 원칙 아래 이주민 정책을 시행하였다.", "a": "O", "e": ""}, {"n": 61, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "스웨덴은 이주민에게 모든 참정권을 완전히 인정하였다.", "a": "X", "e": "제한적인 범위 내에서 인정했어요."}, {"n": 62, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "스웨덴은 동화 전략과 다문화 정책을 병행하였다.", "a": "O", "e": ""}, {"n": 63, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "스웨덴은 성 평등 정책을 문화 다양성 정책의 일환으로 시행하였다.", "a": "O", "e": ""}, {"n": 64, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "우리나라의 무지개다리 사업은 이주민의 정착과 복지 지원이 핵심이다.", "a": "X", "e": "그것은 과거 정책이에요. 무지개다리 사업은 문화 주체 간 교류가 핵심이에요."}, {"n": 65, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "무지개다리 사업은 문화 다양성을 인권의 측면에서 바라본다.", "a": "O", "e": ""}, {"n": 66, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "q": "무지개다리 사업은 전국의 지역 문화 재단을 중심으로 운영된다.", "a": "O", "e": ""}, {"n": 67, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "지식 정보사회에서는 지적 재산이 정보로 가공되어 그 자체가 상품화된다.", "a": "O", "e": ""}, {"n": 68, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "지식 정보사회에서는 정보가 부가 가치의 원천이 된다.", "a": "O", "e": ""}, {"n": 69, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "메가트렌드는 유엔 인권 이사회가 정리하였다.", "a": "X", "e": "유럽 연합 집행 위원회가 정리했어요."}, {"n": 70, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "메가트렌드는 세계화, 인구 통계학적 변화, 기술의 가속이다.", "a": "O", "e": ""}, {"n": 71, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "고령화와 도시 이주는 세계화에 해당한다.", "a": "X", "e": "인구 통계학적 변화에 해당해요."}, {"n": 72, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "메가트렌드 중 기술의 가속이 우리 삶을 가장 빠르게 변화시키는 요소이다.", "a": "O", "e": ""}, {"n": 73, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "블록체인은 거래 내역을 중앙 서버 한 곳에 저장한다.", "a": "X", "e": "수많은 컴퓨터에 동시에 저장해요."}, {"n": 74, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "블록체인은 현재 암호 화폐 기술의 핵심이다.", "a": "O", "e": ""}, {"n": 75, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "블록체인은 앞으로 전자 투표, 화물 거래 시스템 등에 도입될 것으로 예측된다.", "a": "O", "e": ""}, {"n": 76, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "크리스퍼 유전자 가위 기술은 의료 혁신과 함께 생명 윤리 논란을 불러왔다.", "a": "O", "e": ""}, {"n": 77, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "드론은 운송, 물류, 보안 산업에 큰 변화를 가져올 것으로 예측된다.", "a": "O", "e": ""}, {"n": 78, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "소셜 미디어는 소셜 네트워크 서비스(SNS)보다 좁은 개념이다.", "a": "X", "e": "소셜 미디어가 더 광범위한 개념이에요."}, {"n": 79, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "2차 산업 혁명은 전기 기관의 발명으로 대량 생산이 가능해졌다.", "a": "O", "e": ""}, {"n": 80, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "4차 산업 혁명은 1970년대에 시작되었다.", "a": "X", "e": "4차는 2010년대예요. 1970년대는 3차예요."}, {"n": 81, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "4차 산업 혁명을 주장한 인물은 클라우스 슈밥이다.", "a": "O", "e": ""}, {"n": 82, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "전문가들은 신상 털기를 정당한 사회 정의 실현이라고 평가한다.", "a": "X", "e": "전문가들은 신상 털기도 범죄 행위라고 지적해요."}, {"n": 83, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보 인권은 정보의 유통에 관한 개인의 기본적 권리들이다.", "a": "O", "e": ""}, {"n": 84, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보 그 자체가 지배 혹은 권력의 중요한 요소가 될 수 있다.", "a": "O", "e": ""}, {"n": 85, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보 격차는 단순한 편의의 차이에 불과하다.", "a": "X", "e": "교육과 각종 활동에 참여할 기회 자체를 박탈해요."}, {"n": 86, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "우리나라는 정보 인프라 구축에 비해 관련 법률과 시민 의식이 앞서 있었다.", "a": "X", "e": "법률과 시민 의식이 인프라를 쫓아가지 못했어요."}, {"n": 87, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "우리나라 헌법재판소는 개인 정보 자기 결정권을 인정하여야 한다고 판결문에서 제시하였다.", "a": "O", "e": ""}, {"n": 88, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보 프라이버시는 자신에 관한 정보를 정보 주체가 스스로 통제할 수 있는 권리이다.", "a": "O", "e": ""}, {"n": 89, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보 프라이버시는 신체, 공간에 대한 간섭 배제만을 강조한다.", "a": "X", "e": "그것은 전통적 의미의 프라이버시예요."}, {"n": 90, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "표현의 자유가 추구하는 가치는 자기실현의 가치와 자기 통치의 민주적 가치이다.", "a": "O", "e": ""}, {"n": 91, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "표현의 자유는 경제적 자유의 핵심이다.", "a": "X", "e": "정신적 자유와 정치적 자유의 핵심이에요."}, {"n": 92, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보에 대한 접근권은 알 권리의 기초가 되는 기본권이다.", "a": "O", "e": ""}, {"n": 93, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보에 대한 접근권은 권력 분립 원리의 실질화에 기여한다.", "a": "X", "e": "국민 주권 원리의 실질화에 기여해요."}, {"n": 94, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보에 대한 접근권은 정보 격차의 해소에 관한 권리까지 포괄한다.", "a": "O", "e": ""}, {"n": 95, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보 문화 향유권은 2018년 GDPR을 계기로 구체화되었다.", "a": "X", "e": "1995년 WTO 트립스(TRIPS)를 계기로 구체화되었어요."}, {"n": 96, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "정보 문화 향유권은 과도한 지적 재산권 보호를 인권법적으로 제한하는 원리이다.", "a": "O", "e": ""}, {"n": 97, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "미국 연방 대법원은 영화 검열 자체가 곧 위헌이라고 판시하였다.", "a": "X", "e": "검열 자체가 곧 위헌은 아니고, 절차적 보장이 있어야 허용된다고 했어요."}, {"n": 98, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "미국 연방 대법원 판결에서 상영 금지의 최종 결정은 법원이 한다.", "a": "O", "e": ""}, {"n": 99, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "잊힐 권리는 정보의 삭제 및 확산 방지를 요구할 수 있는 권리이다.", "a": "O", "e": ""}, {"n": 100, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "2014년 5월 유럽 사법 재판소는 검색 엔진 이용자의 잊힐 권리를 인정하였다.", "a": "O", "e": ""}, {"n": 101, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "팀 버너스리는 웹의 힘이 잊힐 권리에 있다고 하였다.", "a": "X", "e": "웹의 힘은 보편성에 있다고 했어요."}, {"n": 102, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "잊힐 권리는 정보 프라이버시와 관련이 깊고, 알 권리와 충돌한다.", "a": "O", "e": ""}, {"n": 103, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "GDPR은 미국에서 2018년부터 시행되었다.", "a": "X", "e": "EU(유럽 연합)에서 시행되었어요."}, {"n": 104, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "GDPR에서 새롭게 등장한 권리는 처리 제한권과 정보 이동권이다.", "a": "O", "e": ""}, {"n": 105, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "GDPR은 개인 정보 처리의 목적과 수단을 결정하는 컨트롤러의 의무를 강조한다.", "a": "O", "e": ""}, {"n": 106, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "처리 제한권이 행사되면 컨트롤러는 정보를 즉시 삭제해야 한다.", "a": "X", "e": "그 정보를 보유만 할 수 있어요."}, {"n": 107, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "반대권의 내용은 정보 주체에게 최초 연락하는 시점에 알려 주어야 한다.", "a": "O", "e": ""}, {"n": 108, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "q": "프로파일링 거부권은 모든 개인 정보 처리에 반대할 권리이다.", "a": "X", "e": "자동화된 처리에 의해서만 결정하는 것에 반대할 권리예요."}],MCD=[{"n": 1, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "hard": false, "typ": "개념 이해형", "kind": "mc", "stem": "문화 다양성에 대한 설명으로 옳은 것은?", "body": "<div class=\"fig\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAIaAoADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6RooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiilcApCcUtI1MBjOwHFIJDtOetOqIj95ntSuA9JSw+lCyNk5xiosgqcHGKZklTyOKYFjzH3dsU7cc1FHIp4DA4qQtmgNhxfikZyOlMAO6ndTQA4Nkc06ojnOBUgGBQAtFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRmgAopM0tABRRRQAUUUUAFN3gHBpxqIkHPqKTAfvGaC4BqLpyelOJXPNALUfvFDMNpOeBTdopCQqn+tOwDRMhQtu+UUgYOu5Tn2FZ9zf21ucXc8VuBzl2AB9qfDex3MTSxSJLA4zG0ZyGH  방식을 포괄한다.<\/div>", "bogi": ["2005년 유네스코 총회에서 채택된 협약의 내용이다.", "문화가 예술적 창조, 생산, 보급, 배포 및 향유의 과정에서 존중되어야 함을 제시한다.", "다양한 문화를 주류 문화로 통합하는 것을 궁극적 목적으로 한다.", "미국과 이스라엘의 주도로 만장일치 채택되었다."], "ch": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 0, "ans": "", "con": [["문화 다양성 협약의 개념", ["집단과 사회의 문화가 <b class=\"k\">표현되는 다양한 방식<\/b>", "집단 내부 또는 상호 간에 전해짐", "창조, 생산, 보급, 배포, 향유 과정에서 <b class=\"k\">존중<\/b>"]]], "core": "제시문 = 2005년 협약의 문화 다양성 개념 → 인정 + 공존 + 새로운 문화 창조", "intro": "제시문은 2005년 유네스코 '문화적 표현의 다양성 보호와 증진을 위한 협약'의 개념이에요.", "ex": [["ㄱ", 1, "'문화적 표현의 다양성 보호와 증진을 위한 협약'(<b>2005년<\/b> 유네스코 총회)의 개념이에요."], ["ㄴ", 1, "협약은 문화의 가치를 인정하며 이 모든 과정에서 <b>존중<\/b>되어야 한다고 해요."], ["ㄷ", 0, "문화 다양성의 핵심 가치는 통합이 아니라 <b>공존<\/b>이에요."], ["ㄹ", 0, "미국과 이스라엘은 <b>반대<\/b>했고, 154개국 중 <b>148개국<\/b> 찬성으로 채택되었어요."]], "concl": "따라서 정답은 ①번이에요.", "fig": ""}, {"n": 3, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "hard": false, "typ": "이론 비교형", "kind": "mc", "stem": "표는 문화 다양성과 관련된 이론 A, B를 나타낸 것이다. 이에 대한 설명으로 옳은 것은? (단, A, B는 각각 문화 다원주의, 다문화주의 중 하나이다.)", "body": "<table class=\"t\"><tr><th>구분<\/th><th>특징<\/th><\/tr><tr><td>A<\/td><td>주류 문화의 존재를 인정하면서 동시에 소수 집단의 문화를 동등하게 중시한다.<\/td><\/tr><tr><td>B<\/td><td>다양한 문화 집단들의 목소리가 행정, 법, 교육, 이민, 고용 등 국가의 정책에 반영되어야 한다고 본다.<\/td><\/tr><\/table>", "bogi": [], "ch": ["A는 동화주의 정책을 뒷받침하기 위해 등장하였다.", "B는 세계화가 심화된 1990년대에 범세계적 화두로 등장하였다.", "A, B는 모두 1970년대까지 대부분 국가의 주된 이주민 정책이었다.", "A는 샐러드 볼 이론으로 비유된다.", "B는 주류 문화의 존재를 인정한다."], "a": 1, "ans": "", "con": [["문화 다원주의 = 국수 대접", ["각 문화의 고유한 가치 인정, 우열 없음", "<b class=\"k\">주류 문화 인정 O<\/b> + 소수 문화 동등 중시"]], ["다문화주의 = 샐러드 볼", ["문화 집단의 목소리를 <b class=\"k\">국가 정책에 반영<\/b>", "<b class=\"k\">주류 문화 인정 ×<\/b>, 1990년대 범세계적 화두"]]], "core": "주류 문화 인정 O = 문화 다원주의(A) / 정책 반영 = 다문화주의(B)", "intro": "A는 주류 문화를 인정하므로 <b>문화 다원주의<\/b>, B는 정책 반영을 주장하므로 <b>다문화주의<\/b>예요.", "ex": [["①", 0, "문화 다원주의는 동화주의에 <b>대항<\/b>하여 등장했어요."], ["②", 1, "다문화주의는 1970년대 이후 주요 국가에서 등장, <b>1990년대<\/b> 범세계적 화두가 되었어요."], ["③", 0, "1970년대까지 많은 국가가 펼친 정책은 <b>동화주의<\/b>예요."], ["④", 0, "A(문화 다원주의)는 <b>국수 대접 이론<\/b>, 샐러드 볼은 B(다문화주의)예요."], ["⑤", 0, "B(다문화주의)는 주류 문화의 존재를 <b>인정하지 않아요<\/b>."]], "concl": "따라서 정답은 ②번이에요.", "fig": ""}, {"n": 4, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "hard": false, "typ": "보기 조합형", "kind": "mc", "stem": "다음 글의 밑줄 친 '이 정책'에 대한 옳은 설명만을 &lt;보기&gt;에서 고른 것은?", "body": "<div class=\"mb2\">세계화의 확대로 하나의 국가 안에 다양한 민족, 인종이 공존하면서 여러 형태의 문화 갈등이 증폭되었다. 많은 국가들은 이러한 문제를 해결하기 위해 1970년대까지 <u>이 정책<\/u>을 진행하였다.<\/div>", "bogi": ["이민, 난민, 이주 노동자 집단이 그들의 언어와 생활 습관을 버리고 주류 문화에 동화되도록 지원하였다.", "각 문화의 우열이 없으며 각 문화가 고유의 가치를 지닌다고 보았다.", "문화 다원주의는 이 정책에 대항하여 등장하였다.", "다문화주의는 이 정책의 한계를 인식하고 등장하였다."], "ch": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 3, "ans": "", "con": [["문화 동화주의", ["1970년대까지 많은 국가가 진행", "이주민이 언어, 생활 습관을 버리고 <b class=\"k\">주류 문화에 동화<\/b>"]], ["동화주의 이후", ["문화 다원주의 : 동화주의에 <b class=\"k\">대항<\/b>", "다문화주의 : 동화주의의 <b class=\"k\">한계<\/b> 인식"]]], "core": "1970년대까지 = 동화주의 → 이에 대항(다원주의), 한계 인식(다문화주의)", "intro": "1970년대까지 진행된 '이 정책'은 <b>문화 동화주의<\/b>예요.", "ex": [["ㄱ", 1, "'이 정책'은 <b>문화 동화주의 정책<\/b>이에요."], ["ㄴ", 0, "이것은 <b>문화 다원주의<\/b>의 특징이에요."], ["ㄷ", 1, "동화주의에 <b>대항<\/b>하여 문화 다원주의가 등장했어요."], ["ㄹ", 1, "다문화주의도 <b>동화주의 정책의 한계<\/b>를 인식하고 1970년대 이후 등장했어요."]], "concl": "따라서 정답은 ④번이에요.", "fig": ""}, {"n": 5, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "hard": false, "typ": "옳지 않은 것", "kind": "mc", "stem": "다문화주의의 한계에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "body": "", "bogi": [], "ch": ["겉으로는 다문화주의를 표방하면서 실제로는 동화주의 정책을 펴는 경우가 있다.", "문화의 공존 자체보다 사회 통합을 궁극적인 목표로 삼는 경우가 많다.", "소수자 집단 보호를 핑계로 소수자의 주류 문화 편입을 꾀하기도 한다.", "소수 집단에 기회나 결과의 평등을 제공하는 정책이 인종주의 강화라는 결과를 낳기도 한다.", "문화의 공존 자체만을 궁극적인 목표로 삼아 사회 통합을 소홀히 한다."], "a": 4, "ans": "", "con": [["다문화주의의 한계", ["말로는 다문화, 실제는 <b class=\"k\">동화주의<\/b>", "목표가 공존이 아니라 <b class=\"k\">사회 통합<\/b>", "소수자 보호 핑계로 주류 문화 편입", "기회·결과의 평등 → <b class=\"k\">인종주의 강화<\/b>(역차별 논란)"]]], "core": "다문화주의의 한계 = 겉과 속이 다르고, 목표는 '통합', 돕는 정책이 반발을 부름", "intro": "다문화주의의 한계 4가지를 떠올리며 하나씩 확인해요.", "ex": [["①", 1, "옳은 설명이에요. 말과 실제가 다른 경우예요."], ["②", 1, "옳은 설명이에요."], ["③", 1, "옳은 설명이에 .", "ex": [["①", 0, "문화도 똑같이 취급하자는 A국이 <b>미국<\/b>, 문화적 예외를 주장한 B국이 <b>프랑스<\/b>예요."], ["②", 1, "프랑스의 '문화적 예외' 입장 그대로예요."], ["③", 0, "우루과이 라운드 협상은 <b>1986년<\/b>에 시작되었어요."], ["④", 0, "그것은 <b>A국(미국)<\/b>의 입장이에요."], ["⑤", 0, "'문화 다양성' 용어는 우루과이 라운드 협상 <b>이후<\/b> 국제 사회에 등장했어요."]], "concl": "따라서 정답은 ②번이에요.", "fig": ""}, {"n": 8, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "hard": false, "typ": "자료 해석형", "kind": "mc", "stem": "다음 선언에 대한 옳은 설명만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "body": "<div class=\"mb2\">생태 다양성이 자연에 필요한 것처럼 교류, 혁신, 창조성의 근원으로서 문화 다양성은 인류에게 필요하다. … 문화 다양성은 인류의 공동 유산이다.<\/div><div class=\"fig\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAIGAZQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6JvbyOxspbqY7Y4lLMfQVw8nxq8FQztFJqyIyHByp/wAK6nxOSPDGobevktj8q+QdR8A6/darcyR2ZdJXyGOKION7SZEr9D6VX41+Bz11mP8A75P+FSD4zeBiP+Q5CPqrf4V8zR/DHxM7YWwBI+lW4fhN4vmTdFpjED+6QK6FGm9pGXtGj6OHxl8DHrrsA/4C3+FO/wCFyeBv+g9B/wB8t/hXzZ/wq7xZgltPcY6/MKlHwn8XsoI02TDdPmFU6UF1Gqkn0Po7/hcngfHGuQn/AIC3+FN/4XL4H/6DcP8A3y3+FfOi/CXxi+SuluQOT84oHwl8XsB/xK256fPUWpfzIfNPsfRo+MngY/8AMchH/AW/woPxk8Cj/mPwf98t/hXzkfhJ4vUZ/stsDvvFOHwl8YH/AJhjev3hVclPuT7SXY+iv+Fy+Bf+g9B/3y3+FH/C5fA3/Qeg/wC+W/wr5vb4YeKVjeQ6e+xDhjuHFRy/DXxREVD6e4LDI+YdKPZw7h7SXY+lP+Fy+Bv+g9B/3y3+FL/wuXwN/wBB2H 의 한계로 <b>인종주의 강화<\/b>, 역차별 논란이 있어요."], ["⑤", 0, "다문화주의는 동화주의의 <b>한계<\/b>를 인식하고 등장했어요."]], "concl": "따라서 정답은 ④번이에요.", "fig": ""}, {"n": 24, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "hard": false, "typ": "단답형", "kind": "sa", "stem": "다음 글의 빈칸 ( &nbsp;&nbsp; )에 들어갈 용어를 쓰시오.", "body": "<div class=\"mb2\">1986년 우루과이 라운드 협상에서 미국은 문화도 다른 분야와 똑같이 취급할 것을 요구하였다. 이에 프랑스는 '문화는 교류의 대상이지 교역의 대상이 아니다.'라며 '( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )'(이)라는 입장으로 맞섰다.<\/div>", "bogi": [], "ch": [], "a": -1, "ans": "문화적 예외", "con": [["우루과이 라운드", ["미국 : 문화도 똑같이 취급", "프랑스 : <b class=\"k\">문화적 예외<\/b>"]]], "core": "문화적 예외 = 프랑스", "intro": "프랑스가 문화를 자유 무역의 '예외'로 해야 한다고 주장한 입장이에요.", "ex": [], "concl": "", "fig": ""}, {"n": 25, "sec": "Ⅰ. 다양한 문화 보호를 위한 태도", "hard": false, "typ": "서술형", "kind": "es", "stem": "다문화주의의 한계를 <u>두 가지<\/u> 서술하시오.", "body": "<div class=\"mb2\">다문화주의는 1970년대 이후 동화주의 정책의 한계를 인식하고 등장하였으며, 1990년대에는 범세계적 화두가 되었다. 그러나 다문화주의에는 여러 한계가 있다.<\/div>", "bogi": [], "ch": [], "a": -1, "ans": "① 겉으로는 다문화주의를 표방하면서 실제로는 동화주의 정책을 펴는 경우가 있다.<br>② 문화의 공존 자체보다 사회 통합을 궁극적인 목표로 삼는 경우가 많다.<br>(그 밖에) 소수자 보호를 핑계로 주류 문화 편입을 꾀하거나, 소수 집단에 기회·결과의 평등을 제공하는 정책이 인종주의 강화(역차별 논란)라는 결과를 낳기도 한다.<br><small>채점 요소 : 한계 두 가지를 정확히 서술하면 만점, 한 가지만 서술하면 부분 점수<\/small>", "con": [["다문화주의의 한계", ["표방은 다문화, 실제는 동화", "목표가 공존이 아닌 사회 통합", "보호 핑계 주류 편입", "인종주의 강화, 역차별"]]], "core": "한계 4가지 중 2가지를 정확한 표현으로!", "intro": "개념서의 다문화주의 한계 4가지 중 두 가지를 쓰면 돼요.", "ex": [], "concl": "", "fig": ""}, {"n": 26, "sec": "Ⅱ. 지식 정보사회의 문제와 해결 방안", "hard": false, "typ": "개념 이해형", "kind": "mc", "stem": "지식 정보사회에 대한 설명으로 옳은 것은?", "body": "", "bogi": [], "ch": ["토지와 노동력이 경제적 부를 창출하는 핵심 요소이다.", "정보는 주로 한 국가 안에서만 유통된다.", "과학 기술의 발달은 경제적 부와 관련이 없다.", "정보 그 자체는 상품화되지 않는다.", "초고속 정보 통신망을 통해 세계가 하나로 연결되고 정보가 부가 가치의 원천이 된다."], "a": 4, "ans": "", "con": [["지식 정보사회", ["초고속 정보 통신망 → 세계가 <b class=\"k\">하나로 연결<\/b>", "지적 재산이 정보로 가공 → <b class=\"k\">상품화<\/b> → 전 세계 유통", "<b class=\"k\">부가 가치의 원천<\/b>, 과학 기술과 정보가 부 창출"]]], "core": "지식 정보사회 = 정보 자체가 상품, 부가 가치의 원  if(pos>=total){card.innerHTML='<div class="done"><p>이번 회차 결과</p><div class="big">'+right+' / '+tried+'</div><p>틀린 문제는 자동으로 모아 두었어요.</p><div class="row"><button class="chip" id="again">처음부터 다시</button><button class="chip" id="gowrong">틀린 문제만 풀기</button></div></div>';act.innerHTML='';$('again').onclick=build;$('gowrong').onclick=()=>{wrongOnly=true;$('wrong').setAttribute('aria-pressed','true');build()};return}
 mode==='ox'?rOX(card,act,total):rMC(card,act,total)}
function nextBtn(act,total){act.innerHTML='<button class="next" id="nx">'+(pos+1<total?'다음 문제 →':'결과 보기')+'</button>';$('nx').onclick=()=>{pos++;picked=null;sel=[];render();window.scrollTo({top:0})}}

 if(picked!==null){const ok=picked===d.a;h+='<div class="result" data-k="'+d.a+'"><div class="mark">'+d.a+'</div><div><p class="verdict '+(ok?'ok':'no')+'">'+(ok?'정답이에요!':'아쉬워요. 정답은 '+d.a)+'</p><p class="exp">'+esc(d.e||'옳은 설명이에요.')+'</p></div></div>';nextBtn(act,total)}
 else{act.innerHTML='<div class="pad"><button id="bO" aria-label="O 맞다">O</button><button id="bX" aria-label="X 틀리다">X</button></div>';$('bO').onclick=()=>answer('O');$('bX').onclick=()=>answer('X')}
 card.innerHTML=h}
function panel(d,ok){return '<div class="pan"><div class="ti '+(ok?'ok':'no')+'">'+(d.kind!=='mc'?'정답 : '+d.ans:(ok?'정답이에요!':'아쉬워요. 정답은 '+ansTxt(d)))+'</div><div class="core"><b>핵심</b> '+d.core+'</div><div>'+d.intro+'</div><div class="row3">'+d.ex.map(e=>'<span>'+e[0]+'</span><span class="dot '+(e[1]?'o':'x')+'">'+(e[1]?'O':'X')+'</span><span>'+e[2]+'</span>').join('')+'</div><div class="concl">'+d.concl+'</div><details><summary>개념서 내용 보기</summary>'+d.con.map(c=>'<div class="ct">'+c[0]+'</div><ul>'+c[1].map(x=>'<li>'+x+'</li>').join('')+'</ul>').join('')+'</details></div>'}
const ansTxt=d=>Array.isArray(d.a)?d.a.map(i=>MK[i]).join(', ')+'번':MK[d.a]+'번';
let sel=[];
function rMC(card,act,total){const d=list[pos];const done=picked!==null;const multi=Array.isArray(d.a);
 let h='<div class="meta"><span class="no">'+d.n+'<em>번</em></span><span class="tag">'+(d.hard?'<span class="hardtag">고난도</span>':'')+esc(d.typ)+'</span></div><p class="stem">'+d.stem+'</p>'+(d.body?'<div class="mb tw">'+d.body+'</div>':'');
 if(d.bogi.length)h+='<div class="bg">'+d.bogi.map((s,i)=>'<div><b>'+LB[i]+'.</b> '+s+'</div>').join('')+'</div>';
 if(d.kind!=='mc'){
  if(!done){h+='<div class="saans">'+(d.kind==='sa'?'답을 공책에 쓴 뒤 정답을 확인하세요.':'서술형 답안을 공책에 쓴 뒤 모범 답안을 확인하세요.')+'</div>';act.innerHTML='<button class="next" id="reveal">정답 확인하기</button>';card.innerHTML=h;
   $('reveal').onclick=()=>{picked='r';render()};return}
  if(picked==='r'){h+=panel(d,true);act.innerHTML='<div class="selfg"><button style="background:var(--o)" id="sgO">맞혔어요</button><button style="background:var(--x)" id="sgX">틀렸어요</button></div>';card.innerHTML=h;
   $('sgO').onclick=()=>{picked=null;answer('ok')};$('sgX').onclick=()=>{picked=null;answer('no')};return}
  h+=panel(d,picked==='ok');card.innerHTML=h;nextBtn(act,total);return}
 const g=d.ch.every(c=>c.length<=4)?'g5':d.ch.every(c=>c.length<=9)?'g3':'';
 const P=Array.isArray(picked)?picked:[picked];
 h+=(multi&&!done?'<p class="saans" style="padding:8px 12px;font-size:13.5px">두 개를 고르세요. ('+sel.length+'/2)</p>':'')+'<div class="chs '+g+'">'+d.ch.map((c,i)=>{let k='';if(done){const R=multi?d.a:[d.a];if(R.includes(i))k='right';else if(P.includes(i))k='bad'}else if(sel.includes(i))k='sel';return '<button data-i="'+i+'" class="'+k+'"'+(done?' disabled':'')+'>'+MK[i]+' '+c+'</button>'}).join('')+'</div>';
 if(done){const ok=multi?(P.length===2&&d.a.every(x=>P.includes(x))):picked===d.a;h+=panel(d,ok);nextBtn(act,total)}else act.innerHTML='';
 card.innerHTML=h;if(!done)card.querySelectorAll('.chs button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
  if(!multi){answer(i);return}
  if(sel.includes(i))sel=sel.filter(x=>x!==i);else sel.push(i);
  if(sel.length===2){const v=sel.slice();sel=[];answer(v)}else render()})}
function answer(k){const d=list[pos];picked=k;tried++;let ok;
 if(mode==='ox')ok=k===d.a;else if(d.kind!=='mc')ok=k==='ok';else if(Array.isArray(d.a))ok=k.length===2&&d.a.every(x=>k.includes(x));else ok=k===d.a;
 if(ok){right++;if(wrongOnly)delete W()[d.n]}else W()[d.n]=1;save();render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));wrongOnly=false;$('wrong').setAttribute('aria-pressed','false');secs();build()});
$('sec').onchange=e=>{section=e.target.value;build()};
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);build()};
$('wrong').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);build()};
$('prev').onclick=()=>{if(pos>0){pos--;picked=null;sel=[];render();window.scrollTo({top:0})}};
let armed=false;$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}st={wrong:{ox:{},mc:{}}};save();armed=false;t.textContent='기록 초기화';wrongOnly=false;$('wrong').setAttribute('aria-pressed','false');build()};
document.addEventListener('keydown',e=>{if(/SELECT|INPUT/.test(e.target.tagName))return;if(mode==='ox'&&picked===null&&/^[oO]$/.test(e.key))answer('O');else if(mode==='ox'&&picked===null&&/^[xX]$/.test(e.key))answer('X');else if(picked!==null&&(e.key==='Enter'||e.key==='ArrowRight')){e.preventDefault();$('nx')&&$('nx').click()}});
secs();build();

<script>
(function(){
const H=1418297543,K='hanyoung-world-future-w3-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
