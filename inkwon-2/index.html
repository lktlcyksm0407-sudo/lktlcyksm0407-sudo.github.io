<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>세계 문제와 미래 사회 2주차</title>

<style>

<script>
const OXD=[{"n": 1, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "UN의 상시적인 인권 보호 조직은 규약에 근거한 기관과 UN 헌장에 근거한 기관으로 나눌 수 있다.", "a": "O", "e": ""}, {"n": 2, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약에 근거한 기관은 영어로 Charter-based organs라고 한다.", "a": "X", "e": "규약 기반은 Treaty-based organs, 헌장 기반이 Charter-based organs예요."}, {"n": 3, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약에 근거한 인권 감시 체제는 각종 국제 인권 규약의 이행 여부를 감시·심의하는 제도이다.", "a": "O", "e": ""}, {"n": 4, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약에 근거한 기관은 모든 유엔 회원국에 똑같이 적용된다.", "a": "X", "e": "조약 가입국에 한정돼요."}, {"n": 5, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약에 근거한 기관은 조약에 명시된 제한적인 인권 규정을 준수하도록 한다.", "a": "O", "e": ""}, {"n": 6, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약에 근거한 기관은 강제적인 제재와 처벌의 방법으로 인권을 보호한다.", "a": "X", "e": "건설적인 대화와 타협의 방법으로 보호해요."}, {"n": 7, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "UN 헌장에 근거한 기관은 포괄적인 인권 문제를 다루는 정치적 기구이다.", "a": "O", "e": ""}, {"n": 8, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "UN 헌장에 근거한 기관은 조약에 명시된 제한적인 인권 규정만 다룬다.", "a": "X", "e": "포괄적인 인권 문제를 다뤄요. 제한적 규정은 규약 기반 기관이에요."}, {"n": 9, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "국제 조약이란 국가와 국제기구가 상호 합의하여 지키기로 약속한 국제적 합의이다.", "a": "O", "e": ""}, {"n": 10, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "국제 조약은 국가가 의회 등을 통해 비준하면 해당 국가의 법률과 동일한 효력을 지닌다.", "a": "O", "e": ""}, {"n": 11, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "국제 조약은 비준을 하더라도 국내법과 같은 효력을 갖지 못한다.", "a": "X", "e": "비준하면 법률과 동일한 효력을 지녀요."}, {"n": 12, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "UN은 90여 개 주제별 인권 규약이 구속력 있게 지켜지도록 심의 위원회를 설치하였다.", "a": "O", "e": ""}, {"n": 13, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "UN은 심의 위원회를 설치하여 인권 보호를 제도화해 나가고 있다.", "a": "O", "e": ""}, {"n": 14, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "교과서에 따르면 현재 심의 위원회가 구성된 규약은 6개이다.", "a": "O", "e": ""}, {"n": 15, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "인종 차별철폐협약은 1965년에 채택되었다.", "a": "O", "e": ""}, {"n": 16, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "여성차별철폐협약은 1989년에 채택되었다.", "a": "X", "e": "1979년이에요. 1989년은 아동권리협약이에요."}, {"n": 17, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "고문방지협약은 1984년에 채택되었다.", "a": "O", "e": ""}, {"n": 18, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "아동권리협약에 근거하여 아동권리위원회가 설치되었다.", "a": "O", "e": ""}, {"n": 19, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "시민적·정치적 권리에 관한 규약의 위원회는 자유권위원회라고도 한다.", "a": "O", "e": ""}, {"n": 20, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "시민적·정치적 권리 규약의 위원회(인권이사회)는 2006년에 생긴 유엔 인권 이사회(UNHRC)와 같은 기구이다.", "a": "X", "e": "이름만 비슷할 뿐 서로 다른 기구예요."}, {"n": 21, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "이주노동자와 가족의 권리에 관한 협약(1990)에 근거하여 이주노동자권리위원회가 설치되었다.", "a": "O", "e": ""}, {"n": 22, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약 심의 위원회는 10명에서 23명까지의 위원으로 구성된다.", "a": "O", "e": ""}, {"n": 23, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약 심의 위원회 위원의 임기는 위원회마다 서로 다르다.", "a": "X", "e": "임기는 모두 4년으로 동일해요."}, {"n": 24, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약 심의 위원회는 위원 선출 시 지역적 균형을 고려한다.", "a": "O", "e": ""}, {"n": 25, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약 심의 위원회 활동에는 정부 간 기구만 참여할 수 있다.", "a": "X", "e": "NGO도 참석해 보고서 제출과 구두 정보 제공을 해요."}, {"n": 26, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약 심의 위원회는 연례 보고서를 경제사회 이사회를 통해 UN 총회에 제출한다.", "a": "O", "e": ""}, {"n": 27, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약 심의 위원회의 연례 보고서는 안전 보장 이사회에 제출된다.", "a": "X", "e": "경제사회 이사회를 통해 UN 총회에 제출해요."}, {"n": 28, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "규약 심의 위원회의 연례 보고서는 각 가입국이 작성한다.", "a": "X", "e": "연례 보고서는 위원회가 작성해요. 가입국은 최초·정기 보고서를 내요."}, {"n": 29, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "조약 가입국은 가입 후 일정 기간 내 최초 보고서, 이후 정기 보고서를 제출할 의무가 있다.", "a": "O", "e": ""}, {"n": 30, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "q": "UN 헌장에 근거한 기관에는 UN 총회, 안전 보장 이사회, 인권 고등 판무관, 유네스코, 국제 노동 기구 등이 있다.", "a": "O", "e": ""}, {"n": 31, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 이사회는 전 세계 인권에 관한 거의 모든 문제를 다룬다.", "a": "O", "e": ""}, {"n": 32, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 이사회는 유엔 총회 직속 정부 간 기구이다.", "a": "O", "e": ""}, {"n": 33, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 이사회는 개인과 민간단체가 회원인 비정부 기구이다.", "a": "X", "e": "정부 간 기구예요."}, {"n": 34, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 이사회는 1946년 유엔 헌장과 함께 출범하였다.", "a": "X", "e": "1946년 인권 위원회를 대신하여 2006년에 출범했어요."}, {"n": 35, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 위원회는 유엔 헌장 68조에 따라 창설되었다.", "a": "O", "e": ""}, {"n": 36, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 이사회는 스위스 제네바에 있다.", "a": "O", "e": ""}, {"n": 37, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 이사회는 미국 뉴욕에 있다.", "a": "X", "e": "스위스 제네바예요."}, {"n": 38, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 이사회 이사국은 47개국이다.", "a": "O", "e": ""}, {"n": 39, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "유엔 인권 이사회 이사국은 안전 보장 이사회에서 선출된다.", "a": "X", "e": "유엔 총회에서 선출돼요."}, {"n": 40, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회 이사국은 지역별로 정해진 할당에 따라 선출된다.", "a": "O", "e": ""}, {"n": 41, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회 이사국 할당은 아프리카와 아시아·태평양이 각각 13개국이다.", "a": "O", "e": ""}, {"n": 42, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회 이사국 할당은 동유럽이 가장 많다.", "a": "X", "e": "동유럽은 6개국으로 가장 적어요. 아프리카·아시아태평양이 13개국으로 가장 많아요."}, {"n": 43, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회 이사국의 임기는 4년이다.", "a": "X", "e": "3년이에요. 4년은 고등 판무관과 규약 위원이에요."}, {"n": 44, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회 이사국은 최대 2회 연임할 수 있다.", "a": "O", "e": ""}, {"n": 45, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "이사국에서 심각하고 조직적인 인권 침해가 있으면 총회 3분의 2 이상 찬성으로 자격이 박탈된다.", "a": "O", "e": ""}, {"n": 46, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "이사국 자격 박탈은 총회 과반수 찬성으로 이루어진다.", "a": "X", "e": "3분의 2 이상 찬성이 필요해요."}, {"n": 47, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "이사국은 임기 중 자국의 인권 상황에 대한 감사를 면제받는다.", "a": "X", "e": "보편적이고 정기적인 감사를 받아야 해요."}, {"n": 48, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회는 기존 인권 위원회의 임무를 승계하였다.", "a": "O", "e": ""}, {"n": 49, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회는 긴급한 인권 문제에 신속히 대응한다.", "a": "O", "e": ""}, {"n": 50, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회는 유엔 인권 최고 대표 사무소(OHCHR)로부터 실질적·기술적·사무적 지원을 받는다.", "a": "O", "e": ""}, {"n": 51, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회는 2007년 8월 보편적 정례 검토 제도(UPR) 도입을 결정하였다.", "a": "O", "e": ""}, {"n": 52, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "UPR은 인권 이사회 이사국만 검토를 받는 제도이다.", "a": "X", "e": "유엔 회원국 모두가 검토를 받아요."}, {"n": 53, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "UPR은 유엔 회원국 모두의 인권 상황을 4년마다 한 번씩 검토한다.", "a": "O", "e": ""}, {"n": 54, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "UPR은 매년 모든 회원국의 인권 상황을 검토한다.", "a": "X", "e": "4년마다 한 번씩이에요."}, {"n": 55, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "UPR은 객관적이고 비선별적이며 투명한 방법으로 동일한 기준을 적용한다.", "a": "O", "e": ""}, {"n": 56, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "UPR은 인권 침해가 심한 국가만 골라서 검토한다.", "a": "X", "e": "비선별적으로 모든 국가를 검토해요."}, {"n": 57, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "UPR은 회원국이 서로 동료적 검토를 하는 방식이다.", "a": "O", "e": ""}, {"n": 58, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "UPR의 결과로 해당 국가에 법적 처벌이 내려진다.", "a": "X", "e": "결과는 개선 권고예요."}, {"n": 59, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회는 특별 절차, 전문가 자문 기구 등을 규정하는 '인권이사회 기관 구성에 관한 결의'를 채택하였다.", "a": "O", "e": ""}, {"n": 60, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "특별 보고관은 유엔 인권 이사회가 임명한 독립적인 인권 전문가이다.", "a": "O", "e": ""}, {"n": 61, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "특별 보고관은 각국 정부를 대표하는 외교관이다.", "a": "X", "e": "독립적인 인권 전문가예요."}, {"n": 62, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "특별 보고관은 자원봉사직이다.", "a": "O", "e": ""}, {"n": 63, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "고문, 가혹 행위 방지 등 특정 인권 의제를 다루는 것은 국가별 특별 보고관이다.", "a": "X", "e": "주제별 특별 보고관이에요."}, {"n": 64, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "북한 인권 특별 보고관, 미얀마 인권 특별 보고관은 국가별 특별 보고관이다.", "a": "O", "e": ""}, {"n": 65, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "q": "인권 이사회의 독립 조사는 국제법을 위반한 중대한 인권 침해 발생 시 책임 규명 조사를 한다.", "a": "O", "e": ""}, {"n": 66, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "인권 고등 판무관 제도는 비엔나 인권 선언(1993. 6.)과 유엔 제48차 총회의 건의를 바탕으로 신설되었다.", "a": "O", "e": ""}, {"n": 67, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "인권 고등 판무관 제도는 1948년 세계 인권 선언을 계기로 신설되었다.", "a": "X", "e": "1993년 비엔나 인권 선언 → 1994년 신설이에요."}, {"n": 68, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "인권 고등 판무관 제도는 1994년에 신설되었다.", "a": "O", "e": ""}, {"n": 69, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "유엔 인권 고등 판무관은 47개국으로 구성된 기구이다.", "a": "X", "e": "개인 1명의 직책이에요. 47개국은 인권 이사회예요."}, {"n": 70, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "유엔 인권 고등 판무관의 지위는 유엔 인권 최고 대표이다.", "a": "O", "e": ""}, {"n": 71, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "유엔 인권 고등 판무관의 임기는 4년이며 1회 연임할 수 있다.", "a": "O", "e": ""}, {"n": 72, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "유엔 인권 고등 판무관의 임기는 3년이며 2회 연임할 수 있다.", "a": "X", "e": "4년, 1회 연임이에요."}, {"n": 73, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "인권 고등 판무관은 인권 사무국을 전체적으로 감독한다.", "a": "O", "e": ""}, {"n": 74, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "인권 고등 판무관은 인권 침해국에 대해 법적 처벌을 내린다.", "a": "X", "e": "대화, 감독, 교육·정보·기술·재정 지원을 해요."}, {"n": 75, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "인권 고등 판무관은 국제 협력을 강화하고 인권 조직을 통합·조정한다.", "a": "O", "e": ""}, {"n": 76, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "인권 문제가 심각하다고 판단되면 고등 판무관은 조기 경보를 발동하고 특별 회기 개회를 요청한다.", "a": "O", "e": ""}, {"n": 77, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "고등 판무관은 심각한 인권 침해국에 평화 유지군을 파견한다.", "a": "X", "e": "조기 경보 발동, 특별 회기 개회 요청 등으로 대처해요."}, {"n": 78, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "고등 판무관은 필요 국가에 법 체제 정비, 경찰 훈련 등을 위한 기술적·재정적 자문을 제공한다.", "a": "O", "e": ""}, {"n": 79, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "고등 판무관은 에스토니아, 라트비아, 리투아니아 등과 인권 보호 실행 계획을 논의하였다.", "a": "O", "e": ""}, {"n": 80, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "고등 판무관은 네팔에 기술 지원 사무소 개설을 추진하였다.", "a": "X", "e": "네팔은 프로그램, 사무소 개설은 캄보디아와 말라위예요."}, {"n": 81, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "고등 판무관은 캄보디아와 말라위에 기술 지원 사무소 개설을 추진하였다.", "a": "O", "e": ""}, {"n": 82, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "고등 판무관은 유엔 기구의 활동 가운데 인권 분야 사안들을 조정한다.", "a": "O", "e": ""}, {"n": 83, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "OHCHR은 고등 판무관의 업무를 보좌하고 정책을 실행하는 실무 행정 기구(사무국)이다.", "a": "O", "e": ""}, {"n": 84, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "OHCHR은 개인 1명의 직책을 가리킨다.", "a": "X", "e": "OHCHR은 조직(사무소)이에요. 개인은 고등 판무관이에요."}, {"n": 85, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "OHCHR은 1993년 12월 20일에 결성되었다.", "a": "O", "e": ""}, {"n": 86, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "OHCHR의 본부는 프랑스 파리이다.", "a": "X", "e": "제네바와 뉴욕이에요. 파리는 유네스코예요."}, {"n": 87, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "OHCHR은 유엔에 소속된 기관이다.", "a": "O", "e": ""}, {"n": 88, "sec": "Ⅲ. 유엔 인권 고등 판무관과 OHCHR", "q": "유엔 인권 고등 판무관(UNHCHR)은 난민 보호를 담당한다.", "a": "X", "e": "난민은 유엔 난민 고등 판무관(UNHCR)이에요."}, {"n": 89, "sec": "Ⅳ. UN 총회", "q": "UN 총회는 매년 9월에 193개 회원국이 참여하여 열린다.", "a": "O", "e": ""}, {"n": 90, "sec": "Ⅳ. UN 총회", "q": "UN 총회는 15개 회원국으로 구성된다.", "a": "X", "e": "193개국이에요. 15개국은 안전 보장 이사회예요."}, {"n": 91, "sec": "Ⅳ. UN 총회", "q": "UN 총회는 일반적 권한에 입각하여 분쟁을 평화적으로 조정한다.", "a": "O", "e": ""}, {"n": 92, "sec": "Ⅳ. UN 총회", "q": "UN 총회는 인종, 성별, 언어, 종교에 의한 차별 없이 인권 실현을 위한 조치를 취할 수 있다.", "a": "O", "e": ""}, {"n": 93, "sec": "Ⅳ. UN 총회", "q": "총회의 6개 주요 위원회 중 인권 문제를 전담하는 것은 제1위원회이다.", "a": "X", "e": "제3위원회예요."}, {"n": 94, "sec": "Ⅳ. UN 총회", "q": "제3위원회는 사회문화 및 인도주의적 사안을 전담하며 인권 문제를 광범위하게 다룬다.", "a": "O", "e": ""}, {"n": 95, "sec": "Ⅳ. UN 총회", "q": "제3위원회는 국가별 인권 결의안을 매년 심의하고 통과시킨다.", "a": "O", "e": ""}, {"n": 96, "sec": "Ⅳ. UN 총회", "q": "총회의 특별 위원회는 상설 기구로 운영된다.", "a": "X", "e": "한시적으로 설치·운영돼요."}, {"n": 97, "sec": "Ⅳ. UN 총회", "q": "아파르트헤이트 반대 특별 위원회는 총회 특별 위원회의 예이다.", "a": "O", "e": ""}, {"n": 98, "sec": "Ⅳ. UN 총회", "q": "총회는 특별 보고관을 임명하여 인권 침해 사안을 조사, 연구, 보고하도록 할 수 있다.", "a": "O", "e": ""}, {"n": 99, "sec": "Ⅳ. UN 총회", "q": "총회는 인권 고등 판무관에 조사·연구를 위임하고 해당국에 개선을 권고한다.", "a": "O", "e": ""}, {"n": 100, "sec": "Ⅳ. UN 총회", "q": "교과서는 총회가 특정 국가에 경제적, 외교적 제재 조치를 취할 수 있다고 서술한다.", "a": "O", "e": ""}, {"n": 101, "sec": "Ⅳ. UN 총회", "q": "총회는 국제 사회 인권 거버넌스의 최고 심의 기관이다.", "a": "O", "e": ""}, {"n": 102, "sec": "Ⅳ. UN 총회", "q": "유엔 인권 이사회는 총회를 감독하는 최고 심의 기관이다.", "a": "X", "e": "총회가 최고 심의 기관, 인권 이사회는 전문 실무 기구예요."}, {"n": 103, "sec": "Ⅳ. UN 총회", "q": "세계 인권 선언은 1948년 제3차 유엔 총회에서 채택되었다.", "a": "O", "e": ""}, {"n": 104, "sec": "Ⅳ. UN 총회", "q": "세계 인권 선언은 안전 보장 이사회에서 채택되었다.", "a": "X", "e": "1948년 제3차 유엔 총회에서 채택됐어요."}, {"n": 105, "sec": "Ⅳ. UN 총회", "q": "세계 인권 선언은 인류 역사상 최초로 보편적 인권을 명문화하였다.", "a": "O", "e": ""}, {"n": 106, "sec": "Ⅳ. UN 총회", "q": "총회의 국가별 인권 침해 결의안은 군사적 제재를 강제할 수 있는 법적 강제력을 가진다.", "a": "X", "e": "법적 강제력은 없지만 외교적·정치적 압박을 가해요."}, {"n": 107, "sec": "Ⅳ. UN 총회", "q": "총회는 유엔 인권 이사회의 이사국 47개국을 선출한다.", "a": "O", "e": ""}, {"n": 108, "sec": "Ⅳ. UN 총회", "q": "총회는 유엔 인권 고등 판무관의 임명을 승인한다.", "a": "O", "e": ""}, {"n": 109, "sec": "Ⅳ. UN 총회", "q": "총회는 인권 이사회나 특별 보고관의 연례 보고서를 최종 검토한다.", "a": "O", "e": ""}, {"n": 110, "sec": "Ⅳ. UN 총회", "q": "총회는 인류에 대한 범죄 수준의 인권 침해를 직접 국제 형사 재판소에서 재판한다.", "a": "X", "e": "ICC 회부나 제재를 하도록 안보리에 공식 권고해요."}, {"n": 111, "sec": "Ⅳ. UN 총회", "q": "총회 결의는 안보리 결의와 달리 법적 구속력이 없다.", "a": "O", "e": ""}, {"n": 112, "sec": "Ⅳ. UN 총회", "q": "총회는 정치적 블록화와 이중 잣대라는 한계를 지닌다.", "a": "O", "e": ""}, {"n": 113, "sec": "Ⅳ. UN 총회", "q": "안전 보장 이사회는 15개국으로 구성되고, 결의에 법적 구속력이 있다.", "a": "O", "e": ""}, {"n": 114, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유엔 산하 분야별 전문 기구를 통해 통보 절차를 개시할 수 있다.", "a": "O", "e": ""}, {"n": 115, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유네스코는 1945년 11월 16일에 설립되었다.", "a": "O", "e": ""}, {"n": 116, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유네스코의 본부는 스위스 제네바이다.", "a": "X", "e": "프랑스 파리예요."}, {"n": 117, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "대한민국은 1950년에 유네스코에 가입하였다.", "a": "O", "e": ""}, {"n": 118, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유엔 회원국만 유네스코 회원국이 될 수 있다.", "a": "X", "e": "유엔 비회원국도 별도 절차를 거쳐 가입할 수 있어요."}, {"n": 119, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유네스코는 교육, 과학, 문화, 정보 분야에서 개인과 NGO가 제출한 인권 침해 진정서를 심의한다.", "a": "O", "e": ""}, {"n": 120, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유네스코에는 국가만 인권 침해 진정서를 제출할 수 있다.", "a": "X", "e": "개인과 NGO도 제출할 수 있어요."}, {"n": 121, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유네스코는 진정서 심의 결과를 집행 위원회(집행 이사회)에 보고한다.", "a": "O", "e": ""}, {"n": 122, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유네스코의 진정서 심의 결정은 법적 구속력이 있다.", "a": "X", "e": "법적 구속력은 없고, 대화를 통한 정치적 효과를 기대해요."}, {"n": 123, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "104 절차는 유네스코 소관 분야의 인권 침해 고발을 처리하는 독자적인 메커니즘이다.", "a": "O", "e": ""}, {"n": 124, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "104 절차는 공개 재판으로 진행된다.", "a": "X", "e": "시작부터 끝까지 철저히 비공개예요."}, {"n": 125, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "104 절차는 협약·권고 위원회(CR 위원회)가 전담하여 처리한다.", "a": "O", "e": ""}, {"n": 126, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "CR 위원회는 국가에 유죄 판결을 내리고 처벌을 가한다.", "a": "X", "e": "사법적 재판이 아니에요. 중재자 역할을 해요."}, {"n": 127, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "유네스코는 국제 사법 기구의 역할을 수행해서는 안 된다는 원칙을 명시하고 있다.", "a": "O", "e": ""}, {"n": 128, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "국제 노동 기구(ILO)는 1919년에 창설되었다.", "a": "O", "e": ""}, {"n": 129, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO는 1946년에 창설되었다.", "a": "X", "e": "1919년 창설, 1946년 유엔 첫 전문 기구로 편입됐어요."}, {"n": 130, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO는 1944년 필라델피아 선언을 계기로 1946년 유엔의 첫 번째 전문 기구로 편입되었다.", "a": "O", "e": ""}, {"n": 131, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO의 본부는 프랑스 파리이다.", "a": "X", "e": "스위스 제네바예요."}, {"n": 132, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "대한민국은 1991년에 ILO에 가입하였다.", "a": "O", "e": ""}, {"n": 133, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO는 1977년에 노벨 평화상을 받았다.", "a": "X", "e": "1969년이에요. 1977년은 앰네스티예요."}, {"n": 134, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO는 경제적·사회적 차원의 인권 문제를 다룬다.", "a": "O", "e": ""}, {"n": 135, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO는 단결권, 단체 교섭권뿐 아니라 아동 노동, 빈곤층, 직업 훈련, 사회 보장 문제도 다룬다.", "a": "O", "e": ""}, {"n": 136, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO는 노사정 3자주의에 따라 정부, 노동자 대표, 사용자 대표가 동등한 자격으로 정책을 결정한다.", "a": "O", "e": ""}, {"n": 137, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO 총회에 각국은 정부 대표 1명, 노동자 대표 1명, 사용자 대표 1명을 보낸다.", "a": "X", "e": "정부 2명, 노동자 1명, 사용자 1명 총 4명이에요."}, {"n": 138, "sec": "Ⅴ. 유네스코와 국제 노동 기구", "q": "ILO 총회의 각 대표는 자국 정부 방침에 따라서만 표결해야 한다.", "a": "X", "e": "정부 방침과 관계없이 독립적으로 표결해요."}, {"n": 139, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "유엔 난민 고등 판무관(UNHCR)은 국제적 난민의 구호, 지원 및 인권 보호를 위해 설치되었다.", "a": "O", "e": ""}, {"n": 140, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "UNHCR의 모든 권한과 책임은 조직인 고등 판무관실에 귀속된다.", "a": "X", "e": "'고등 판무관'이라는 직책에 귀속돼요."}, {"n": 141, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "UNHCR의 보호 대상은 본국을 벗어난 탈출자이다.", "a": "O", "e": ""}, {"n": 142, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "UNHCR은 인종, 성별, 종교, 국적, 특정 사회 집단 소속, 정치적 의견을 이유로 박해받을 우려가 있는 사람을 보호한다.", "a": "O", "e": ""}, {"n": 143, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "UNHCR은 1948년 세계 인권 선언에 근거하여 강제 송환 금지 원칙을 준수한다.", "a": "X", "e": "1951년 「난민의 지위에 관한 협약」에 근거해요."}, {"n": 144, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "UNHCR은 1951년 난민 협약과 1967년 의정서의 준수 여부를 감시한다.", "a": "O", "e": ""}, {"n": 145, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "UNHCR은 필요하면 난민을 강제로 본국에 송환할 수 있다.", "a": "X", "e": "강제 송환 금지 원칙을 지켜요."}, {"n": 146, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "UNHCR은 난민의 현지 정착 혹은 제3국 정착을 주선한다.", "a": "O", "e": ""}, {"n": 147, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "난민 발생 사유가 종료되면 UNHCR은 난민을 강제로 귀환시킨다.", "a": "X", "e": "자발적 본국 귀환 사업을 주선해요."}, {"n": 148, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "UNHCR은 무국적자 보호 및 감축을 추진한다.", "a": "O", "e": ""}, {"n": 149, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "필리포 그란디는 2016년 1월 1일부터 5년 임기의 유엔 난민 고등 판무관을 맡았다.", "a": "O", "e": ""}, {"n": 150, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "유엔 인권 기구의 주요 역할은 인권을 보호하고 증진시키는 데 있다.", "a": "O", "e": ""}, {"n": 151, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "유엔 인권 체제는 국가 간 활동을 규제하는 강력한 체제로 자리 잡았다.", "a": "O", "e": ""}, {"n": 152, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "유엔 인권 체제의 실행 절차는 강력한 법적 강제력을 가진다.", "a": "X", "e": "실행 절차는 법적 구속력이 미약해요."}, {"n": 153, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "유엔 인권 체제에서 하나의 진정이 처리되는 데 대개 3~4년이 걸린다.", "a": "O", "e": ""}, {"n": 154, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "유엔 인권 체제에서 최종적인 의무 이행은 안전 보장 이사회가 강제한다.", "a": "X", "e": "결국 당사국의 의지에 달려 있어요."}, {"n": 155, "sec": "Ⅵ. 유엔 난민 고등 판무관과 유엔 인권 체제", "q": "유엔은 인권 고등 판무관실을 통해 NGO에 대한 서비스 제공 등으로 국제 여론 조성에 기여한다.", "a": "O", "e": ""}, {"n": 156, "sec": "Ⅶ. 국제 앰네스티", "q": "국제 앰네스티는 특정 정부, 정파, 이데올로기, 경제 체제, 종교적 신념을 초월해 독립적으로 활동한다.", "a": "O", "e": ""}, {"n": 157, "sec": "Ⅶ. 국제 앰네스티", "q": "국제 앰네스티는 세계 최대의 순수 민간 차원의 인권 운동 단체이다.", "a": "O", "e": ""}, {"n": 158, "sec": "Ⅶ. 국제 앰네스티", "q": "국제 앰네스티는 유엔 산하의 정부 간 기구이다.", "a": "X", "e": "순수 민간 단체(NGO)예요."}, {"n": 159, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 1961년 포르투갈 리스본에서 체포된 학생 두 명의 7년 형 사건을 계기로 시작되었다.", "a": "O", "e": ""}, {"n": 160, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티 설립의 계기가 된 학생들은 사형 선고를 받았다.", "a": "X", "e": "7년 형이에요."}, {"n": 161, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 영국의 변호사 피터 베넨슨이 옵저버지에 '잊힌 죄수들' 기사를 실으며 시작되었다.", "a": "O", "e": ""}, {"n": 162, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 미국 인권 운동가 로버트 번스타인의 주도로 창설되었다.", "a": "X", "e": "피터 베넨슨이에요. 번스타인은 휴먼 라이츠 워치예요."}, {"n": 163, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 사면을 위한 탄원 'Amnesty 61' 운동에 기원을 두고 있다.", "a": "O", "e": ""}, {"n": 164, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티의 본부는 포르투갈 리스본이다.", "a": "X", "e": "영국 런던이에요. 리스본은 설립 계기 사건의 장소예요."}, {"n": 165, "sec": "Ⅶ. 국제 앰네스티", "q": "우리나라에서 앰네스티는 1972년 최초로 인권 운동을 시작하였다.", "a": "O", "e": ""}, {"n": 166, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 양심수 석방, 사형 제도 폐지, 고문 근절 등을 위해 활동한다.", "a": "O", "e": ""}, {"n": 167, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 정치적 구금자에 대한 공정하고 신속한 재판을 촉구한다.", "a": "O", "e": ""}, {"n": 168, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 난민 보호와 대인 지뢰 반대 활동도 한다.", "a": "O", "e": ""}, {"n": 169, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 편지 쓰기, 청원, 집회, 언론 홍보 등 시민들의 참여를 촉구한다.", "a": "O", "e": ""}, {"n": 170, "sec": "Ⅶ. 국제 앰네스티", "q": "긴급 행동(Urgent Action)은 휴먼 라이츠 워치의 대표적인 활동 방식이다.", "a": "X", "e": "앰네스티의 활동 방식이에요."}, {"n": 171, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 어떠한 정부나 기업의 기부금도 받지 않는다.", "a": "O", "e": ""}, {"n": 172, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 주로 각국 정부의 지원금으로 운영된다.", "a": "X", "e": "개인 회원의 회비와 순수한 기부금으로만 운영돼요."}, {"n": 173, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 1977년 노벨 평화상, 1978년 유엔 인권상을 받았다.", "a": "O", "e": ""}, {"n": 174, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 1969년 노벨 평화상을 받았다.", "a": "X", "e": "1977년이에요. 1969년은 ILO예요."}, {"n": 175, "sec": "Ⅶ. 국제 앰네스티", "q": "앰네스티는 유엔과 유럽 의회, 미주 인권 위원회의 자문 기구 지위를 유지한다.", "a": "O", "e": ""}, {"n": 176, "sec": "Ⅶ. 국제 앰네스티", "q": "2015 앰네스티 보고서는 한국에서 국가보안법을 적용한 구금과 기소가 이루어졌다고 비판하였다.", "a": "O", "e": ""}, {"n": 177, "sec": "Ⅶ. 국제 앰네스티", "q": "2015 앰네스티 보고서에 따르면 양심에 따른 병역거부자 600명 이상이 수감되어 있었다.", "a": "O", "e": ""}, {"n": 178, "sec": "Ⅶ. 국제 앰네스티", "q": "2015 앰네스티 보고서는 한국의 인권 상황이 크게 악화되고 있다고 결론지었다.", "a": "X", "e": "나아지고 있으나 여전히 아쉬운 부분이 많다고 했어요."}, {"n": 179, "sec": "Ⅶ. 국제 앰네스티", "q": "2023 앰네스티 보고서에는 한국과 북한을 포함한 155개국의 인권 현황이 담겼다.", "a": "O", "e": ""}, {"n": 180, "sec": "Ⅶ. 국제 앰네스티", "q": "2023 앰네스티 보고서는 아프가니스탄에서 탈레반의 여성·소녀 억압이 심해졌다고 밝혔다.", "a": "O", "e": ""}, {"n": 181, "sec": "Ⅶ. 국제 앰네스티", "q": "2023 앰네스티 보고서는 태국에서 사형 선고 의무제가 폐지되었다고 밝혔다.", "a": "X", "e": "태국은 고문·강제 실종 범죄화 법 통과, 사형 선고 의무제 폐지는 말레이시아예요."}, {"n": 182, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 인권을 감시하기 위해 만들어진 단체이다.", "a": "O", "e": ""}, {"n": 183, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 인권 위반 사례를 조사하고 문서화하며 인권 침해 방지 정책을 옹호한다.", "a": "O", "e": ""}, {"n": 184, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 1978년 미국의 헬싱키 협정 준수를 감시하기 위해 창설되었다.", "a": "X", "e": "소련의 헬싱키 협정 준수를 감시하기 위해서예요."}, {"n": 185, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치의 처음 이름은 '헬싱키 워치'였다.", "a": "O", "e": ""}, {"n": 186, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "헬싱키 워치는 로버트 번스타인의 주도로 창설되었다.", "a": "O", "e": ""}, {"n": 187, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "1988년 여러 워치 조직이 통합되어 휴먼 라이츠 워치가 설립되었다.", "a": "O", "e": ""}, {"n": 188, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 1961년에 설립되었다.", "a": "X", "e": "1978년 헬싱키 워치 → 1988년 휴먼 라이츠 워치예요. 1961년은 앰네스티예요."}, {"n": 189, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치의 본부는 미국 뉴욕이다.", "a": "O", "e": ""}, {"n": 190, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치의 본부는 워싱턴 D.C.이다.", "a": "X", "e": "뉴욕이에요. 워싱턴 D.C.는 프리덤 하우스예요."}, {"n": 191, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 전 세계 20여 개 도시에 사무소를 두고 있다.", "a": "O", "e": ""}, {"n": 192, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 여러 국가들이 세계 인권 선언을 위반하는지 감시한다.", "a": "O", "e": ""}, {"n": 193, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "1948년 제정된 세계 인권 선언은 시민적·사회적·정치적 권리의 일반적 정의를 담고 있다.", "a": "O", "e": ""}, {"n": 194, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "네이밍 앤 셰이밍은 인권 침해 주체의 이름을 공개하여 국제적 압박을 가하는 전략이다.", "a": "O", "e": ""}, {"n": 195, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "네이밍 앤 셰이밍은 비공개로 정부와 중재하는 방식이다.", "a": "X", "e": "이름을 보고서에 기록하고 언론에 공개해요."}, {"n": 196, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 국제 지도자들을 만나 제재나 정책 변화를 이끌어 내는 로비 활동을 한다.", "a": "O", "e": ""}, {"n": 197, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 매년 '월드 리포트'를 발행한다.", "a": "O", "e": ""}, {"n": 198, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 '세계의 자유 보고서'를 발행한다.", "a": "X", "e": "월드 리포트예요. 세계의 자유 보고서는 프리덤 하우스예요."}, {"n": 199, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치에는 400여 명의 전문가들이 세계 각지에서 활동하고 있다.", "a": "O", "e": ""}, {"n": 200, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 심각한 인권 침해국에 대한 군사적·경제적 지원 철회를 요구하기도 한다.", "a": "O", "e": ""}, {"n": 201, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치가 미국 정부와 유착되어 있다는 주장이 제기되기도 한다.", "a": "O", "e": ""}, {"n": 202, "sec": "Ⅷ. 휴먼 라이츠 워치", "q": "휴먼 라이츠 워치는 미국 내 인권 문제는 조사하지 않는다.", "a": "X", "e": "교도소 환경, 경찰 폭력, 이민자, 사형 제도 등 미국 내 문제도 조사해요."}, {"n": 203, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스의 본부는 워싱턴 D.C.이다.", "a": "O", "e": ""}, {"n": 204, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스는 1941년 미국 뉴욕에서 설립되었다.", "a": "O", "e": ""}, {"n": 205, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스는 1941년 워싱턴 D.C.에서 설립되었다.", "a": "X", "e": "설립은 뉴욕, 본부는 워싱턴 D.C.예요."}, {"n": 206, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스는 민주주의 수호에 앞장서고 있다는 평가를 받는 국제 비정부 기구이다.", "a": "O", "e": ""}, {"n": 207, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "당시 미국은 제2차 세계 대전 참전을 놓고 찬반 여론이 갈라져 있었다.", "a": "O", "e": ""}, {"n": 208, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "루스벨트 대통령은 프리덤 하우스를 직접 설립하고 운영하였다.", "a": "X", "e": "탄생을 조용히 지원했어요."}, {"n": 209, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스 설립자는 기자, 사업가, 노동계 지도자, 학자 등 다양하고 비정치적인 인사들이다.", "a": "O", "e": ""}, {"n": 210, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스는 1950년대 극단적 반공주의를 비판하였다.", "a": "O", "e": ""}, {"n": 211, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스는 1960년대 미국의 흑인 민권 운동을 지원하고 반전 운동을 지지하였다.", "a": "O", "e": ""}, {"n": 212, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스는 베트남 탈출 난민, 동구권 민주화 운동, 필리핀 반독재 투쟁을 지원하였다.", "a": "O", "e": ""}, {"n": 213, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스는 신생 민주 국가의 선거 관리 위원회를 직접 운영하였다.", "a": "X", "e": "선거 관리 위원회 구성을 지원했어요."}, {"n": 214, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스는 1973년부터 매년 세계의 자유 보고서를 발표하였다.", "a": "O", "e": ""}, {"n": 215, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "세계의 자유 보고서는 정치적 권리와 시민적 자유를 평가한다.", "a": "O", "e": ""}, {"n": 216, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스의 평가에는 분석자의 해석이 개입될 수 있다.", "a": "O", "e": ""}, {"n": 217, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "프리덤 하우스의 보고서는 해당 국가에 대해 법적 구속력을 가진다.", "a": "X", "e": "강제력·구속력은 없지만 직·간접적인 영향력이 있어요."}, {"n": 218, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "2016 언론 자유 지표에서 한국은 6년째 부분적 언론 자유국으로 선정되었다.", "a": "O", "e": ""}, {"n": 219, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "2016 언론 자유 지표에서 한국은 199개국 중 6위를 기록하였다.", "a": "X", "e": "66위예요."}, {"n": 220, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "국제 앰네스티, 휴먼 라이츠 워치, 프리덤 하우스는 모두 비정부 기구(NGO)이다.", "a": "O", "e": ""}, {"n": 221, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "세계 인권 단체는 법적 구속력 대신 조사와 보고서 공개로 국제 여론을 움직인다.", "a": "O", "e": ""}, {"n": 222, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "국가인권위원회 누리집의 '관련 사이트'에서 세계 인권 단체의 소개를 살펴볼 수 있다.", "a": "O", "e": ""}, {"n": 223, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "유엔 인권 이사회, ILO, OHCHR은 모두 스위스 제네바에 본부를 두고 있다.", "a": "O", "e": ""}, {"n": 224, "sec": "Ⅸ. 프리덤 하우스와 세계 인권 단체 비교", "q": "유네스코와 앰네스티는 모두 영국 런던에 본부를 두고 있다.", "a": "X", "e": "유네스코는 파리, 앰네스티는 런던이에요."}],MCD=[{"n": 1, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "hard": false, "typ": "표 해석 · 단일 선택형", "kind": "mc", "stem": "표는 유엔의 상시적인 인권 보호 조직 A, B를 비교한 것이다. 이에 대한 설명으로 옳은 것은? <small>[3.0점]<\/small>", "body": "<table class=\"t\"><tr><th>구분<\/th><th>A<\/th><th>B<\/th><\/tr><tr><td>근거<\/td><td>각종 국제 인권 규약<\/td><td>UN 헌장의 인권 규정<\/td><\/tr><tr><td>성격<\/td><td>규약의 이행 여부 감시·심의<\/td><td>(가)<\/td><\/tr><\/table>", "bogi": [], "ch": ["A는 모든 유엔 회원국에 똑같이 적용된다.", "A는 강제적 제재를 통해 인권 보호를 실현한다.", "B의 사례로 인종차별철폐위원회를 들 수 있다.", "(가)에는 '포괄적인 인권 문제를 다루는 정치적 기구'가 들어갈 수 있다.", "B는 조약에 명시된 제한적인 인권 규정만 준수하도록 한다."], "a": 3, "ans": "", "con": [["두 갈래 (1쪽)", ["<b class=\"k\">규약에 근거한 기관<\/b>(Treaty-based): 국제 인권 규약의 <b class=\"k\">이행 여부 감시·심의<\/b>, <b class=\"k\">조약 가입국에 한정<\/b>, <b class=\"k\">제한적<\/b> 인권 규정, <b class=\"k\">건설적인 대화와 타협<\/b>", "<b class=\"k\">UN 헌장에 근거한 기관<\/b>(Charter-based): <b class=\"k\">포괄적인 인권 문제<\/b>를 다루는 <b class=\"k\">정치적 기구<\/b>", "국제 조약: 상호 합의한 국제적 합의, 의회 등을 통해 <b class=\"k\">비준<\/b>하면 법률과 동일한 효력"]]], "core": "규약 기반 = <b class=\"k\">가입국 한정, 제한적, 대화와 타협<\/b> / 헌장 기반 = <b class=\"k\">포괄적, 정치적 기구<\/b>", "intro": "A는 <b class=\"k\">규약에 근거한 기관<\/b>, B는 <b class=\"k\">UN 헌장에 근거한 기관<\/b>이에요.", "fig": "", "ex": [["①", 0, "A는 <b class=\"k\">조약 가입국에 한정<\/b>돼요."], ["②", 0, "A는 <b class=\"k\">건설적인 대화와 타협<\/b>으로 보호해요."], ["③", 0, "인종차별철폐위원회는 규약 기반 기관(<b class=\"k\">A<\/b>)이에요."], ["④", 1, "헌장 기반 기관은 <b class=\"k\">포괄적 인권 문제를 다루는 정치적 기구<\/b>예요."], ["⑤", 0, "제한적 인권 규정은 <b class=\"k\">A<\/b>의 특징이에요."]], "concl": "따라서 정답은 ④번이에요."}, {"n": 2, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "hard": false, "typ": "밑줄 오류 찾기형", "kind": "mc", "stem": "다음 글의 밑줄 친 ㉠~㉤ 중 옳지 않은 것은? <small>[3.1점]<\/small>", "body": "<div class=\"box\">UN은 90여 개 주제별 인권 규약이 구속력 있게 지켜지도록 심의 위원회를 설치하였다. 각 위원회는 <u>㉠10명에서 23명까지<\/u>의 위원으로 구성되며, 임기는 <u>㉡모두 4년으로 동일<\/u>하다. 위원 선출 시 <u>㉢지역적 균형<\/u>을 고려하며, 위원회 활동에는 <u>㉣정부 간 기구만 참석<\/u>할 수 있다. 각 위원회는 활동 상황을 연례 보고서로 작성하여 <u>㉤경제사회 이사회를 통해 UN 총회에 제출<\/u>한다.<\/div>", "bogi": [], "ch": ["㉠", "㉡", "㉢", "㉣", "㉤"], "a": 3, "ans": "", "con": [["규약 심의 위원회 (2쪽)", ["90여 개 주제별 인권 규약이 구속력 있게 지켜지도록 심의 위원회 설치 → <b class=\"k\">인권 보호 제도화<\/b>", "교과서: 위원회가 구성된 규약 <b class=\"k\">6개<\/b> (인종 차별철폐 1965, 사회권 규약, 자유권 규약 1966, 여성차별철폐 1979, 고문방지 1984, 아동권리 1989)", "위원 <b class=\"k\">10~23명<\/b>, 임기 <b class=\"k\">모두 4년<\/b>, <b class=\"k\">지역적 균형<\/b>", "<b class=\"k\">NGO도 참석<\/b>해 보고서 제출·구두 정보 제공", "위원회가 <b class=\"k\">연례 보고서<\/b> 작성 → <b class=\"k\">경제사회 이사회<\/b> → <b class=\"k\">UN 총회<\/b>", "가입국: <b class=\"k\">최초 보고서<\/b> → <b class=\"k\">정기 보고서<\/b> 제출 <b class=\"k\">의무<\/b>"]]], "core": "위원회 활동 = 정부 간 기구 + <b class=\"k\">NGO<\/b>", "intro": "개념서 2쪽 문장에서 한 군데만 바꾸었어요.", "fig": "", "ex": [["①", 1, "<b class=\"k\">10~23명<\/b>이에요."], ["②", 1, "임기는 <b class=\"k\">모두 4년<\/b>이에요."], ["③", 1, "<b class=\"k\">지역적 균형<\/b>을 고려해요."], ["④", 0, "<b class=\"k\">NGO도 참석<\/b>해 보고서 제출·구두 정보 제공을 해요."], ["⑤", 1, "<b class=\"k\">경제사회 이사회<\/b>를 통해 총회에 제출해요."]], "concl": "따라서 옳지 않은 것은 ④번이에요."}, {"n": 3, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "hard": false, "typ": "&lt;보기> 조합형", "kind": "mc", "stem": "규약에 근거한 기관에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 고른 것은? <small>[3.2점]<\/small>", "body": "", "bogi": ["가입국은 가입 후 일정 기간 내에 최초 보고서를 제출해야 한다.", "연례 보고서는 각 가입국 정부가 작성하여 안보리에 제출한다.", "시민적·정치적 권리 규약의 위원회는 2006년 출범한 유엔 인권 이사회와 같은 기구이다.", "건설적인 대화와 타협의 방법으로 인권을 보호하는 역할을 한다."], "ch": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 1, "ans": "", "con": [["두 갈래 (1쪽)", ["<b class=\"k\">규약에 근거한 기관<\/b>(Treaty-based): 국제 인권 규약의 <b class=\"k\">이행 여부 감시·심의<\/b>, <b class=\"k\">조약 가입국에 한정<\/b>, <b class=\"k\">제한적<\/b> 인권 규정, <b class=\"k\">건설적인 대화와 타협<\/b>", "<b class=\"k\">UN 헌장에 근거한 기관<\/b>(Charter-based): <b class=\"k\">포괄적인 인권 문제<\/b>를 다루는 <b class=\"k\">정치적 기구<\/b>", "국제 조약: 상호 합의한 국제적 합의, 의회 등을 통해 <b class=\"k\">비준<\/b>하면 법률과 동일한 효력"]], ["규약 심의 위원회 (2쪽)", ["90여 개 주제별 인권 규약이 구속력 있게 지켜지도록 심의 위원회 설치 → <b class=\"k\">인권 보호 제도화<\/b>", "교과서: 위원회가 구성된 규약 <b class=\"k\">6개<\/b> (인종 차별철폐 1965, 사회권 규약, 자유권 규약 1966, 여성차별철폐 1979, 고문방지 1984, 아동권리 1989)", "위원 <b class=\"k\">10~23명<\/b>, 임기 <b class=\"k\">모두 4년<\/b>, <b class=\"k\">지역적 균형<\/b>", "<b class=\"k\">NGO도 참석<\/b>해 보고서 제출·구두 정보 제공", "위원회가 <b class=\"k\">연례 보고서<\/b> 작성 → <b class=\"k\">경제사회 이사회<\/b> → <b class=\"k\">UN 총회<\/b>", "가입국: <b class=\"k\">최초 보고서<\/b> → <b class=\"k\">정기 보고서<\/b> 제출 <b class=\"k\">의무<\/b>"]]], "core": "가입국 = <b class=\"k\">최초·정기 보고서<\/b>, 위원회 = <b class=\"k\">연례 보고서<\/b>", "intro": "누가 어떤 보고서를 쓰는지 구분하는 문제예요.", "fig": "", "ex": [["ㄱ", 1, "<b class=\"k\">최초 보고서<\/b> → 정기 보고서 제출이 의무예요."], ["ㄴ", 0, "연례 보고서는 <b class=\"k\">위원회<\/b>가 작성해 경제사회 이사회를 통해 <b class=\"k\">총회<\/b>에 내요."], ["ㄷ", 0, "교과서의 '인권이사회'(자유권위원회)와 UNHRC는 <b class=\"k\">다른 기구<\/b>예요."], ["ㄹ", 1, "<b class=\"k\">건설적인 대화와 타협<\/b>이에요."]], "concl": "옳은 것은 ㄱ, ㄹ → ②번이에요."}, {"n": 4, "sec": "Ⅰ. 유엔 인권 보호 조직의 두 갈래", "hard": false, "typ": "표 해석 · 단일 선택형", "kind": "mc", "stem": "표는 교과서에 제시된 국제 인권 규약과 채택 연도를 나타낸 것이다. (가)~(다)에 들어갈 내용으로 옳은 것은? <small>[3.0점]<\/small>", "body": "<table class=\"t\"><tr><th>규약<\/th><th>채택 연도<\/th><\/tr><tr><td>인종 차별철폐협약<\/td><td>(가)<\/td><\/tr><tr><td>여성차별철폐협약<\/td><td>1979년<\/td><\/tr><tr><td>(나)<\/td><td>1984년<\/td><\/tr><tr><td>아동권리협약<\/td><td>(다)<\/td><\/tr><\/table>", "bogi": [], "ch": ["(가) 1948년", "(가) 1966년", "(나) 고문방지협약", "(나) 이주노동자권리협약", "(다) 1979년"], "a": 2, "ans": "", "con": [["규약 심의 위원회 (2쪽)", ["90여 개 주제별 인권 규약이 구속력 있게 지켜지도록 심의 위원회 설치 → <b class=\"k\">인권 보호 제도화<\/b>", "교과서: 위원회가 구성된 규약 <b class=\"k\">6개<\/b> (인종 차별철폐 1965, 사회권 규약, 자유권 규약 1966, 여성차별철폐 1979, 고문방지 1984, 아동권리 1989)", "위원 <b class=\"k\">10~23명<\/b>, 임기 <b class=\"k\">모두 4년<\/b>, <b class=\"k\">지역적 균형<\/b>", "<b class=\"k\">NGO도 참석<\/b>해 보고서 제출·구두 정보 제공", "위원회가 <b class=\"k\">연례 보고서<\/b> 작성 → <b class=\"k\">경제사회 이사회<\/b> → <b class=\"k\">UN 총회<\/b>", "가입국: <b class=\"k\">최초 보고서<\/b> → <b class=\"k\">정기 보고서<\/b> 제출 <b class=\"k\">의무<\/b>"]]], "core": "인종 1965, 자유권 1966, 여성 1979, 고문 <b class=\"k\">1984<\/b>, 아동 1989", "intro": "협약 이름과 연도를 짝지어 외워야 해요.", "fig": "", "ex": [["①", 0, "인종 차별철폐협약은 <b class=\"k\">1965년<\/b>이에요."], ["②", 0, "1966년은 <b class=\"k\">시민적·정치적 권리 규약<\/b>이에요."], ["③", 1, "<b class=\"k\">고문방지협약<\/b>이 1984년이에요."], ["④", 0, "이주노동자 협약은 <b class=\"k\">1990년<\/b>이에요."], ["⑤", 0, "아동권리협약은 <b class=\"k\">1989년<\/b>이에요."]], "concl": "따라서 정답은 ③번이에요."}, {"n": 5, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "hard": false, "typ": "자료 제시 · 단일 선택형", "kind": "mc", "stem": "다음 글에서 설명하는 기구에 대한 설명으로 옳은 것은? <small>[3.0점]<\/small>", "body": "<div class=\"box\">이 기구는 1946년 유엔 헌장 68조에 따라 창설된 위원회를 대신하여 2006년 새롭게 탄생하였다. 유엔 총회 직속 정부 간 기구로서 전 세계 인권에 관한 거의 모든 문제를 다룬다.<\/div>", "bogi": [], "ch": ["본부는 미국 뉴욕에 있다.", "이사국도 임기 중 자국의 인권 상황에 대한 감사를 받아야 한다.", "이사국의 임기는 4년이며 연임할 수 없다.", "이사국은 안전 보장 이사회에서 선출된다.", "개인과 민간단체가 회원으로 가입하는 비정부 기구이다."], "a": 1, "ans": "", "con": [["유엔 인권 이사회 (3쪽)", ["<b class=\"k\">유엔 총회 직속 정부 간 기구<\/b>, 거의 모든 인권 문제", "<b class=\"k\">1946년<\/b> 인권 위원회(헌장 68조) 대신 <b class=\"k\">2006년<\/b> 탄생, <b class=\"k\">스위스 제네바<\/b>", "<b class=\"k\">47개<\/b> 이사국, 지역별 할당, <b class=\"k\">유엔 총회에서 선출<\/b> (아프리카 13, 아시아·태평양 13, 남미·카리브 8, 동유럽 6, 서유럽 및 기타 7)", "임기 <b class=\"k\">3년<\/b>, 최대 2회 연임, 총회 <b class=\"k\">3분의 2<\/b> 이상 찬성 시 자격 박탈, 이사국도 <b class=\"k\">자국 인권 감사<\/b>", "임무: 인권 위원회 임무 승계, 총회에 권고 제출, 이행 상황 주기적 검토, 긴급 문제 신속 대응", "<b class=\"k\">OHCHR<\/b>로부터 실질적·기술적·사무적 지원"]]], "core": "UNHRC: <b class=\"k\">2006, 제네바, 47개국, 총회 선출, 3년<\/b>", "intro": "2006년, 총회 직속 → <b class=\"k\">유엔 인권 이사회<\/b>예요.", "fig": "", "ex": [["①", 0, "<b class=\"k\">스위스 제네바<\/b>예요."], ["②", 1, "이사국도 <b class=\"k\">자국 인권 상황 감사<\/b>를 받아요."], ["③", 0, "임기 <b class=\"k\">3년<\/b>, 최대 2회 연임이에요."], ["④", 0, "<b class=\"k\">유엔 총회<\/b>에서 선출돼요."], ["⑤", 0, "<b class=\"k\">정부 간 기구<\/b>예요."]], "concl": "따라서 정답은 ②번이에요."}, {"n": 6, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "hard": false, "typ": "표 해석 · &lt;보기> 조합형", "kind": "mc", "stem": "표는 유엔 인권 이사회 이사국의 지역별 할당을 나타낸 것이다. 이에 대한 옳은 설명만을 &lt;보기&gt;에서 고른 것은? <small>[3.3점]<\/small>", "body": "<table class=\"t\"><tr><th>지역<\/th><th>아프리카<\/th><th>아시아·태평양<\/th><th>남미·카리브해<\/th><th>동유럽<\/th><th>서유럽 및 기타<\/th><\/tr><tr><td>이사국 수<\/td><td>13<\/td><td>13<\/td><td>(가)<\/td><td>6<\/td><td>7<\/td><\/tr><\/table>", "bogi": ["(가)에 들어갈 숫자는 8이다.", "이사국은 모두 47개국이다.", "이사국 수가 가장 적은 지역은 서유럽 및 기타이다.", "심각한 인권 침해가 있으면 총회 과반수 찬성으로 이사국 자격이 박탈된다."], "ch": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 0, "ans": "", "con": [["유엔 인권 이사회 (3쪽)", ["<b class=\"k\">유엔 총회 직속 정부 간 기구<\/b>, 거의 모든 인권 문제", "<b class=\"k\">1946년<\/b> 인권 위원회(헌장 68조) 대신 <b class=\"k\">2006년<\/b> 탄생, <b class=\"k\">스위스 제네바<\/b>", "<b class=\"k\">47개<\/b> 이사국, 지역별 할당, <b class=\"k\">유엔 총회에서 선출<\/b> (아프리카 13, 아시아·태평양 13, 남미·카리브 8, 동유럽 6, 서유럽 및 기타 7)", "임기 <b class=\"k\">3년<\/b>, 최대 2회 연임, 총회 <b class=\"k\">3분의 2<\/b> 이상 찬성 시 자격 박탈, 이사국도 <b class=\"k\">자국 인권 감사<\/b>", "임무: 인권 위원회 임무 승계, 총회에 권고 제출, 이행 상황 주기적 검토, 긴급 문제 신속 대응", "<b class=\"k\">OHCHR<\/b>로부터 실질적·기술적·사무적 지원"]]], "core": "13 + 13 + 8 + 6 + 7 = <b class=\"k\">47<\/b>", "intro": "지역 할당 숫자와 자격 박탈 조건을 확인해요.", "fig": "", "ex": [["ㄱ", 1, "남미·카리브해는 <b class=\"k\">8개국<\/b>이에요."], ["ㄴ", 1, "합계 <b class=\"k\">47개국<\/b>이에요."], ["ㄷ", 0, "가장 적은 지역은 <b class=\"k\">동유럽(6개국)<\/b>이에요."], ["ㄹ", 0, "<b class=\"k\">3분의 2 이상<\/b> 찬성이 필요해요."]], "concl": "옳은 것은 ㄱ, ㄴ → ①번이에요."}, {"n": 7, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "hard": false, "typ": "대화형 · 단일 선택형", "kind": "mc", "stem": "다음은 보편적 정례 검토 제도(UPR)에 대한 학생들의 대화이다. 옳게 말한 학생은? <small>[3.2점]<\/small>", "body": "<div class=\"box\"><b>갑<\/b>: UPR은 인권 이사회 이사국 47개국만 검토를 받는 제도야.<br><b>을<\/b>: UPR은 매년 모든 회원국의 인권 상황을 검토해.<br><b>병<\/b>: UPR은 인권 침해가 심각한 나라만 골라서 집중적으로 검토해.<br><b>정<\/b>: UPR은 회원국이 서로 동료적 검토를 하고, 결과로 개선을 권고해.<br><b>무<\/b>: UPR의 결과에 따라 국제 사법 재판소가 해당 국가를 처벌해.<\/div>", "bogi": [], "ch": ["갑", "을", "병", "정", "무"], "a": 3, "ans": "", "con": [["UPR과 특별 보고관 (4쪽)", ["<b class=\"k\">2007년 8월<\/b> UPR 도입 결정, '인권이사회 기관 구성에 관한 결의' 채택", "UPR: <b class=\"k\">유엔 회원국 모두<\/b>, <b class=\"k\">4년마다<\/b>, 객관적·<b class=\"k\">비선별적<\/b>·투명, <b class=\"k\">동일한 기준<\/b>, 회원국의 <b class=\"k\">동료적 검토<\/b> → 개선 권고", "특별 보고관: 인권 이사회가 임명한 <b class=\"k\">독립적 인권 전문가<\/b>, <b class=\"k\">자원봉사직<\/b>", "<b class=\"k\">주제별<\/b>(고문, 가혹 행위 방지 등), <b class=\"k\">국가별<\/b>(북한, 미얀마 등)"]]], "core": "UPR = <b class=\"k\">모든 회원국, 4년마다, 비선별적, 동료적 검토, 개선 권고<\/b>", "intro": "UPR의 핵심어 다섯 개를 하나씩 대조해요.", "fig": "", "ex": [["갑", 0, "<b class=\"k\">유엔 회원국 모두<\/b>가 검토를 받아요."], ["을", 0, "<b class=\"k\">4년마다<\/b> 한 번이에요."], ["병", 0, "<b class=\"k\">비선별적<\/b>으로 모든 나라를 검토해요."], ["정", 1, "<b class=\"k\">동료적 검토<\/b> → <b class=\"k\">개선 권고<\/b>예요."], ["무", 0, "처벌이 아니라 <b class=\"k\">개선 권고<\/b>예요."]], "concl": "따라서 옳게 말한 학생은 정, ④번이에요."}, {"n": 8, "sec": "Ⅱ. 유엔 인권 이사회와 UPR", "hard": false, "typ": "&lt;보기> 조합형", "kind": "mc", "stem": "유엔 인권 이사회의 특별 보고관에 \"k\">개인 1명, 1994, 4년(1회 연임)<\/b>", "intro": "(가)는 <b class=\"k\">유엔 인권 고등 판무관<\/b>이에요.", "fig": "", "ex": [["①", 0, "47개국은 <b class=\"k\">인권 이사회<\/b>예요. 고등 판무관은 개인이에요."], ["②", 0, "판결이 아니라 <b class=\"k\">대화와 지원<\/b>이에요."], ["③", 0, "난민은 <b class=\"k\">UNHCR<\/b>이에요."], ["④", 0, "<b class=\"k\">조기 경보<\/b>, 특별 회기 요청 등으로 대처해요."], ["⑤", 1, "<b class=\"k\">4년, 1회 연임<\/b>이에요."]], "concl": "따라서 정답은 ⑤번이에요."}, {"n": 10, "sec": "Ⅲ. 유엔 인권 고등 판무관", "hard": false, "typ": "표 해석 · 단일 선택형", "kind": "mc", "stem": "표는 유엔 인권 고등 판무관의 활동 사례를 정리한 것이다. (가)~(다)에 들어갈 내용을 바르게 연결한 것은? <small>[3.2점]<\/small>", "body": "<table class=\"t\"><tr><th>국가<\/th><th>활동 내용<\/th><\/tr><tr><td>에스토니아, 라트비아, 리투아니아<\/td><td>(가)<\/td><\/tr><tr><td>네팔<\/td><td>(나)<\/td><\/tr><tr><td>캄보디아, 말라위<\/td><td>(다)<\/td><\/tr><\/table>", "bogi": [], "ch": ["(가) 사무소 개설 - (나) 실행 계획 논의 - (다) 기술 지원 프로그램", "(가) 실행 계획 논의 - (나) 기술 지원 프로그램 - (다) 사무소 개설", "(가) 기술 지원 프로그램 - (나) 사무소 개설 - (다) 실행 계획 논의", "(가) 실행 계획 논의 - (나) 사무소 개설 - (다) 기술 지원 프로그램", "(가) 사무소 개설 - (나) 기술 지원 프로그램 - (다) 실행 계획 논의"], "a": 1, "ans": "", "con": [["세 가지 측면과 OHCHR (5쪽)", ["① 심각한 인권 침해 → <b class=\"k\">조기 경보<\/b>, <b class=\"k\">특별 회기 개회 요청<\/b>", "② 법 체제 정비·경찰 훈련 등에 <b class=\"k\">기술적·재정적 자문<\/b>: 에스토니아·라트비아·리투아니아(<b class=\"k\">실행 계획<\/b>), 네팔(<b class=\"k\">프로그램<\/b>), 캄보디아·말라위(<b class=\"k\">사무소 개설<\/b>)", "③ 유엔 기구의 <b class=\"k\">인권 분야 사안 조정<\/b>", "<b class=\"k\">OHCHR<\/b>: 고등 판무관 보좌·정책 실행 <b class=\"k\">사무국<\/b>, 1993. 12. 20. 결성, 제네바·뉴욕"]]], "core": "발트 3국 = <b class=\"k\">실행 계획<\/b>, 네팔 = <b class=\"k\">프로그램<\/b>, 캄보디아·말라위 = <b class=\"k\">사무소<\/b>", "intro": "두 번째 측면(기술적·재정적 자문)의 사례예요.", "fig": "", "ex": [["(가)", 1, "에스토니아·라트비아·리투아니아 → 인권 보호 <b class=\"k\">실행 계획<\/b> 논의"], ["(나)", 1, "네팔 → 기술 지원 <b class=\"k\">프로그램<\/b>"], ["(다)", 1, "캄보디아·말라위 → 기술 지원 <b class=\"k\">사무소 개설<\/b>"]], "concl": "따라서 정답은 ②번이에요."}, {"n": 11, "sec": "Ⅲ. 유엔 인권 고등 판무관", "hard": false, "typ": "&lt;보기> 조합형", "kind": "mc", "stem": "유엔 인권 고등 판무관과 유엔 인권 최고 대표 사무소(OHCHR)에 대한 설명으
