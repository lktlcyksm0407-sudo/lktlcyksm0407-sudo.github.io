<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>세계 문제와 미래 사회 1주차</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --band:#1C2747; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.14);
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#16203A; --muted:#6A7389; --line:#E1E5EE;
  --o:#2563EB; --o-soft:#E6EEFF; --x:#E0453A; --x-soft:#FDEBEA; --gold:#F5B731;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.band{background:var(--band);color:var(--band-ink);padding-bottom:64px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.badge b{color:var(--o);font-weight:400}.badge i{color:var(--x);font-style:normal}
.logo small{display:block;font-size:12px;opacity:.75;font-weight:500;letter-spacing:.02em}
.logo h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(19px,5.4vw,24px);letter-spacing:0;line-height:1.15}
.score{flex:0 0 auto;text-align:center;background:var(--band-soft);border-radius:14px;padding:8px 12px;min-width:64px;font-variant-numeric:tabular-nums}
.score span{display:block;font-size:11px;opacity:.8}
.score strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,.chip{font:inherit;font-size:14px;font-weight:500;color:var(--band-ink);background:var(--band-soft);border:1px solid transparent;border-radius:999px;padding:9px 14px;min-height:40px;-webkit-appearance:none;appearance:none}
select{flex:1 1 150px;min-width:0;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{color:#16203A;background:#fff}
.chip{cursor:pointer;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--gold);color:#1C2747}
.progress{height:6px;background:var(--band-soft);border-radius:6px;overflow:hidden}

main.wrap{margin-top:-48px;display:flex;flex-direction:column;gap:16px;padding-block:0 24px}
.card{background:var(--surface);border-radius:24px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:16px;min-height:280px;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.no{font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:0}
.no em{font-style:normal;font-size:13px;font-family:var(--sans);font-weight:700;color:var(--muted);margin-left:4px}
.tag{background:var(--bg);border-radius:999px;padding:5px 11px;font-weight:500;font-size:12px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{font-size:clamp(19px,5.1vw,22px);font-weight:500;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.result{margin-top:auto;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start;animation:pop .28s ease-out}
.result[data-k="O"]{background:var(--o-soft)} .result[data-k="X"]{background:var(--x-soft)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.mark{flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-size:30px;border-radius:50%;color:#fff;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.result[data-k="O"] .mark{background:var(--o)} .result[data-k="X"] .mark{background:var(--x)}
@keyframes stamp{from{transform:scale(.4) rotate(-20deg)}to{transform:none}}
.verdict{font-weight:900;font-size:16px;margin:3px 0 6px}
.verdict.ok{color:var(--o)} .verdict.no{color:var(--x)}
.exp{font-size:15.5px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad button{font-family:var(--display);font-size:52px;line-height:1;cursor:pointer;border:none;border-radius:24px;min-height:104px;color:#fff;box-shadow:var(--shadow);transition:transform .1s}
#bO{background:var(--o)} #bX{background:var(--x)}
.pad button:active{transform:scale(.96)}
.next{width:100%;font:inherit;font-size:18px;font-weight:700;cursor:pointer;border:none;border-radius:20px;min-height:66px;background:var(--band);color:#fff;box-shadow:var(--shadow)}
:root[data-theme="dark"] .next{background:var(--gold);color:#1C2747}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:var(--gold);color:#1C2747}}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{font:inherit;font-size:14px;font-weight:500;background:none;border:none;color:var(--muted);padding:8px 4px;cursor:pointer}
.nav button:disabled{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1}
.done .big{font-family:var(--display);font-size:54px;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.done .chip{background:var(--band);color:#fff}
footer{font-size:12px;color:var(--muted);text-align:center}
.gate{position:fixed;inset:0;background:var(--band);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.gate form{background:var(--surface);color:var(--ink);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gate .badge{width:56px;height:56px;font-size:24px;background:var(--bg);box-shadow:none}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.gate input{font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.gate input:focus{border-color:var(--o);outline:none}
.gate button{font:inherit;font-size:17px;font-weight:700;padding:15px;border-radius:14px;border:none;background:var(--o);color:#fff;cursor:pointer}
.gate .err{color:var(--x);font-size:13px;min-height:1em}
.sh{margin:6px 0 0;font-size:15.5px;font-weight:900;color:var(--ink);background:var(--surface);border-left:5px solid var(--gold);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow)}
.it{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);font-size:16px;line-height:2.05;word-break:keep-all;overflow-wrap:anywhere}
.it.dn{opacity:.6}
.it p{margin:2px 0}.it img{display:block;max-width:100%;max-height:260px;margin:4px auto 6px;border-radius:8px}
.ih{display:flex;justify-content:space-between;align-items:center;line-height:1.3;margin-bottom:4px}
.nn{font-family:var(--display);font-size:18px;color:var(--muted)}
.chk{font:inherit;font-size:12.5px;border:1.5px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.chk[aria-pressed="true"]{background:var(--o);border-color:var(--o);color:#fff}
.bl{max-width:100%;white-space:normal;font:inherit;font-weight:700;display:inline-block;vertical-align:baseline;border:none;border-bottom:2.5px solid var(--o);background:var(--o-soft);border-radius:6px 6px 0 0;padding:0 6px;margin:0 2px;line-height:1.5;cursor:pointer;color:transparent;min-height:1.5em}
.bl span{visibility:hidden}.bl.open{color:var(--x);background:var(--x-soft);border-bottom-color:var(--x)}.bl.open span{visibility:visible}
.pick{white-space:normal}.pick i{font-style:normal;color:var(--muted);margin:0 2px}
.op{font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:0 7px;line-height:1.55;cursor:pointer;margin:0 1px}
.op.right{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}.op.bad{background:var(--x);border-color:var(--x);color:#fff}
.tw{overflow-x:auto;margin:4px 0}.tw table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.7}.tw th,.tw td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}.tw th{background:var(--bg);white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.8;background:var(--surface);border-radius:18px}
.tip{font-size:12.5px;opacity:.85;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.it td:first-child,.it th:first-child{min-width:4.4em;word-break:keep-all}</style></head><body>
<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>빈</b><i>칸</i></div><h2>세계 문제와 미래 사회 1주차</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>

적)"}, {"t": "11. 이주를 다룬 문학 장르를 '{디아스포라 문학}'이라 함", "h": "이주 현상의 구분(① 이주의 목적)", "s": "이주 현상의 구분(① 이주의 목적)"}, {"tbl": [["{이미륵}", "본명 이의경, 1899년 황해도 해주 출생, {3·1 운동} 참여 후 1920년 {독일}로 망명 → 소설 「{압록강은 흐른다}」, 1940년대 독일 교과서에 실림, 1950년 독일에서 사망"], ["{이창래}", "데뷔작 「{네이티브 스피커}」로 헤밍웨이재단상·펜 문학상, 「제스처 라이프」, {한국 이민 세대}를 소재로 영어권에서 큰 반향"]], "nh": true, "h": "이주 현상의 구분(① 이주의 목적)", "s": "이주 현상의 구분(① 이주의 목적)"}, {"t": "12. 캘리포니아주는 미국으로 이주하는 사람들이 가장 선호하는 지역 중 하나 → 1년 내내 춥지 않음, 미국 제1의 농업주 → 차이나타운, {코리아타운}, 리틀 도쿄 → 쾌적한 기후 = {배출/흡인*} 요인", "h": "이주 현상의 구분(① 이주의 목적)", "s": "이주 현상의 구분(① 이주의 목적)"}, {"tbl": [["구분", "자발적 이주", "강제적 이주"], ["의미", "이주자들이 {스스로} 선택한 이주", "피할 수 없는 사정으로 이주를 선택할 수밖에 없도록 {내몰린} 경우"], ["주로 작용하는 요인", "{흡인*/배출} 요인", "{흡인/배출*} 요인"], ["예", "임금을 더 많이 받을 수 있는 지역, 기후가 쾌적한 지역으로 이주, 우리나라: {이촌 향도}", "심각한 자연재해로 인한 환경적 이주, 인종 갈등·종교적 박해·내전 등을 피하는 {정치적} 이주, 우리나라: {사할린} 한인 동포"]], "nh": false, "h": "이주 현상의 구분(② 이주를 선택하는 이의 동기)", "s": "이주 현상의 구분(② 이주를 선택하는 이의 동기)", "pre": "13."}, {"tbl": [["구분", "사할린 한인", "고려인"], ["이동 방향", "한반도 → {사할린}", "연해주 → {중앙아시아}"], ["강제 주체", "{일본 정부}", "{소련(스탈린)}"], ["시기", "일제 강점기", "1937년"]], "nh": false, "h": "이주 현상의 구분(② 이주를 선택하는 이의 동기)", "s": "이주 현상의 구분(② 이주를 선택하는 이의 동기)"}, {"img": "n2", "lines": [], "h": "이주 현상의 구분(② 이주를 선택하는 이의 동기)", "s": "이주 현상의 구분(② 이주를 선택하는 이의 동기)"}, {"t": "14. 체로키족: 병사들이 내민 종이에 서명하자 골짜기와 집과 산을 {포기}한다는 내용이 적혀 있었음 → 마차를 타지 않고 걸어감 → 전체의 {3분의 1}이 넘는 이들이 숨짐 = '{눈물의 여로}'", "h": "이주 현상의 구분(② 이주를 선택하는 이의 동기)", "s": "이주 현상의 구분(② 이주를 선택하는 이의 동기)"}, {"t": "15. 국지적 규모의 이주는 {한 국가 내에서*/국가 사이에서} 이루어지는 이주로 {이촌 향도}와 {교외화}가 있다.", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "16. 이촌 향도: 산업화 과정에서 {촌락 → 도시*/도시 → 촌락}로 이동하는 현상", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"tbl": [["농촌의 배출 요인", "도시의 흡인 요인"], ["{고용 기회} 감소, 낮은 농촌 소득, 교육 및 문화 시설의 부족", "고용 기회의 증가, 높은 도시 소득, 정부와 기업의 {투자} 확대, 풍부한 교육 및 문화 시설"]], "nh": false, "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "17. 우리나라는 {1960년대*/1980년대} 경제 개발 정책을 바탕으로 한 산업화 과정에서 이촌 향도 진행 → 도시 인구 급증, {도농 간 격차} 확대", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "18. 중국의 1인당 GDP: 도시 478위안 → 1만 5,731위안, 농촌 191위안 → 4,760위안(1980~2008년), 격차가 점점 {벌어짐*/줄어듦}", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"tbl": [["농·어업 인구(만 명)", "2000년", "2005년", "2010년", "2015년"], ["농업", "403.1", "343.4", "306.3", "256.9"], ["어업", "25.1", "22.1", "17.1", "12.9"]], "nh": false, "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "→ 농·어업 인구 계속 {증가/감소*} → 국가가 {귀농·귀촌}을 권장", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "19. {과잉 도시화}: 현재 일부 {선진국/개발 도상국*}에서 나타남, 기본적 서비스와 주택, 사회 기반 시설의 공급 능력을 {초과}해 인구가 집중하는 사회 공간적 과정", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "→ 결과: 심각한 {주택} 부족, 실업과 범죄 증가, 교통 혼잡, 부동산 폭등, 환경 오염 → 빈민 집단 거주지 형성(예: {브라질}의 슬럼 지역)", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "20. {종주 도시}의 출현은 과잉 도시화의 징후 중 하나로 좋은 사례는 {태국(방콕)}이다. 선진 산업 사회의 특징인 {균형 도시화}와 정반대 → 권력·부·기회가 집중되는 일종의 {악순환}", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "21. 인도: 식수의 약 {85}%를 지하수에 의존, 신종 범죄 집단 '{물탱크 마피아}'가 지하수를 몰래 시추·갈취, 북부 대도시 {델리} 식수량의 약 60% 공급, 불소·비소 포함 지하수까지 이용", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "22. 교외: 도시도 농촌도 아닌 그 중간에 있는 {정주지}의 물리적 형태. {교외화}: {교외 → 도심/도심 → 교외*}로 인구와 도시 기능이 이동", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "23. 고속도로 건설 및 교통수단의 발달은 교외화를 {억제/촉진*}, 우리나라에서도 {1960년대/1990년대*} 이후 나타남 → 대도시와 주변 지역 간 {교통량} 증가", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "24. 자료: 경기도에서 서울로 통근자 비율 18.8%(2012) → 21.6%(2014) 증가, 평균 통근·통학 시간(분) 전국 29 → 32.4 → 30.6 → 32.9, 서울 35.9 → 40.5 → 38.5 → 41.2(1995~2010)", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "25. 교외화가 도시 형성 과정과 두드러지게 다른 점: {인종적인 배타성}. 미국의 대규모 거주지 개발은 {백인*/흑인}들이 주도 → 교외는 더 백인 중심적이고 더 {부유}함, 시내 인구 50% 감소", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"tbl": [["시기", "상황", "백인들의 움직임"], ["인권 운동 이전", "도심에서 흑인을 법과 제도로 분리, 차별함", "도심에 머물러도 분리 가능"], ["{1960년대 인권 운동} 이후", "이런 분리와 차별이 어려워짐", "흑인과 떨어져 살기 위해 먼 {교외}로 이동(역사가 케즈, 애틀랜타)"]], "nh": false, "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "26. 고속도로가 들어설수록 자동차 이용 증가 → 고속도로를 건설해도 새로운 {교통 체증} 구간이 생김", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "27. 세계적 규모의 이주: 국제 순이동 = 전입 − 전출, {+ 순유입*/+ 순유출}", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"tbl": [["(단위: 천 명)", "2000~2005", "2005~2010", "2010~2015"], ["아프리카", "−420", "−356", "−496"], ["아시아", "−1,615", "−1,946", "−1,432"], ["유럽", "1,875", "1,858", "1,176"], ["라틴 아메리카", "−1,243", "−1,068", "−621"], ["북아메리카", "1,270", "1,295", "1,220"], ["오세아니아", "133", "217", "149"], ["한국", "−26", "21", "68"]], "nh": false, "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "28. 순유입: 유럽, {북아메리카}, {오세아니아}, 순유출: 아프리카, 아시아, {라틴 아메리카}, 한국: {순유입 → 순유출/순유출 → 순유입*}", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "29. 가장 많은 세계적 이주는 경제적 목적으로 {개발 도상국 → 선진국*/선진국 → 개발 도상국} 이동", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "30. 이주 노동자: 경제적 목적으로 이주한 노동자, 1990년 유엔 총회 협약: 국적을 부여한 나라({모국})가 아닌 국가에서 {유급 활동}에 종사할 예정이거나, 종사하고 있거나, 종사하여 온 사람", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "31. 주로 현지인이 비선호하는 {숙련/비숙련*} 노동에 종사, 제2차 세계 대전 이후 서유럽은 노동력 부족 해결 → 한국은 {독일}에 간호사와 광부 파견", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"img": "n3", "lines": ["경제적 목적의 이주 (개념서 11쪽)"], "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"tbl": [["초록색", "경제적 원인에 의한 이주를 많이 받아들인 국가: {서유럽}, 북아메리카, {오스트레일리아}"], ["분홍색", "주요 출신국: {멕시코}, 중앙아메리카·카리브해, 북아프리카, 중앙아시아, 인도 반도, 동남아시아, 중국"], ["화살표", "빨강: {숙련} 노동자, 파랑: 미숙련 혹은 비숙련 노동자, 회색: 국내 이주 많은 지역"]], "nh": true, "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "32. 유엔 협약의 의의: 이주 노동자뿐 아니라 그 {가족}에 대한 보호도 규정, 전문과 9부 {93}조, 2부: 어떠한 종류의 {차별}도 없이 향유, 3부: 출국의 자유, 생명권, 고문 금지, 강제 노동 금지, 사상·양심의 자유, 신체의 자유, 국외 추방의 제한, 자녀의 권리, 노동조합", "h": "세계적인 이주 현상의 유형과 특성", "s": "세계적인 이주 현상의 유형과 특성"}, {"t": "33. 난민의 정의: {인종}, 종교, 국적, {특정 사회 집단}의 let section='0',showAll=false,hideDone=false;
$('sec').innerHTML=SECS.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+s+' ('+DATA.filter(d=>d.h===s).length+')</option>').join('');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function mk(t){
  return esc(t).replace(/\{(.+?)\}/g,(m,x)=>{
    if(x.includes('/')){
      return '<span class="pick">( '+x.split('/').map(o=>{const ok=o.endsWith('*');o=o.replace(/\*$/,'');return '<button class="op'+(showAll&&ok?' right':'')+'" data-ok="'+(ok?1:0)+'">'+o+'</button>'}).join('<i>/</i>')+' )</span>';
    }
    return '<button class="bl'+(showAll?' open':'')+'" style="min-width:'+Math.min(14,Math.max(2.5,x.length*0.95))+'em"><span>'+x+'</span></button>';
  }).replace(/_(.+?)_/g,'<u>$1</u>').replace(/\n/g,'<br>').replace(/&lt;br&gt;/g,'<br>');
}
function render(){
  const items=DATA.map((d,i)=>[d,i]).filter(([d])=>d.h===SECS[+section]);
  const nd=items.filter(([d,i])=>st.done[i]).length;
  $('score').innerHTML='<span>외운 문장</span><strong>'+nd+'/'+items.length+'</strong>';
  $('bar').style.width=(items.length?nd/items.length*100:0)+'%';
  let h='',cur='',n=0;
  items.forEach(([d,i])=>{
    if(hideDone&&st.done[i])return;
    if(d.s!==cur){cur=d.s;n=0;h+='<h3 class="sh">'+esc(d.s)+'</h3>'}
    n++;
    const num=(d.pre||((d.t||'').match(/^(\d+)\./)||[])[0]||'');
    h+='<article class="it'+(st.done[i]?' dn':'')+'"><div class="ih"><span class="nn">'+num+'</span><button class="chk" data-i="'+i+'" aria-pressed="'+(st.done[i]?'true':'false')+'">'+(st.done[i]?'외웠어요 ✓':'외웠어요')+'</button></div>';
    if(d.img)h+='<img src="img/'+d.img+'.jpg" alt="">'+(d.lines||[]).map(l=>'<p>'+mk(l)+'</p>').join('');
    else if(d.tbl)h+='<div class="tw"><table>'+d.tbl.map((r,ri)=>'<tr>'+r.map(c=>(ri===0&&!d.nh?'<th>':'<td>')+mk(c)+(ri===0&&!d.nh?'</th>':'</td>')).join('')+'</tr>').join('')+'</table></div>';
    else h+='<p>'+mk(d.t.replace(/^\d+\.\s*/,''))+'</p>';
    h+='</article>';
  });
  if(!h)h='<div class="empty">이 단원의 문장을 모두 외웠어요! 👏<br>‘외운 문장 숨기기’를 끄면 다시 볼 수 있어요.</div>';
  $('list').innerHTML=h;
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('bl'))b.classList.toggle('open');
  else if(b.classList.contains('op')){b.classList.add(b.dataset.ok==='1'?'right':'bad');if(b.dataset.ok!=='1')setTimeout(()=>b.classList.remove('bad'),900)}
  else if(b.classList.contains('chk')){const i=b.dataset.i;if(st.done[i])delete st.done[i];else st.done[i]=1;save();render()}
});
$('sec').onchange=e=>{section=e.target.value;window.scrollTo({top:0});render()};
$('all').onclick=e=>{showAll=!showAll;e.currentTarget.setAttribute('aria-pressed',showAll);e.currentTarget.textContent=showAll?'모두 가리기':'정답 모두 보기';render()};
$('hide').onclick=e=>{hideDone=!hideDone;e.currentTarget.setAttribute('aria-pressed',hideDone);render()};
let armed=false;
$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}
 st={done:{}};save();armed=false;t.textContent='기록 초기화';render()};
render();
</script>
<script>
(function(){
const H=1418297543,K='hy-world-future-w1-note-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
</body></html>
