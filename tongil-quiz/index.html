<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>통일 국토 문제 트레이닝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --band:#1C2747; --band-ink:#FFFFFF; --band-soft:rgba(255,255,255,.14);
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#16203A; --muted:#6A7389; --line:#E1E5EE;
  --o:#2563EB; --o-soft:#E6EEFF; --x:#E0453A; --x-soft:#FDEBEA; --gold:#F5B731;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --shadow:0 10px 30px rgba(22,32,58,.10),0 2px 6px rgba(22,32,58,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#141B30; --band-soft:rgba(255,255,255,.10);
  --bg:#0E1322; --surface:#1A2238; --ink:#EEF1F8; --muted:#9AA3B8; --line:#2A3350;
  --o:#6E9BFF; --o-soft:#1D2B52; --x:#FF7A70; --x-soft:#45201F; --gold:#F5C451;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.band{background:var(--band);color:var(--band-ink);padding-bottom:64px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.badge{flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.badge b{color:var(--o);font-weight:400}.badge i{color:var(--x);font-style:normal}
.logo small{display:block;font-size:12px;opacity:.75;font-weight:500;letter-spacing:.02em}
.logo h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(19px,5.4vw,24px);white-space:nowrap;letter-spacing:0;line-height:1.15}
.score{flex:0 0 auto;text-align:center;background:var(--band-soft);border-radius:14px;padding:8px 12px;min-width:64px;font-variant-numeric:tabular-nums}
.score span{display:block;font-size:11px;opacity:.8}
.score strong{display:block;font-size:20px;font-weight:900;line-height:1.2}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,.chip{font:inherit;font-size:14px;font-weight:500;color:var(--band-ink);background:var(--band-soft);border:1px solid transparent;border-radius:999px;padding:9px 14px;min-height:40px;-webkit-appearance:none;appearance:none}
select{flex:1 1 150px;min-width:0;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option{color:#16203A;background:#fff}
.chip{cursor:pointer;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--gold);color:#1C2747}
.progress{height:6px;background:var(--band-soft);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--gold);width:0;border-radius:6px;transition:width .3s}
main.wrap{margin-top:-48px;display:flex;flex-direction:column;gap:16px;padding-block:0 24px}
.card{background:var(--surface);border-radius:24px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:16px;min-height:280px;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.no{font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:0}
.no em{font-style:normal;font-size:13px;font-family:var(--sans);font-weight:700;color:var(--muted);margin-left:4px}
.tag{background:var(--bg);border-radius:999px;padding:5px 11px;font-weight:500;font-size:12px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{font-size:clamp(19px,5.1vw,22px);font-weight:500;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.result{margin-top:auto;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start;animation:pop .28s ease-out}
.result[data-k="O"]{background:var(--o-soft)} .result[data-k="X"]{background:var(--x-soft)}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.mark{flex:0 0 auto;width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-size:30px;border-radius:50%;color:#fff;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.result[data-k="O"] .mark{background:var(--o)} .result[data-k="X"] .mark{background:var(--x)}
@keyframes stamp{from{transform:scale(.4) rotate(-20deg)}to{transform:none}}
.verdict{font-weight:900;font-size:16px;margin:3px 0 6px}
.verdict.ok{color:var(--o)} .verdict.no{color:var(--x)}
.exp{font-size:15.5px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad button{font-family:var(--display);font-size:52px;line-height:1;cursor:pointer;border:none;border-radius:24px;min-height:104px;color:#fff;box-shadow:var(--shadow);transition:transform .1s}
#bO{background:var(--o)} #bX{background:var(--x)}
.pad button:active{transform:scale(.96)}
.next{width:100%;font:inherit;font-size:18px;font-weight:700;cursor:pointer;border:none;border-radius:20px;min-height:66px;background:var(--band);color:#fff;box-shadow:var(--shadow)}
:root[data-theme="dark"] .next{background:var(--gold);color:#1C2747}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{background:var(--gold);color:#1C2747}}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{font:inherit;font-size:14px;font-weight:500;background:none;border:none;color:var(--muted);padding:8px 4px;cursor:pointer}
.nav button:disabled{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1}
.done .big{font-family:var(--display);font-size:54px;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted)}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.done .chip{background:var(--band);color:#fff}
footer{font-size:12px;color:var(--muted);text-align:center}
.gate{position:fixed;inset:0;background:var(--band);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
.gate form{background:var(--surface);color:var(--ink);border-radius:24px;padding:30px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.gate .badge{width:56px;height:56px;font-size:24px;background:var(--bg);box-shadow:none}
.gate h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.gate input{font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.gate input:focus{border-color:var(--o);outline:none}
.gate button{font:inherit;font-size:17px;font-weight:700;padding:15px;border-radius:14px;border:none;background:var(--o);color:#fff;cursor:pointer}
.gate .err{color:var(--x);font-size:13px;min-height:1em}
.q{font-size:clamp(17px,4.6vw,19px);font-weight:700;line-height:1.6}
.q u{text-underline-offset:3px}
.body{font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.body .dbox,.body .bogi{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0;background:var(--bg)}
.body .bogi{position:relative;padding-top:18px}.body .bogi .bt{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--surface);padding:0 10px;font-weight:700;font-size:13px;letter-spacing:.3em}
.body .bogi p{margin:3px 0;padding-left:20px;text-indent:-20px}
.body .src{display:block;text-align:right;font-size:12px;color:var(--muted)}
.body .qimg{text-align:center;margin:6px 0}.body .qimg img{max-width:100%;height:auto!important;max-height:240px;border-radius:8px}
.body .icap{display:block;font-size:12px;color:var(--muted)}
.body .pair2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.body .pair2>*{flex:1 1 140px}
.body table.tb{width:100%;border-collapse:collapse;font-size:13.5px}.body .tb th,.body .tb td{border:1px solid var(--line);padding:6px;text-align:center}.body .tb th{background:var(--bg)}
.body .tl{display:flex;align-items:flex-start;position:relative;margin:10px 0;font-size:11.5px;text-align:center}
.body .tl:before{content:"";position:absolute;left:0;right:0;top:9px;border-top:2px solid var(--muted)}
.body .tl .ev{flex:1.2;position:relative}.body .tl .tick{display:block;width:10px;height:10px;border-radius:50%;background:var(--ink);margin:4px auto}
.body .tl .seg{flex:.7;font-weight:900;color:var(--o);font-size:13px}
.chs{display:flex;flex-direction:column;gap:9px}
.cho{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:15.5px;line-height:1.5;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;word-break:keep-all}
.cho b{font-size:18px;line-height:1.3;color:var(--o)}
.cho.right{border-color:var(--o);background:var(--o-soft)}.cho.bad{border-color:var(--x);background:var(--x-soft)}
.cho:disabled{cursor:default;opacity:1}.cho:disabled:not(.right):not(.bad){opacity:.55}
.xp{border-radius:16px;background:var(--bg);padding:14px 14px 10px;font-size:14.5px;line-height:1.65;animation:pop .28s ease-out}
.xp .ans{color:var(--x);font-weight:700;margin-bottom:6px}
.key{background:#FFF4CC;color:#3a2e00;border-radius:10px;padding:8px 10px;margin:0 0 8px;font-size:14px}.key b{background:var(--gold);color:#1C2747;border-radius:4px;padding:0 5px;margin-right:4px}
.intro{margin:0 0 8px}.er{display:flex;gap:6px;margin:0 0 6px;align-items:flex-start}.er .lb{font-weight:700;min-width:22px}
.ox{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:900;margin-top:2px}.ox.o{background:var(--o)}.ox.x{background:var(--x)}
.end{color:var(--x);font-weight:700;margin:6px 0 2px}
.self{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}.self p{margin:0;color:var(--muted)}
.self .chip,.row2 .chip{background:var(--band);color:#fff}.row2{display:flex;gap:10px;justify-content:center}.row2 .ok{background:var(--o)}.row2 .no{background:var(--x)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dbox u{text-decoration:underline}
.qt{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}.qt th,.qt td{border:1px solid var(--line);padding:6px 8px}.qt th{background:var(--bg)}
.bogi{border:1.5px solid var(--line);border-radius:12px;padding:14px 12px 8px;margin:12px 0 6px;font-size:15px;line-height:1.7;position:relative}
.bogi .bh{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--surface);padding:0 8px;font-size:13px;font-weight:700}
.icap2{text-align:center;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.tl{display:flex;align-items:center;font-size:11px;text-align:center;margin:6px 0;overflow-x:auto}
.tl span{border:1px solid var(--line);border-radius:6px;padding:3px 4px;line-height:1.35;flex:0 0 auto;max-width:72px}
.tl i{flex:1 0 18px;font-style:normal;font-weight:900;border-bottom:2px solid var(--muted);margin:0 2px;font-size:12px}
.flexq{display:flex;flex-direction:column;gap:6px}.flexq .qimg img{max-height:130px!important}
.cpt{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13.5px;line-height:1.65}
.cpt u{text-decoration:none;font-weight:700;background:linear-gradient(transparent 60%,rgba(245,183,49,.45) 60%)}
</style></head><body>
<div class="gate" id="gate"><form id="gf"><div class="badge" aria-hidden="true"><b>문</b><i>제</i></div><h2>통일 국토 문제 트레이닝</h2><p>이경태T 수강생 전용이에요.<br>선생님께 받은 입장 코드를 입력하세요.</p><input id="gc" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" placeholder="입장 코드" aria-label="입장 코드"><div class="err" id="ge"></div><button type="button" id="gb">입장하기</button></form></div>
<div class="band"><div class="wrap">
  <div class="top">

  <div class="controls">

</div></div>

답은 ④번이에요."}, {"n": 9, "sec": "한반도 평화의 중요성", "type": "빈칸 채우기형", "stem": "빈칸 ㉠에 들어갈 말로 가장 적절한 것은?", "body": "<div class=\"dbox\">남북은 상호 존중과 화해·협력을 바탕으로 이해와 공존, ( ㉠ )의 문화를 구축하고 한반도의 평화 정착을 위한 국제 사회의 협력을 이끌어 내야 한다.<\/div>", "ch": ["경쟁", "대립", "고립", "단절", "신뢰"], "a": 5, "at": "", "key": "이해 · 공존 · <b>신뢰<\/b>의 문화", "intro": "교과서 본문 문장 속 단어를 그대로 묻는 문제예요. “이해와 공존, ○○”을 통째로 기억해요.<div class=\"cpt\"><b>▸ 남북 갈등의 평화적 해결<\/b> 남북은 <u>상호 존중과 화해·협력<\/u>을 바탕으로 <u>이해와 공존, 신뢰<\/u>의 문화를 구축하고, 한반도 평화 정착을 위한 <u>국제 사회의 협력<\/u>을 이끌어 내야 한다.<br><\/div>", "exp": [["①", 0, "경쟁의 문화는 갈등을 키울 수 있어 평화적 해결과 거리가 멀어요."], ["②", 0, "대립은 평화적으로 “해결해야 할” 대상이에요."], ["③", 0, "고립은 교류와 협력의 반대예요."], ["④", 0, "단절은 교류를 끊는 것이라 이해와 공존을 만들 수 없어요."], ["⑤", 1, "교과서: “이해와 공존, 신뢰의 문화를 구축”"]], "end": "따라서 정답은 ⑤번이에요."}, {"n": 10, "sec": "한반도 평화의 중요성", "type": "자료 분석형 · 옳지 않은 것", "stem": "다음 글의 ㉠~㉤에 관한 설명으로 옳지 <u>않은<\/u> 것은?", "body": "<div class=\"dbox\">1969년 ㉠ <u>서독 정부<\/u>는 화해 정책을 추진하기 시작하였고 1972년에는 ㉡ <u>‘동·서독 기본 조약’<\/u>이 체결되었다. 적대 관계 속에서도 양국은 ㉢ <u>텔레비전 시청 허용, 경제·문화 협력<\/u> 등을 통해 상호 이해와 신뢰 관계를 쌓았다. 1980년대 말 동독 시민들은 자유와 체제 개혁을 요구하는 ㉣ <u>평화 혁명<\/u>을 전개하였고, 그 결과 동독이 몰락하였다. 이후 ㉤ <u>통일을 위한 법과 제도<\/u>를 마련하고 미국, 구소련 등 국제 사회의 동의와 지지를 얻었다. 마침내 독일은 1990년 10월에 통일을 선포하였다.<\/div>", "ch": ["㉠ - 동독을 포함한 공산권에 대한 화해 정책을 추진하였다.", "㉡ - 동·서독 간 갈등의 평화적 해결 원칙이 담겨 있다.", "㉢ - 이를 통해 상호 이해와 신뢰 관계를 쌓았다.", "㉣ - 동독 시민들이 자유와 체제 개혁을 요구하였다.", "㉤ - 미국, 구소련 등 국제 사회의 주도로 마련되었다."], "a": 5, "at": "", "key": "법과 제도 마련 = <b>동·서독 정부<\/b> / 국제 사회 = 동의와 지지", "intro": "독일 통일 글은 시험 단골! 각 밑줄의 “주체”가 누구인지 정확히 구분해야 해요.<div class=\"cpt\"><b>▸ 독일 통일 과정<\/b> 1969 <u>서독 정부<\/u> 화해 정책 → 1972 <u>동·서독 기본 조약<\/u>(갈등의 평화적 해결 원칙) → TV 시청 허용·경제·문화 협력 → 1980년대 말 <u>동독 시민 평화 혁명<\/u> → 동·서독 정부가 법·제도 마련 + 미국·구소련 등 <u>국제 사회의 동의와 지지<\/u> → <u>1990년 10월<\/u> 통일 선포<br><\/div>", "exp": [["①", 1, "1969년 서독 정부의 화해 정책이에요."], ["②", 1, "교과서: 양국 간 갈등의 평화적 해결 원칙을 담은 조약."], ["③", 1, "적대 관계 속에서도 교류를 통해 상호 이해와 신뢰를 쌓았어요."], ["④", 1, "평화 혁명의 주체는 동독 시민, 요구는 자유와 체제 개혁이에요."], ["⑤", 0, "통일을 위한 법과 제도는 . (다) - 독일의 통일에 반대하며 압력을 가하였다.<\/div><div>ㄹ. (나) - 화해 정책을 추진하고 세계의 지지를 얻는 외교적 활동을 펼쳤다.<\/div><\/div>", "ch": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "a": 4, "at": "", "key": "시민 = 평화 혁명 / 정부 = 화해 정책·법과 제도·외교 / 국제 사회 = 지지·지원", "intro": "교과서 “해 보자” 1번 활동을 문제로 만든 거예요. 주체와 역할을 짝지어 외워 두세요.<div class=\"cpt\"><b>▸ 각 주체의 역할 (예시 답안)<\/b> <u>시민<\/u>: 평화 혁명 전개 / <u>정부<\/u>: 화해 정책, 시민 의견 수용, 통일을 위한 법과 제도 마련, 외교적 활동 / <u>국제 사회<\/u>: 독일 통일 지지·지원<br><\/div>", "exp": [["ㄱ", 0, "법과 제도를 마련한 것은 “정부”(나)예요."], ["ㄴ", 1, "시민의 역할이에요."], ["ㄷ", 0, "미국, 구소련 등 국제 사회는 독일의 통일을 “지지하고 지원”했어요."], ["ㄹ", 1, "정부의 역할이에요."]], "end": "옳은 것은 ㄴ, ㄹ이므로 정답은 ④번이에요."}, {"n": 15, "sec": "한반도 평화의 중요성", "type": "<보기> 조합형", "stem": "우리나라가 독일의 통일 과정에서 배워야 할 점으로 적절한 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "body": "<div class=\"bogi\"><div class=\"bh\">보기<\/div><div>ㄱ. 남북 간 신뢰의 회복이 필요하다.<\/div><div>ㄴ. 평화 정착을 위한 국제 사회의 협력을 이끌어 내야 한다.<\/div><div>ㄷ. 갈등과 대립을 평화적으로 해결하려는 태도를 가져야 한다.<\/div><div>ㄹ. 양국 간 대화와 교류를 중단하고 평화 감수성 함양에만 집중해야 한다.<\/div><\/div>", "ch": ["ㄱ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "a": 3, "at": "", "key": "독일의 교훈 = 교류·신뢰 + 평화적 해결 + 국제 사회의 협력", "intro": "독일 통일의 시사점이에요. “교류 중단”은 독일이 한 일과 반대라는 점을 꼭 잡으세요.<div class=\"cpt\"><b>▸ 독일 통일 과정<\/b> 1969 <u>서독 정부<\/u> 화해 정책 → 1972 <u>동·서독 기본 조약<\/u>(갈등의 평화적 해결 원칙) → TV 시청 허용·경제·문화 협력 → 1980년대 말 <u>동독 시민 평화 혁명<\/u> → 동·서독 정부가 법·제도 마련 + 미국·구소련 등 <u>국제 사회의 동의와 지지<\/u> → <u>1990년 10월<\/u> 통일 선포<br><b>▸ 남북 갈등의 평화적 해결<\/b> 남북은 <u>상호 존중과 화해·협력<\/u>을 바탕으로 <u>이해와 공존, 신뢰<\/u>의 문화를 구축하고, 한반도 평화 정착을 위한 <u>국제 사회의 협력<\/u>을 이끌어 내야 한다.<br><\/div>", "exp": [["ㄱ", 1, "독일은 교류를 통해 상호 이해와 신뢰 관계를 쌓았어요."], ["ㄴ", 1, "독일은 미국, 구소련 등 국제 사회의 동의와 지지를 얻었어요."], ["ㄷ", 1, "독일은 분단 문제를 평화적으로 해결한 대표 국가예요."], ["ㄹ", 0, "독일은 적대 관계 속에서도 TV 시청 허용, 경제·문화 협력 등 교류를 이어 갔어요. 교류 중단은 정반대!"]], "end": "옳은 것은 ㄱ, ㄴ, ㄷ이므로 정답은 ③번이에요."}, {"n": 16, "sec": "한반도 평화의 중요성", "type": "사례 탐구형", "stem": "(가)에 들어갈 국가로 옳은 것은?", "body": "<div class=\"dbox\">남북으로 분단되었던 (가)은/는 양국 정상 회담, 접경지역 지하자원의 공동 개발 등을 통한 협력을 바탕으로 평화 통일을 이루어 낸 사례가 }
function expHtml(d,ok){
  let h='<div class="xp"><p class="verdict '+(ok===null?'':(ok?'ok':'no'))+'">'+(ok===null?'정답 확인':(ok?'정답이에요!':'아쉬워요. 정답은 '+CI[d.a-1]))+'</p>';
  if(d.at)h+='<div class="ans">정답 | '+d.at+'</div>';
  if(d.key)h+='<div class="key"><b>핵심</b> '+d.key+'</div>';
  if(d.intro)h+='<p class="intro">'+d.intro+'</p>';
  h+=d.exp.map(e=>'<div class="er"><span class="lb">'+e[0]+'</span><span class="ox '+(e[1]?'o':'x')+'">'+(e[1]?'O':'X')+'</span><span>'+e[2]+'</span></div>').join('');
  if(d.end)h+='<p class="end">'+d.end+'</p>';
  return h+'</div>';
}
function render(){
  const total=list.length;
  $('score').innerHTML=tried?'<span>정답</span><strong>'+right+'/'+tried+'</strong>':'<span>틀린 문제</span><strong>'+Object.keys(st.wrong).length+'</strong>';
  $('bar').style.width=total?((pos+(picked!==null?1:0))/total*100)+'%':'0';
  $('prev').disabled=pos===0;
  const card=$('card'),act=$('actions');
  if(!total){card.innerHTML='<div class="done"><div class="big">0</div><p>'+(wrongOnly?'틀린 문제가 없어요. 전체 문제로 돌아가 풀어 보세요.':'문제가 없어요.')+'</p></div>';act.innerHTML='';return}
  if(pos>=total){
    card.innerHTML='<div class="done"><p>이번 회차 결과</p><div class="big">'+right+' / '+tried+'</div><p>틀린 문제는 자동으로 모아 두었어요.</p><div class="row"><button class="chip" id="again">처음부터 다시</button><button class="chip" id="gowrong">틀린 문제만 풀기</button></div></div>';
    act.innerHTML='';$('again').onclick=build;$('gowrong').onclick=()=>{wrongOnly=true;$('wrong').setAttribute('aria-pressed','true');build()};return;
  }
  const d=list[pos],si=SECS.indexOf(d.sec);
  let h='<div class="meta"><span class="no">'+d.n+'<em>번</em></span><span class="tag">'+ROM[si]+'. '+d.sec+'</span></div><p class="q">'+d.stem+'</p><div class="body">'+d.body+'</div>';
  if(d.a){
    h+='<div class="chs">'+d.ch.map((c,i)=>{let cls='';if(picked!==null){if(i+1===d.a)cls='right';else if(i+1===picked)cls='bad'}
      return '<button class="cho '+cls+'" data-i="'+(i+1)+'"'+(picked!==null?' disabled':'')+'><b>'+CI[i]+'</b><span>'+c+'</span></button>'}).join('')+'</div>';
  }else if(picked===null){
    h+='<div class="self"><p>'+(d.type==='서술형'?'답을 공책에 써 본 뒤':'답을 떠올려 본 뒤')+' 정답을 확인하세요.</p><button class="chip" id="reveal">정답 보기</button></div>';
  }
  if(picked!==null){
    h+=expHtml(d,d.a?picked===d.a:(picked===1?true:(picked===2?false:null)));
    if(!d.a&&picked===0)h+='<div class="row2"><button class="chip ok" id="sOk">맞았어요</button><button class="chip no" id="sNo">틀렸어요</button></div>';
  }
  card.innerHTML=h;
  card.querySelectorAll('.cho').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  if($('reveal'))$('reveal').onclick=()=>{picked=0;render()};
  if($('sOk'))$('sOk').onclick=()=>selfMark(true);
  if($('sNo'))$('sNo').onclick=()=>selfMark(false);
  if(picked!==null&&!(!d.a&&picked===0)){act.innerHTML='<button class="next" id="nx">'+(pos+1<total?'다음 문제 →':'결과 보기')+'</button>';$('nx').onclick=()=>{pos++;picked=null;render();window.scrollTo({top:0})}}
  else act.innerHTML='';
}
function selfMark(ok){const d=list[pos];tried++;if(ok){right++;if(wrongOnly)delete st.wrong[d.n]}else st.wrong[d.n]=1;picked=ok?1:2;save();render()}
function answer(k){const d=list[pos];picked=k;tried++;if(k===d.a){right++;if(wrongOnly)delete st.wrong[d.n]}else st.wrong[d.n]=1;save();render()}
$('sec').onchange=e=>{section=e.target.value;build()};
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);build()};
$('wrong').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);build()};
$('prev').onclick=()=>{if(pos>0){pos--;picked=null;render()}};
let armed=false;
$('reset').onclick=e=>{const t=e.currentTarget;if(!armed){armed=true;t.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;t.textContent='기록 초기화'},2500);return}
  st={wrong:{}};save();armed=false;t.textContent='기록 초기화';wrongOnly=false;$('wrong').setAttribute('aria-pressed','false');build()};
build();
</script>
<script>
(function(){
const H=1418297543,K='ms-soc2-tongil-quiz-gate';
const hash=s=>{let h=5381;for(const c of s.trim().toLowerCase())h=((h*33)^c.charCodeAt(0))>>>0;return h};
const g=document.getElementById('gate');
let ok=false;try{ok=localStorage.getItem(K)===String(H)}catch(e){}
if(ok){g.hidden=true;return}
const M={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m'};
const norm=s=>[...String(s).replace(/\s+/g,'')].map(c=>M[c]||c).join('');
const tryIn=()=>{const v=document.getElementById('gc').value;
 if(hash(norm(v))===H||hash(v)===H){try{localStorage.setItem(K,String(H))}catch(e){} g.hidden=true}
 else document.getElementById('ge').textContent='코드가 맞지 않아요. 영문 자판으로 입력했는지 확인해 주세요.'};
document.getElementById('gb').addEventListener('click',tryIn);
document.getElementById('gc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryIn()}});
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();tryIn()});
})();
</script>
